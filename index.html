/* ================= 계정 =================
   서버가 없는 정적 페이지라 계정은 이 기기(브라우저)에 저장한다. 비밀번호는 그대로 두지 않고 소금(salt)을 쳐서 해시로만 남긴다.
   claude.ai 아티팩트로 열면 Claude 계정의 개인 저장소(data/users/<id>/)에도 같이 올려서 다른 기기에서 이어진다. */
const ID_RE = /^[a-z0-9_]{4,12}$/;
const NAME_RE = /^[가-힣a-zA-Z0-9]{2,8}$/;
let REG = null, curAcc = null, regDirty = false, modalLock = false, loginBusy = false;
const emptyReg = () => ({v:1, accounts:{}, keep:null, legacyClaimed:false, t:0});
function loadReg(){
  try {
    const d = JSON.parse(localStorage.getItem(ACC_KEY) || 'null');
    if (d && d.v === 1 && d.accounts && typeof d.accounts === 'object'){
      const r = Object.assign(emptyReg(), d);
      for (const A of Object.values(r.accounts)) if (!Array.isArray(A.chars)) A.chars = [];
      return r;
    }
  } catch (e) {}
  return emptyReg();
}
function saveReg(){
  REG.t = now(); regDirty = true;
  try { localStorage.setItem(ACC_KEY, JSON.stringify(REG)); } catch (e) {}
}
function writeSession(o){ try { if (o) sessionStorage.setItem(SESSION_KEY, JSON.stringify(o)); else sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
function readSession(){ try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; } }
function randHex(n){
  const a = new Uint8Array(n);
  try { crypto.getRandomValues(a); } catch (e) { for (let i = 0; i < n; i++) a[i] = Math.random() * 256 | 0; }
  return Array.from(a, x => x.toString(16).padStart(2, '0')).join('');
}
async function hashPw(pw, salt, alg){
  if (alg !== 'f'){
    try {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:enc.encode(salt), iterations:60000, hash:'SHA-256'}, key, 256);
      return 'p:' + Array.from(new Uint8Array(bits), x => x.toString(16).padStart(2, '0')).join('');
    } catch (e) { if (alg === 'p') return null; }
  }
  // 아주 오래된 브라우저용 예비 해시
  let h1 = 0x9e3779b9, h2 = 0x85ebca6b;
  const s = salt + ':' + pw;
  for (let r = 0; r < 3000; r++) for (let i = 0; i < s.length; i++){
    const c = s.charCodeAt(i) + r;
    h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); h1 ^= h2 >>> 15; h2 ^= h1 >>> 13;
  }
  return 'f:' + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}
const allChars = () => Object.entries(REG.accounts).flatMap(([acc, A]) => (A.chars || []).map(c => Object.assign({acc}, c)));
let cloudLegacy = null;
// 계정이 생기기 전에 하던 모험(예전 저장)을 찾는다
function legacyCandidate(){
  if (REG.legacyClaimed) return null;
  let best = null;
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (d && d.v === 1 && d.chosen) best = {data:d, t:d.lastSave || 0}; } catch (e) {}
  if (cloudLegacy && cloudLegacy.t > (best ? best.t : -1)) best = cloudLegacy;
  return best && {data:best.data, level:Math.floor(best.data.level) || 1, stage:Math.floor(best.data.maxStage) || 1};
}

async function submitLogin(signup){
  if (loginBusy) return;
  const id = ($('#lg-id').value || '').trim().toLowerCase(), pw = $('#lg-pw').value || '', keep = $('#lg-keep').checked;
  const err = m => setText($('#lg-err'), m);
  if (!ID_RE.test(id)) return err('아이디는 영문 소문자·숫자·밑줄(_)로 4~12자예요.');
  if (pw.length < 4) return err('비밀번호는 4자 이상이에요.');
  if (signup){
    if (pw !== $('#lg-pw2').value) return err('비밀번호 확인이 서로 달라요.');
    if (REG.accounts[id]) return err('이미 있는 아이디예요. 다른 아이디를 쓰거나 로그인해 주세요.');
  } else if (!REG.accounts[id] && !onlineWanted()) return err(cloud ? '없는 아이디예요. [새 계정 만들기]를 눌러 주세요.' : '이 기기에 없는 아이디예요. [새 계정 만들기]를 눌러 주세요.');
  loginBusy = true; err('');
  const btn = $('#mBtns .primary');
  if (btn){ btn.disabled = true; btn.textContent = '확인 중…'; }
  try {
    let srv = null;                       // 온라인 서버가 준 로그인 표(토큰)
    onlineNote = '';
    if (onlineWanted()){
      try { srv = await rpc(signup ? 'samhan_signup' : 'samhan_login', {p_id:id, p_pw:pw}); }
      catch (e) {
        const A = REG.accounts[id];
        if (e.code === 'id_taken') return err('이미 서버에 있는 아이디예요. 다른 아이디를 쓰거나 [로그인]해 주세요.');
        if (e.code === 'bad_login'){
          // 서버가 생기기 전에 이 기기에서만 만든 계정이면 서버로 옮긴다
          if (!(A && (await hashPw(pw, A.salt, A.hash[0])) === A.hash)) return err('아이디나 비밀번호가 맞지 않아요.');
          try { srv = await rpc('samhan_signup', {p_id:id, p_pw:pw}); onlineNote = '이 기기의 계정을 온라인 서버로 옮겼어요. 이제 다른 기기에서도 이 아이디로 들어올 수 있어요.'; }
          catch (e2) {
            if (e2.code === 'id_taken') return err('서버에 같은 아이디가 이미 있어요(비밀번호가 달라요). 서버 비밀번호로 로그인하거나 다른 아이디로 새로 만들어 주세요.');
            onlineNote = '지금은 서버에 연결할 수 없어 이 기기에만 저장해요. 다시 연결되면 서버에 올려요.';
          }
        } else if (e.code !== 'net') return err('서버에서 받아 주지 않았어요. 아이디·비밀번호 규칙을 확인해 주세요.');
        else if (!signup && !A) return err('서버에 연결할 수 없어요. 인터넷 연결을 확인하고 다시 시도해 주세요.');
        else onlineNote = '지금은 서버에 연결할 수 없어 이 기기에만 저장해요. 다시 연결되면 서버에 올려요.';
      }
    }
    if (signup || srv){
      // 새 계정이거나 서버 로그인에 성공: 이 기기에도 같은 비밀번호로 계정을 둔다(인터넷이 끊겨도 들어올 수 있게)
      const salt = randHex(16), hash = await hashPw(pw, salt), A = REG.accounts[id];
      if (A) Object.assign(A, {salt, hash, t:now()}); else REG.accounts[id] = {salt, hash, created:now(), t:now(), chars:[]};
    } else {
      const A = REG.accounts[id], h = await hashPw(pw, A.salt, A.hash[0]);
      if (!h) return err('이 브라우저에서는 비밀번호를 확인할 수 없어요. 다른 브라우저로 열어 주세요.');
      if (h !== A.hash) return err('비밀번호가 맞지 않아요.');
    }
    curAcc = id;
    REG.keep = keep ? {acc:id} : null;
    saveReg(); writeSession({acc:id});
    if (srv){
      online = {acc:id, token:srv}; saveOnline(keep);
      try { await syncChars(id); } catch (e) { if (e.code === 'bad_token') lostOnline(); }
    }
    showCharSelect(onlineNote || (signup ? '계정을 만들었어요! 이제 캐릭터를 만들어 볼까요?' : ''));
    onlineNote = '';
  } finally {
    loginBusy = false;
    if (btn && btn.isConnected){ btn.disabled = false; btn.textContent = signup ? '계정 만들기' : '게임 시작'; }
  }
}

/* ================= 온라인 서버(Supabase) =================
   ONLINE.url·key가 채워져 있고 github.io·내 컴퓨터에서 열면 켜진다(claude.ai에서는 그쪽 저장소를 쓴다).
   계정·캐릭터 저장은 서버의 samhan_* 함수만 부른다(supabase/setup.sql). 비밀번호는 서버에서 bcrypt 해시로만 저장되고,
   로그인하면 60일짜리 무작위 표(토큰)를 받아 이 기기에 둔다. 채팅·타임 보스는 실시간 채널 'samhan-world'.
   서버에 닿지 않으면 지금처럼 이 기기 저장으로 놀고, 다시 닿으면 1분마다 올린다. */
const ONLINE = Object.assign({url:'', key:''}, window.__samhanOnline || {});   // key는 '공개용(publishable) 키'라 여기 적어도 된다
const ON_KEY = 'samhan-online-v1';
const ON_CODES = ['id_taken', 'bad_login', 'bad_id', 'bad_pw', 'bad_token', 'name_taken', 'too_many', 'too_big'];
let online = null, onlineLib = null, onlineNote = '';
const onlineWanted = () => !!(ONLINE.url && ONLINE.key) && (PWA_HOST || !!window.__samhanOnline) && !(window.claude && typeof window.claude.use === 'function');
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script')); document.head.appendChild(s); }); }
async function onlineClient(){
  if (onlineLib) return onlineLib;
  if (!window.supabase) await loadScript('vendor/supabase.js');
  onlineLib = window.supabase.createClient(ONLINE.url, ONLINE.key, {auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false}});
  return onlineLib;
}
// 서버 함수 부르기. 실패하면 e.code: 위 ON_CODES 중 하나 또는 'net'(연결 안 됨·느림)
async function rpc(fn, args){
  let r;
  try {
    const sb = await onlineClient();
    r = await Promise.race([sb.rpc(fn, args), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 9000))]);
  } catch (e) { throw Object.assign(new Error('net'), {code:'net'}); }
  if (r && r.error){
    const m = String(r.error.message || '');
    throw Object.assign(new Error(m), {code:ON_CODES.find(c => m.includes(c)) || 'net'});
  }
  return r ? r.data : null;
}
function saveOnline(keep){
  const v = online ? JSON.stringify({acc:online.acc, token:online.token}) : null;
  try { if (v && keep) localStorage.setItem(ON_KEY, v); else localStorage.removeItem(ON_KEY); } catch (e) {}
  try { if (v) sessionStorage.setItem(ON_KEY, v); else sessionStorage.removeItem(ON_KEY); } catch (e) {}
}
function readOnline(){
  for (const st of [sessionStorage, localStorage]){ try { const o = JSON.parse(st.getItem(ON_KEY) || 'null'); if (o && ID_RE.test(o.acc) && typeof o.token === 'string') return o; } catch (e) {} }
  return null;
}
function lostOnline(msg){
  online = null; saveOnline(false);
  if (session) addLog(msg || '서버 로그인이 끊겼어요. 다시 로그인하면 서버에 이어서 저장돼요(지금은 이 기기에 저장 중).', 'warn');
}
// 캐릭터 요약(목록·레이드 동료용)
const charSummary = ch => ({cls:ch.cls, level:ch.level, maxStage:ch.maxStage, look:ch.look, armorG:ch.armorG, weaponG:ch.weaponG, ally:ch.ally});
// 서버의 내 캐릭터 목록을 이 기기 목록과 합친다. 이 기기에만 있는 캐릭터는 서버로 올린다
async function syncChars(acc){
  if (!online) return;
  const A = REG.accounts[acc];
  if (!A) return;
  const list = await rpc('samhan_list', {p_token:online.token});
  if (!Array.isArray(list)) return;
  for (const it of list){
    if (!it || typeof it.cid !== 'string' || typeof it.name !== 'string') continue;
    const sm = it.summary && typeof it.summary === 'object' ? it.summary : {};
    const loc = A.chars.find(c => c.cid === it.cid);
    const ent = {cid:it.cid, name:String(it.name).slice(0, 8), cls:CLASSES[sm.cls] ? sm.cls : 'musa', level:Math.max(1, +sm.level || 1), maxStage:Math.max(1, +sm.maxStage || 1),
      look:cleanLook(sm.look), armorG:Number.isFinite(+sm.armorG) ? +sm.armorG : -1, weaponG:Number.isFinite(+sm.weaponG) ? +sm.weaponG : -1,
      ally:sm.ally && typeof sm.ally === 'object' ? {dps:Math.max(1, +sm.ally.dps || 1), maxHp:Math.max(1, +sm.ally.maxHp || 1)} : undefined, t:+it.t || 0, srvT:+it.t || 0};
    if (!loc) A.chars.push(ent);
    else { loc.srvT = ent.srvT; if ((ent.t || 0) > (loc.t || 0)) Object.assign(loc, ent); }
  }
  const onSrv = new Set(list.map(it => it && it.cid));
  for (const ch of A.chars.slice()){
    if (onSrv.has(ch.cid)) continue;
    let save = null;

    if (!save){ continue; }
    try { const d = JSON.parse(save); await rpc('samhan_save', {p_token:online.token, p_cid:ch.cid, p_name:ch.name, p_summary:charSummary(ch), p_save:save, p_t:d.lastSave || 0}); }
    catch (e) { if (e.code === 'name_taken') ch.srvErr = 'name'; else if (e.code === 'bad_token'){ lostOnline(); return; } }
  }
  A.chars = A.chars.slice(0, MAX_CHARS);
  A.t = now(); saveReg();
}
// 지금 캐릭터를 서버에 올린다(1분마다·창을 숨길 때·캐릭터 바꿀 때)
let onlineBusy = false, onlineP = Promise.resolve();
function pushOnline(){
  if (!online || !session || onlineBusy || session.acc !== online.acc) return onlineP;
  onlineP = pushOnlineNow();
  return onlineP;
}
async function pushOnlineNow(){

  }
  onlineBusy = false;
}
// 실시간 채널: claude.ai room과 같은 모양(on·onPeers·emit)으로 감싼다
async function onlineRoom(){
  const sb = await onlineClient(), me = randHex(6), hs = {}, peerFns = [];
  const ch = sb.channel('samhan-world', {config:{broadcast:{self:false}, presence:{key:me}}});
  for (const topic of ['chat', 'tb']) ch.on('broadcast', {event:topic}, msg => {
    const p = msg && msg.payload && typeof msg.payload === 'object' ? msg.payload : {};
    for (const fn of hs[topic] || []) fn({data:p.d, peer:String(p.p || '').slice(0, 16)});
  });
  ch.on('presence', {event:'sync'}, () => { const n = Object.keys(ch.presenceState() || {}).length; for (const f of peerFns) f({peers:new Array(n).fill(0)}); });
  await new Promise((res, rej) => {
    const to = setTimeout(() => rej(new Error('timeout')), 9000);
    ch.subscribe(st => {
      if (st === 'SUBSCRIBED'){ clearTimeout(to); Promise.resolve(ch.track({t:Date.now()})).catch(() => {}); res(); }
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED'){ clearTimeout(to); rej(new Error(st)); }
    });
  });
  return {
    on(topic, fn){ (hs[topic] = hs[topic] || []).push(fn); return () => {}; },
    onPeers(fn){ peerFns.push(fn); return () => {}; },
    emit(topic, data){ return Promise.resolve(ch.send({type:'broadcast', event:topic, payload:{d:data, p:me}})).then(r => { if (r && r !== 'ok') throw Object.assign(new Error(String(r)), {code:String(r)}); }); },
  };
}

/* ================= 소리: 국악풍 배경음악·효과음 =================
   음원 파일 없이 Web Audio로 직접 연주한다(저작권 걱정 없음, 오프라인에서도 남).
   가야금(뜯는 소리)·대금(부는 소리)·장구(덩·쿵·덕)·징. 이승은 평조, 저승은 계면조 느낌의 5음 음계.
   브라우저 규칙상 화면을 한 번 눌러야 소리가 난다. */
const AUD_KEY = 'samhan-audio';
const AUD = {ctx:null, master:null, bgm:null, fx:null, noise:null, track:'', next:0, step:0, phrase:[], deg:0, lastHit:0, set:{bgm:true, sfx:true, bv:0.5, sv:0.7}};
try { Object.assign(AUD.set, JSON.parse(localStorage.getItem(AUD_KEY) || '{}')); } catch (e) {}
function audSave(){ try { localStorage.setItem(AUD_KEY, JSON.stringify(AUD.set)); } catch (e) {} audApply(); }
function audApply(){
  if (!AUD.ctx) return;
  const t = AUD.ctx.currentTime;
  AUD.bgm.gain.setTargetAtTime(AUD.set.bgm ? AUD.set.bv * 0.55 : 0, t, 0.2);
  AUD.fx.gain.setTargetAtTime(AUD.set.sfx ? AUD.set.sv * 0.8 : 0, t, 0.05);
}
function audInit(){
  if (AUD.ctx) { if (AUD.ctx.state === 'suspended') AUD.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const c = AUD.ctx = new AC();
  AUD.master = c.createGain(); AUD.master.gain.value = 0.9; AUD.master.connect(c.destination);
  AUD.bgm = c.createGain(); AUD.bgm.connect(AUD.master);
  AUD.fx = c.createGain(); AUD.fx.connect(AUD.master);
  const len = c.sampleRate, nb = c.createBuffer(1, len, c.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  AUD.noise = nb;
  audApply();
  AUD.next = c.currentTime + 0.1;
  setInterval(audTick, 60);
}
document.addEventListener('pointerdown', audInit, true);

const hz = midi => 440 * Math.pow(2, (midi - 69) / 12);
// 악기
function pluck(out, t, midi, dur, vol){
  const c = AUD.ctx, o1 = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
  const fq = hz(midi);
  o1.type = 'triangle'; o2.type = 'sawtooth'; o2.detune.value = 6;
  o1.frequency.setValueAtTime(fq * 1.02, t); o1.frequency.exponentialRampToValueAtTime(fq, t + 0.07);   // 농현처럼 살짝 꺾임
  o2.frequency.setValueAtTime(fq * 1.02, t); o2.frequency.exponentialRampToValueAtTime(fq, t + 0.07);
  f.type = 'lowpass'; f.frequency.setValueAtTime(3200, t); f.frequency.exponentialRampToValueAtTime(500, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const g2 = c.createGain(); g2.gain.value = 0.35;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(f); f.connect(out);
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}
function flute(out, t, midi, dur, vol){
  const c = AUD.ctx, o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), g = c.createGain();
  o.type = 'sine'; o.frequency.value = hz(midi);
  lfo.frequency.value = 5; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(hz(midi) * 0.012, t + dur * 0.6);
  lfo.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.09); g.gain.setValueAtTime(vol, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const n = c.createBufferSource(), nf = c.createBiquadFilter(), ng = c.createGain();
  n.buffer = AUD.noise; nf.type = 'bandpass'; nf.frequency.value = hz(midi) * 2; nf.Q.value = 3; ng.gain.value = vol * 0.25;
  n.connect(nf); nf.connect(ng); ng.connect(g);
  o.connect(g); g.connect(out);
  o.start(t); lfo.start(t); n.start(t, Math.random() * 0.5); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05); n.stop(t + dur + 0.05);
}
function drum(out, t, kind, vol){
  const c = AUD.ctx;
  if (kind === 'dung' || kind === 'kung'){
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(kind === 'dung' ? 110 : 90, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.25);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.4);
  }
  if (kind === 'dung' || kind === 'deok'){
    const n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    n.buffer = AUD.noise; f.type = 'bandpass'; f.frequency.value = kind === 'deok' ? 2600 : 1800; f.Q.value = 1.2;
    g.gain.setValueAtTime(vol * (kind === 'deok' ? 0.9 : 0.6), t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    n.connect(f); f.connect(g); g.connect(out); n.start(t, Math.random()); n.stop(t + 0.12);
  }
}
function gong(out, t, vol){
  const c = AUD.ctx;
  for (const [fq, v] of [[98, 1], [101.5, 0.7], [196, 0.3]]){
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = fq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * v, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 3.3);
  }
}
// 곡: 박자 길이·음계·장단(장구 무늬)·밑음
const TRACKS = {
  title:{step:0.5, root:55, scale:[0, 2, 5, 7, 9], drums:['dung', '', '', '', '', '', 'kung', '', '', '', 'deok', ''], mel:'flute', melEvery:2, arp:true},
  field:{step:0.24, root:55, scale:[0, 2, 5, 7, 9], drums:['dung', '', 'deok', 'kung', '', 'deok', 'dung', 'deok', 'deok'], mel:'pluck', melEvery:1, arp:false},
  battle:{step:0.16, root:57, scale:[0, 3, 5, 7, 10], drums:['dung', 'deok', 'deok', 'dung', 'kung', 'deok', 'dung', 'deok'], mel:'pluck', melEvery:1, arp:true},
  hell:{step:0.42, root:52, scale:[0, 3, 5, 7, 10], drums:['dung', '', '', '', 'kung', '', '', ''], mel:'flute', melEvery:2, drone:true},
};
function wantTrack(){
  if (!session) return 'title';
  if (cut) return S.world ? 'hell' : 'title';
  if (raid || bossActive) return 'battle';
  return S.world ? 'hell' : 'field';
}
function audTick(){
  const c = AUD.ctx;
  if (!c || c.state !== 'running') return;
  const want = wantTrack();
  if (want !== AUD.track){
    AUD.track = want; AUD.step = 0; AUD.phrase = []; AUD.next = Math.max(AUD.next, c.currentTime + 0.05);
    if (want === 'battle' && AUD.set.bgm) gong(AUD.bgm, c.currentTime + 0.05, 0.25);
  }
  if (!AUD.set.bgm){ AUD.next = c.currentTime + 0.1; return; }
  const T = TRACKS[AUD.track];
  while (AUD.next < c.currentTime + 0.25){
    const t = AUD.next, st = AUD.step;
    const dk = T.drums[st % T.drums.length];
    if (dk) drum(AUD.bgm, t, dk, dk === 'deok' ? 0.18 : 0.32);
    if (st % T.melEvery === 0){
      if (!AUD.phrase.length){
        // 새 가락: 음계 안에서 한두 칸씩 움직이고, 끝은 으뜸음으로
        const n = 6 + ((Math.random() * 5) | 0), ph = [];
        let dg = AUD.deg || 5;
        for (let i = 0; i < n; i++){ dg = Math.max(0, Math.min(10, dg + [-2, -1, -1, 1, 1, 2, 0][(Math.random() * 7) | 0])); ph.push(Math.random() < 0.18 ? null : dg); }
        ph.push(5); ph.push(null); ph.push(null);
        AUD.phrase = ph; AUD.deg = dg;
      }
      const dg = AUD.phrase.shift();
      if (dg != null){
        const midi = T.root + 12 + T.scale[dg % 5] + 12 * Math.floor(dg / 5) - 12;
        if (T.mel === 'flute') flute(AUD.bgm, t, midi + 12, T.step * T.melEvery * 1.8, 0.13);
        else pluck(AUD.bgm, t, midi + 12, 0.9, 0.16);
      }
    }
    if (T.arp && st % 4 === 0) pluck(AUD.bgm, t, T.root + T.scale[(st / 4) % 5 | 0], 1.4, 0.09);
    if (T.drone && st % 16 === 0) flute(AUD.bgm, t, T.root - 12, T.step * 16, 0.07);
    AUD.next += T.step; AUD.step++;
  }
}
// 효과음
const SFX_GAP = {hit:0.07, crit:0.08, blip:0.06, click:0.05, kill:0.08, gem:0.1};
const sfxLast = {};
sfx = function(name){
  const c = AUD.ctx;
  if (!c || !AUD.set.sfx || c.state !== 'running') return;
  const t = c.currentTime;
  if (SFX_GAP[name] && t - (sfxLast[name] || 0) < SFX_GAP[name]) return;
  sfxLast[name] = t;
  const o = AUD.fx, P5 = [0, 2, 5, 7, 9];
  switch (name){
    case 'hit': drum(o, t, 'deok', 0.12); break;
    case 'crit': drum(o, t, 'deok', 0.2); pluck(o, t, 84, 0.25, 0.12); break;
    case 'kill': pluck(o, t, 88, 0.2, 0.08); pluck(o, t + 0.05, 93, 0.25, 0.08); break;
    case 'gem': pluck(o, t, 91, 0.6, 0.14); pluck(o, t + 0.08, 96, 0.8, 0.12); break;
    case 'level': P5.concat([12]).forEach((d, i) => pluck(o, t + i * 0.07, 67 + d, 0.6, 0.15)); break;
    case 'boss': gong(o, t, 0.4); drum(o, t, 'dung', 0.5); break;
    case 'win': [0, 5, 9, 12].forEach((d, i) => pluck(o, t + i * 0.1, 67 + d, 0.8, 0.16)); drum(o, t, 'dung', 0.4); break;
    case 'fail': [7, 5, 2, 0].forEach((d, i) => flute(o, t + i * 0.18, 60 + d, 0.3, 0.1)); break;
    case 'skill': { const n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); n.buffer = AUD.noise; f.type = 'bandpass'; f.Q.value = 2;
      f.frequency.setValueAtTime(600, t); f.frequency.exponentialRampToValueAtTime(3000, t + 0.25); g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      n.connect(f); f.connect(g); g.connect(o); n.start(t); n.stop(t + 0.32); break; }
    case 'nuke': drum(o, t, 'dung', 0.6); drum(o, t + 0.12, 'kung', 0.5); sfx('skill'); break;
    case 'quest': [0, 2, 5, 7].forEach((d, i) => pluck(o, t + i * 0.06, 72 + d, 0.5, 0.13)); break;
    case 'rare': [0, 5, 9, 12, 17, 21].forEach((d, i) => pluck(o, t + i * 0.07, 72 + d, 0.9, 0.14)); gong(o, t, 0.15); break;
    case 'summon': [0, 2, 5, 7, 9].forEach((d, i) => pluck(o, t + i * 0.05, 72 + d, 0.4, 0.1)); break;
    case 'refOk': pluck(o, t, 96, 0.5, 0.2); pluck(o, t + 0.05, 91, 0.7, 0.15); break;
    case 'refNo': drum(o, t, 'kung', 0.4); break;
    case 'raid': gong(o, t, 0.35); [0, 1, 2, 3].forEach(i => drum(o, t + 0.3 + i * 0.12, i % 2 ? 'deok' : 'dung', 0.35)); break;
    case 'awaken': gong(o, t, 0.5); [0, 5, 7, 12, 17, 19, 24].forEach((d, i) => pluck(o, t + i * 0.04, 60 + d, 1.2, 0.15)); break;
    case 'form': [0, 7, 12, 19].forEach((d, i) => flute(o, t + i * 0.06, 72 + d, 0.6, 0.1)); break;
    case 'rebirth': gong(o, t, 0.5); [12, 7, 5, 0, -5].forEach((d, i) => flute(o, t + 0.3 + i * 0.25, 60 + d, 0.6, 0.1)); break;
    case 'potion': flute(o, t, 79, 0.25, 0.1); break;
    case 'cut': gong(o, t, 0.18); break;
    case 'blip': pluck(o, t, 86, 0.12, 0.05); break;
    case 'click': pluck(o, t, 81, 0.1, 0.06); break;
  }
};
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('.btn,.chip,.tab,.seg button,.gbtn,.ccard,.char')) sfx('click'); });

/* ================= 시작 ================= */
let last = performance.now();
function loop(ts){
  let dt = (ts - last) / 1000; last = ts;
  if (dt > 0.25) dt = 0.25;
  if (cut){ updateCut(dt); shake = Math.max(0, shake - dt); }
  else if (dt > 0){
    for (let i = 0; i < S.speed; i++){
      let rem = dt;
      while (rem > 0){ const step = Math.min(rem, 0.05); update(step); rem -= step; }
    }
  }
  if (session && dt > 0){ tickBuffs(dt); npcChatter(dt); }
  if (heroSay){ heroSay.t -= dt; if (heroSay.t <= 0) heroSay = null; }
  render(); updateHud();
  requestAnimationFrame(loop);
}
function start(hotData){
  REG = loadReg();
  refreshStats(); resetRuntime(); resize(); applySpeedBtn();
  buildTab('grow');
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv.parentElement);
  else window.addEventListener('resize', resize);
  last = performance.now();
  requestAnimationFrame(loop);
  setInterval(() => { refreshPanel(); updateGuide(); updateDots(); }, 200);
  setInterval(saveLocal, 5000);
  setInterval(pushCloud, 60000);
  let hotOk = false;
  if (hotData && typeof hotData.save === 'string' && hotData.acc && REG.accounts[hotData.acc]){
    try {
      const d = JSON.parse(hotData.save);
      if (d && d.v === 1 && REG.accounts[hotData.acc].chars.some(c => c.cid === hotData.cid)){
        curAcc = hotData.acc; enterChar(hotData.cid, {data:d, hot:true}); hotOk = true;
        bootCloud().then(c => { cloud = c; });
      }
    } catch (e) {}
  }
  if (!hotOk) boot();
  if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function'){
    window.claude.hot.snapshot(() => ({save:JSON.stringify(S), acc:session && session.acc, cid:session && session.cid}));
  }
}
if (location.search.indexOf('simtest') >= 0){
  window.__game = {
    get S(){ return S; }, get ST(){ return ST; }, get hero(){ return hero; }, get bossActive(){ return bossActive; }, get raid(){ return raid; }, get session(){ return session; },
    update, buyStat, upgradeSkill, summon, mergeAll, equipBest, skillCost, buyInfo, SKILLS, setClass, render,
    petSummon, petUpgrade, petEquipBest, petUpCost, PETS, PET_TYPE_ORDER, eqPet, refineTry, refineGold, refineGems, REFINE_MAX,
    claimAll, startRaid, raidReady, raidUnlocked, firstReadyRaid, raidInfo, buildTab,
    buyShop, SHOP, dropMyth, showNotes, playCut, get cut(){ return cut; }, MAIN_Q, PROLOGUE, claimMain, installApp, get pwa(){ return PWA_HOST; }, questLuck, sendChat, addChat, get chatMsgs(){ return chatMsgs; }, get skillCd(){ return skillCd; }, luck:null,
    addTime(ms){ clockSkew += ms; }, quiet:false,
    sheet(){ return {hero:CLASS_ORDER.map(c => ['down', 'up', 'right'].map(d => [0, 1, 2, 3].map(f => heroSprite(c, d, f).toDataURL()))), mobs:Object.keys(MOB_HD).map(t => [mobSprite(t, '#8a8a8a', 0, false).toDataURL(), mobSprite(t, '#8a8a8a', 1, false).toDataURL()]), pets:PETS.map((p, i) => [petSprite(i, 0).toDataURL(), petSprite(i, 1).toDataURL()])}; },
    setStage(s){ S.stage = s; mapCache.clear(); resetRuntime(); },
    lookSheet(){ const out = [], L = S.look; for (let g = -1; g <= 4; g++) out.push(lookPreview(S.cls, L, g, g, 'down')); for (let g = 2; g <= 4; g++) out.push(lookPreview(S.cls, L, g, g, 'right')); out.push(lookPreview(S.cls, L, 4, 4, 'up'));
      for (const F of FORMS) for (const d of ['down', 'right', 'up']) out.push(lookPreview(S.cls, L, 3, 3, d, {form:F.k, ear:4, brace:3})); return out; },
    CURVE, fmt, get online(){ return online; }, pushOnline, get room(){ return room; }, get aud(){ return AUD; }, get REG(){ return REG; }, applyWorld, refreshStats, HELL_REGIONS,
    setWorld(w){ S.world = w; S.stage = 1; mapCache.clear(); resetRuntime(); applyWorld(); refreshStats(); },
    doRebirth, rebirthReady, claimTrial, rebUp, giveAcc, rollAcc, startTimeBoss, tbWindow, tbCan, castAwaken, startFight,
  };
}

const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});
})();
