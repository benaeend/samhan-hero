/* ================= 타임 보스 =================
   00시부터 3시간마다(이 기기 시계) 30분 동안 나타난다. 접속한 용사는 저절로 모두 참가(tbAutoJoin), 파티 전체 목숨 TB_LIVES(5)번.
   참가자: claude.ai에서는 같은 페이지에서 [참가]를 누른 사람(실시간 room 'tb'), 그 밖에는 이 기기의 '다른 계정' 캐릭터.
   온라인 서버가 생기면 tbOthers()만 서버 참가자 목록으로 바꾸면 된다. */
const TB_SLOTS = [
  {name:'그믐 어둑시니', type:'shade', color:'#2a2238'},
  {name:'새벽 불가사리', type:'bulgasari', color:'#4a5a6a'},
  {name:'해돋이 해태', type:'haetae', color:'#e0a03a'},
  {name:'구미호 여왕', type:'fox', color:'#f4e8ff'},
  {name:'한낮 도깨비 대장군', type:'dokkaebi', color:'#d8433a'},
  {name:'노을 이무기', type:'serpent', color:'#c86a3a'},
  {name:'저녁 장승 대장군', type:'totem', color:'#7a5a4a'},
  {name:'밤의 염라 그림자', type:'judge', color:'#3a1a2a'},
];
const TB_OPEN = 30 * 60 * 1000, TB_TIME = 120;
const TB_DIFF = {
  normal:{name:'노말', ref:60, gold:300, drop:{ear:0.006, brace:0.006, myth:0.01}, gp:[0.4, 0.33, 0.18, 0.07, 0.02]},
  hell:{name:'지옥', ref:100, gold:600, drop:{ear:0.02, brace:0.02, myth:0.03}, gp:[0.1, 0.3, 0.35, 0.18, 0.07]},
};
function tbWindow(){
  const d = new Date(now()), slot = Math.floor(d.getHours() / 3);
  const start = new Date(d.getFullYear(), d.getMonth(), d.getDate(), slot * 3).getTime();
  return {slot, id:start, open:now() - start < TB_OPEN, end:start + TB_OPEN, next:start + 3 * 3600 * 1000, boss:TB_SLOTS[slot]};
}
const tbPeers = new Map();     // 실시간으로 참가한 사람들(peer → 정보)
function tbOthers(){
  const w = tbWindow(), out = [];
  for (const p of tbPeers.values()) if (p.w === w.id && out.length < 9) out.push(Object.assign({live:true}, p));
  if (session) for (const c of allChars()) if (c.acc !== session.acc && c.ally && out.length < 9)
    out.push({name:c.name, cls:c.cls, look:cleanLook(c.look), armorG:c.armorG, weaponG:c.weaponG, dps:c.ally.dps, maxHp:c.ally.maxHp, own:true});
  return out;
}
const tbUsers = () => 1 + tbOthers().length;
const tbDone = diff => (S.tb && S.tb[diff]) === tbWindow().id;
function tbCan(diff){
  const w = tbWindow();
  if (!w.open) return '아직 나타나지 않았어요';
  if (raid) return '다른 싸움 중이에요';
  if (tbDone(diff)) return '이번 타임 보스는 이미 잡았어요';
  if (diff === 'hell' && !S.reb.n) return '환생해야 도전할 수 있어요';
  return '';
}
const TB_LIVES = 5;   // 타임 보스: 파티 전체가 다섯 번까지만 일어날 수 있다
let tbJoinedId = '';
// 타임 보스가 열려 있으면 접속한 용사는 저절로 참가를 알린다(모두 함께 싸움)
function tbAutoJoin(){ const w = tbWindow(); if (!w.open || !session || tbJoinedId === w.id) return; tbJoinedId = w.id; tbJoin(); }
function tbJoin(){
  if (!room || !session) return;
  room.emit('tb', {w:tbWindow().id, n:S.name, c:S.cls, d:Math.round(dpsOf(ST)), h:Math.round(ST.maxHp), l:S.look}).catch(() => {});
}
function startTimeBoss(diff){
  if (tbCan(diff)) return false;
  const w = tbWindow(), D = TB_DIFF[diff], others = tbOthers();
  const party = others.map(o => ({name:o.name, cls:CLASSES[o.cls] ? o.cls : 'musa', look:cleanLook(o.look), armorG:o.armorG == null ? -1 : o.armorG, weaponG:o.weaponG == null ? -1 : o.weaponG,
    dps:Math.max(1, +o.dps || 1), maxHp:Math.max(1, +o.maxHp || 1), own:true}));
  const partyDps = dpsOf(ST) + party.reduce((t, a) => t + a.dps, 0);
  const base = 10 * mobHp(D.ref) / 15 * 3 * 40;
  const info = {tb:true, diff, w:w.id, label:`타임 보스 · ${D.name}`, bossName:(diff === 'hell' ? '지옥 ' : '') + w.boss.name, type:w.boss.type,
    color:diff === 'hell' ? mix(w.boss.color, '#ff2a2a', 0.45) : w.boss.color, region:regionIndex(S.stage), party:party.length + 1, ref:D.ref};
  startFight(info, party, {hp:Math.max(base * 2, partyDps * 70), atk:heroRef(0, D.ref) / (2 * MOB_TTK) * 4.8, aoe:heroRef(0, D.ref) / (2 * MOB_TTK) * 3.2, time:TB_TIME});
  raid.deaths = 0;
  addLog(`타임 보스 ${info.bossName}! ${party.length + 1}명이 함께 ${TB_TIME}초 안에 쓰러뜨려요.`, 'warn');
  tbJoin();
  return true;
}
function finishTimeBoss(R){
  const info = R.info, D = TB_DIFF[info.diff];
  if (!R.win){
    addLog(`타임 보스 ${info.bossName} 토벌 실패…`, 'warn');
    if (!(window.__game && window.__game.quiet)) showModal('타임 보스 실패', `<p>${TB_TIME}초 안에 <b>${info.bossName}</b>${josa(info.bossName, '을', '를')} 쓰러뜨리지 못했어요. 창이 열려 있는 동안 다시 도전할 수 있어요.</p>`, [{label:'확인', primary:true}]);
    return;
  }
  if (!S.tb) S.tb = {};
  S.tb[info.diff] = info.w;
  const gold = Math.max(mobGold(D.ref), mGold(S.stage)) * D.gold * gainMul('gold');
  S.gold += gold; S.rec.tb = (S.rec.tb || 0) + 1;
  gainMat(MAT_DROP.tb); gainPiece(MOUNT_PIECE.tb);
  const luck = window.__game && window.__game.tbLuck || 1, drops = [];
  for (const k of ['ear', 'brace']) if (Math.random() < D.drop[k] * luck){
    let r = Math.random(), g = 0; for (; g < 4; g++){ if (r < D.gp[g]) break; r -= D.gp[g]; }
    const a = giveAcc(k, g); drops.push(`${GRADES[a.g].name} ${ACC[k].names[a.g]}${a.better ? '' : ' (보석으로 바꿈)'}`);
  }
  if (Math.random() < D.drop.myth * luck){ const m = dropMyth(D.ref); drops.push(`신화 보물 ${MYTHS.find(x => x.k === m.k).name}${m.up ? '' : ' (보석으로 바꿈)'}`); }
  addLog(`타임 보스 토벌! 엽전 +${fmt(gold)}`, 'gain');
  announce(`${S.name}님의 파티가 타임 보스 ${info.bossName}${josa(info.bossName, '을', '를')} 쓰러뜨렸어요!`);
  saveLocal();
  sfx('win');
  if (window.__game && window.__game.quiet) return;
  showModal('타임 보스 토벌 성공', `<p><b>${info.bossName}</b>${josa(info.bossName, '을', '를')} ${info.party}명이 함께 쓰러뜨렸어요!</p>
    <ul class="rewards"><li><span class="coin"></span>${fmt(gold)}<span>엽전</span></li>
    ${drops.map(d => `<li style="color:var(--myth)">${d}<span>희귀 보상!</span></li>`).join('')}</ul>
    <p class="small" style="margin-top:8px">귀걸이·팔찌·신화 보물은 아주 드물게 떨어져요. 다음 타임 보스는 ${new Date(tbWindow().next).getHours()}시예요.</p>`, [{label:'확인', primary:true}]);
}

function pickRaidTarget(){
  const pool = [];
  if (!hero.dead) pool.push([hero, S.cls === 'musa' ? 3 : 1.5]);
  for (const a of raid.allies) if (!a.down) pool.push([a, a.cls === 'musa' ? 3 : 1]);
  let tot = pool.reduce((s, p) => s + p[1], 0), r = Math.random() * tot;
  for (const [e, w] of pool){ if (r < w) return e; r -= w; }
  return null;
}
function damageAlly(a, d){
  const dmg = d * (0.9 + Math.random() * 0.2);
  a.hp -= dmg; a.hurt = 0.12;
  addText('-' + fmt(dmg), a.x, a.y - 30, '#ff8a7a', 9);
  if (a.hp <= 0){ a.hp = 0; a.down = true; a.downT = 6; a.swing = 0;
    if (raid && raid.info.tb){ raid.deaths = (raid.deaths || 0) + 1; if (raid.deaths >= TB_LIVES){ a.downT = Infinity; for (const b2 of raid.allies) if (b2.down) b2.downT = Infinity; if (hero.dead) hero.deadT = Infinity; } } }
}
function allyAttack(a, B){
  a.swing = 0.2;
  const C = CLASSES[a.cls];
  if (!C.proj){ fx.push({type:'slash', t:0, dur:0.16, x:a.x, y:a.y - 8, dir:a.dir, color:C.fx}); hit(B, a.hit, 'ally'); }
  else projs.push({kind:C.proj, x:a.x, y:a.y - 12, tg:B, trail:[], dmg:a.hit, hk:'ally'});
}
function healParty(a){
  const all = [];
  if (!hero.dead) all.push([hero, hero.hp / ST.maxHp, ST.maxHp]);
  for (const o of raid.allies) if (!o.down) all.push([o, o.hp / o.maxHp, o.maxHp]);
  all.sort((p, q) => p[1] - q[1]);
  const [tg, r, mx] = all[0] || [];
  if (!tg || r > 0.85) return;
  const h = mx * 0.25;
  tg.hp = Math.min(mx, tg.hp + h);
  addText('+' + fmt(h), tg.x, tg.y - 34, '#8ff0a0', 10);
  fx.push({type:'heal', t:0, dur:0.7, x:tg.x, y:tg.y});
  fx.push({type:'pillar', t:0, dur:0.35, x:a.x, y:a.y - 10});
}
function updateRaid(dt){
  const R = raid, B = R.boss;
  if (R.ending){ R.endT -= dt; if (R.endT <= 0) finishRaid(); return; }
  R.time -= dt;
  if (R.time <= 0){ raidEnd(false); return; }
  if (R.info.tb && (R.deaths || 0) >= TB_LIVES && hero.dead && R.allies.every(a => a.down)){ raidEnd(false); return; }
  if (R.awk){
    if (R.awk.show > 0) R.awk.show -= dt;
    if (!R.awk.used && !hero.dead && !B.dead && B.spawnT <= 0){ R.awk.t -= dt; if (R.awk.t <= 0 || B.hp <= B.maxHp * 0.6) castAwaken(); }
  }
  for (const a of R.allies){
    a.swing = Math.max(0, a.swing - dt); a.hurt = Math.max(0, a.hurt - dt);
    if (a.down){
      a.downT -= dt;
      if (a.downT <= 0){ a.down = false; a.hp = a.maxHp * 0.5; fx.push({type:'poof', t:0, dur:0.4, x:a.x, y:a.y - 8}); }
      continue;
    }
    a.hp = Math.min(a.maxHp, a.hp + a.maxHp * 0.01 * dt);
    if (B.dead || B.spawnT > 0) continue;
    a.dir = dirOf(B.tx - a.tx, B.ty - a.ty);
    a.atkT -= dt * a.aspd;
    if (a.atkT <= 0){ a.atkT = 1; allyAttack(a, B); }
    if (a.cls === 'doin'){ a.healT -= dt; if (a.healT <= 0){ a.healT = 4; healParty(a); } }
  }
  if (B.dead || B.spawnT > 0) return;
  B.atkT -= dt;
  if (B.atkT <= 0){
    B.atkT = 1.6;
    const tg = pickRaidTarget();
    if (tg){
      B.dir = tg.x > B.x ? 'right' : 'left'; B.lunge = 0.2;
      fx.push({type:'hit', t:0, dur:0.2, x:tg.x, y:tg.y - 12});
      if (tg === hero) damageHero(B.atk); else damageAlly(tg, B.atk);
    }
  }
  B.aoeT -= dt;
  if (B.aoeT <= 0){
    B.aoeT = 7;
    fx.push({type:'ring', t:0, dur:0.6, x:B.x, y:B.y - 4, color:'#ff7a4a', r:90});
    shake = 0.3;
    addText('땅울림!', B.x, B.y - mobHeight(B) - 14, '#ff9a6a', 13, true);
    if (!hero.dead) damageHero(B.aoe);
    for (const a of R.allies) if (!a.down) damageAlly(a, B.aoe);
  }
}
function raidEnd(win){
  if (!raid || raid.ending) return;
  raid.ending = true; raid.win = win; raid.endT = win ? 1.3 : 0.8;
  const B = raid.boss;
  if (!win && !B.dead){ B.dead = true; B.deathT = 0.6; B.fled = true; fx.push({type:'poof', t:0, dur:0.6, x:B.x, y:B.y - 20, big:true}); }
  if (win){ shake = 0.4; fx.push({type:'level', t:0, dur:1}); }
}
function raidReward(info){
  const first = !S.raid.first[info.key];
  const gems = info.gems + (first ? info.firstGems : 0), gold = mGold(info.ref) * 60 * gainMul('gold');
  const items = [];
  const roll = () => { let r = Math.random(), t = 0; for (; t < 3; t++){ if (r < TIER_P[t]) break; r -= TIER_P[t]; } return t; };
  items.push({slot:Math.random() < 0.5 ? 'weapon' : 'armor', it:info.g * 4 + roll()});
  if (first) items.push({slot:Math.random() < 0.5 ? 'weapon' : 'armor', it:Math.min(info.hell || info.god || info.busang || info.kunlun ? 4 : 3, info.g + 1) * 4 + roll()});
  for (const r of items) r.isNew = giveItem(r.slot, r.it);
  S.gems += gems; S.gold += gold;
  const mat = gainMat(first ? MAT_DROP.raid + MAT_DROP.raidFirst : MAT_DROP.raid, true);
  const piece = info.busang || info.kunlun ? gainPiece((info.kunlun ? MOUNT_PIECE.kunlun : MOUNT_PIECE.busang) + (first ? MOUNT_PIECE.first : 0), true) : 0;
  S.raid.first[info.key] = true; S.rec.raids++;
  if (info.hell) S.rec.hraids = (S.rec.hraids || 0) + 1;
  if (raidTickets() >= TICKET_MAX) S.raid.tkT = now();
  S.raid.tk = Math.max(0, S.raid.tk - 1);
  refreshStats();
  ev('raid');
  return {gems, gold, items, first, mat, piece};
}
/* 허수아비 수련(솔로 레이드): 하루 3번, 30초 동안 허수아비에게 넣은 피해로 1~5등급 보상(엽전·보석·재료·장신구) */
const DUMMY_TRIES = 3, DUMMY_TIME = 30, DUMMY_T = [2, 5, 10, 20, 40];   // 등급 기준 = 지금 세계 최고 단계 몹 체력 ×
const dummyDay = () => { const t = new Date(now()); return `${t.getFullYear()}-${t.getMonth() + 1}-${t.getDate()}`; };
function dummyLeft(){ if (S.dummy.day !== dummyDay()){ S.dummy.day = dummyDay(); S.dummy.n = 0; } return DUMMY_TRIES - S.dummy.n; }
const dummyTiers = () => DUMMY_T.map(k => k * mHp(Math.max(1, S.maxStage)));
const dummyTier = dmg => dummyTiers().filter(t => dmg >= t).length;
function startDummy(){
  if (raid || dummyLeft() <= 0 || !session && !window.__game) return false;
  S.dummy.n++;
  const info = {dummy:true, label:'허수아비 수련', bossName:'짚 허수아비', type:'scarecrow', color:'#d8b060', region:regionIndex(S.stage), party:1, ref:S.maxStage, g:0};
  startFight(info, [], {hp:1e300, atk:0, aoe:0, time:DUMMY_TIME});
  dmgMeter = 0;
  addLog(`허수아비 수련! ${DUMMY_TIME}초 동안 있는 힘껏 쳐요.`, 'warn');
  return true;
}
function finishDummy(){
  const dmg = dmgMeter, tier = dummyTier(dmg), w = Math.min(4, S.world + 1);
  const gold = tier ? Math.round(mGold(Math.max(1, S.maxStage)) * 150 * gainMul('gold', true)) : 0, gems = [0, 0, 30, 60, 100, 150][tier], mats = [0, 0, 0, 2, 4, 6][tier];
  S.gold += gold; S.gems += gems; if (mats) gainMat(mats, true);
  const piece = tier >= 4 ? gainPiece(tier - 3, true) : 0;
  let acc = '';
  if (tier >= 4){ const k = tier >= 5 ? (Math.random() < 0.5 ? 'ear' : 'brace') : 'ring', gg = Math.min(4, tier >= 5 ? w : w - 1); const r = giveAcc(k, Math.max(0, gg)); acc = ACC[k].names[Math.max(0, gg)] + (r ? '' : ' (이미 더 좋은 것)'); }
  if (dmg > (S.dummy.best || 0)) S.dummy.best = dmg;
  addLog(`허수아비 수련 끝! 피해 ${fmt(dmg)} · ${tier ? tier + '등급' : '등급 없음'}`, tier ? 'gain' : 'warn'); sfx(tier ? 'win' : 'fail');
  if (!(window.__game && window.__game.quiet)) showModal('허수아비 수련', `<p>${DUMMY_TIME}초 동안 넣은 피해 <b>${fmt(dmg)}</b></p>
    <div class="dtier">${[1, 2, 3, 4, 5].map(t => `<span class="${t <= tier ? 'on' : ''}">${t}</span>`).join('')}</div>
    <div class="rchips" style="justify-content:center">${gold ? `<span class="rchip rc-gold">엽전 ${fmt(gold)}</span>` : ''}${gems ? `<span class="rchip rc-gem">보석 ${gems}</span>` : ''}${mats ? `<span class="rchip rc-mat">재료 ${mats}</span>` : ''}${acc ? `<span class="rchip rc-acc">${acc}</span>` : ''}${piece ? `<span class="rchip rc-mount">고삐 조각 ${piece}</span>` : ''}${tier ? '' : '<span class="rchip">1등급까지 조금만 더!</span>'}</div>`,
    [{label:'확인', primary:true}]);
  ev('raid');
  return {dmg, tier, gold, gems};
}
function finishRaid(){
  const R = raid;
  raid = null;
  mobs = []; projs = []; bossActive = false; bossRef = null; spawnT = 1;
  Object.assign(hero, {tx:10, ty:8, fx:10, fy:8, moving:false, dir:'down', dead:false, hp:ST.maxHp, target:null, engaged:false});
  placeOf(hero);
  fx.push({type:'poof', t:0, dur:0.4, x:hero.x, y:hero.y - 8});
  if (currentTab === 'raid') buildTab('raid', true);
  const info = R.info;
  if (info.tb){ finishTimeBoss(R); return; }
  if (info.dummy){ finishDummy(R); return; }
  if (info.job){ finishJobTrial(R); return; }
  if (R.win){
    const rw = raidReward(info);
    addLog(`${info.label} 토벌 성공! 보석 +${rw.gems}`, 'gain'); sfx('win');
    announce(`${S.name}님의 파티가 ${info.bossName}${josa(info.bossName, '을', '를')} 토벌했어요!`);
    saveLocal();
    if (window.__game && window.__game.quiet) return;
    showModal(`토벌 성공 · ${info.label}`, `
      <p><b>${info.bossName}</b>${josa(info.bossName, '을', '를')} 물리쳤어요! ${rw.first ? '<b>첫 클리어 보상</b>도 함께 받았어요.' : ''}</p>
      <ul class="rewards">
        <li><span class="gem"></span>${fmt(rw.gems)}<span>보석</span></li>
        <li><span class="coin"></span>${fmt(rw.gold)}<span>엽전</span></li>
        <li style="color:${MATS[Math.min(2, S.world)].color}">${fmt(rw.mat)}<span>${MATS[Math.min(2, S.world)].name} (조합 재료)</span></li>
        ${rw.piece ? `<li style="color:#c8b0ff">${rw.piece}<span>고삐 조각 (탈것 별·천리마·산군 범)</span></li>` : ''}
        ${rw.items.map(r => `<li style="color:${GRADES[Math.floor(r.it / 4)].color}">${gearName(r.slot, r.it)}<span>${GRADES[Math.floor(r.it / 4)].name} ${GEAR[r.slot].label}${r.isNew ? ' · 새 장비' : ''}</span></li>`).join('')}
      </ul>
      <p class="small" style="margin-top:8px">토벌패 1개를 썼어요(남은 토벌패 ${raidTickets()}/${TICKET_MAX}). 토벌패는 ${TICKET_REGEN / 60000}분마다 1개씩 다시 차요.</p>`,
      [{label:'확인', primary:true}]);
  } else {
    addLog(`${info.label} 토벌 실패… 수련하고 다시 도전해요.`, 'warn'); sfx('fail');
    if (window.__game && window.__game.quiet) return;
    showModal('토벌 실패', `<p>${RAID_TIME}초 안에 <b>${info.bossName}</b>${josa(info.bossName, '을', '를')} 쓰러뜨리지 못했어요. 토벌패는 돌려받았어요. 능력치·장비·펫을 키워서 다시 도전해요.</p>`, [{label:'확인', primary:true}]);
  }
}

/* ================= 펫 움직임 ================= */
const petRt = {atk:{x:0, y:0, atkT:1, lunge:0, init:false}, def:{x:0, y:0, glow:0, init:false}, sup:{x:0, y:0, healT:3, init:false}};
const PET_OFF = {atk:[-13, -3], def:[13, 1], sup:[-5, 7]};
const PET_FLY = {hawk:1, crow:1, magpie:1, phoenix:1};
function updatePets(dt){
  const side = hero.dir === 'left' ? -1 : 1;
  for (const t of PET_TYPE_ORDER){
    const r = petRt[t];
    if (eqPet(t) < 0){ r.init = false; continue; }
    const gx = Math.max(6, Math.min(MW - 6, hero.x + PET_OFF[t][0] * side)), gy = Math.max(IOY + 8, Math.min(MH - 2, hero.y + PET_OFF[t][1]));
    if (!r.init){ r.x = gx; r.y = gy; r.init = true; }
    const k = Math.min(1, dt * 5);
    r.x += (gx - r.x) * k; r.y += (gy - r.y) * k;
    r.lunge = Math.max(0, (r.lunge || 0) - dt); r.glow = Math.max(0, (r.glow || 0) - dt);
    if (r.lunge > 0 && r.lx != null) r.faceRight = r.lx > r.x;
    else if (hero.dir === 'right') r.faceRight = true;
    else if (hero.dir === 'left') r.faceRight = false;
  }
  if (hero.dead) return;
  const ai = eqPet('atk');
  if (ai >= 0){
    const r = petRt.atk;
    r.atkT -= dt;
    if (r.atkT <= 0){
      const tg = hero.target && !hero.target.dead && hero.target.spawnT <= 0 ? hero.target : nearestMob();
      if (tg && Math.hypot(tg.x - hero.x, tg.y - hero.y) < 100){
        r.atkT = 1.5; r.lunge = 0.25; r.lx = tg.x; r.ly = tg.y - 3;
        const e = petInfo(ai), dmg = ST.atk * atkBuff() * e.pct / 100 * (cls().petMul || 1) * (1 + craftEff('pet') / 100);
        fx.push({type:'claw', t:0, dur:0.25, x:tg.x, y:tg.y - mobHeight(tg) * 0.5, color:PETS[ai].c});
        if (e.splash){ for (const m of mobs) if (!m.dead && m.spawnT <= 0 && Math.hypot(m.x - tg.x, m.y - tg.y) <= 30) hit(m, dmg, 'pet'); }
        else hit(tg, dmg, 'pet');
      } else r.atkT = 0.3;
    }
  }
  const si = eqPet('sup');
  if (si >= 0){
    const r = petRt.sup;
    r.healT -= dt;
    if (r.healT <= 0){
      r.healT = 5;
      if (hero.hp < ST.maxHp){
        const h = ST.maxHp * petInfo(si).heal / 100;
        hero.hp = Math.min(ST.maxHp, hero.hp + h);
        addText('+' + fmt(h), hero.x, hero.y - 34, '#8ff0a0', 11);
        fx.push({type:'heal', t:0, dur:0.7});
      }
    }
  }
  const mh = rideAb('heal');   // 백록: 5초마다 체력 회복
  if (mh > 0){
    hero.mHealT = (hero.mHealT == null ? 5 : hero.mHealT) - dt;
    if (hero.mHealT <= 0){ hero.mHealT = 5; if (hero.hp < ST.maxHp){ const h = ST.maxHp * mh / 100; hero.hp = Math.min(ST.maxHp, hero.hp + h); addText('+' + fmt(h), hero.x + 6, hero.y - 44, '#c8ffd8', 10); } }
  }
}

// 직업별 기술 피해 배율(자객: 한 적 노리기 +30%, 여럿 치기 55%)

function castSkill(i, lv, manual){

    shake = 0.15;
    hit(t2, ST.atk * mul * boltPct(lv) / 100, 'skill');

  }
  if (i === 2){
    hero.buffT = 8; hero.buffLv = lv;
    fx.push({type:'aura', t:0, dur:0.9, color:C.fx});
    if (C.shield){
      hero.shield = ST.maxHp * shieldPct(lv) / 100; hero.shieldT = 12;

  }

      if (t2.dead) return;

    fx.push({type:'awaken', t:0, dur:1, color:C.fx, x:hero.x, y:hero.y - 12});

    shake = i === 7 ? 0.6 : 0.4;
    for (const m of alive){
      if (i === 6){ m.markT = Math.max(m.markT || 0, 6); m.markP = Math.max(m.markP || 0, 15); }
      hit(m, ST.atk * mul * (i === 6 ? jobAPct(lv) : jobBPct(lv)) / 100, 'skill');
    }

    sfx('awaken');
    return true;
  }
  if (i === 5){
    // 약점 표시: 보이는 적 모두 받는 피해 증가
    for (const m of alive){ m.markT = 10; m.markP = markPct(lv); fx.push({type:'ring', t:0, dur:0.5, x:m.x, y:m.y - 6, color:'#ff5a8a', r:14}); }
    addText('약점!', tg.x, tg.y - mobHeight(tg) - 10, '#ff8ab0', 12, true);
    sfx('skill');
    return true;
  }
  fx.push({type:C.nukeFx, t:0, dur:0.8, pts:alive.slice(0, 6).map(m => [m.x, m.y - 6]), seed:Math.random() * 1000});
  shake = 0.3;
  for (const m of alive) hit(m, ST.atk * mul * meteorPct(lv) / 100, 'skill');
  sfx('nuke');

}

function jobDCast(lv, alive, tg, mul){
  const P = jobDPct(lv) / 100, atk = ST.atk * mul;
  shake = 0.6;

    hero.invisT = 2;
    for (let k = 0; k < 12; k++) after(k * 0.16, () => { for (const m of mobs.filter(m => !m.dead && m.spawnT <= 0)) hit(m, atk * P * 0.08, 'skill', true); });
    return true;
  }
  if (S.cls === 'sulsa'){
    const order = alive.slice().sort((a, b2) => b2.hp - a.hp);
    for (let k = 0; k < 9; k++) after(k * 0.12, () => {
      const live = mobs.filter(m => !m.dead && m.spawnT <= 0); if (!live.length) return;
      if (k === 8){ for (const m of live) hit(m, atk * P * 0.17, 'skill'); return; }
      const m = order.find(x => !x.dead) || live[0];
      fx.push({type:cls().boltFx || 'zig', t:0, dur:0.35, x:m.x, y:m.y - mobHeight(m) * 0.5, seed:Math.random() * 1000});
      hit(m, atk * P * 0.17, 'skill');

  if (S.cls === 'doin'){
    for (const m of alive) hit(m, atk * P * 0.9, 'skill', true);
    hero.shield = Math.max(hero.shield || 0, ST.maxHp * 0.5); hero.shieldT = 10;
    return true;
  }
  for (const m of alive) hit(m, atk * P * (m.boss || m.raid ? 2 : 1), 'skill');
  hero.dr4T = 10;
  return true;

// 기술 재사용 시간(노리개 '도력' 각인으로 줄어든다)

function castNow(i){

function nearestMob(){
  let best = null, bd = 1e9;
  for (const m of mobs){
    if (m.dead || m.spawnT > 0) continue;
    const d = Math.abs(m.tx - hero.tx) + Math.abs(m.ty - hero.ty) + (m.boss ? -0.5 : 0);
    if (d < bd){ bd = d; best = m; }
  }
  return best;
}

function update(dt){
  gtime += dt; S.rec.play += dt;
  if (S.chosen && !raid && S.mode === 'auto') offTrack(dt);
  if (later.length){ const due = []; for (const L of later){ L.t -= dt; if (L.t <= 0) due.push(L); } if (due.length){ later = later.filter(L => L.t > 0); for (const L of due) L.fn(); } }
  for (const e of fx) e.t += dt;
  fx = fx.filter(e => e.t < e.dur);
  updateVfx(dt);
  for (const p of parts){
    p.t += dt;
    if (p.type === 'coin'){ p.vy += 300 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.y > p.gy){ p.y = p.gy; p.vy *= -0.35; p.vx *= 0.5; } }
    else { p.x += p.vx * dt; p.y += p.vy * dt; }
  }
  parts = parts.filter(p => p.t < p.dur);
  for (const t of texts){ t.t += dt; t.y -= 18 * dt; }
  texts = texts.filter(t => t.t < t.dur);
  shake = Math.max(0, shake - dt);
  hero.swing = Math.max(0, hero.swing - dt);
  hero.hurt = Math.max(0, hero.hurt - dt);
  if (hero.buffT > 0) hero.buffT -= dt;
  if (hero.jobBuffT > 0) hero.jobBuffT -= dt;
  if (hero.dr4T > 0) hero.dr4T -= dt;
  if (hero.invisT > 0) hero.invisT -= dt;

  // 부상의 해돋이 기운: 사냥 속도와 상관없이 지금까지 나아간 단계만큼 경험치가 조금씩 쌓인다
  if (S.world >= 3 && !hero.dead) gainExp(mExp(S.maxStage) * CONT[S.world].sun * gainMul('exp') * dt);

  // 레이드 / 보스·소환
  if (raid) updateRaid(dt);
  else if (bossActive){
    bossTime -= dt;
    if (bossTime <= 0) bossFail('시간 초과');
  } else if (!hero.dead){
    if (S.kills >= FIELD.kills && !S.autoBoss && S.bossAuto){ bossRetry += dt; if (bossRetry >= BOSS_RETRY){ S.autoBoss = true; bossRetry = 0; } }   // 보스 자동: 실패해도 잠시 수련한 뒤 다시
    if (S.kills >= FIELD.kills && S.autoBoss) startBoss();
    else {
      spawnT -= dt;
      if (spawnT <= 0){
        if (aliveMobs().length < maxField()){
          const spot = spawnTile(4) || spawnTile(2);
          if (spot){ const m = makeMob(false, spot[0], spot[1]); mobs.push(m); fx.push({type:'poof', t:0, dur:0.4, x:m.x, y:m.y - 6}); }
        }
        spawnT = FIELD.gap + Math.random() * FIELD.rand;
      }
    }
  }

  // 용사
  if (hero.dead){ hero.deadT -= dt; if (hero.deadT <= 0) respawn(); }
  else {
    hero.hp = Math.min(ST.maxHp, hero.hp + ST.maxHp * ST.regen * dt);
    autoPotion(dt);
    updateMove(hero, dt);
    hero.atkT = Math.max(0, hero.atkT - dt * ST.aspd * spdBuff());
    if (!hero.moving){
      let tg = hero.target;
      if (!tg || tg.dead || tg.spawnT > 0) tg = hero.target = nearestMob();
      if (tg){
        hero.idleT = 0;
        const dx = tg.tx - hero.tx, dy = tg.ty - hero.ty, C = cls();
        const inRange = C.range === 1 ? Math.abs(dx) + Math.abs(dy) === 1 : Math.hypot(dx, dy) <= C.range + 0.01;
        if (inRange){
          hero.engaged = true;
          if (dx || dy) hero.dir = dirOf(dx, dy);
          if (hero.atkT <= 0) attack(tg);
        } else {
          hero.engaged = false;
          if (!stepToward(hero, tg.tx, tg.ty, heroStep())){
            const other = nearestOther(tg);
            if (other) hero.target = other;
          }
        }
      } else {
        hero.engaged = false;
        hero.idleT += dt;
        if (hero.idleT > 1.2){ hero.idleT = 0; randomStep(hero, heroStep() * 1.5); }
      }
    }
  }
  placeOf(hero);
  updatePets(dt);

  // 몬스터
  for (const m of mobs){
    m.anim += dt;
    if (m.dead){ m.deathT -= dt; continue; }
    if (m.spawnT > 0){ m.spawnT -= dt; placeOf(m); continue; }
    m.flash = Math.max(0, m.flash - dt); m.lunge = Math.max(0, m.lunge - dt);
    if (m.markT > 0) m.markT -= dt;
    if (m.raid){ placeOf(m); continue; }   // 레이드 보스는 updateRaid가 움직인다

  const bl = Math.round((pa & 255) * (1 - t) + (pb & 255) * t);

const mobCache = new Map();
function mobSprite(type, color, f, boss, white){
  const key = type + color + f + (boss ? 'B' : '');
  let sp = mobCache.get(key);
  if (!sp){
    const hd = MOB_HD[type];
    const [w, h, draw] = hd, cnv = document.createElement('canvas'); cnv.width = w + 4; cnv.height = h + 4; const g = cnv.getContext('2d'); g.translate(2, 2); draw(g, f, color, boss);
    const base = hdFinish(cnv, boss ? '#ff3b3b' : '#1d1420');
    const wh = whiteOf(base); wh.hd = base.hd;
    sp = {base, white:wh};
    mobCache.set(key, sp);
  }
  return white ? sp.white : sp.base;
}

function gPoly(g, pts, col){ g.fillStyle = col; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); g.fill(); }
function gEll(g, x, y, rx, ry, col){ g.fillStyle = col; g.beginPath(); g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2); g.fill(); }
function isoTile(g, cx, cy, col, grow = 0.35){ gPoly(g, [[cx, cy - IH / 2 - grow], [cx + IW / 2 + grow * 2, cy], [cx, cy + IH / 2 + grow], [cx - IW / 2 - grow * 2, cy]], col); }
// 둥근 덩어리(나뭇잎·바위·눈더미): 아래 오른쪽은 어둡게, 위 왼쪽은 밝게
function gBlob(g, x, y, rx, ry, col){ gEll(g, x, y, rx, ry, darken(col, 0.22)); gEll(g, x - rx * 0.12, y - ry * 0.14, rx * 0.86, ry * 0.84, col); gEll(g, x - rx * 0.35, y - ry * 0.4, rx * 0.32, ry * 0.26, mix(col, '#ffffff', 0.28)); }
function gShadow(g, x, y, rx){ gEll(g, x, y, rx, rx * 0.45, 'rgba(0,0,0,.22)'); }

/* ── 풍경 소품(화면 좌표, 밑동 기준) ── */
const PROPS = {
  tree(g, x, y, s = 1, col = '#4f9a42'){ gShadow(g, x, y, 7 * s); gPoly(g, [[x - 1.6 * s, y], [x + 1.6 * s, y], [x + 1 * s, y - 10 * s], [x - 1 * s, y - 10 * s]], '#6b4a2b');
    gBlob(g, x - 4 * s, y - 12 * s, 6 * s, 5 * s, darken(col, 0.08)); gBlob(g, x + 4 * s, y - 12 * s, 6 * s, 5 * s, darken(col, 0.04)); gBlob(g, x, y - 17 * s, 7 * s, 6 * s, col); },
  pine(g, x, y, s = 1, snow){ gShadow(g, x, y, 6 * s); gPoly(g, [[x - 1.2 * s, y], [x + 1.2 * s, y], [x + 1.2 * s, y - 5 * s], [x - 1.2 * s, y - 5 * s]], '#5a4030');
    for (let i = 0; i < 3; i++){ const w = (7 - i * 1.8) * s, yy = y - (4 + i * 6) * s; gPoly(g, [[x - w, yy], [x + w, yy], [x, yy - 9 * s]], i % 2 ? '#2f6a5a' : '#2a5e50'); gPoly(g, [[x, yy - 9 * s], [x + w, yy], [x + w * 0.2, yy]], '#22504a');
      if (snow) gPoly(g, [[x - w * 0.55, yy - 3 * s], [x, yy - 9 * s], [x + w * 0.55, yy - 3 * s], [x, yy - 5 * s]], '#f4f9fd'); } },
  bamboo(g, x, y, s = 1){ for (let i = 0; i < 3; i++){ const bx = x + (i - 1) * 3 * s, h = (22 + ((i * 7) % 9)) * s, col = ['#7cc05a', '#6ab04a', '#8ad06a'][i];
    gPoly(g, [[bx - 1 * s, y], [bx + 1 * s, y], [bx + 1 * s, y - h], [bx - 1 * s, y - h]], col); gPoly(g, [[bx + 0.3 * s, y], [bx + 1 * s, y], [bx + 1 * s, y - h], [bx + 0.3 * s, y - h]], darken(col, 0.2));
    for (let k = 5; k < h / s; k += 6) gPoly(g, [[bx - 1.4 * s, y - k * s], [bx + 1.4 * s, y - k * s], [bx + 1.4 * s, y - k * s - 0.8], [bx - 1.4 * s, y - k * s - 0.8]], darken(col, 0.35));
    gEll(g, bx + 3 * s, y - h + 3 * s, 3.5 * s, 1.2 * s, '#4f9a3f'); gEll(g, bx - 3 * s, y - h + 6 * s, 3 * s, 1 * s, '#5aa850'); } },
  rock(g, x, y, s = 1, col = '#9a8a7a'){ gShadow(g, x, y, 6 * s); gPoly(g, [[x - 6 * s, y], [x - 4 * s, y - 5 * s], [x + 1 * s, y - 7 * s], [x + 6 * s, y - 3 * s], [x + 5 * s, y]], darken(col, 0.25));
    gPoly(g, [[x - 6 * s, y], [x - 4 * s, y - 5 * s], [x + 1 * s, y - 7 * s], [x + 1 * s, y - 1 * s]], col); gPoly(g, [[x - 4 * s, y - 5 * s], [x + 1 * s, y - 7 * s], [x - 1 * s, y - 4 * s]], mix(col, '#ffffff', 0.3)); },
  flowers(g, x, y, rnd){ for (let i = 0; i < 5; i++){ const fx = x + (rnd() - 0.5) * 10, fy = y + (rnd() - 0.5) * 5; gEll(g, fx, fy + 1, 1.2, 0.6, '#3f7a35'); gEll(g, fx, fy, 1, 1, ['#ffd84a', '#ff8ab0', '#ffffff', '#b98aff'][(rnd() * 4) | 0]); } },
  grass(g, x, y, col = '#4f8a3f'){ for (let i = -2; i <= 2; i++) gPoly(g, [[x + i * 1.2 - 0.6, y], [x + i * 1.2 + 0.6, y], [x + i * 1.8, y - 4 + Math.abs(i)]], i % 2 ? col : darken(col, 0.15)); },
  house(g, x, y, roof){   // 밑동 가운데 (x, y), 가로로 긴 초가·기와집
    const w = 26, d = 12, h = 10;
    gShadow(g, x, y + 1, 22);
    // 앞(왼쪽 아래) 벽과 옆(오른쪽 아래) 벽
    gPoly(g, [[x - w / 2, y - 4], [x + 4, y + 3], [x + 4, y + 3 - h], [x - w / 2, y - 4 - h]], '#efe6d0');
    gPoly(g, [[x + 4, y + 3], [x + w / 2, y - 3], [x + w / 2, y - 3 - h], [x + 4, y + 3 - h]], '#d8ccb0');
    for (const t of [0, 0.5, 1]){ const px = x - w / 2 + (x + 4 - (x - w / 2)) * t, py = y - 4 + 7 * t; gPoly(g, [[px - 0.6, py], [px + 0.6, py], [px + 0.6, py - h], [px - 0.6, py - h]], '#6b4a2b'); }
    gPoly(g, [[x - w / 2, y - 4 - h * 0.45], [x + 4, y + 3 - h * 0.45], [x + 4, y + 2.4 - h * 0.45], [x - w / 2, y - 4.6 - h * 0.45]], '#6b4a2b');
    gPoly(g, [[x - 6, y - 1.2], [x - 2, y + 0.4], [x - 2, y - 6], [x - 6, y - 7.6]], '#4a3423');
    gPoly(g, [[x + 8, y + 1], [x + 11, y - 0.6], [x + 11, y - 5.6], [x + 8, y - 4]], '#c9b48a');
    // 지붕
    const top = y - 4 - h, ridge = top - (roof === 'tile' ? 9 : 11);
    if (roof === 'tile'){
      gPoly(g, [[x - w / 2 - 4, top + 2], [x + 5, top + 10], [x + w / 2 + 4, top + 2], [x + w / 2 - 2, ridge + 2], [x - 4, ridge - 4], [x - w / 2 - 1, ridge + 1]], '#3c4652');
      gPoly(g, [[x - w / 2 - 4, top + 2], [x + 5, top + 10], [x + 6, top + 7], [x - w / 2 - 1, ridge + 1]], '#4a5664');
      for (let i = 1; i < 6; i++){ const t = i / 6; gPoly(g, [[x - w / 2 - 4 + (9 + w / 2) * t, top + 2 + 8 * t], [x - w / 2 - 1 + (w / 2 - 3) * t, ridge + 1 - 5 * t], [x - w / 2 - 0.4 + (w / 2 - 3) * t, ridge + 1 - 5 * t], [x - w / 2 - 3.4 + (9 + w / 2) * t, top + 2 + 8 * t]], '#2e3640'); }
      gPoly(g, [[x - w / 2 - 2, ridge], [x - 4, ridge - 5], [x + w / 2 - 1, ridge + 1], [x + w / 2 - 1, ridge + 2.6], [x - 4, ridge - 3.4], [x - w / 2 - 2, ridge + 1.6]], '#2a3038');
    } else {
      gPoly(g, [[x - w / 2 - 3, top + 3], [x + 5, top + 10], [x + w / 2 + 3, top + 3], [x + w / 2 - 3, ridge + 3], [x - 3, ridge - 2], [x - w / 2, ridge + 2]], '#a8823a');
      gPoly(g, [[x - w / 2 - 3, top + 3], [x + 5, top + 10], [x + 5, top + 7], [x - w / 2, ridge + 2]], '#c9a050');
      for (let i = 1; i < 4; i++) gPoly(g, [[x - w / 2 - 3 + 2 * i, top + 3 - 2.6 * i], [x + 5 - 0.5 * i, top + 10 - 2.4 * i], [x + 5 - 0.5 * i, top + 9.4 - 2.4 * i], [x - w / 2 - 3 + 2 * i, top + 2.4 - 2.6 * i]], '#b08a40');
    }
  },
  fence(g, x0, y0, n){ for (let i = 0; i <= n; i++){ const x = x0 + i * 5, y = y0 + i * 2.5; gPoly(g, [[x - 0.7, y], [x + 0.7, y], [x + 0.7, y - 6], [x - 0.7, y - 6]], '#8a6a4a'); }
    for (const h of [2, 4.5]) gPoly(g, [[x0, y0 - h], [x0 + n * 5, y0 + n * 2.5 - h], [x0 + n * 5, y0 + n * 2.5 - h - 0.8], [x0, y0 - h - 0.8]], '#a88a62'); },
  pond(g, x, y, rx, col = '#5a9ac8'){ gEll(g, x, y, rx + 1.5, rx * 0.5 + 1, darken(col, 0.3)); gEll(g, x, y, rx, rx * 0.5, col); gEll(g, x - rx * 0.3, y - rx * 0.12, rx * 0.35, rx * 0.1, mix(col, '#ffffff', 0.45)); },
  reeds(g, x, y){ for (let i = -2; i <= 2; i++){ const h = 8 + (i * 3 + 9) % 5; gPoly(g, [[x + i * 1.5 - 0.4, y], [x + i * 1.5 + 0.4, y], [x + i * 2, y - h]], '#6a8a4a'); if (i % 2) gEll(g, x + i * 2, y - h + 1, 0.8, 2, '#7a5a3a'); } },
  deadtree(g, x, y, col = '#2a3a30'){ gShadow(g, x, y, 5); const L = (x0, y0, x1, y1, w) => gPoly(g, [[x0 - w, y0], [x0 + w, y0], [x1 + w * 0.4, y1], [x1 - w * 0.4, y1]], col);
    L(x, y, x + 1, y - 20, 1.6); L(x + 1, y - 12, x - 6, y - 18, 0.8); L(x + 1, y - 15, x + 7, y - 22, 0.8); L(x - 3, y - 15, x - 4, y - 21, 0.5); },
  stalag(g, x, y, s = 1, col = '#4a3a3a'){ gShadow(g, x, y, 4 * s); gPoly(g, [[x - 4 * s, y], [x + 4 * s, y], [x + 0.5 * s, y - 14 * s]], col); gPoly(g, [[x + 0.5 * s, y - 14 * s], [x + 4 * s, y], [x + 1.5 * s, y]], darken(col, 0.3)); },
  crystal(g, x, y, col = '#9a6ad8'){ gPoly(g, [[x - 2, y], [x + 2, y], [x + 1, y - 7], [x - 1, y - 8]], col); gPoly(g, [[x - 1, y - 8], [x - 2, y], [x - 0.6, y]], mix(col, '#ffffff', 0.5)); gPoly(g, [[x + 2, y], [x + 4, y - 4], [x + 3.4, y - 5], [x + 1, y - 1]], darken(col, 0.2)); },
  torch(g, x, y){ gPoly(g, [[x - 0.8, y], [x + 0.8, y], [x + 0.8, y - 10], [x - 0.8, y - 10]], '#6b4a2b'); gPoly(g, [[x - 2.5, y - 10], [x + 2.5, y - 10], [x + 2, y - 12], [x - 2, y - 12]], '#4a3423'); },
  snowmound(g, x, y, s = 1){ gBlob(g, x, y - 2 * s, 8 * s, 3.5 * s, '#f4f9fd'); },
  bladespike(g, x, y, s = 1){ gShadow(g, x, y, 4 * s); for (const [dx, h, w] of [[-3, 16, 1.6], [2, 22, 2], [5, 12, 1.4]]){ const bx = x + dx * s;
    gPoly(g, [[bx - w * s, y], [bx + w * s, y], [bx, y - h * s]], '#9aa2ae'); gPoly(g, [[bx, y - h * s], [bx + w * s, y], [bx + 0.2, y]], '#6a727e'); gPoly(g, [[bx - w * 0.3 * s, y - h * 0.5 * s], [bx, y - h * s], [bx - w * 0.6 * s, y - h * 0.6 * s]], '#e8eef4'); } },
  bones(g, x, y){ gEll(g, x, y, 2.4, 2, '#d8d0c0'); gEll(g, x - 0.8, y - 0.2, 0.5, 0.6, '#1a1418'); gEll(g, x + 0.8, y - 0.2, 0.5, 0.6, '#1a1418'); gPoly(g, [[x + 3, y + 1], [x + 8, y + 2], [x + 8, y + 2.8], [x + 3, y + 1.8]], '#d8d0c0'); },
  cauldron(g, x, y){ gShadow(g, x, y, 10); gEll(g, x, y - 6, 10, 7, '#1a1414'); gEll(g, x, y - 11, 10, 3, '#2a2222'); gEll(g, x, y - 11, 8, 2.2, '#ff7a2a'); gEll(g, x - 2, y - 11.4, 3, 0.8, '#ffd24a');
    for (const dx of [-6, 6]) gPoly(g, [[x + dx - 1, y - 1], [x + dx + 1, y - 1], [x + dx + 1, y + 2], [x + dx - 1, y + 2]], '#1a1414'); },
  icespike(g, x, y, s = 1){ gShadow(g, x, y, 4 * s); gPoly(g, [[x - 3 * s, y], [x + 3 * s, y], [x + 0.5 * s, y - 15 * s]], '#cfeaff'); gPoly(g, [[x + 0.5 * s, y - 15 * s], [x + 3 * s, y], [x + 1.2 * s, y]], '#8fb8d8'); gPoly(g, [[x - 1.6 * s, y - 5 * s], [x + 0.5 * s, y - 15 * s], [x - 0.8 * s, y - 5 * s]], '#ffffff'); },
  bladetree(g, x, y){ gShadow(g, x, y, 7); gPoly(g, [[x - 1.4, y], [x + 1.4, y], [x + 0.8, y - 18], [x - 0.8, y - 18]], '#2a1e18');
    for (let i = 0; i < 14; i++){ const a = i * 2.4, r = 3 + (i % 4) * 2, lx = x + Math.cos(a) * r, ly = y - 20 + Math.sin(a) * r * 0.7; gPoly(g, [[lx, ly - 3], [lx + 0.9, ly], [lx, ly + 1.4], [lx - 0.9, ly]], i % 3 ? '#c8d0d8' : '#ffffff'); } },
  pillar(g, x, y){ gShadow(g, x, y, 5); gPoly(g, [[x - 3, y], [x + 3, y], [x + 3, y - 22], [x - 3, y - 22]], '#2a1a2a'); gPoly(g, [[x + 1, y], [x + 3, y], [x + 3, y - 22], [x + 1, y - 22]], '#1a1018');
    gPoly(g, [[x - 4.5, y - 22], [x + 4.5, y - 22], [x + 3.5, y - 25], [x - 3.5, y - 25]], '#3a2234'); gEll(g, x - 1, y - 14, 0.8, 0.5, '#ff2a4a'); gEll(g, x + 1.4, y - 14, 0.8, 0.5, '#ff2a4a'); },
  cloudpuff(g, x, y, s = 1){ gEll(g, x, y + 1, 10 * s, 3 * s, 'rgba(120,150,200,.25)'); for (const [dx, dy, r] of [[-6, -3, 5], [0, -6, 6.4], [6, -3, 5], [0, -1, 6]]) gEll(g, x + dx * s, y + dy * s, r * s, r * 0.8 * s, '#ffffff'); gEll(g, x - 2 * s, y - 7 * s, 2.4 * s, 1.4 * s, '#f4f8ff'); },
  peachtree(g, x, y, s = 1){ gShadow(g, x, y, 7 * s); gPoly(g, [[x - 1.4 * s, y], [x + 1.4 * s, y], [x + 0.8 * s, y - 9 * s], [x - 0.8 * s, y - 9 * s]], '#6b4a2b');
    gBlob(g, x - 4 * s, y - 12 * s, 6 * s, 5 * s, '#ff9ab8'); gBlob(g, x + 4 * s, y - 12 * s, 6 * s, 5 * s, '#ffb0c8'); gBlob(g, x, y - 16 * s, 7 * s, 5.4 * s, '#ffc0d4');
    for (const [dx, dy] of [[-5, -10], [3, -14], [5, -9], [-1, -17]]) { gEll(g, x + dx * s, y + dy * s, 1.6 * s, 1.6 * s, '#ff7a6a'); gEll(g, x + (dx - 0.5) * s, y + (dy - 0.6) * s, 0.5 * s, 0.5 * s, '#ffe0d0'); } },
  boat(g, x, y, s = 1){ gEll(g, x, y + 1, 16 * s, 3 * s, 'rgba(255,255,255,.35)'); gPoly(g, [[x - 15 * s, y - 5 * s], [x + 15 * s, y - 5 * s], [x + 11 * s, y], [x - 11 * s, y]], '#6b4a2b'); gPoly(g, [[x - 15 * s, y - 5 * s], [x + 15 * s, y - 5 * s], [x + 14 * s, y - 3.6 * s], [x - 14 * s, y - 3.6 * s]], '#8a6a42');
    gPoly(g, [[x - 0.8 * s, y - 5 * s], [x + 0.8 * s, y - 5 * s], [x + 0.6 * s, y - 24 * s], [x - 0.6 * s, y - 24 * s]], '#4a3423'); gPoly(g, [[x + 1, y - 23 * s], [x + 11 * s, y - 15 * s], [x + 1, y - 8 * s]], '#efe6d0'); gPoly(g, [[x - 1, y - 21 * s], [x - 8 * s, y - 14 * s], [x - 1, y - 9 * s]], '#e8dcc4'); },
  waterfall(g, x, y){ gPoly(g, [[x - 14, y], [x + 14, y], [x + 10, y - 26], [x - 10, y - 26]], '#8a7a6a'); gPoly(g, [[x - 5, y - 26], [x + 5, y - 26], [x + 6, y], [x - 6, y]], '#8fd0ff'); for (let i = 0; i < 4; i++) gPoly(g, [[x - 3 + i * 2, y - 24], [x - 2.4 + i * 2, y - 24], [x - 2 + i * 2, y], [x - 2.6 + i * 2, y]], '#e8f6ff'); gEll(g, x, y + 1, 9, 2.6, '#cfeaff'); },
  redpillar(g, x, y){ gShadow(g, x, y, 4); gPoly(g, [[x - 2.4, y], [x + 2.4, y], [x + 2.4, y - 26], [x - 2.4, y - 26]], '#c8382f'); gPoly(g, [[x + 0.8, y], [x + 2.4, y], [x + 2.4, y - 26], [x + 0.8, y - 26]], '#9a2a24'); gPoly(g, [[x - 3.6, y - 26], [x + 3.6, y - 26], [x + 3, y - 29], [x - 3, y - 29]], '#ffd24a'); gPoly(g, [[x - 3.4, y], [x + 3.4, y], [x + 3, y - 2], [x - 3, y - 2]], '#e8e0c8'); },
  pavilion(g, x, y){ gShadow(g, x, y + 1, 18); for (const dx of [-12, 12]) PROPS.redpillar(g, x + dx, y);
    gPoly(g, [[x - 20, y - 26], [x + 20, y - 26], [x + 16, y - 34], [x - 16, y - 34]], '#3c4652'); gPoly(g, [[x - 22, y - 25], [x - 16, y - 34], [x - 18, y - 34], [x - 25, y - 27]], '#2e3640'); gPoly(g, [[x + 22, y - 25], [x + 16, y - 34], [x + 18, y - 34], [x + 25, y - 27]], '#2e3640');
    gPoly(g, [[x - 16, y - 34], [x + 16, y - 34], [x + 12, y - 39], [x - 12, y - 39]], '#ffd24a'); gEll(g, x, y - 40, 2.6, 2, '#ffd24a'); },
  lantern(g, x, y, s = 1){ gShadow(g, x, y, 5 * s); gPoly(g, [[x - 2 * s, y], [x + 2 * s, y], [x + 1.4 * s, y - 6 * s], [x - 1.4 * s, y - 6 * s]], '#8a8a90');
    gPoly(g, [[x - 4 * s, y - 6 * s], [x + 4 * s, y - 6 * s], [x + 3 * s, y - 7.4 * s], [x - 3 * s, y - 7.4 * s]], '#a8a8b0');

function buildIsoMap(ri, w = S.world){

  const g = c.getContext('2d'); g.scale(RS, RS);
  // 바깥 땅 + 먼 하늘·산
  g.fillStyle = th.outer; g.fillRect(0, 0, MW, MH);
  const sky = g.createLinearGradient(0, 0, 0, 24); sky.addColorStop(0, th.sky[0]); sky.addColorStop(1, th.sky[1]);

  g.fillStyle = th.hills; g.beginPath(); g.moveTo(0, 22);

  gPoly(g, [[0, 20], [MW, 20], [MW, 23], [0, 23]], darken(th.hills, 0.15));
  // 바깥 땅 무늬(비스듬한 칸)
  for (let i = -20; i < 44; i++) for (let j = -24; j < 40; j++){
    const cx = isoX(i, j), cy = isoY(i, j);
    if (cx < -IW || cx > MW + IW || cy < 18 || cy > MH + IH) continue;
    if (rnd() < 0.5) isoTile(g, cx, cy, darken(th.outer, 0.04 + rnd() * 0.05), 0);
    if (rnd() < 0.5){ g.fillStyle = darken(th.outer, 0.12); g.fillRect(cx + (rnd() - 0.5) * 10, cy + (rnd() - 0.5) * 4, 0.8, 0.8); }
  }
  if (t === 'lava'){ for (let k = 0; k < 60; k++){ const x = rnd() * MW, y = 22 + rnd() * (MH - 22); gEll(g, x, y, 2 + rnd() * 5, 0.8 + rnd(), rnd() < 0.5 ? '#ffd24a' : '#ff8a2a'); } }
  if (t === 'sea' || t === 'river2'){ for (let k = 0; k < 70; k++){ const x = rnd() * MW, y = 24 + rnd() * (MH - 24); gEll(g, x, y, 2 + rnd() * 4, 0.5, 'rgba(255,255,255,.45)'); } }
  if (t === 'cloud' || t === 'heaven'){ for (let k = 0; k < 26; k++){ const x = rnd() * MW, y = 26 + rnd() * (MH - 26); gEll(g, x, y, 6 + rnd() * 10, 2 + rnd() * 2, 'rgba(255,255,255,.7)'); } }
  if (t === 'swamp' || t === 'poison'){ for (let k = 0; k < 18; k++){ const x = rnd() * MW, y = 24 + rnd() * (MH - 24); gEll(g, x, y, 3 + rnd() * 6, 1 + rnd() * 1.5, mix(th.outer, '#ffffff', 0.12)); } }

  gPoly(g, [[bx, by], [rx, ry], [rx, ry + IDEP], [bx, by + IDEP]], th.side[1]);
  for (let k = 1; k < 3; k++){ const yy = IDEP * k / 3; g.globalAlpha = 0.25;
    gPoly(g, [[lx, ly + yy], [bx, by + yy], [bx, by + yy + 0.7], [lx, ly + yy + 0.7]], darken(th.side[0], 0.35));
    gPoly(g, [[bx, by + yy], [rx, ry + yy], [rx, ry + yy + 0.7], [bx, by + yy + 0.7]], darken(th.side[1], 0.35)); g.globalAlpha = 1; }
  if (t === 'lava') for (let k = 0; k < 8; k++){ const u = rnd(), x = lx + (bx - lx) * u, y = ly + (by - ly) * u; gPoly(g, [[x, y + 2], [x + 1, y + 2], [x + 2, y + IDEP], [x + 1, y + IDEP]], '#ff6a1a'); }
  for (let ty = TOPR; ty < ROWS; ty++) for (let tx = 0; tx < COLS; tx++){

  sc.front.sort((a, b2) => a[0] - b2[0]).forEach(([, fn]) => fn(g));
  return c;
}

function addChat(kind, name, text, extra){

function holdButton(btn, fn){
  let t1 = null, t2 = null;
  const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };
  btn.addEventListener('pointerdown', e => {
    if (btn.disabled || e.button > 0) return;
    if (!fn()) return;
    t1 = setTimeout(() => { t2 = setInterval(() => { if (!fn()) stop(); }, 85); }, 380);
  });
  ['pointerup', 'pointerleave', 'pointercancel', 'blur'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('click', e => { if (e.detail === 0) fn(); });
  btn.addEventListener('contextmenu', e => e.preventDefault());
}

  if ($('#eqBtn')) $('#eqBtn').addEventListener('click', () => { S.equip[slot] = gearSel; refreshStats(); buildTab('gear', true); addLog(`${gearName(slot, gearSel)}${josa(gearName(slot, gearSel), '을', '를')} 장착했습니다.`); });

  $('#equipBest').addEventListener('click', () => { equipBest(slot); addLog(S.equip[slot] >= 0 ? `${gearName(slot, S.equip[slot])}${josa(gearName(slot, S.equip[slot]), '을', '를')} 장착했습니다.` : '먼저 장비를 소환해 주세요.'); buildTab('gear', true); });
  return () => { $('#sum1').disabled = S.gems < 50; $('#sum10').disabled = S.gems < 450; };

function doSummon(slot, n){
  const res = summon(slot, n);
  if (!res){ addLog('보석이 부족합니다.', 'warn'); return; }
  sfx(res.some(r => r.it >= 12) ? 'rare' : 'summon');
  if (currentTab === 'gear') buildTab('gear', true);
  const best = res.reduce((a, r) => Math.max(a, r.it), 0);
  playFx('summon', {best:Math.floor(best / 4), sub:gearName(slot, best)});
  const html = `<div class="res-grid">${res.map((r, i) => {
      const g = GRADES[Math.floor(r.it / 4)];
      return `<div class="res flip${r.it >= 12 ? ' legend' : ''}" style="--g:${g.color};--i:${i}" title="${gearName(slot, r.it)}">${SVG[GEAR[slot].icon]}<span class="tier">${ROMAN[r.it % 4]}</span>${r.isNew ? '<span class="new">NEW</span>' : ''}</div>`;
    }).join('')}</div>
    <p class="small" style="margin-top:10px">가장 좋은 장비: <b>${gearName(slot, best)}</b> (${GRADES[Math.floor(best / 4)].name})</p>`;
  const cost = summonCost(n);
  showModal(`${GEAR[slot].label} 소환 결과`, html, [
    {label:`${n}회 더 (보석 ${cost})`, disabled:S.gems < cost, fn:() => doSummon(slot, n)},
    {label:'확인', primary:true},
  ]);
}

  wireGearSeg();
  const grindMax = () => Math.max(...['weapon', 'armor'].map(sl => S.equip[sl] >= 0 ? Math.floor(S.equip[sl] / 4) : 0)) - 1;
  $('#grindBtn').addEventListener('click', () => { const g = grindGear('weapon', grindMax()) + grindGear('armor', grindMax()); if (g){ sfx('refOk'); refreshPanel(); } });
  $('#whetChk').addEventListener('change', e => { S.useWhet = e.target.checked; refreshPanel(); });
  $('#protChk').addEventListener('change', e => { S.useProtect = e.target.checked; refreshPanel(); });
  const refs = ['weapon', 'armor'].map(slot => {

    r.btn.addEventListener('click', () => {
      const out = refineTry(slot);
      if (!out) return;
      const name = slot === 'weapon' ? cls().weapon : cls().armor;
      sfx(out.ok ? 'refOk' : 'refNo');
      playFx('refine', {el:r.btn, res:out.res, lv:out.lv, chance:out.sure});
      refineMsg[slot] = out.ok ? {ok:true, t:`성공! ${name} +${out.lv}${out.sure ? ' (기회의 불꽃)' : ''}`}
        : {ok:false, t:out.res === 'break' ? `부서졌어요… +${out.lv}로 돌아갔어요` : out.res === 'drop' ? `실패… +${out.lv}로 떨어졌어요${(S.refine[slot].drops || 0) >= 2 ? ' — 다음은 반드시 성공!' : ''}` : '실패… 단계는 그대로예요'};
      addLog(out.ok ? `재련 성공! ${name} +${out.lv}` : `재련 실패 (${name} +${out.from + 1} 시도${out.res === 'break' ? ', 부서짐' : out.res === 'drop' ? ', 하락' : ''})`, out.ok ? 'gain' : 'warn');
      if (out.ok){ fx.push({type:'level', t:0, dur:0.6}); addText(`+${out.lv}`, hero.x, hero.y - 34, '#ffd96a', 14, true); }
      r.res.classList.remove('pop'); void r.res.offsetWidth; r.res.classList.add('pop');
      refreshPanel();
    });
    return r;
  });
  return () => {
    setText($('#dustN'), fmt(S.dust));
    const gp = grindPreview('weapon', grindMax()) + grindPreview('armor', grindMax()); const gb = $('#grindBtn'); gb.disabled = !gp; setText(gb, gp ? `남는 장비 갈기 (쇳가루 +${fmt(gp)})` : '갈 장비가 없어요');
    setText($('#whetTxt'), `숫돌 함께 쓰기 (가진 숫돌 ${S.inv.whet}개${S.inv.whet ? '' : ' · 상점에서 살 수 있어요'})`);
    $('#whetChk').disabled = !S.inv.whet && !S.useWhet;
    for (const r of refs){
      const R2 = S.refine[r.slot], stat = r.slot === 'weapon' ? '공격력' : '체력', cap = refineCap(r.slot), max = R2.lv >= cap, top = cap >= REFINE_MAX;
      setText(r.lv, `+${R2.lv}${R2.t ? ' 계승' : ''} / 한도 +${cap}`);
      const rp = l => fmt(+refineEff(r.slot, l).toFixed(1));
      setHTML(r.eff, max ? `${stat} +${rp(R2.lv)}% (${top ? '최고 단계' : r.slot === 'armor' && S.world === 0 ? '저승에서 +22까지 열려요' : '천계에서 +25까지 열려요'})` : `${stat} +${rp(R2.lv)}% → <em>+${rp(R2.lv + 1)}%</em>`);
      if (max){ setText(r.rate, '-'); setText(r.en, '-'); setHTML(r.g, top ? '최고' : '한도'); setHTML(r.m, ''); r.btn.disabled = true; }
      else {
        const o = refineOdds(r.slot), f1 = v => +v.toFixed(1);
        setText(r.rate, o.chance ? '100% (기회의 불꽃)' : `${f1(o.ok)}%${whetOn() ? ' (숫돌 ×1.15)' : ''}`);
        setText(r.en, o.chance ? '-' : [`유지 ${f1(o.keep)}%`, o.drop ? `하락 ${f1(o.drop)}%` : '', o.brk ? `부서짐 ${f1(o.brk)}%` : (S.useProtect && refineProtectable(R2.lv) ? '보호 중' : '')].filter(Boolean).join(' · '));
        const g = refineGold(R2.lv), m = S.useProtect && refineProtectable(R2.lv) && !o.chance ? refineGems(R2.lv) * 2 : 0, du = refineDust(R2.lv);
        setHTML(r.g, fmt(g)); setHTML(r.m, `쇳가루 ${fmt(du)}${m ? ` · 보석 ${fmt(m)}` : ''}`);
        r.btn.disabled = S.gold < g || S.gems < m || S.dust < du;
      }
      const msg = refineMsg[r.slot];
      setText(r.res, msg ? msg.t : '');
      r.res.classList.toggle('ok', !!(msg && msg.ok)); r.res.classList.toggle('no', !!(msg && !msg.ok));
    }
  };
}

        <img src="${petImg(i)}" alt="">${own ? `<span class="lvl">Lv.${S.pets.lv[i]}</span><span class="st">${starStr(S.pets.star[i])}</span>` : ''}${eq ? '<span class="eq">함께</span>' : ''}</button>`;

      </div>
      <p class="small">${own ? '강화는 엽전과 보석이 들어요. 길게 누르면 계속 올라가요. 같은 펫을 또 뽑으면 별이 올라 효과가 20%씩 세져요.' : '펫 소환으로 얻을 수 있어요.'}</p>

    <div class="pslots" id="pslots"></div>
    <div class="summon">
      <button class="gbtn" id="psum1"><span>펫 1회 소환</span><span class="price"><i class="gem"></i>${petSummonCost(1)}</span></button>
      <button class="gbtn" id="psum10"><span>펫 10회 소환</span><span class="price"><i class="gem"></i>${petSummonCost(10)}</span></button>
    </div>
    <p class="odds">확률 공개 — 전설 0.5% · 영웅 3.5% · 희귀 13% · 고급 28% · 일반 55% (등급 안에서 공격·방어·지원 펫이 똑같이 3분의 1씩, 예: 전설 펫 한 마리는 0.17%). <b id="petPity"></b></p>

function doPetSummon(n){
  const res = petSummon(n);
  if (!res){ addLog('보석이 부족합니다.', 'warn'); return; }
  sfx(res.some(r => PETS[r.i].g >= 3) ? 'rare' : 'summon');
  if (currentTab === 'pet') buildTab('pet', true);
  const lab = {new:'NEW', star:'★+1', gem:'보석'};
  { const bp = res.reduce((a, r) => PETS[r.i].g > PETS[a.i].g ? r : a, res[0]); playFx('summon', {best:PETS[bp.i].g, sub:PETS[bp.i].name}); }
  const html = `<div class="res-grid">${res.map((r, k) => {
      const p = PETS[r.i];
      return `<div class="res flip${p.g >= 3 ? ' legend' : ''}" style="--g:${GRADES[p.g].color};--i:${k}" title="${p.name}"><img src="${petImg(r.i)}" alt="${p.name}"><span class="new${r.kind === 'star' ? ' star' : r.kind === 'gem' ? ' gem2' : ''}">${lab[r.kind]}</span></div>`;
    }).join('')}</div>
    <p class="small" style="margin-top:10px">${res.map(r => PETS[r.i].name).filter((v, k, a) => a.indexOf(v) === k).join(', ')}${josa(PETS[res[res.length - 1].i].name, '이', '가')} 나왔어요. 같은 펫은 별이 오르고, 별이 가득하면 보석 ${PET_DUP_GEMS}개로 돌려받아요.</p>`;
  const cost = petSummonCost(n);
  showModal('펫 소환 결과', html, [
    {label:`${n}회 더 (보석 ${cost})`, disabled:S.gems < cost, fn:() => doPetSummon(n)},
    {label:'확인', primary:true},
  ]);
}

// 퀘스트 화면: 이야기 · 오늘의 할 일 · 마을 부탁(서브 퀘스트) 세 칸
let questView = 'main';
function questGo(q){   // 「바로 가기」: 이 퀘스트를 하는 곳으로
  const k = q.k;
  if (k === 'raids' || k === 'raidK' || k === 'hraids') return buildTab('raid');
  if (k === 'refineW' || k === 'refineA' || k === 'myth' || k === 'acc' || k === 'forms' || k === 'avatar') return buildTab('gear');
  if (k === 'pets3') return buildTab('pet');
  if (k === 'job' || k === 'world' || k === 'reb' || k === 'trials'){ growView = k === 'job' ? 'job' : 'reb'; return buildTab('grow'); }

}
function questRewHTML(q){
  const ch = [`<span class="rchip rc-gem">보석 ${fmt(q.gems)}</span>`];
  if (q.myth){ const m = MYTHS.find(x => x.k === q.myth); if (m) ch.push(`<span class="rchip rc-myth">${m.name}</span>`); }
  if (q.av){ const a = AVATARS.find(x => x.k === q.av); if (a) ch.push(`<span class="rchip rc-av">${a.name}</span>`); }

function buildQuest(){

  const wireSeg = () => panel.querySelectorAll('[data-qv]').forEach(b => b.addEventListener('click', () => { questView = b.dataset.qv; buildTab('quest'); }));
  const dots = () => {
    const q = mainQuest(), md = questCur(q) >= q.n;
    const dd = DAILY.some(d => dailyReady(d)) || dailyAllReady();

    return () => {
      dailyCheck(); dots();

        const row = $('#dq-' + d.key), v = S.quest.dp[d.key] || 0, got = S.quest.dgot.includes(d.key);

        ${doneN ? `<details class="ngrp"><summary><b>마친 부탁</b><span>${doneN}개</span></summary><ul class="rewards notes">${SUB_Q.filter(q => S.sub.done[q.k]).map(q => `<li><b>${q.t}</b><span>${q.who}</span></li>`).join('')}</ul></details>` : ''}`;
      wireSeg();
      $('#subFind').addEventListener('click', () => { const av = subAvail(); if (!av.length) return; const q = av[(Math.random() * av.length) | 0]; addChat('npc', q.who, q.hook, {sq:q.k}); offerSub(q.k); });
      panel.querySelectorAll('[data-sq]').forEach(b => b.addEventListener('click', () => { if (claimSub(b.dataset.sq)) draw(); }));

  panel.innerHTML = top + `

    <div class="card qmain" id="mainCard">
      <div class="qtitle"><span class="qbadge">이야기</span><b id="mqTitle"></b></div>
      <p class="story" id="mqStory"></p>
      <div class="qbar"><div class="meter gold big"><i id="mqBar"></i></div><span id="mqProg"></span></div>

// 레이드 화면: 레이드 · 타임 보스 · 허수아비 세 칸. 레이드 카드는 보스 얼굴·권장 전투력·보상·입장 단추

const portCache = new Map();
function bossPortrait(type, color){
  const k = type + color; let u = portCache.get(k);
  if (!u){
    const sp = mobSprite(type, color, 0, true), c = document.createElement('canvas'); c.width = 96; c.height = 96;
    const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
    const sc = Math.min(86 / sp.width, 86 / sp.height), w = sp.width * sc, h = sp.height * sc;
    g.drawImage(sp, (96 - w) / 2, 94 - h, w, h); u = c.toDataURL(); portCache.set(k, u);
  }
  return u;
}
// 권장 전투력: 이 레이드를 약 45초에 깨려면 필요한 힘(지금 내 힘에 예상 시간 비율을 곱해 셈)
const RAID_DPS_K = 3.5;
function raidRecPower(info){
  const eff = (1 + 0.45 * (info.party - 1)) * (info.party > RAID_PARTY_MAX ? 0.7 : 1), hp = 10 * mHp(info.ref) / 15 * eff * 40;
  const team = dpsOf(ST) * RAID_DPS_K * (1 + 0.45 * (partyOf(info) - 1)), est = hp / Math.max(1e-9, team);
  return power(ST) * est / 45;
}

const jmSpan = w => [null, HELL_SPAN, HEAVEN_SPAN, BUSANG_SPAN, KUNLUN_SPAN][w];
const jmNodeOf = (w, s) => w === 0 ? Math.min(9, Math.floor((Math.max(1, s) - 1) / 10)) : (sp => (k => k < 0 ? sp.length : k)(sp.findIndex(e => s <= e)))(jmSpan(w));
let jmNodesCache = null, jmChCache = null;
function jmNodes(){
  if (jmNodesCache) return jmNodesCache;

  for (let w = 1; w <= 4; w++){ const sp = jmSpan(w); regionsOf(w).forEach((R, k) => N.push({w, k, ri:k, name:R.name, a:k ? sp[k - 1] + 1 : 1, b:sp[k] || null, R})); }

}
// 장마다: 그 장 퀘스트 조건 중 가장 뒤 세계, 그 세계에서 처음 나오는 '단계' 조건으로 지도 위 자리를 정한다
function jmChapters(){
  if (jmChCache) return jmChCache;
  const out = [], lastS = [1, 1, 1, 1];
  let curW = 0;
  for (let ch = 0; ch < CHAPTERS.length; ch++){
    const qs = []; MAIN_Q.forEach((q, i) => { if (q.ch === ch) qs.push([q, i]); });
    if (!qs.length) continue;
    let w = -1;
    for (const [q] of qs){ const m = /^[sl](\d)$/.exec(q.k); if (m) w = Math.max(w, +m[1]); if (q.k === 'world') w = Math.max(w, q.n); }
    if (w < 0) w = curW;
    let st = null;
    for (const [q] of qs) if (q.k === 's' + w){ st = Math.max(1, q.n - 1); break; }
    if (st == null) st = lastS[w];
    curW = Math.max(curW, w); lastS[w] = st;
    const lab = CHAPTERS[ch].split(' · ')[0];
    out.push({ch, w, k:jmNodeOf(w, st), first:qs[0][1], last:qs[qs.length - 1][1], lab, name:CHAPTERS[ch]});
  }
  return (jmChCache = out);
}
const jmChState = c => S.quest.main > c.last ? 's-done' : S.quest.main >= c.first ? 's-now' : 's-todo';
const jmBest = w => Math.max(S.best['s' + w] || 0, S.world === w ? S.maxStage : 0);
function jmState(n){
  if (n.w > S.world) return 's-lock';
  if (n.w < S.world) return 's-done';
  const ci = jmNodeOf(n.w, S.stage);
  if (n.k === ci) return 's-now';
  return (n.b && jmBest(n.w) > n.b) || n.k < ci ? 's-done' : 's-todo';

/* ================= 계정 =================
   서버가 없는 정적 페이지라 계정은 이 기기(브라우저)에 저장한다. 비밀번호는 그대로 두지 않고 소금(salt)을 쳐서 해시로만 남긴다.
   claude.ai 아티팩트로 열면 Claude 계정의 개인 저장소(data/users/<id>/)에도 같이 올려서 다른 기기에서 이어진다. */
const ID_RE = /^[a-z0-9_]{4,12}$/;
const NAME_RE = /^[가-힣a-zA-Z0-9]{2,8}$/;
let REG = null, curAcc = null, regDirty = false, modalLock = false, loginBusy = false;
const emptyReg = () => ({v:1, accounts:{}, keep:null, legacyClaimed:false, t:0});
function loadReg(){
  try {
    const d = JSON.parse(localStorage.getItem(ACC_KEY) || 'null');
    if (d && d.v === 1 && d.accounts && typeof d.accounts === 'object'){
      const r = Object.assign(emptyReg(), d);
      for (const A of Object.values(r.accounts)) if (!Array.isArray(A.chars)) A.chars = [];
      return r;
    }
  } catch (e) {}
  return emptyReg();
}
function saveReg(){
  REG.t = now(); regDirty = true;
  try { localStorage.setItem(ACC_KEY, JSON.stringify(REG)); } catch (e) {}
}
function writeSession(o){ try { if (o) sessionStorage.setItem(SESSION_KEY, JSON.stringify(o)); else sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
function readSession(){ try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; } }
function randHex(n){
  const a = new Uint8Array(n);
  try { crypto.getRandomValues(a); } catch (e) { for (let i = 0; i < n; i++) a[i] = Math.random() * 256 | 0; }
  return Array.from(a, x => x.toString(16).padStart(2, '0')).join('');
}
async function hashPw(pw, salt, alg){
  if (alg !== 'f'){
    try {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:enc.encode(salt), iterations:60000, hash:'SHA-256'}, key, 256);
      return 'p:' + Array.from(new Uint8Array(bits), x => x.toString(16).padStart(2, '0')).join('');
    } catch (e) { if (alg === 'p') return null; }
  }
  // 아주 오래된 브라우저용 예비 해시
  let h1 = 0x9e3779b9, h2 = 0x85ebca6b;
  const s = salt + ':' + pw;
  for (let r = 0; r < 3000; r++) for (let i = 0; i < s.length; i++){
    const c = s.charCodeAt(i) + r;
    h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); h1 ^= h2 >>> 15; h2 ^= h1 >>> 13;
  }
  return 'f:' + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}
const allChars = () => Object.entries(REG.accounts).flatMap(([acc, A]) => (A.chars || []).map(c => Object.assign({acc}, c)));
let cloudLegacy = null;
// 계정이 생기기 전에 하던 모험(예전 저장)을 찾는다
function legacyCandidate(){
  if (REG.legacyClaimed) return null;
  let best = null;

  try {
    const sb = await onlineClient();
    r = await Promise.race([sb.rpc(fn, args), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 9000))]);
  } catch (e) { throw Object.assign(new Error('net'), {code:'net'}); }
  if (r && r.error){
    const m = String(r.error.message || '');
    throw Object.assign(new Error(m), {code:ON_CODES.find(c => m.includes(c)) || 'net'});
  }
  return r ? r.data : null;
}

const charSummary = ch => ({cls:ch.cls, level:ch.level, maxStage:ch.maxStage, look:ch.look, armorG:ch.armorG, weaponG:ch.weaponG, ally:ch.ally});
// 서버의 내 캐릭터 목록을 이 기기 목록과 합친다. 이 기기에만 있는 캐릭터는 서버로 올린다
async function syncChars(acc){
  if (!online) return;
  const A = REG.accounts[acc];
  if (!A) return;
  const list = await rpc('samhan_list', {p_token:online.token});
  if (!Array.isArray(list)) return;
  for (const it of list){
    if (!it || typeof it.cid !== 'string' || typeof it.name !== 'string') continue;
    const sm = it.summary && typeof it.summary === 'object' ? it.summary : {};
    const loc = A.chars.find(c => c.cid === it.cid);
    const ent = {cid:it.cid, name:String(it.name).slice(0, 8), cls:CLASSES[sm.cls] ? sm.cls : 'musa', level:Math.max(1, +sm.level || 1), maxStage:Math.max(1, +sm.maxStage || 1),
      look:cleanLook(sm.look), armorG:Number.isFinite(+sm.armorG) ? +sm.armorG : -1, weaponG:Number.isFinite(+sm.weaponG) ? +sm.weaponG : -1,
      ally:sm.ally && typeof sm.ally === 'object' ? {dps:Math.max(1, +sm.ally.dps || 1), maxHp:Math.max(1, +sm.ally.maxHp || 1)} : undefined, t:+it.t || 0, srvT:+it.t || 0};
    if (!loc) A.chars.push(ent);
    else { loc.srvT = ent.srvT; if ((ent.t || 0) > (loc.t || 0)) Object.assign(loc, ent); }
  }
  const onSrv = new Set(list.map(it => it && it.cid));
  for (const ch of A.chars.slice()){
    if (onSrv.has(ch.cid)) continue;
    let save = null;
    try { save = localStorage.getItem(charKey(acc, ch.cid)); } catch (e) {}
    if (!save){ continue; }
    try { const d = JSON.parse(save); await rpc('samhan_save', {p_token:online.token, p_cid:ch.cid, p_name:ch.name, p_summary:charSummary(ch), p_save:save, p_t:d.lastSave || 0}); }
    catch (e) { if (e.code === 'name_taken') ch.srvErr = 'name'; else if (e.code === 'bad_token'){ lostOnline(); return; } }
  }
  A.chars = A.chars.slice(0, MAX_CHARS);
  A.t = now(); saveReg();
}

// 실시간 채널: claude.ai room과 같은 모양(on·onPeers·emit)으로 감싼다
async function onlineRoom(){
  const sb = await onlineClient(), me = randHex(6), hs = {}, peerFns = [];
  const ch = sb.channel('samhan-world', {config:{broadcast:{self:false}, presence:{key:me}}});
  for (const topic of ['chat', 'tb']) ch.on('broadcast', {event:topic}, msg => {
    const p = msg && msg.payload && typeof msg.payload === 'object' ? msg.payload : {};
    for (const fn of hs[topic] || []) fn({data:p.d, peer:String(p.p || '').slice(0, 16)});
  });
  ch.on('presence', {event:'sync'}, () => { const n = Object.keys(ch.presenceState() || {}).length; for (const f of peerFns) f({peers:new Array(n).fill(0)}); });
  await new Promise((res, rej) => {
    const to = setTimeout(() => rej(new Error('timeout')), 9000);
    ch.subscribe(st => {
      if (st === 'SUBSCRIBED'){ clearTimeout(to); Promise.resolve(ch.track({t:Date.now()})).catch(() => {}); res(); }
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED'){ clearTimeout(to); rej(new Error(st)); }
    });
  });
  return {
    on(topic, fn){ (hs[topic] = hs[topic] || []).push(fn); return () => {}; },
    onPeers(fn){ peerFns.push(fn); return () => {}; },
    emit(topic, data){ return Promise.resolve(ch.send({type:'broadcast', event:topic, payload:{d:data, p:me}})).then(r => { if (r && r !== 'ok') throw Object.assign(new Error(String(r)), {code:String(r)}); }); },
  };
}

/* 오프라인 보상: 온라인에서 스킬 자동으로 사냥할 때 잰 처치 속도(1분씩 재서 평균)를 그대로 쓴다.
   경험치는 온라인의 1.25배, 엽전·보석·재료는 0.85배. 오프라인으로 비운 시간을 모두 더해 24시간이 될 때마다 3% 확률로 신화 보물 */
const OFF_EXP = 1.25, OFF_CUR = 0.85, OFF_KPS_MAX = 6, OFF_MYTH_H = 24, OFF_MYTH_P = 0.03;
const offHunt = {t:0, k:0};
function offTrack(dt){
  offHunt.t += dt;
  if (offHunt.t < 60) return;
  const r = Math.min(OFF_KPS_MAX, offHunt.k / offHunt.t);
  S.off.kps = S.off.kps > 0 ? S.off.kps * 0.7 + r * 0.3 : r;
  offHunt.t = 0; offHunt.k = 0;
}
// 아직 잰 적이 없으면(예전 저장) 지금까지 전체 평균 처치 속도로
const offlineKps = () => S.off.kps > 0 ? S.off.kps : Math.min(OFF_KPS_MAX, S.rec.play > 300 ? S.rec.kills / S.rec.play : 0.5);
function offlineReward(sec){
  sec = Math.min(sec, OFFLINE_CAP);
  if (sec < 60) return;
  const s = S.stage, mk = 1 + rideAb('off') / 100;
  const kills = Math.floor(offlineKps() * sec);
  const gold = kills * mGold(s) * FIELD.rew * gainMul('gold', true) * OFF_CUR * mk;
  const exp = (kills * mExp(s) * FIELD.rew + (S.world >= 3 ? mExp(S.maxStage) * CONT[S.world].sun * sec : 0)) * gainMul('exp', true) * OFF_EXP * mk;
  const gx = kills * GEM_DROP * FIELD.rew * (1 + Math.min(1, s / 300)) * OFF_CUR * mk, gems = Math.floor(gx) + (Math.random() < gx % 1 ? 1 : 0);
  const lv0 = S.level;
  S.gold += gold; S.gems += gems; S.rec.kills += kills;
  const mats = gainMat(kills * MAT_DROP.mob * FIELD.rew * OFF_CUR, true);
  const dust = Math.round(kills * MOB_GEAR * FIELD.rew * DUST_G[Math.max(0, dropGrade() - 1)] * 1.52 * OFF_CUR); S.dust += dust;
  gainExp(exp);
  // 오프라인 누적 24시간마다 신화 보물 한 번 굴림
  S.off.acc += sec;
  const myths = [];
  while (S.off.acc >= OFF_MYTH_H * 3600){
    S.off.acc -= OFF_MYTH_H * 3600;
    if (Math.random() < OFF_MYTH_P * (window.__game && window.__game.offLuck || 1)){ const m = dropMyth(questDiff({daily:true}), null, true); myths.push(m); }
  }
  saveLocal();
  const mythRow = m => { const M = MYTHS.find(x => x.k === m.k); return `<li style="color:${MYTH_COLOR}">${M.name}<span>신화 보물${m.up ? ` · ${M.stat} +${m.p}%` : ' (이미 더 센 것이 있어 보석으로)'}</span></li>`; };
  showModal('다녀오셨습니까?', `
    <p>자리를 비운 <b>${fmtTime(sec)}</b> 동안 용사가 스킬 자동으로 <b>${fmt(kills)}마리</b>를 잡았어요.</p>
    <ul class="rewards">
      <li><span class="coin"></span>${fmt(gold)}<span>엽전</span></li>
      <li><span class="gem"></span>${fmt(gems)}<span>보석 (몬스터가 떨군 것)</span></li>
      ${mats ? `<li style="color:${MATS[Math.min(2, S.world)].color}">${fmt(mats)}<span>${MATS[Math.min(2, S.world)].name}</span></li>` : ''}
      ${dust ? `<li style="color:#c8c0b0">${fmt(dust)}<span>쇳가루 (재련 재료)</span></li>` : ''}
      <li>Lv.${lv0}${S.level > lv0 ? ` → Lv.${S.level}` : ''}<span>경험치 +${fmt(exp)}</span></li>
      ${myths.map(mythRow).join('')}
    </ul>
    <p class="small" style="margin-top:8px">경험치 ×${OFF_EXP} · 엽전·보석 ×${OFF_CUR}${mk > 1 ? ` · 천리마 +${Math.round((mk - 1) * 100)}%` : ''} · 최대 ${OFFLINE_CAP / 3600}시간 · 신화 보물 굴림까지 ${fmtTime(S.off.acc)} / ${OFF_MYTH_H}시간(${Math.round(OFF_MYTH_P * 100)}%)</p>`,
    [{label:'받기', primary:true}]);
  return {kills, gold, gems, exp, myths, dust};
}

/* ================= 소리: 국악풍 배경음악·효과음 =================
   음원 파일 없이 Web Audio로 직접 연주한다(저작권 걱정 없음, 오프라인에서도 남).
   가야금(뜯는 소리)·대금(부는 소리)·장구(덩·쿵·덕)·징. 이승은 평조, 저승은 계면조 느낌의 5음 음계.
   브라우저 규칙상 화면을 한 번 눌러야 소리가 난다. */
const AUD_KEY = 'samhan-audio';
const AUD = {ctx:null, master:null, bgm:null, fx:null, noise:null, track:'', next:0, step:0, phrase:[], deg:0, lastHit:0, set:{bgm:true, sfx:true, bv:0.5, sv:0.7}};
try { Object.assign(AUD.set, JSON.parse(localStorage.getItem(AUD_KEY) || '{}')); } catch (e) {}
function audSave(){ try { localStorage.setItem(AUD_KEY, JSON.stringify(AUD.set)); } catch (e) {} audApply(); }
function audApply(){
  if (!AUD.ctx) return;
  const t = AUD.ctx.currentTime;
  AUD.bgm.gain.setTargetAtTime(AUD.set.bgm ? AUD.set.bv * 0.55 : 0, t, 0.2);
  AUD.fx.gain.setTargetAtTime(AUD.set.sfx ? AUD.set.sv * 0.8 : 0, t, 0.05);
}
function audInit(){
  if (AUD.ctx) { if (AUD.ctx.state === 'suspended') AUD.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const c = AUD.ctx = new AC();
  AUD.master = c.createGain(); AUD.master.gain.value = 0.9; AUD.master.connect(c.destination);
  AUD.bgm = c.createGain(); AUD.bgm.connect(AUD.master);
  AUD.fx = c.createGain(); AUD.fx.connect(AUD.master);
  const len = c.sampleRate, nb = c.createBuffer(1, len, c.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  AUD.noise = nb;
  audApply();
  AUD.next = c.currentTime + 0.1;
  setInterval(audTick, 60);
}
document.addEventListener('pointerdown', audInit, true);
document.addEventListener('keydown', audInit, true);
const hz = midi => 440 * Math.pow(2, (midi - 69) / 12);
// 악기
function pluck(out, t, midi, dur, vol){
  const c = AUD.ctx, o1 = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
  const fq = hz(midi);
  o1.type = 'triangle'; o2.type = 'sawtooth'; o2.detune.value = 6;
  o1.frequency.setValueAtTime(fq * 1.02, t); o1.frequency.exponentialRampToValueAtTime(fq, t + 0.07);   // 농현처럼 살짝 꺾임
  o2.frequency.setValueAtTime(fq * 1.02, t); o2.frequency.exponentialRampToValueAtTime(fq, t + 0.07);
  f.type = 'lowpass'; f.frequency.setValueAtTime(3200, t); f.frequency.exponentialRampToValueAtTime(500, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const g2 = c.createGain(); g2.gain.value = 0.35;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(f); f.connect(out);
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}
function flute(out, t, midi, dur, vol){
  const c = AUD.ctx, o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), g = c.createGain();
  o.type = 'sine'; o.frequency.value = hz(midi);
  lfo.frequency.value = 5; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(hz(midi) * 0.012, t + dur * 0.6);
  lfo.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.09); g.gain.setValueAtTime(vol, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const n = c.createBufferSource(), nf = c.createBiquadFilter(), ng = c.createGain();
  n.buffer = AUD.noise; nf.type = 'bandpass'; nf.frequency.value = hz(midi) * 2; nf.Q.value = 3; ng.gain.value = vol * 0.25;
  n.connect(nf); nf.connect(ng); ng.connect(g);
  o.connect(g); g.connect(out);
  o.start(t); lfo.start(t); n.start(t, Math.random() * 0.5); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05); n.stop(t + dur + 0.05);
}
function drum(out, t, kind, vol){
  const c = AUD.ctx;
  if (kind === 'dung' || kind === 'kung'){
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(kind === 'dung' ? 110 : 90, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.25);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.4);
  }
  if (kind === 'dung' || kind === 'deok'){
    const n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    n.buffer = AUD.noise; f.type = 'bandpass'; f.frequency.value = kind === 'deok' ? 2600 : 1800; f.Q.value = 1.2;
    g.gain.setValueAtTime(vol * (kind === 'deok' ? 0.9 : 0.6), t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    n.connect(f); f.connect(g); g.connect(out); n.start(t, Math.random()); n.stop(t + 0.12);
  }
}
function gong(out, t, vol){
  const c = AUD.ctx;
  for (const [fq, v] of [[98, 1], [101.5, 0.7], [196, 0.3]]){
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = fq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * v, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 3.3);
  }
}
// 곡: 박자 길이·음계·장단(장구 무늬)·밑음
const TRACKS = {
  title:{step:0.5, root:55, scale:[0, 2, 5, 7, 9], drums:['dung', '', '', '', '', '', 'kung', '', '', '', 'deok', ''], mel:'flute', melEvery:2, arp:true},
  field:{step:0.24, root:55, scale:[0, 2, 5, 7, 9], drums:['dung', '', 'deok', 'kung', '', 'deok', 'dung', 'deok', 'deok'], mel:'pluck', melEvery:1, arp:false},
  battle:{step:0.16, root:57, scale:[0, 3, 5, 7, 10], drums:['dung', 'deok', 'deok', 'dung', 'kung', 'deok', 'dung', 'deok'], mel:'pluck', melEvery:1, arp:true},
  hell:{step:0.42, root:52, scale:[0, 3, 5, 7, 10], drums:['dung', '', '', '', 'kung', '', '', ''], mel:'flute', melEvery:2, drone:true},
};
function wantTrack(){
  if (!session) return 'title';
  if (cut) return S.world === 1 ? 'hell' : 'title';
  if (raid || bossActive) return 'battle';
  return S.world === 1 ? 'hell' : S.world === 2 ? 'title' : 'field';
}
function audTick(){
  const c = AUD.ctx;
  if (!c || c.state !== 'running') return;
  const want = wantTrack();
  if (want !== AUD.track){
    AUD.track = want; AUD.step = 0; AUD.phrase = []; AUD.next = Math.max(AUD.next, c.currentTime + 0.05);
    if (want === 'battle' && AUD.set.bgm) gong(AUD.bgm, c.currentTime + 0.05, 0.25);
  }
  if (!AUD.set.bgm){ AUD.next = c.currentTime + 0.1; return; }
  const T = TRACKS[AUD.track];
  while (AUD.next < c.currentTime + 0.25){
    const t = AUD.next, st = AUD.step;
    const dk = T.drums[st % T.drums.length];
    if (dk) drum(AUD.bgm, t, dk, dk === 'deok' ? 0.18 : 0.32);
    if (st % T.melEvery === 0){
      if (!AUD.phrase.length){
        // 새 가락: 음계 안에서 한두 칸씩 움직이고, 끝은 으뜸음으로
        const n = 6 + ((Math.random() * 5) | 0), ph = [];
        let dg = AUD.deg || 5;
        for (let i = 0; i < n; i++){ dg = Math.max(0, Math.min(10, dg + [-2, -1, -1, 1, 1, 2, 0][(Math.random() * 7) | 0])); ph.push(Math.random() < 0.18 ? null : dg); }
        ph.push(5); ph.push(null); ph.push(null);
        AUD.phrase = ph; AUD.deg = dg;
      }
      const dg = AUD.phrase.shift();
      if (dg != null){
        const midi = T.root + 12 + T.scale[dg % 5] + 12 * Math.floor(dg / 5) - 12;
        if (T.mel === 'flute') flute(AUD.bgm, t, midi + 12, T.step * T.melEvery * 1.8, 0.13);
        else pluck(AUD.bgm, t, midi + 12, 0.9, 0.16);
      }
    }
    if (T.arp && st % 4 === 0) pluck(AUD.bgm, t, T.root + T.scale[(st / 4) % 5 | 0], 1.4, 0.09);
    if (T.drone && st % 16 === 0) flute(AUD.bgm, t, T.root - 12, T.step * 16, 0.07);
    AUD.next += T.step; AUD.step++;
  }
}
// 효과음
const SFX_GAP = {hit:0.07, crit:0.08, blip:0.06, click:0.05, kill:0.08, gem:0.1};
const sfxLast = {};
sfx = function(name){
  const c = AUD.ctx;
  if (!c || !AUD.set.sfx || c.state !== 'running') return;
  const t = c.currentTime;
  if (SFX_GAP[name] && t - (sfxLast[name] || 0) < SFX_GAP[name]) return;
  sfxLast[name] = t;
  const o = AUD.fx, P5 = [0, 2, 5, 7, 9];
  switch (name){
    case 'hit': drum(o, t, 'deok', 0.12); break;
    case 'crit': drum(o, t, 'deok', 0.2); pluck(o, t, 84, 0.25, 0.12); break;
    case 'kill': pluck(o, t, 88, 0.2, 0.08); pluck(o, t + 0.05, 93, 0.25, 0.08); break;
    case 'gem': pluck(o, t, 91, 0.6, 0.14); pluck(o, t + 0.08, 96, 0.8, 0.12); break;
    case 'level': P5.concat([12]).forEach((d, i) => pluck(o, t + i * 0.07, 67 + d, 0.6, 0.15)); break;
    case 'boss': gong(o, t, 0.4); drum(o, t, 'dung', 0.5); break;
    case 'win': [0, 5, 9, 12].forEach((d, i) => pluck(o, t + i * 0.1, 67 + d, 0.8, 0.16)); drum(o, t, 'dung', 0.4); break;
    case 'fail': [7, 5, 2, 0].forEach((d, i) => flute(o, t + i * 0.18, 60 + d, 0.3, 0.1)); break;
    case 'skill': { const n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); n.buffer = AUD.noise; f.type = 'bandpass'; f.Q.value = 2;
      f.frequency.setValueAtTime(600, t); f.frequency.exponentialRampToValueAtTime(3000, t + 0.25); g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      n.connect(f); f.connect(g); g.connect(o); n.start(t); n.stop(t + 0.32); break; }
    case 'nuke': drum(o, t, 'dung', 0.6); drum(o, t + 0.12, 'kung', 0.5); sfx('skill'); break;
    case 'quest': [0, 2, 5, 7].forEach((d, i) => pluck(o, t + i * 0.06, 72 + d, 0.5, 0.13)); break;
    case 'rare': [0, 5, 9, 12, 17, 21].forEach((d, i) => pluck(o, t + i * 0.07, 72 + d, 0.9, 0.14)); gong(o, t, 0.15); break;
    case 'summon': [0, 2, 5, 7, 9].forEach((d, i) => pluck(o, t + i * 0.05, 72 + d, 0.4, 0.1)); break;
    case 'refOk': pluck(o, t, 96, 0.5, 0.2); pluck(o, t + 0.05, 91, 0.7, 0.15); break;
    case 'refNo': drum(o, t, 'kung', 0.4); break;
    case 'raid': gong(o, t, 0.35); [0, 1, 2, 3].forEach(i => drum(o, t + 0.3 + i * 0.12, i % 2 ? 'deok' : 'dung', 0.35)); break;
    case 'awaken': gong(o, t, 0.5); [0, 5, 7, 12, 17, 19, 24].forEach((d, i) => pluck(o, t + i * 0.04, 60 + d, 1.2, 0.15)); break;
    case 'form': [0, 7, 12, 19].forEach((d, i) => flute(o, t + i * 0.06, 72 + d, 0.6, 0.1)); break;
    case 'rebirth': gong(o, t, 0.5); [12, 7, 5, 0, -5].forEach((d, i) => flute(o, t + 0.3 + i * 0.25, 60 + d, 0.6, 0.1)); break;
    case 'potion': flute(o, t, 79, 0.25, 0.1); break;
    case 'cut': gong(o, t, 0.18); break;
    case 'blip': pluck(o, t, 86, 0.12, 0.05); break;
    case 'click': pluck(o, t, 81, 0.1, 0.06); break;
  }
};
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('.btn,.chip,.tab,.seg button,.gbtn,.ccard,.char')) sfx('click'); });

let last = performance.now();
function loop(ts){
  let dt = (ts - last) / 1000; last = ts;
  if (dt > 0.25) dt = 0.25;
  if (cut){ updateCut(dt); shake = Math.max(0, shake - dt); }
  else if (dt > 0){
    for (let i = 0; i < S.speed; i++){
      let rem = dt;
      while (rem > 0){ const step = Math.min(rem, 0.05); update(step); rem -= step; }
    }
  }
  if (session && dt > 0){ tickBuffs(dt); npcChatter(dt); }
  if (heroSay){ heroSay.t -= dt; if (heroSay.t <= 0) heroSay = null; }
  render(); updateHud();
  requestAnimationFrame(loop);
}
