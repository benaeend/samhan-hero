:root{
  /* 한지와 먹, 나무틀: 종이색 창 + 먹색 글씨 + 인주 빨강 하나로 강조.
     레이아웃: 세로 한 화면 = 나무 상태바 → 탑뷰 도트 장면 → 기술 줄 → 한지 창(스크롤) → 나무 탭 */
  --wood:#2b1f17;
  --wood-2:#3d2c20;
  --wood-line:#5e4532;
  --paper:#efe5cf;
  --paper-2:#e2d4b4;
  --paper-line:#c4ad84;
  --ink:#2a2118;
  --ink-soft:#6e5c47;
  --seal:#b8382f;
  --gold:#e0b03c;
  --jade:#3f8f6a;
  --sky:#3a9fcf;
  --pixel:'Galmuri','Apple SD Gothic Neo','Malgun Gothic',monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#1d150f;color:var(--ink);font-family:var(--pixel);font-size:13px;line-height:1.45;overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px);
}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--paper);border-left:3px solid var(--wood-2);border-right:3px solid var(--wood-2)}

/* 상단 나무 상태바 */
.hud{background:var(--wood);color:#f3e6c8;padding:7px 10px 8px;border-bottom:3px solid var(--wood-line);display:grid;gap:6px}
.hud-top{display:flex;align-items:center;gap:10px}
.who{flex:1;min-width:0;display:flex;align-items:baseline;gap:7px;white-space:nowrap;overflow:hidden}
.who b{font-weight:700;font-size:15px}
.who .cls{color:var(--gold)}
.who .cp{font-size:12px;color:#c9b490}
.cur{display:flex;align-items:center;gap:5px;font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.coin{width:12px;height:12px;background:#e0b03c;box-shadow:inset -2px -2px 0 #a8781a,inset 2px 2px 0 #ffe58a;flex:none;display:inline-block}
.gem{width:10px;height:10px;transform:rotate(45deg);background:#5ac8f0;box-shadow:inset -2px -2px 0 #2a88b0,inset 2px 2px 0 #c8f2ff;flex:none;display:inline-block;margin:0 2px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{display:flex;align-items:center;gap:5px;font-size:11px;color:#c9b490;white-space:nowrap}
.bar .tr{flex:1;height:8px;background:#120c08;border:1px solid #5e4532;position:relative}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;width:0}
.bar.hp i{background:#d8433a;box-shadow:inset 0 -2px 0 #9a2a22}
.bar.xp i{background:#e0b03c;box-shadow:inset 0 -2px 0 #a8781a}
.bar .num{min-width:58px;text-align:right;color:#f3e6c8;font-variant-numeric:tabular-nums}

/* 장면 */
.scene{position:relative;line-height:0;background:#000}
canvas{display:block;width:100%;image-rendering:pixelated;touch-action:manipulation}
.log{position:absolute;left:6px;right:6px;bottom:6px;display:flex;flex-direction:column;gap:1px;pointer-events:none;line-height:1.35}
.log div{align-self:flex-start;background:rgba(10,6,4,.62);color:#f3eee0;font-size:11px;padding:1px 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:opacity .6s}
.log div.gain{color:#ffd96a}.log div.warn{color:#ff8a7a}.log div.good{color:#9ff0b8}
.log div.old{opacity:0}

/* 기술 줄 */
.ctrl{display:flex;align-items:center;gap:7px;padding:6px 10px;background:var(--wood-2);border-top:3px solid var(--wood-line);border-bottom:3px solid var(--wood-line)}
.skills{display:flex;gap:6px}
.sk{position:relative;width:38px;height:38px;background:#1d150f;display:grid;place-items:center;color:var(--gold);border:2px solid #8a6a4a;box-shadow:inset 0 0 0 1px #000;overflow:hidden}
.sk svg{width:20px;height:20px;position:relative;z-index:1}
.sk .cd{position:absolute;inset:0;z-index:2;background:linear-gradient(to top,rgba(0,0,0,.72) var(--p,0%),transparent var(--p,0%))}
.sk .lk{display:none;position:absolute;inset:0;z-index:3;place-items:center;font-size:10px;color:#c9b490;background:rgba(29,21,15,.85)}
.sk.locked .lk{display:grid}
.sp{flex:1}
.btn-boss{border:2px solid #1d150f;padding:7px 10px;background:var(--seal);color:#fff4e0;font-weight:700;font-size:13px;cursor:pointer;
  box-shadow:inset -2px -2px 0 #7a1f1a,inset 2px 2px 0 #e86a5a;animation:blink 1s steps(2) infinite;touch-action:manipulation}
.btn-boss[hidden]{display:none}
@keyframes blink{50%{filter:brightness(1.25)}}
.btn-speed{border:2px solid #1d150f;padding:7px 9px;background:#5e4532;color:#f3e6c8;font-size:12px;cursor:pointer;box-shadow:inset -2px -2px 0 #3d2c20,inset 2px 2px 0 #8a6a4a;touch-action:manipulation}
.btn-speed[aria-pressed="true"]{background:#8a6a2a;color:#fff4c0}

/* 한지 창 패널 */
.panel{flex:1;overflow-y:auto;padding:10px 12px 16px;min-height:0;overscroll-behavior:contain;
  background-color:var(--paper);
  background-image:radial-gradient(rgba(120,90,50,.07) 1px,transparent 1px);background-size:5px 5px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 4px;padding-bottom:5px;border-bottom:2px solid var(--ink)}
.ph h2{font-weight:700;font-size:16px;margin:0;text-wrap:balance;display:flex;align-items:center;gap:7px}
.ph h2::before{content:"";width:9px;height:9px;background:var(--seal);display:inline-block}
.hint{font-size:12px;color:var(--ink-soft);margin:4px 0 6px}
.mode{display:flex;gap:4px}
.chip{border:2px solid var(--ink);background:var(--paper-2);color:var(--ink-soft);padding:2px 8px;font-size:12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--paper-line)}
.row:last-child{border-bottom:0}
.ic{width:36px;height:36px;background:var(--wood);border:2px solid var(--ink);display:grid;place-items:center;color:var(--gold)}
.ic svg{width:20px;height:20px}
.nm{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.nm .l{font-weight:400;font-size:12px;color:var(--ink-soft)}
.val{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.val em{font-style:normal;color:var(--jade);font-weight:700}
.buy{min-width:96px;display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 9px;border:2px solid var(--ink);
  background:var(--gold);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  box-shadow:inset -2px -2px 0 #a8781a,inset 2px 2px 0 #ffe58a;font-variant-numeric:tabular-nums}
.buy:active:not(:disabled){box-shadow:inset 2px 2px 0 #a8781a,inset -2px -2px 0 #ffe58a}
.buy:disabled{background:#d6c8a8;color:#8a7a60;box-shadow:inset -2px -2px 0 #bcae8c,inset 2px 2px 0 #ece0c4;cursor:default}
.buy:disabled .coin{filter:grayscale(1) opacity(.6)}
.buy.nocoin .coin{display:none}
.buy small{font-size:11px;font-weight:400}

/* 장비 */
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink)}
.seg button{border:0;background:var(--paper-2);color:var(--ink-soft);padding:7px;font-weight:700;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.summon{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.gbtn{border:2px solid var(--ink);padding:8px;background:var(--sky);color:#06202c;font-weight:700;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:inset -2px -2px 0 #1f6a8f,inset 2px 2px 0 #9fdcf4;touch-action:manipulation}
.gbtn .price{display:flex;align-items:center;gap:4px;font-weight:400;font-size:12px}
.gbtn:disabled{background:#d6c8a8;color:#8a7a60;box-shadow:inset -2px -2px 0 #bcae8c,inset 2px 2px 0 #ece0c4;cursor:default}
.odds{font-size:11px;color:var(--ink-soft);margin:0 0 8px;text-align:center}
.effects{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--ink-soft);margin-bottom:8px}
.effects div{background:var(--paper-2);border:2px solid var(--paper-line);padding:5px 8px}
.effects b{display:block;color:var(--ink);font-size:14px}
.grid{display:grid;grid-template-columns:34px repeat(4,1fr);gap:5px;align-items:center}
.gl{font-weight:700;font-size:12px;color:var(--gc)}
.cell{position:relative;aspect-ratio:1;background:var(--wood);border:2px solid var(--g);color:var(--g);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px #000}
.cell svg{width:46%;height:46%}
.cell.unseen{border-color:#7a6a52;color:#4e4032}
.cell.sel{outline:3px solid var(--seal);outline-offset:1px}
.cell .tier,.res .tier{position:absolute;left:3px;bottom:1px;font-size:10px;color:#f3e6c8}
.cell .cnt{position:absolute;right:3px;top:1px;font-size:11px;font-weight:700;color:#f3e6c8}
.cell .eq{position:absolute;left:-3px;top:-8px;background:var(--seal);color:#fff4e0;font-size:10px;padding:0 3px;border:1px solid var(--ink)}
.detail{margin-top:10px;padding:10px;background:var(--paper-2);border:2px solid var(--ink);border-top:5px solid var(--g);display:grid;gap:5px}
.dn{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px}
.badge{font-size:11px;padding:1px 5px;background:var(--wood);color:var(--g);border:1px solid var(--g)}
.dl{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-soft)}
.dl b{color:var(--ink)}
.dbtns,.bulk{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.bulk{margin-top:10px}
.small{font-size:12px;color:var(--ink-soft);margin:2px 0 0}

/* 공용 버튼 */
.btn{border:2px solid var(--ink);background:var(--paper-2);color:var(--ink);padding:7px 10px;cursor:pointer;font-weight:700;font-size:13px;
  box-shadow:inset -2px -2px 0 var(--paper-line),inset 2px 2px 0 #fbf4e2;touch-action:manipulation}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--seal);color:#fff4e0;box-shadow:inset -2px -2px 0 #7a1f1a,inset 2px 2px 0 #e86a5a}
.btn.danger{color:var(--seal)}

/* 정보 */
.rec{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 10px}
.rec div{background:var(--paper-2);border:2px solid var(--paper-line);padding:5px 8px}
.rec dt{font-size:11px;color:var(--ink-soft)}
.rec dd{margin:0;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.save-note{font-size:12px;color:var(--ink-soft);margin:0 0 12px;display:flex;align-items:center;gap:7px}
.save-note::before{content:"";width:8px;height:8px;background:var(--jade);flex:none}
.howto{margin:6px 0 14px;padding-left:18px;color:var(--ink-soft);font-size:12px;display:grid;gap:4px;max-width:65ch}
.recbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* 하단 탭 */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--wood);border-top:3px solid var(--wood-line);padding-bottom:env(safe-area-inset-bottom)}
.tab{background:none;border:0;color:#a8906c;font-size:12px;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tab svg{width:18px;height:18px}
.tab[aria-selected="true"]{color:#ffe58a;background:#3d2c20;box-shadow:inset 0 3px 0 var(--seal)}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(15,10,6,.72);display:grid;place-items:center;padding:14px;z-index:10}
.modal[hidden]{display:none}
.sheet{width:min(430px,100%);background:var(--paper);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--wood-line),0 18px 50px rgba(0,0,0,.6);padding:14px;max-height:92%;overflow:auto}
.sheet h2{font-weight:700;margin:0 0 8px;font-size:18px;text-wrap:balance;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.sheet p{margin:0 0 8px;color:var(--ink-soft)}
.sheet p b{color:var(--ink)}
.mbtns{display:flex;gap:8px;margin-top:12px}
.mbtns button{flex:1}
.rewards{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:5px}
.rewards li{display:flex;align-items:center;gap:8px;background:var(--paper-2);border:2px solid var(--paper-line);padding:6px 10px;font-weight:700;font-size:15px}
.rewards li span:last-child{margin-left:auto;font-weight:400;font-size:12px;color:var(--ink-soft)}
.res-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:4px}
.res{position:relative;aspect-ratio:1;background:var(--wood);border:2px solid var(--g);color:var(--g);display:grid;place-items:center;animation:pop .3s steps(3) both;animation-delay:calc(var(--i) * 60ms)}
.res svg{width:48%;height:48%}
.res.legend{box-shadow:0 0 0 2px var(--g)}
.res .new{position:absolute;right:-3px;top:-8px;background:var(--seal);color:#fff;font-size:9px;padding:0 3px;border:1px solid var(--ink)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.classes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ccard{border:2px solid var(--ink);background:var(--paper-2);padding:8px;cursor:pointer;display:grid;justify-items:center;gap:4px;text-align:center;box-shadow:inset -2px -2px 0 var(--paper-line),inset 2px 2px 0 #fbf4e2}
.ccard[aria-pressed="true"]{background:#f6e2b8;outline:3px solid var(--seal);outline-offset:1px}
.ccard img{width:60px;height:56px;image-rendering:pixelated}
.ccard b{font-size:15px}
.ccard span{font-size:11px;color:var(--ink-soft);line-height:1.35}
.ccard em{font-style:normal;font-size:11px;color:var(--seal)}

@media (prefers-reduced-motion: reduce){
  .btn-boss,.res{animation:none}
  .log div{transition:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="hud-top">
      <div class="who"><b id="lv">Lv.1</b><b class="cls" id="clsName">무사</b><span class="cp">전투력 <b id="cp">0</b></span></div>
      <div class="cur" aria-label="엽전"><span class="coin"></span><span id="gold">0</span></div>
      <div class="cur" aria-label="보석"><span class="gem"></span><span id="gems">0</span></div>
    </div>
    <div class="bars">
      <div class="bar hp"><span>체력</span><span class="tr"><i id="hpfill"></i></span><span class="num" id="hpnum">0</span></div>

    </div>

  <div class="scene" id="scene">
    <canvas id="cv" aria-label="사냥 화면"></canvas>
    <div class="log" id="log" role="log" aria-live="polite"></div>
  </div>

  <div class="ctrl">

    <button class="btn-speed" id="speedBtn" aria-pressed="false">속도 ×1</button>
  </div>

  <main class="panel" id="panel"></main>

  <nav class="tabs" role="tablist" aria-label="메뉴">
    <button class="tab" role="tab" id="tab-grow" data-tab="grow" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 3h2v2h2v2h2v2h2v2h-4v10h-6V11H5V9h2V7h2V5h2z"/></svg>수련</button>
    <button class="tab" role="tab" id="tab-skill" data-tab="skill" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13 2h4l-4 8h5L9 22l2-9H6l3-11z"/></svg>기술</button>
    <button class="tab" role="tab" id="tab-gear" data-tab="gear" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 3h4l1 2 1-2h4l4 4-3 4-2-1v11H8V10l-2 1-3-4z"/></svg>장비</button>
    <button class="tab" role="tab" id="tab-rec" data-tab="rec" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 3h12l2 2v16H5zm3 4v2h8V7zm0 4v2h8v-2zm0 4v2h5v-2z"/></svg>정보</button>
  </nav>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
    <div class="mbtns" id="mBtns"></div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ================= 기본 설정 ================= */
const T = 16, COLS = 15, ROWS = 10, W = COLS * T, H = ROWS * T, TOPR = 2;

const SAVE_KEY = 'samhan-hero-v1';

  speed:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13 2h4l-4 8h5L9 22l2-9H6l3-11z"/></svg>',
  spin:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 3h6v2h2v2h-2v2h-2V7H9v2H7v6h2v2h6v-2h2v-2h4v2h-2v2h-2v2h-2v2H9v-2H7v-2H5v-2H3V9h2V7h2V5h2zm10 2h2v6h-6V9h2V7h2z"/></svg>',

};

const GRADES = [
  {name:'일반', color:'#b9bfc6'},
  {name:'고급', color:'#5fd07c'},
  {name:'희귀', color:'#4aa8ff'},
  {name:'영웅', color:'#c27bff'},
  {name:'전설', color:'#ffb347'},
];
const GRADE_P = [0.64, 0.26, 0.085, 0.013, 0.002];
const TIER_P = [0.55, 0.28, 0.13, 0.04];
const ROMAN = ['I', 'II', 'III', 'IV'];

/* ================= 직업 ================= */
const CLASSES = {
  musa:{name:'무사', desc:'튼튼한 몸으로 앞에 서서 베어 넘겨요', tags:'체력 높음 · 근접', hpMul:1.3, atkMul:0.95, spdMul:1, critAdd:0, regenAdd:0, range:1, skillMul:1,
    weapon:'검', armor:'갑옷', wtype:'sword', base:'#8a5a3a', pants:'#4a3a2e', belt:'#d8b34a', fx:'#ffffff', boltFx:'flash', nukeFx:'slashes', proj:null,
    skills:['회오리 베기', '일섬', '투혼', '천지 가르기']},
  jagaek:{name:'자객', desc:'빠른 손놀림으로 급소를 노려요', tags:'공격 속도·치명타 · 근접', hpMul:1, atkMul:1, spdMul:1.4, critAdd:0.1, regenAdd:0, range:1, skillMul:1,
    weapon:'단검', armor:'야행복', wtype:'dagger', base:'#3a3450', pants:'#22202c', belt:'#8a2b2b', fx:'#e0607a', boltFx:'cross', nukeFx:'rain', proj:null,
    skills:['그림자 베기', '급소 찌르기', '바람 걸음', '비도 난무']},
  sulsa:{name:'술사', desc:'멀리서 불덩이와 벼락을 불러요', tags:'공격력·기술 피해 · 원거리', hpMul:0.8, atkMul:1.2, spdMul:0.9, critAdd:0, regenAdd:0, range:4, skillMul:1.3,

  doin:{name:'도인', desc:'부적으로 싸우고 스스로를 치유해요', tags:'회복 · 원거리', hpMul:1.15, atkMul:1.02, spdMul:1, critAdd:0, regenAdd:0.02, range:3, skillMul:1,
    weapon:'부채', armor:'도포', wtype:'fan', base:'#e6e0cc', pants:'#bdb59c', belt:'#b8382f', fx:'#f3d36b', boltFx:'pillar', nukeFx:'pillars', proj:'charm',
    skills:['부적 폭발', '천벌', '회복의 기운', '하늘의 심판']},
};
const CLASS_ORDER = ['musa', 'jagaek', 'sulsa', 'doin'];
const W_PRE = ['나무', '무쇠', '청동', '백은', '신령'];
const A_PRE = ['삼베', '무명', '비단', '금실', '신령'];
const cls = () => CLASSES[S.cls] || CLASSES.musa;
const GEAR = {
  weapon:{label:'무기', stat:'공격력', icon:'sword'},
  armor:{label:'방어구', stat:'체력', icon:'armor'},
};
const gearName = (slot, i) => (slot === 'weapon' ? W_PRE : A_PRE)[Math.floor(i / 4)] + ' ' + (slot === 'weapon' ? cls().weapon : cls().armor) + ' ' + ROMAN[i % 4];
const gearEquipPct = i => Math.round(10 * Math.pow(1.35, i));
const gearOwnPct = i => Math.max(1, Math.round(gearEquipPct(i) / 5));

const STAT_DEFS = {
  atk:    {name:'공격력',     icon:'sword', max:Infinity, cost:l => 8 * Math.pow(1.12, l)},
  hp:     {name:'체력',       icon:'heart', max:Infinity, cost:l => 6 * Math.pow(1.12, l)},
  crit:   {name:'치명타 확률', icon:'crit',  max:140,      cost:l => 60 * Math.pow(1.17, l)},
  critDmg:{name:'치명타 피해', icon:'burst', max:Infinity, cost:l => 80 * Math.pow(1.14, l)},

const STAT_ORDER = ['atk', 'hp', 'crit', 'critDmg', 'aspd', 'regen'];

const SKILLS = [
  {key:'spin',   unlock:5,  cd:6,  base:150,  growth:1.9, max:30},

function spinPct(l){ return 200 + 20 * (l - 1); }
function boltPct(l){ return 500 + 50 * (l - 1); }
function meteorPct(l){ return 800 + 80 * (l - 1); }
function roarSpd(l){ return 40 + 2 * (l - 1); }
function roarAtk(l){ return 20 + 2 * (l - 1); }
const skillName = i => cls().skills[i];
function skillDesc(i, l){
  const sm = cls().skillMul;
  if (i === 0) return `${cls().range > 1 ? '대상 주변' : '내 주변'} 적 모두에게 공격력의 ${Math.round(spinPct(l) * sm)}% 피해`;

  if (i === 2) return `8초 동안 공격 속도 +${roarSpd(l)}%, 공격력 +${roarAtk(l)}%` + (S.cls === 'doin' ? ', 체력 30% 회복' : '');
  return `보이는 적 모두에게 공격력의 ${Math.round(meteorPct(l) * sm)}% 피해`;

/* ================= 지역·몬스터 ================= */
const REGIONS = [
  {name:'마을 어귀', theme:'village', mobs:[['frog', '#5fbf4a', '청개구리'], ['boar', '#7a4a2a', '멧돼지']], bossIdx:1, boss:'멧돼지 대왕'},
  {name:'대나무 숲', theme:'bamboo', mobs:[['raccoon', '#8a7a66', '너구리'], ['fox', '#e07a2f', '여우']], bossIdx:1, boss:'구미호', bossColor:'#f3eee6'},
  {name:'바위 고개', theme:'rock', mobs:[['totem', '#a89a88', '돌장승'], ['bat', '#5a4a6a', '동굴 박쥐']], bossIdx:0, boss:'장승 대장군'},
  {name:'안개 늪', theme:'swamp', mobs:[['ghost', '#e6f0f0', '물귀신'], ['frog', '#8a5ab0', '독두꺼비']], bossIdx:0, boss:'늪의 원귀'},
  {name:'도깨비 굴', theme:'cave', mobs:[['dokkaebi', '#d8433a', '도깨비'], ['wisp', '#5ab8ff', '도깨비불']], bossIdx:0, boss:'도깨비 대장', bossColor:'#3a6ad8'},
  {name:'백두 설원', theme:'snow', mobs:[['wolf', '#a8bccd', '눈늑대'], ['bulgasari', '#6f7a86', '불가사리']], bossIdx:1, boss:'불가사리 왕'},

/* ================= 숫자·글자 ================= */
const UNITS = ['', '만', '억', '조', '경', '해', '자', '양', '구', '간', '정', '재', '극'];
function fmt(n){
  if (!isFinite(n)) return '∞';
  n = Math.floor(Math.max(0, n));
  if (n < 10000) return n.toLocaleString('ko-KR');
  const u = Math.floor(Math.log10(n) / 4);
  if (u >= UNITS.length) return n.toExponential(2);
  const v = n / Math.pow(10000, u);
  let s = v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v).toLocaleString('ko-KR');
  if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s + UNITS[u];
}
function fmtTime(sec){
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  if (h) return `${h}시간 ${m}분`;
  if (m) return `${m}분 ${s}초`;
  return `${s}초`;
}
function josa(word, a, b){
  const c = word.charCodeAt(word.length - 1);
  if (c < 0xac00 || c > 0xd7a3) return b;
  return (c - 0xac00) % 28 ? a : b;
}

function defaultState(){
  return {
    v:1, cls:'musa', chosen:false, gold:0, gems:500, level:1, exp:0, stage:1, maxStage:1, kills:0, autoBoss:true, deathsHere:0,
    up:{atk:0, hp:0, crit:0, critDmg:0, aspd:0, regen:0},
    skills:{spin:0, bolt:0, roar:0, meteor:0},
    gear:{weapon:{count:Array(20).fill(0), seen:Array(20).fill(false)}, armor:{count:Array(20).fill(0), seen:Array(20).fill(false)}},
    equip:{weapon:-1, armor:-1},
    rec:{kills:0, bosses:0, summons:0, play:0},
    speed:1, buyMode:1, lastSave:0,
  };
}
function mergeState(d){
  const out = Object.assign(defaultState(), d);
  const base = defaultState();
  out.up = Object.assign(base.up, d.up || {});
  out.skills = Object.assign(base.skills, d.skills || {});
  out.rec = Object.assign(base.rec, d.rec || {});
  out.equip = Object.assign(base.equip, d.equip || {});
  for (const k of ['weapon', 'armor']){
    const src = (d.gear && d.gear[k]) || {};
    base.gear[k].count = (src.count || []).concat(Array(20).fill(0)).slice(0, 20).map(x => Math.max(0, +x || 0));
    base.gear[k].seen = (src.seen || []).concat(Array(20).fill(false)).slice(0, 20).map(Boolean);
  }
  out.gear = base.gear;
  if (!CLASSES[out.cls]) out.cls = 'musa';
  for (const k of ['gold', 'gems', 'exp']) if (!isFinite(out[k]) || out[k] < 0) out[k] = 0;
  out.level = Math.max(1, Math.floor(out.level) || 1);
  out.stage = Math.max(1, Math.floor(out.stage) || 1);
  out.maxStage = Math.max(out.stage, Math.floor(out.maxStage) || 1);
  if (out.speed !== 2) out.speed = 1;
  if (![1, 10, 'max'].includes(out.buyMode)) out.buyMode = 1;
  return out;
}

const hero = {tx:7, ty:6, fx:7, fy:6, mt:0, moving:false, stepDur:STEP_HERO, dir:'down', x:0, y:0, hp:100, dead:false, deadT:0, atkT:0, swing:0, hurt:0,

/* ================= 능력치 ================= */
function ownedPct(slot){
  let p = 0; const seen = S.gear[slot].seen;
  for (let i = 0; i < 20; i++) if (seen[i]) p += gearOwnPct(i);
  return p;
}
function gearPct(slot){ const eq = S.equip[slot]; return ownedPct(slot) + (eq >= 0 ? gearEquipPct(eq) : 0); }
function computeStats(up = S.up){
  const C = cls(), lvMul = Math.pow(1.03, S.level - 1);
  return {
    atk: 10 * Math.pow(1.09, up.atk) * lvMul * (1 + gearPct('weapon') / 100) * C.atkMul,
    maxHp: 100 * Math.pow(1.09, up.hp) * lvMul * (1 + gearPct('armor') / 100) * C.hpMul,
    regen: 0.01 + 0.001 * up.regen + C.regenAdd,
    crit: Math.min(0.85, 0.05 + 0.005 * up.crit + C.critAdd),
    critDmg: 1.5 + 0.05 * up.critDmg,
    aspd: (1 + 0.02 * up.aspd) * C.spdMul,
  };
}
const power = st => st.atk * st.aspd * (1 + st.crit * (st.critDmg - 1)) * 10 + st.maxHp;
function refreshStats(){
  const old = ST;
  ST = computeStats();
  if (old && old.maxHp > 0) hero.hp = Math.min(ST.maxHp, hero.hp / old.maxHp * ST.maxHp);
  heroSpriteCache.clear();
}
function statValue(k, st){
  switch (k){
    case 'atk': return st.atk < 100 ? st.atk.toFixed(1) : fmt(st.atk);
    case 'hp': return st.maxHp < 1000 ? st.maxHp.toFixed(1) : fmt(st.maxHp);
    case 'crit': return (st.crit * 100).toFixed(1) + '%';
    case 'critDmg': return Math.round(st.critDmg * 100) + '%';
    case 'aspd': return st.aspd.toFixed(2) + '회/초';
    case 'regen': return (st.regen * 100).toFixed(1) + '%/초';
  }
}
const atkBuff = () => hero.buffT > 0 ? 1 + roarAtk(hero.buffLv) / 100 : 1;
const spdBuff = () => hero.buffT > 0 ? 1 + roarSpd(hero.buffLv) / 100 : 1;

/* ================= 강화·기술·장비 ================= */
function buyInfo(k){
  const d = STAT_DEFS[k], lv = S.up[k], room = d.max - lv;
  if (room <= 0) return {n:0, cost:0, afford:false};
  let n = 0, cost = 0;
  if (S.buyMode === 'max'){
    while (n < room && n < 1000){ const c = d.cost(lv + n); if (cost + c > S.gold) break; cost += c; n++; }
    if (n === 0) return {n:1, cost:d.cost(lv), afford:false};
    return {n, cost, afford:true};
  }
  const want = Math.min(S.buyMode, room);
  for (let i = 0; i < want; i++) cost += d.cost(lv + i);
  return {n:want, cost, afford:cost <= S.gold};
}
function buyStat(k){
  const b = buyInfo(k);
  if (!b.n || !b.afford) return false;
  S.gold -= b.cost; S.up[k] += b.n;
  refreshStats(); refreshPanel();
  return true;
}
const skillCost = (sk, lv) => sk.base * Math.pow(sk.growth, lv - 1);
function upgradeSkill(key){
  const sk = SKILLS.find(s => s.key === key), lv = S.skills[key];
  if (!lv || lv >= sk.max) return false;
  const c = skillCost(sk, lv);
  if (S.gold < c) return false;
  S.gold -= c; S.skills[key]++;
  refreshPanel();
  return true;
}
function rollItem(){
  let r = Math.random(), g = 0;
  for (; g < 4; g++){ if (r < GRADE_P[g]) break; r -= GRADE_P[g]; }
  let r2 = Math.random(), t = 0;
  for (; t < 3; t++){ if (r2 < TIER_P[t]) break; r2 -= TIER_P[t]; }
  return g * 4 + t;
}
const summonCost = n => n === 10 ? 450 : 50 * n;
function summon(slot, n){
  const cost = summonCost(n);
  if (S.gems < cost) return null;
  S.gems -= cost; S.rec.summons += n;
  const G = S.gear[slot], res = [];
  for (let i = 0; i < n; i++){
    const it = rollItem();
    res.push({it, isNew:!G.seen[it]});
    G.count[it]++; G.seen[it] = true;
  }
  if (S.equip[slot] < 0) equipBest(slot);
  refreshStats(); saveLocal();
  return res;
}
function mergeableSets(slot, i){
  if (i >= 19) return 0;
  const keep = S.equip[slot] === i ? 1 : 0;
  return Math.max(0, Math.floor((S.gear[slot].count[i] - keep) / 4));
}
function mergeOne(slot, i){
  const sets = mergeableSets(slot, i);
  if (!sets) return 0;
  const G = S.gear[slot];
  G.count[i] -= sets * 4; G.count[i + 1] += sets; G.seen[i + 1] = true;
  return sets;
}
function mergeAll(slot){
  let total = 0;
  for (let i = 0; i < 19; i++) total += mergeOne(slot, i);
  refreshStats();
  return total;
}
function equipBest(slot){
  for (let i = 19; i >= 0; i--) if (S.gear[slot].count[i] > 0){ S.equip[slot] = i; break; }
  refreshStats();
}
function gainExp(x){
  S.exp += x;
  let up = 0;
  while (S.exp >= expNeed(S.level)){ S.exp -= expNeed(S.level); S.level++; up++; }
  if (!up) return;
  refreshStats();
  hero.hp = ST.maxHp;
  fx.push({type:'level', t:0, dur:0.8});
  addText('LEVEL UP', hero.x, hero.y - 34, '#ffe27a', 13);
  addLog(`레벨 ${S.level}이 되었습니다!`, 'good');
  for (let i = 0; i < SKILLS.length; i++){
    const sk = SKILLS[i];
    if (!S.skills[sk.key] && S.level >= sk.unlock){
      S.skills[sk.key] = 1; skillCd[sk.key] = 0.5;
      addLog(`새 기술을 익혔습니다: ${skillName(i)}`, 'gain');
      if (currentTab === 'skill') buildTab('skill', true);
    }
  }
}

/* ================= 칸 이동 ================= */
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const dirOf = (dx, dy) => Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
const inMap = (x, y) => x >= 0 && x < COLS && y >= TOPR && y < ROWS;
function occupied(x, y, self){
  if (self !== hero && !hero.dead && ((hero.tx === x && hero.ty === y) || (hero.moving && hero.fx === x && hero.fy === y))) return true;
  for (const m of mobs){
    if (m === self || m.dead) continue;
    if ((m.tx === x && m.ty === y) || (m.moving && m.fx === x && m.fy === y)) return true;
  }
  return false;
}
const tileFree = (x, y, self) => inMap(x, y) && !occupied(x, y, self);
function startMove(e, nx, ny, dur){
  e.fx = e.tx; e.fy = e.ty; e.tx = nx; e.ty = ny; e.mt = 0; e.moving = true; e.stepDur = dur;
  e.dir = dirOf(nx - e.fx, ny - e.fy);
}
function updateMove(e, dt){
  if (!e.moving) return;
  e.mt += dt / e.stepDur;
  if (e.mt >= 1){ e.mt = 0; e.moving = false; e.fx = e.tx; e.fy = e.ty; }
}
function placeOf(e){
  const k = e.moving ? e.mt : 1;
  const tx = e.moving ? e.fx + (e.tx - e.fx) * k : e.tx, ty = e.moving ? e.fy + (e.ty - e.fy) * k : e.ty;
  e.x = tx * T + T / 2; e.y = ty * T + T - 2;
}
function stepToward(e, gx, gy, dur){
  const dx = gx - e.tx, dy = gy - e.ty, opts = [];
  if (Math.abs(dx) >= Math.abs(dy)){ if (dx) opts.push([Math.sign(dx), 0]); if (dy) opts.push([0, Math.sign(dy)]); }
  else { if (dy) opts.push([0, Math.sign(dy)]); if (dx) opts.push([Math.sign(dx), 0]); }
  for (const [ox, oy] of opts){ if (tileFree(e.tx + ox, e.ty + oy, e)){ startMove(e, e.tx + ox, e.ty + oy, dur); return true; } }
  if (Math.random() < 0.35){
    const side = DIRS.filter(([ox, oy]) => !opts.some(o => o[0] === ox && o[1] === oy) && tileFree(e.tx + ox, e.ty + oy, e));
    if (side.length){ const [ox, oy] = side[(Math.random() * side.length) | 0]; startMove(e, e.tx + ox, e.ty + oy, dur); return true; }
  }
  return false;
}
function randomStep(e, dur){
  const opts = DIRS.filter(([ox, oy]) => tileFree(e.tx + ox, e.ty + oy, e));
  if (!opts.length) return;
  const [ox, oy] = opts[(Math.random() * opts.length) | 0];
  startMove(e, e.tx + ox, e.ty + oy, dur);
}

/* ================= 전투 ================= */
function makeMob(boss, tx, ty){
  const R = REGIONS[regionIndex(S.stage)], s = S.stage;
  const v = boss ? R.bossIdx : (Math.random() < 0.6 ? 0 : 1);
  const [type, color, name] = R.mobs[v];
  const m = {
    type, color:boss && R.bossColor ? R.bossColor : color, name:boss ? R.boss : name, boss,
    tx, ty, fx:tx, fy:ty, mt:0, moving:false, stepDur:boss ? 0.45 : 0.36 + Math.random() * 0.1, dir:'left', x:0, y:0,
    hp:mobHp(s) * (boss ? 10 : 1), atk:mobAtk(s) * (boss ? 3 : 1),
    gold:mobGold(s) * (boss ? 10 : 1) * (0.9 + Math.random() * 0.2), exp:mobExp(s) * (boss ? 10 : 1),
    atkT:0.6, flash:0, lunge:0, dead:false, deathT:0, spawnT:0.35, thinkT:Math.random(), anim:Math.random() * 2, aggro:false,
  };
  m.maxHp = m.hp;
  placeOf(m);
  return m;
}
function spawnTile(minDist){
  for (let k = 0; k < 60; k++){
    const x = (Math.random() * COLS) | 0, y = TOPR + ((Math.random() * (ROWS - TOPR)) | 0);
    if (Math.abs(x - hero.tx) + Math.abs(y - hero.ty) >= minDist && tileFree(x, y, null)) return [x, y];
  }
  return null;
}
const aliveMobs = () => mobs.filter(m => !m.dead);
const maxField = () => 3 + (S.stage > 20 ? 1 : 0);
function mobHeight(m){ const sp = mobSprite(m.type, m.color, 0, m.boss); return sp.height * (m.boss ? 2 : 1) + (FLOAT[m.type] || 0) * (m.boss ? 2 : 1); }

let logEls = [];
function addLog(msg, kind){
  const box = document.getElementById('log');
  const el = document.createElement('div');
  el.textContent = msg; if (kind) el.className = kind;
  box.appendChild(el); logEls.push(el);
  while (logEls.length > 2){ const o = logEls.shift(); o.remove(); }
  setTimeout(() => el.classList.add('old'), 6000);
  setTimeout(() => { el.remove(); logEls = logEls.filter(e => e !== el); }, 6700);
}
function addText(text, x, y, color, size, bold){
  if (texts.length > 40) texts.shift();
  texts.push({text, x, y, color, size, bold, t:0, dur:0.9});
}
function hit(m, base, kind){
  if (m.dead) return;
  const crit = Math.random() < ST.crit;
  const dmg = base * (crit ? ST.critDmg : 1) * (0.92 + Math.random() * 0.16);
  m.hp -= dmg; m.flash = 0.1; m.aggro = true;
  addText(fmt(dmg), m.x + (Math.random() * 10 - 5), m.y - mobHeight(m) - 2,
    crit ? '#ffb347' : kind === 'skill' ? '#9fe7ff' : '#ffffff', crit ? 15 : 12, crit);
  fx.push({type:'hit', t:0, dur:0.18, x:m.x, y:m.y - mobHeight(m) * 0.5});
  if (m.hp <= 0) killMob(m);
}
function killMob(m){
  m.dead = true; m.deathT = 0.4; m.hp = 0;
  S.gold += m.gold; S.rec.kills++;
  const n = m.boss ? 12 : 3;
  for (let i = 0; i < n; i++) parts.push({type:'coin', x:m.x, y:m.y - 6, vx:(Math.random() - 0.5) * 70, vy:-(50 + Math.random() * 60), gy:m.y, t:0, dur:0.9 + Math.random() * 0.3});
  if (hero.target === m) hero.target = null;
  if (m.boss){ gainExp(m.exp); bossWin(); return; }
  addLog(`${m.name}${josa(m.name, '을', '를')} 잡았습니다. (경험치 +${fmt(m.exp)})`);
  gainExp(m.exp);
  S.kills = Math.min(KILLS_PER_STAGE, S.kills + 1);
  if (Math.random() < 0.015){ S.gems += 1; addLog('보석 1개를 주웠습니다.', 'gain'); }
}
function damageHero(d){
  const dmg = d * (0.9 + Math.random() * 0.2);
  hero.hp -= dmg; hero.hurt = 0.12;
  addText('-' + fmt(dmg), hero.x + Math.random() * 8 - 4, hero.y - 30, '#ff8a7a', 11);
  if (hero.hp <= 0){ hero.hp = 0; heroDie(); }
}
function heroDie(){
  hero.dead = true; hero.deadT = 2.2; hero.buffT = 0; hero.moving = false; hero.target = null;
  const wasBoss = bossActive;
  if (bossActive) bossFail('용사가 쓰러짐');
  for (const m of mobs) if (!m.dead){ m.dead = true; m.deathT = 0.4; m.fled = true; }
  addLog('용사가 쓰러졌습니다…', 'warn');
  if (!wasBoss){
    S.deathsHere++;
    if (S.deathsHere >= 2 && S.stage > 1){
      S.stage--; S.kills = KILLS_PER_STAGE; S.autoBoss = false; S.deathsHere = 0;
      addLog('적이 너무 강합니다. 한 단계 물러나 수련합니다.', 'warn');
    }
  }
}
function respawn(){
  hero.dead = false; hero.hp = ST.maxHp; hero.atkT = 0.3; spawnT = 0.8;
  hero.tx = hero.fx = 7; hero.ty = hero.fy = 6; hero.moving = false; hero.dir = 'down';
  placeOf(hero);

}
function startBoss(){
  for (const m of mobs) if (!m.dead){ m.dead = true; m.deathT = 0.4; m.fled = true; fx.push({type:'poof', t:0, dur:0.4, x:m.x, y:m.y - 6}); }
  const spot = spawnTile(6) || spawnTile(3) || [13, 5];
  const b = makeMob(true, spot[0], spot[1]);
  mobs.push(b); bossRef = b; bossActive = true; bossTime = BOSS_TIME;
  fx.push({type:'poof', t:0, dur:0.5, x:b.x, y:b.y - 10, big:true});
  addLog(`${b.name}${josa(b.name, '이', '가')} 나타났습니다! 30초 안에 쓰러뜨리세요.`, 'warn');

function bossFail(reason){
  bossActive = false;
  if (bossRef && !bossRef.dead){ bossRef.dead = true; bossRef.deathT = 0.4; bossRef.fled = true; }
  bossRef = null; S.autoBoss = false;
  addLog(`보스 도전 실패 (${reason}). 수련 후 [보스 도전]을 누르세요.`, 'warn');

function bossWin(){
  const gems = 10 + Math.floor(S.stage / 2);

  S.gems += gems; S.rec.bosses++;
  S.stage++; S.maxStage = Math.max(S.maxStage, S.stage); S.kills = 0; S.deathsHere = 0;

  addLog(`보스를 물리쳤습니다! 보석 +${gems}`, 'gain');
  if (now !== prev){ addLog(`새 지역에 들어섰습니다: ${REGIONS[now].name}`, 'good'); mapCache.delete(now); }
}
function attack(tg){
  const C = cls();
  hero.swing = 0.2; hero.atkT = 1;
  if (!C.proj){
    fx.push({type:'slash', t:0, dur:0.16, x:hero.x, y:hero.y - 8, dir:hero.dir, color:C.fx});
    hit(tg, ST.atk * atkBuff(), 'basic');
  } else {
    projs.push({kind:C.proj, x:hero.x + (hero.dir === 'left' ? -6 : hero.dir === 'right' ? 6 : 0), y:hero.y - 12, tg, trail:[]});
  }

function tryCast(i, lv){
  const C = cls();
  const alive = mobs.filter(m => !m.dead && m.spawnT <= 0);
  if (!alive.length || !hero.engaged) return false;
  const mul = C.skillMul * atkBuff();
  const tg = hero.target && !hero.target.dead ? hero.target : alive[0];
  if (i === 0){
    const cx = C.range > 1 ? tg.x : hero.x, cy = C.range > 1 ? tg.y : hero.y;
    const hits = alive.filter(m => Math.hypot(m.x - cx, m.y - cy) <= 34);
    if (!hits.length) return false;
    fx.push({type:'ring', t:0, dur:0.4, x:cx, y:cy - 6, color:C.fx});
    for (const m of hits) hit(m, ST.atk * mul * spinPct(lv) / 100, 'skill');
    return true;
  }
  if (i === 1){
    const t2 = alive.reduce((a, b) => b.hp > a.hp ? b : a);
    fx.push({type:C.boltFx, t:0, dur:0.4, x:t2.x, y:t2.y - mobHeight(t2) * 0.5, seed:Math.random() * 1000});
    shake = 0.15;
    hit(t2, ST.atk * mul * boltPct(lv) / 100, 'skill');
    return true;
  }
  if (i === 2){
    hero.buffT = 8; hero.buffLv = lv;
    fx.push({type:'aura', t:0, dur:0.9, color:C.fx});
    if (S.cls === 'doin'){
      const h = ST.maxHp * 0.3;
      hero.hp = Math.min(ST.maxHp, hero.hp + h);
      addText('+' + fmt(h), hero.x, hero.y - 34, '#8ff0a0', 12);
      fx.push({type:'heal', t:0, dur:0.9});
    }
    return true;
  }
  fx.push({type:C.nukeFx, t:0, dur:0.8, pts:alive.slice(0, 6).map(m => [m.x, m.y - 6]), seed:Math.random() * 1000});
  shake = 0.3;
  for (const m of alive) hit(m, ST.atk * mul * meteorPct(lv) / 100, 'skill');
  return true;
}
function nearestMob(){
  let best = null, bd = 1e9;
  for (const m of mobs){
    if (m.dead || m.spawnT > 0) continue;
    const d = Math.abs(m.tx - hero.tx) + Math.abs(m.ty - hero.ty) + (m.boss ? -0.5 : 0);
    if (d < bd){ bd = d; best = m; }
  }
  return best;
}

function update(dt){
  gtime += dt; S.rec.play += dt;
  for (const e of fx) e.t += dt;
  fx = fx.filter(e => e.t < e.dur);
  for (const p of parts){
    p.t += dt;
    if (p.type === 'coin'){ p.vy += 300 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.y > p.gy){ p.y = p.gy; p.vy *= -0.35; p.vx *= 0.5; } }
    else { p.x += p.vx * dt; p.y += p.vy * dt; }
  }
  parts = parts.filter(p => p.t < p.dur);
  for (const t of texts){ t.t += dt; t.y -= 18 * dt; }
  texts = texts.filter(t => t.t < t.dur);
  shake = Math.max(0, shake - dt);
  hero.swing = Math.max(0, hero.swing - dt);
  hero.hurt = Math.max(0, hero.hurt - dt);
  if (hero.buffT > 0) hero.buffT -= dt;

  // 보스·소환
  if (bossActive){
    bossTime -= dt;
    if (bossTime <= 0) bossFail('시간 초과');
  } else if (!hero.dead){
    if (S.kills >= KILLS_PER_STAGE && S.autoBoss) startBoss();
    else {
      spawnT -= dt;
      if (spawnT <= 0){
        if (aliveMobs().length < maxField()){
          const spot = spawnTile(4) || spawnTile(2);
          if (spot){ const m = makeMob(false, spot[0], spot[1]); mobs.push(m); fx.push({type:'poof', t:0, dur:0.4, x:m.x, y:m.y - 6}); }
        }
        spawnT = 0.6 + Math.random() * 0.5;
      }
    }
  }

  // 용사
  if (hero.dead){ hero.deadT -= dt; if (hero.deadT <= 0) respawn(); }
  else {
    hero.hp = Math.min(ST.maxHp, hero.hp + ST.maxHp * ST.regen * dt);
    updateMove(hero, dt);
    hero.atkT = Math.max(0, hero.atkT - dt * ST.aspd * spdBuff());
    if (!hero.moving){
      let tg = hero.target;
      if (!tg || tg.dead || tg.spawnT > 0) tg = hero.target = nearestMob();
      if (tg){
        hero.idleT = 0;
        const dx = tg.tx - hero.tx, dy = tg.ty - hero.ty, C = cls();
        const inRange = C.range === 1 ? Math.abs(dx) + Math.abs(dy) === 1 : Math.hypot(dx, dy) <= C.range + 0.01;
        if (inRange){
          hero.engaged = true;
          if (dx || dy) hero.dir = dirOf(dx, dy);
          if (hero.atkT <= 0) attack(tg);
        } else {
          hero.engaged = false;
          if (!stepToward(hero, tg.tx, tg.ty, STEP_HERO)){
            const other = nearestOther(tg);
            if (other) hero.target = other;
          }
        }
      } else {
        hero.engaged = false;
        hero.idleT += dt;
        if (hero.idleT > 1.2){ hero.idleT = 0; randomStep(hero, STEP_HERO * 1.5); }
      }
    }
  }
  placeOf(hero);

  // 몬스터
  for (const m of mobs){
    m.anim += dt;
    if (m.dead){ m.deathT -= dt; continue; }
    if (m.spawnT > 0){ m.spawnT -= dt; placeOf(m); continue; }
    updateMove(m, dt);
    m.flash = Math.max(0, m.flash - dt); m.lunge = Math.max(0, m.lunge - dt);
    if (!m.moving){
      const dx = hero.tx - m.tx, dy = hero.ty - m.ty, man = Math.abs(dx) + Math.abs(dy);
      const aggro = !hero.dead && (m.boss || m.aggro || man <= 5);
      if (aggro && man === 1){
        m.dir = dirOf(dx, dy);
        m.atkT -= dt;
        if (m.atkT <= 0){ m.atkT = m.boss ? 1.5 : 1.3; m.lunge = 0.2; damageHero(m.atk); }
      } else {
        m.thinkT -= dt;
        if (m.thinkT <= 0){
          if (aggro){ m.thinkT = 0.08; stepToward(m, hero.tx, hero.ty, m.stepDur); }
          else { m.thinkT = 1 + Math.random() * 1.6; randomStep(m, m.stepDur * 1.4); }
        }
      }
    }
    placeOf(m);
    if (hero.dead) break;
  }
  mobs = mobs.filter(m => !m.dead || m.deathT > 0);

  // 투사체
  for (const p of projs){
    const tg = p.tg;
    if (!tg || tg.dead){ p.done = true; continue; }
    const tx = tg.x, ty = tg.y - mobHeight(tg) * 0.5;
    const d = Math.hypot(tx - p.x, ty - p.y), sp = 190 * dt;
    p.trail.push([p.x, p.y]); if (p.trail.length > 4) p.trail.shift();
    if (d <= sp + 2){ p.done = true; hit(tg, ST.atk * atkBuff(), 'basic'); }
    else { p.x += (tx - p.x) / d * sp; p.y += (ty - p.y) / d * sp; }
  }
  projs = projs.filter(p => !p.done);

  // 기술
  if (!hero.dead){
    SKILLS.forEach((sk, i) => {
      const lv = S.skills[sk.key];
      if (!lv) return;
      skillCd[sk.key] = Math.max(0, skillCd[sk.key] - dt);
      if (skillCd[sk.key] <= 0 && tryCast(i, lv)) skillCd[sk.key] = sk.cd;
    });
  }
}
function nearestOther(not){
  let best = null, bd = 1e9;
  for (const m of mobs){
    if (m === not || m.dead || m.spawnT > 0) continue;
    const d = Math.abs(m.tx - hero.tx) + Math.abs(m.ty - hero.ty);
    if (d < bd){ bd = d; best = m; }
  }
  return best;
}

/* ================= 도트 그림 ================= */
function mix(a, b, t){
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(((pa >> 16) & 255) * (1 - t) + ((pb >> 16) & 255) * t);
  const g = Math.round(((pa >> 8) & 255) * (1 - t) + ((pb >> 8) & 255) * t);
  const bl = Math.round((pa & 255) * (1 - t) + (pb & 255) * t);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}
const darken = (c, f) => mix(c, '#000000', f);
const SKIN = '#f4c79c', SKIN_D = '#d9a47a', HAIR = '#241c26', EYE = '#1b1420';
let G = null;
const R = (x, y, w, h, c) => { G.fillStyle = c; G.fillRect(x, y, w, h); };

function buildSprite(w, h, draw, outline){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  G = c.getContext('2d'); draw();
  const o = document.createElement('canvas'); o.width = w + 2; o.height = h + 2;
  const og = o.getContext('2d');
  const s = document.createElement('canvas'); s.width = w; s.height = h;
  const sg = s.getContext('2d'); sg.drawImage(c, 0, 0); sg.globalCompositeOperation = 'source-in'; sg.fillStyle = outline || '#1a1218'; sg.fillRect(0, 0, w, h);
  for (const [dx, dy] of [[0, 1], [2, 1], [1, 0], [1, 2]]) og.drawImage(s, dx, dy);
  og.drawImage(c, 1, 1);
  return o;
}
function whiteOf(src){
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const g = c.getContext('2d'); g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
  return c;
}

}

      b.globalAlpha = 1;
      break; }
    case 'aura': {

      break; }
    case 'heal': {
      for (let i = 0; i < 5; i++){ const x = hero.x - 10 + i * 5, y = hero.y - 8 - k * 20 - (i % 2) * 4; P(x, y - 1, 1, 3, '#7fe07f'); P(x - 1, y, 3, 1, '#7fe07f'); }
      break; }
    case 'level': {

    case 'slashes': {

      b.globalAlpha = 1;

    case 'rain': {

        else { const ek = Math.min(1, (k - 0.55 - i * 0.05) / 0.4); b.globalAlpha = Math.max(0, 1 - ek); pdisk(tx, ty, 4 + Math.round(ek * 10), '#ffb347'); pdisk(tx, ty, 2 + Math.round(ek * 5), '#fff2a0'); b.globalAlpha = 1; }
      });

    case 'pillars': {

function drawWeather(Rg){
  const t = Rg.theme;

    b.fillStyle = 'rgba(220,235,230,.13)';
    for (let i = 0; i < 4; i++){ const y = 50 + i * 28, x = ((gtime * (6 + i * 2) + i * 70) % (W + 120)) - 120; b.fillRect(Math.round(x), y, 120, 6); b.fillRect(Math.round(x) + 20, y - 3, 70, 3); }
  } else if (t === 'cave'){
    for (const tx of [40, 120, 200]){
      const fl = Math.floor(gtime * 10 + tx) % 3;
      P(tx - 2, 9 - fl, 5, 4 + fl, '#ff7a2a'); P(tx - 1, 8 - fl, 3, 3, '#ffd27a'); P(tx, 7 - fl, 1, 2, '#fff2c0');
    }
    b.fillStyle = 'rgba(10,4,6,.18)'; b.fillRect(0, 0, W, H);
  } else if (t === 'snow'){
    b.fillStyle = '#ffffff';
    for (let i = 0; i < 40; i++){ const x = ((i * 53.7 - gtime * (8 + i % 5)) % W + W) % W, y = ((i * 31.3 + gtime * (18 + i % 7)) % H); b.fillRect(Math.round(x), Math.round(y), 1, 1); }
  } else if (t === 'bamboo'){
    b.fillStyle = '#a8c060';
    for (let i = 0; i < 6; i++){ const x = ((i * 47 + gtime * 6) % W), y = ((i * 29 + gtime * 12) % (H - 32)) + 32; b.fillRect(Math.round(x + Math.sin(gtime * 2 + i) * 4), Math.round(y), 2, 1); }
  }
}
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function render(){
  const ri = regionIndex(S.stage), Rg = REGIONS[ri];
  b.imageSmoothingEnabled = false;
  b.setTransform(1, 0, 0, 1, 0, 0);
  b.drawImage(getMap(ri), 0, 0);
  for (const p of parts) if (p.type === 'coin' && p.t < p.dur){ const a = p.t > p.dur * 0.7 ? 0.5 : 1; b.globalAlpha = a; P(p.x - 1, p.y - 1, 2, 2, '#e0b03c'); P(p.x - 1, p.y - 1, 1, 1, '#fff2a0'); b.globalAlpha = 1; }
  const ents = mobs.slice();
  ents.push(hero);
  ents.sort((a, b2) => a.y - b2.y);
  for (const e of ents){ if (e === hero) drawEntityHero(); else drawMob(e); }
  for (const p of projs) drawProj(p);
  for (const e of fx) drawFx(e);
  drawWeather(Rg);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  let ox = 0, oy = 0;
  if (shake > 0 && !reduceMotion){ ox = Math.round((Math.random() - 0.5) * 4 * dpr * scale * shake / 0.3); oy = Math.round((Math.random() - 0.5) * 4 * dpr * scale * shake / 0.3); }
  ctx.drawImage(buf, ox, oy, cv.width, cv.height);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawTexts(); drawOverlay();
}
function drawTexts(){
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const t of texts){
    ctx.globalAlpha = 1 - Math.max(0, (t.t - 0.55) / 0.35);
    ctx.font = `700 ${t.size}px Galmuri, monospace`;
    const x = Math.round(t.x * scale), y = Math.round(t.y * scale);
    ctx.lineWidth = 3; ctx.strokeStyle = '#1a1018'; ctx.strokeText(t.text, x, y);
    ctx.fillStyle = t.color; ctx.fillText(t.text, x, y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}
function box(x, y, w, h){ ctx.fillStyle = 'rgba(20,12,8,.78)'; ctx.fillRect(x, y, w, h); ctx.strokeStyle = '#c9b490'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1); }
function drawOverlay(){
  const cw = cv.width / dpr;
  ctx.textBaseline = 'middle';
  ctx.font = '700 12px Galmuri, monospace';
  const label = stageLabel(S.stage);
  const tw = Math.ceil(ctx.measureText(label).width);
  box(6, 6, tw + 14, 20);
  ctx.fillStyle = '#f3e6c8'; ctx.fillText(label, 13, 16.5);
  if (bossActive && bossRef){
    const bx = tw + 26, bw = cw - bx - 6;
    box(bx, 6, bw, 20);
    const k = Math.max(0, bossRef.hp / bossRef.maxHp);
    ctx.fillStyle = '#8a1f1a'; ctx.fillRect(bx + 3, 9, bw - 6, 14);
    ctx.fillStyle = '#e04a3a'; ctx.fillRect(bx + 3, 9, Math.round((bw - 6) * k), 14);
    ctx.fillStyle = '#fff4e0'; ctx.font = '700 11px Galmuri, monospace';
    ctx.fillText(bossRef.name, bx + 8, 16.5);
    ctx.textAlign = 'right'; ctx.fillText(`${Math.ceil(bossTime)}초`, bx + bw - 8, 16.5); ctx.textAlign = 'left';
    ctx.fillStyle = bossTime < 8 ? '#ff6b5a' : '#e0b03c'; ctx.fillRect(bx + 3, 26, Math.round((bw - 6) * Math.max(0, bossTime / BOSS_TIME)), 2);
  } else {
    const n = KILLS_PER_STAGE, pw = 8, gap = 2, total = n * pw + (n - 1) * gap;
    ctx.font = '11px Galmuri, monospace';
    const lab = S.kills >= n && !S.autoBoss ? '보스 대기' : '보스까지';
    const lw = Math.ceil(ctx.measureText(lab).width);
    const x0 = cw - 6 - total - 8;
    box(x0 - lw - 10, 6, total + lw + 20, 20);
    ctx.fillStyle = '#f3e6c8'; ctx.fillText(lab, x0 - lw - 3, 16.5);
    for (let i = 0; i < n; i++){ ctx.fillStyle = i < S.kills ? '#e0b03c' : '#4e3e30'; ctx.fillRect(x0 + i * (pw + gap) + 2, 12, pw, 9); }
  }
}

const $ = s => document.querySelector(s);

const setText = (el, s) => { if (el && el.textContent !== s) el.textContent = s; };
const setHTML = (el, s) => { if (el && el._h !== s){ el._h = s; el.innerHTML = s; } };
let modalOpen = false;
function showModal(title, html, buttons, onBuilt){
  $('#mTitle').textContent = title;
  $('#mBody').innerHTML = html;
  const bx = $('#mBtns'); bx.innerHTML = '';
  buttons.forEach((bt, i) => {
    const el = document.createElement('button');
    el.className = 'btn' + (bt.primary ? ' primary' : '') + (bt.danger ? ' danger' : '');
    el.id = 'modal-btn-' + i; el.textContent = bt.label; el.disabled = !!bt.disabled;
    el.addEventListener('click', () => { if (bt.keep && bt.keep()) return; hideModal(); if (bt.fn) bt.fn(); });
    bx.appendChild(el);
  });
  $('#modal').hidden = false; modalOpen = true;
  if (onBuilt) onBuilt();
  const p = bx.querySelector('.primary:not(:disabled)') || bx.querySelector('button:not(:disabled)');
  if (p) p.focus({preventScroll:true});
}
function hideModal(){ $('#modal').hidden = true; modalOpen = false; }
function holdButton(btn, fn){
  let t1 = null, t2 = null;
  const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };
  btn.addEventListener('pointerdown', e => {
    if (btn.disabled || e.button > 0) return;
    if (!fn()) return;
    t1 = setTimeout(() => { t2 = setInterval(() => { if (!fn()) stop(); }, 85); }, 380);
  });
  ['pointerup', 'pointerleave', 'pointercancel', 'blur'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('click', e => { if (e.detail === 0) fn(); });
  btn.addEventListener('contextmenu', e => e.preventDefault());
}

    </div>
    <p class="odds">전설 0.2% · 영웅 1.3% · 희귀 8.5% · 고급 26% · 일반 64%</p>
    <div class="effects">
      <div>장착 효과<b>${def.stat} +${fmt(eqP)}%</b></div>
      <div>보유 효과 합계<b>${def.stat} +${fmt(ownedPct(slot))}%</b></div>
    </div>
    <div class="grid">${grid}</div>
    ${detail}
    <div class="bulk"><button class="btn" id="mergeAll">일괄 합성</button><button class="btn" id="equipBest">가장 좋은 것 장착</button></div>`;
  $('#seg-weapon').addEventListener('click', () => { gearSlot = 'weapon'; gearSel = -1; buildTab('gear', true); });
  $('#seg-armor').addEventListener('click', () => { gearSlot = 'armor'; gearSel = -1; buildTab('gear', true); });
  $('#sum1').addEventListener('click', () => doSummon(slot, 1));
  $('#sum10').addEventListener('click', () => doSummon(slot, 10));
  panel.querySelectorAll('.cell').forEach(bt => bt.addEventListener('click', () => { const i = +bt.dataset.i; gearSel = gearSel === i ? -1 : i; buildTab('gear', true); }));
  if ($('#eqBtn')) $('#eqBtn').addEventListener('click', () => { S.equip[slot] = gearSel; refreshStats(); buildTab('gear', true); addLog(`${gearName(slot, gearSel)}${josa(gearName(slot, gearSel), '을', '를')} 장착했습니다.`); });
  if ($('#mgBtn')) $('#mgBtn').addEventListener('click', () => { const n = mergeOne(slot, gearSel); refreshStats(); if (n) addLog(`${gearName(slot, gearSel + 1)} ${n}개를 만들었습니다.`, 'gain'); buildTab('gear', true); });
  $('#mergeAll').addEventListener('click', () => { const n = mergeAll(slot); addLog(n ? `${n}번 합성했습니다.` : '합성할 장비가 없습니다. 같은 장비 4개가 필요해요.', n ? 'gain' : ''); buildTab('gear', true); });
  $('#equipBest').addEventListener('click', () => { equipBest(slot); addLog(S.equip[slot] >= 0 ? `${gearName(slot, S.equip[slot])}${josa(gearName(slot, S.equip[slot]), '을', '를')} 장착했습니다.` : '먼저 장비를 소환해 주세요.'); buildTab('gear', true); });
  return () => { $('#sum1').disabled = S.gems < 50; $('#sum10').disabled = S.gems < 450; };
}
function doSummon(slot, n){
  const res = summon(slot, n);
  if (!res){ addLog('보석이 부족합니다.', 'warn'); return; }
  if (currentTab === 'gear') buildTab('gear', true);
  const best = res.reduce((a, r) => Math.max(a, r.it), 0);
  const html = `<div class="res-grid">${res.map((r, i) => {
      const g = GRADES[Math.floor(r.it / 4)];
      return `<div class="res${r.it >= 12 ? ' legend' : ''}" style="--g:${g.color};--i:${i}" title="${gearName(slot, r.it)}">${SVG[GEAR[slot].icon]}<span class="tier">${ROMAN[r.it % 4]}</span>${r.isNew ? '<span class="new">NEW</span>' : ''}</div>`;
    }).join('')}</div>
    <p class="small" style="margin-top:10px">가장 좋은 장비: <b>${gearName(slot, best)}</b> (${GRADES[Math.floor(best / 4)].name})</p>`;
  const cost = summonCost(n);
  showModal(`${GEAR[slot].label} 소환 결과`, html, [
    {label:`${n}회 더 (보석 ${cost})`, disabled:S.gems < cost, fn:() => doSummon(slot, n)},
    {label:'확인', primary:true},
  ]);
}

/* --- 정보 --- */
function buildRec(){
  const items = [['r-max', '최고 단계'], ['r-kills', '잡은 몬스터'], ['r-boss', '물리친 보스'], ['r-sum', '장비 소환'], ['r-atk', '공격력'], ['r-hp', '체력'], ['r-dps', '초당 피해 (예상)'], ['r-play', '수련 시간']];
  panel.innerHTML = `
    <div class="ph"><h2>용사 정보</h2></div>
    <dl class="rec">${items.map(([id, l]) => `<div><dt>${l}</dt><dd id="${id}"></dd></div>`).join('')}</dl>
    <p class="save-note" id="r-save"></p>
    <div class="ph"><h2>하는 법</h2></div>
    <ul class="howto">
      <li>용사는 알아서 사냥해요. 몬스터 10마리를 잡으면 보스가 나타나요.</li>
      <li>보스는 30초 안에 쓰러뜨려야 다음 단계로 가요. 실패하면 엽전을 모아 수련한 뒤 [보스 도전]을 눌러요.</li>
      <li>엽전으로 능력과 기술을 올리고, 보석으로 장비를 소환해요. 같은 장비 4개는 한 단계 위 장비로 합성돼요.</li>
      <li>지역은 10단계마다 바뀌어요: 마을 어귀, 대나무 숲, 바위 고개, 안개 늪, 도깨비 굴, 백두 설원.</li>
      <li>창을 닫아도 최대 12시간까지 오프라인 보상이 쌓여요.</li>
    </ul>
    <div class="recbtns"><button class="btn" id="clsBtn">직업 바꾸기</button><button class="btn danger" id="resetBtn">처음부터 다시</button></div>`;
  $('#clsBtn').addEventListener('click', () => chooseClass(true));
  $('#resetBtn').addEventListener('click', () => showModal('처음부터 다시 할까요?', '<p>레벨, 엽전, 보석, 장비가 모두 사라지고 마을 어귀 1-1부터 다시 시작해요. 되돌릴 수 없어요.</p>', [
    {label:'취소'}, {label:'다시 시작', danger:true, fn:resetGame},
  ]));
  return () => {
    setText($('#r-max'), `${stageLabel(S.maxStage)} (${S.maxStage}단계)`);
    setText($('#r-kills'), fmt(S.rec.kills) + '마리');
    setText($('#r-boss'), fmt(S.rec.bosses) + '마리');
    setText($('#r-sum'), fmt(S.rec.summons) + '회');
    setText($('#r-atk'), fmt(ST.atk));
    setText($('#r-hp'), fmt(ST.maxHp));
    setText($('#r-dps'), fmt(ST.atk * ST.aspd * (1 + ST.crit * (ST.critDmg - 1))));
    setText($('#r-play'), fmtTime(S.rec.play));
    setText($('#r-save'), cloudRef ? '계정에 자동 저장 중이에요. 다른 기기에서도 이어서 할 수 있어요.' : '이 브라우저에 자동 저장 중이에요.');
  };
}

const BUILDERS = {grow:buildGrow, skill:buildSkill, gear:buildGear, rec:buildRec};
let currentTab = 'grow', refresher = null;
function buildTab(key, keepScroll){
  const top = panel.scrollTop;
  currentTab = key;
  document.querySelectorAll('.tab').forEach(bt => bt.setAttribute('aria-selected', String(bt.dataset.tab === key)));
  refresher = BUILDERS[key]();
  refreshPanel();
  panel.scrollTop = keepScroll ? top : 0;
}
function refreshPanel(){ if (refresher) refresher(); }
document.querySelectorAll('.tab').forEach(bt => bt.addEventListener('click', () => buildTab(bt.dataset.tab)));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalOpen && S.chosen) hideModal(); });

/* --- 직업 고르기 --- */
function classPreview(c){
  const L = CLASSES[c];
  const sp = buildSprite(28, 26, () => drawHero(c, 'down', 0, L.base, '#d7dde3'));
  return sp.toDataURL();
}
function chooseClass(canCancel){
  let pick = S.cls;
  const html = `<p>직업마다 싸우는 방식이 달라요. 나중에 정보 창에서 언제든 바꿀 수 있고, 레벨과 장비는 그대로예요.</p>
    <div class="classes">${CLASS_ORDER.map(c => `<button class="ccard" id="cc-${c}" data-c="${c}" aria-pressed="${c === pick}">
      <img src="${classPreview(c)}" alt=""><b>${CLASSES[c].name}</b><span>${CLASSES[c].desc}</span><em>${CLASSES[c].tags}</em></button>`).join('')}</div>`;
  const btns = [{label:'이 직업으로 시작', primary:true, fn:() => setClass(pick)}];
  if (canCancel) btns.unshift({label:'취소'});
  showModal(canCancel ? '직업 바꾸기' : '직업을 고르세요', html, btns, () => {
    document.querySelectorAll('.ccard').forEach(card => card.addEventListener('click', () => {
      pick = card.dataset.c;
      document.querySelectorAll('.ccard').forEach(c2 => c2.setAttribute('aria-pressed', String(c2.dataset.c === pick)));
    }));
  });
}
function setClass(c){
  const changed = S.cls !== c || !S.chosen;
  S.cls = c; S.chosen = true;
  refreshStats(); hero.hp = ST.maxHp; hero.target = null;
  buildTab(currentTab, true);
  if (changed) addLog(`${CLASSES[c].name}의 길을 걷습니다.`, 'good');
  saveLocal();
}

/* ================= 저장·오프라인 보상 ================= */
let cloudRef = null, cloudBusy = false;
function loadFrom(json){
  try { const d = JSON.parse(json); if (d && d.v === 1){ S = mergeState(d); return true; } } catch (e) {}
  return false;
}
function saveLocal(){
  S.lastSave = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}
async function pushCloud(){
  if (!cloudRef || cloudBusy) return;
  cloudBusy = true;
  try { S.lastSave = Date.now(); await cloudRef.set({t:S.lastSave, save:JSON.stringify(S)}); }
  catch (e) { const c = e && e.code; if (c !== 'unavailable' && c !== 'resource_exhausted') cloudRef = null; }
  cloudBusy = false;
}
function resetRuntime(){
  mobs = []; texts = []; parts = []; fx = []; projs = [];
  bossActive = false; bossRef = null; bossTime = 0; spawnT = 0.5;
  Object.assign(hero, {tx:7, ty:6, fx:7, fy:6, mt:0, moving:false, dir:'down', hp:ST.maxHp, dead:false, deadT:0, atkT:0, swing:0, hurt:0, buffT:0, target:null, engaged:false});
  placeOf(hero);
  for (const k in skillCd) skillCd[k] = 1.5;
}
function resetGame(){
  S = defaultState();
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  ST = null; refreshStats(); resetRuntime(); applySpeedBtn(); gearSel = -1; mapCache.clear();
  saveLocal(); pushCloud();
  buildTab('grow');
  chooseClass(false);
}
function offlineReward(sec){
  sec = Math.min(sec, OFFLINE_CAP);
  if (sec < 60) return;
  const s = S.stage;
  const dps = ST.atk * ST.aspd * (1 + ST.crit * (ST.critDmg - 1));
  const kps = Math.min(0.6, dps / mobHp(s) * 0.5) * 0.5;
  const kills = Math.floor(kps * sec);
  const gold = kills * mobGold(s), exp = kills * mobExp(s), gems = Math.floor(sec / 600);
  const lv0 = S.level;
  S.gold += gold; S.gems += gems; S.rec.kills += kills;
  gainExp(exp);
  saveLocal();
  showModal('다녀오셨습니까?', `
    <p>자리를 비운 <b>${fmtTime(sec)}</b> 동안 용사가 <b>${fmt(kills)}마리</b>를 잡았어요.</p>
    <ul class="rewards">
      <li><span class="coin"></span>${fmt(gold)}<span>엽전</span></li>
      <li><span class="gem"></span>${fmt(gems)}<span>보석 (10분마다 1개)</span></li>
      <li>Lv.${lv0}${S.level > lv0 ? ` → Lv.${S.level}` : ''}<span>경험치 +${fmt(exp)}</span></li>
    </ul>${sec >= OFFLINE_CAP ? '<p class="small" style="margin-top:8px">오프라인 보상은 최대 12시간까지 쌓여요.</p>' : ''}`,
    [{label:'받기', primary:true}]);
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ hiddenAt = Date.now(); saveLocal(); pushCloud(); }
  else {
    const away = hiddenAt ? (Date.now() - hiddenAt) / 1000 : 0;
    hiddenAt = 0; last = performance.now();
    if (away >= 60 && S.chosen) offlineReward(away);
  }
});
window.addEventListener('pagehide', saveLocal);

async function initCloud(loadedAt){
  let decided = false;
  const decide = data => {
    if (decided) return;
    decided = true;
    if (data && typeof data.save === 'string' && data.t > loadedAt + 2000 && loadFrom(data.save)){
      ST = null; refreshStats(); resetRuntime(); applySpeedBtn(); mapCache.clear(); buildTab(currentTab);
      addLog('다른 기기에서 하던 모험을 불러왔습니다.', 'good');
      const away = (Date.now() - data.t) / 1000;
      if (!S.chosen) chooseClass(false);
      else if (away >= 60) offlineReward(away);
    } else if (!S.chosen){
      chooseClass(false);
    } else if (loadedAt){
      const away = (Date.now() - loadedAt) / 1000;
      if (away >= 60) offlineReward(away);
    }
  };
  const timer = setTimeout(() => decide(null), 6000);
  try {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') throw 0;
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) throw 0;
    const uid = await user.id();
    if (!uid) throw 0;
    const ref = db.doc('data/users/' + uid + '/samhan');
    const snap = await ref.get();
    clearTimeout(timer);
    cloudRef = ref;
    decide(snap.exists ? snap.data() : null);
  } catch (e) {
    clearTimeout(timer);
    decide(null);
  }
}

/* ================= 시작 ================= */
let last = performance.now();
function loop(now){
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 0.25;
  if (dt > 0){
    for (let i = 0; i < S.speed; i++){
      let rem = dt;
      while (rem > 0){ const step = Math.min(rem, 0.05); update(step); rem -= step; }
    }
  }
  render(); updateHud();
  requestAnimationFrame(loop);
}
function start(hotData){
  let fromHot = false, loadedAt = 0;
  if (hotData && typeof hotData.save === 'string' && loadFrom(hotData.save)) fromHot = true;
  else { try { const j = localStorage.getItem(SAVE_KEY); if (j && loadFrom(j)) loadedAt = S.lastSave || 0; } catch (e) {} }
  refreshStats(); resetRuntime(); resize(); applySpeedBtn();
  buildTab('grow');
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv.parentElement);
  else window.addEventListener('resize', resize);
  last = performance.now();
  requestAnimationFrame(loop);
  setInterval(refreshPanel, 200);
  setInterval(saveLocal, 5000);
  setInterval(pushCloud, 60000);
  addLog(`${stageLabel(S.stage)}에 들어섰습니다.`, 'good');
  if (!fromHot) initCloud(loadedAt);
  else if (!S.chosen) chooseClass(false);
  if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function'){
    window.claude.hot.snapshot(() => ({save:JSON.stringify(S)}));
  }
}
if (location.search.indexOf('simtest') >= 0){
  window.__game = {
    get S(){ return S; }, get ST(){ return ST; }, get bossActive(){ return bossActive; },
    update, buyStat, upgradeSkill, summon, mergeAll, equipBest, skillCost, buyInfo, SKILLS, setClass, render,
    sheet(){ return {hero:CLASS_ORDER.map(c => ['down', 'up', 'right'].map(d => [0, 1, 2, 3].map(f => heroSprite(c, d, f).toDataURL()))), mobs:Object.keys(MOB_DRAW).map(t => [mobSprite(t, '#8a8a8a', 0, false).toDataURL(), mobSprite(t, '#8a8a8a', 1, false).toDataURL()])}; },
    setStage(s){ S.stage = s; mapCache.clear(); resetRuntime(); },
  };
}

const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
