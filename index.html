}

/* ================= 2~3등신 캐릭터(HD) =================
   64×64 캔버스(장면 2배 해상도 기준, 화면에서는 32×32)에 둥근 도형으로 그린 뒤
   가장자리를 도트처럼 또렷하게 다듬고 1px 외곽선을 두른다. 발 기준점은 (32, 60) → 화면 (16, 30).
   view: 'front'(오른쪽 아래를 봄) / 'back'(오른쪽 위를 봄). 왼쪽을 보는 그림은 좌우로 뒤집어 만든다 */
const HD_W = 64, HD_H = 64, HD_AX = 16, HD_AY = 30;
function hdFinish(c, outline = '#1d1420'){
  const g = c.getContext('2d'), w = c.width, h = c.height;
  const id = g.getImageData(0, 0, w, h), d = id.data;
  for (let i = 3; i < d.length; i += 4) d[i] = d[i] > 120 ? 255 : 0;   // 가장자리를 또렷하게
  g.putImageData(id, 0, 0);
  const o = document.createElement('canvas'); o.width = w; o.height = h;
  const og = o.getContext('2d');
  const s = document.createElement('canvas'); s.width = w; s.height = h;
  const sg = s.getContext('2d'); sg.drawImage(c, 0, 0); sg.globalCompositeOperation = 'source-in'; sg.fillStyle = outline; sg.fillRect(0, 0, w, h);
  for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) og.drawImage(s, dx, dy);
  og.drawImage(c, 0, 0);

const spW = sp => sp.width / (sp.hd || 1), spH = sp => sp.height / (sp.hd || 1);
function flipCanvas(src){

function drawChibi(g, c, view, f, col, look){

  const SK = SKINS[look.skin] || SKINS[0], SKD = darken(SK, 0.16), HR = look.hair, HRD = darken(HR, 0.28), HRL = mix(HR, '#ffffff', 0.22);
  const O = col.outfit, OD = darken(O, 0.24), OL = mix(O, '#ffffff', 0.18), BELT = col.belt;
  const aG = col.aG == null ? -1 : col.aG, wG = col.wG == null ? -1 : col.wG, fm = col.form || '';
  const trim = aG >= 0 ? GRADES[aG].color : '#9a9a9a', capeC = aG >= 0 ? darken(GRADES[aG].color, 0.45) : '#5a2a2a';
  const hat = look.hat === 'class' ? c : look.hat;
  const E = (x, y, rx, ry, cl, rot = 0) => { g.fillStyle = cl; g.beginPath(); g.ellipse(x, y, Math.max(0.3, rx), Math.max(0.3, ry), rot, 0, Math.PI * 2); g.fill(); };
  const Pl = (pts, cl) => { g.fillStyle = cl; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); g.fill(); };
  const RR = (x, y, w, h, r, cl) => { g.fillStyle = cl; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };
  const walk = f === 1 || f === 2, bob = walk ? -1 : 0, sway = f === 1 ? 1 : f === 2 ? -1 : 0;
  const by = bob;                        // 몸 전체 위아래

  if (tier === 3) return S.world >= 3 && S.level >= JOB3_LV && chapterDone(JOBS[S.cls][2].ch);

  fence(g, x0, y0, n){ for (let i = 0; i <= n; i++){ const x = x0 + i * 5, y = y0 + i * 2.5; gPoly(g, [[x - 0.7, y], [x + 0.7, y], [x + 0.7, y - 6], [x - 0.7, y - 6]], '#8a6a4a'); }

  pond(g, x, y, rx, col = '#5a9ac8'){ gEll(g, x, y, rx + 1.5, rx * 0.5 + 1, darken(col, 0.3)); gEll(g, x, y, rx, rx * 0.5, col); gEll(g, x - rx * 0.3, y - rx * 0.12, rx * 0.35, rx * 0.1, mix(col, '#ffffff', 0.45)); },

  deadtree(g, x, y, col = '#2a3a30'){ gShadow(g, x, y, 5); const L = (x0, y0, x1, y1, w) => gPoly(g, [[x0 - w, y0], [x0 + w, y0], [x1 + w * 0.4, y1], [x1 - w * 0.4, y1]], col);
    L(x, y, x + 1, y - 20, 1.6); L(x + 1, y - 12, x - 6, y - 18, 0.8); L(x + 1, y - 15, x + 7, y - 22, 0.8); L(x - 3, y - 15, x - 4, y - 21, 0.5); },
  stalag(g, x, y, s = 1, col = '#4a3a3a'){ gShadow(g, x, y, 4 * s); gPoly(g, [[x - 4 * s, y], [x + 4 * s, y], [x + 0.5 * s, y - 14 * s]], col); gPoly(g, [[x + 0.5 * s, y - 14 * s], [x + 4 * s, y], [x + 1.5 * s, y]], darken(col, 0.3)); },
  crystal(g, x, y, col = '#9a6ad8'){ gPoly(g, [[x - 2, y], [x + 2, y], [x + 1, y - 7], [x - 1, y - 8]], col); gPoly(g, [[x - 1, y - 8], [x - 2, y], [x - 0.6, y]], mix(col, '#ffffff', 0.5)); gPoly(g, [[x + 2, y], [x + 4, y - 4], [x + 3.4, y - 5], [x + 1, y - 1]], darken(col, 0.2)); },
  torch(g, x, y){ gPoly(g, [[x - 0.8, y], [x + 0.8, y], [x + 0.8, y - 10], [x - 0.8, y - 10]], '#6b4a2b'); gPoly(g, [[x - 2.5, y - 10], [x + 2.5, y - 10], [x + 2, y - 12], [x - 2, y - 12]], '#4a3423'); },
  snowmound(g, x, y, s = 1){ gBlob(g, x, y - 2 * s, 8 * s, 3.5 * s, '#f4f9fd'); },
  bladespike(g, x, y, s = 1){ gShadow(g, x, y, 4 * s); for (const [dx, h, w] of [[-3, 16, 1.6], [2, 22, 2], [5, 12, 1.4]]){ const bx = x + dx * s;
    gPoly(g, [[bx - w * s, y], [bx + w * s, y], [bx, y - h * s]], '#9aa2ae'); gPoly(g, [[bx, y - h * s], [bx + w * s, y], [bx + 0.2, y]], '#6a727e'); gPoly(g, [[bx - w * 0.3 * s, y - h * 0.5 * s], [bx, y - h * s], [bx - w * 0.6 * s, y - h * 0.6 * s]], '#e8eef4'); } },
  bones(g, x, y){ gEll(g, x, y, 2.4, 2, '#d8d0c0'); gEll(g, x - 0.8, y - 0.2, 0.5, 0.6, '#1a1418'); gEll(g, x + 0.8, y - 0.2, 0.5, 0.6, '#1a1418'); gPoly(g, [[x + 3, y + 1], [x + 8, y + 2], [x + 8, y + 2.8], [x + 3, y + 1.8]], '#d8d0c0'); },

    for (const dx of [-6, 6]) gPoly(g, [[x + dx - 1, y - 1], [x + dx + 1, y - 1], [x + dx + 1, y + 2], [x + dx - 1, y + 2]], '#1a1414'); },
  icespike(g, x, y, s = 1){ gShadow(g, x, y, 4 * s); gPoly(g, [[x - 3 * s, y], [x + 3 * s, y], [x + 0.5 * s, y - 15 * s]], '#cfeaff'); gPoly(g, [[x + 0.5 * s, y - 15 * s], [x + 3 * s, y], [x + 1.2 * s, y]], '#8fb8d8'); gPoly(g, [[x - 1.6 * s, y - 5 * s], [x + 0.5 * s, y - 15 * s], [x - 0.8 * s, y - 5 * s]], '#ffffff'); },
  bladetree(g, x, y){ gShadow(g, x, y, 7); gPoly(g, [[x - 1.4, y], [x + 1.4, y], [x + 0.8, y - 18], [x - 0.8, y - 18]], '#2a1e18');
    for (let i = 0; i < 14; i++){ const a = i * 2.4, r = 3 + (i % 4) * 2, lx = x + Math.cos(a) * r, ly = y - 20 + Math.sin(a) * r * 0.7; gPoly(g, [[lx, ly - 3], [lx + 0.9, ly], [lx, ly + 1.4], [lx - 0.9, ly]], i % 3 ? '#c8d0d8' : '#ffffff'); } },
  pillar(g, x, y){ gShadow(g, x, y, 5); gPoly(g, [[x - 3, y], [x + 3, y], [x + 3, y - 22], [x - 3, y - 22]], '#2a1a2a'); gPoly(g, [[x + 1, y], [x + 3, y], [x + 3, y - 22], [x + 1, y - 22]], '#1a1018');
    gPoly(g, [[x - 4.5, y - 22], [x + 4.5, y - 22], [x + 3.5, y - 25], [x - 3.5, y - 25]], '#3a2234'); gEll(g, x - 1, y - 14, 0.8, 0.5, '#ff2a4a'); gEll(g, x + 1.4, y - 14, 0.8, 0.5, '#ff2a4a'); },
  cloudpuff(g, x, y, s = 1){ gEll(g, x, y + 1, 10 * s, 3 * s, 'rgba(120,150,200,.25)'); for (const [dx, dy, r] of [[-6, -3, 5], [0, -6, 6.4], [6, -3, 5], [0, -1, 6]]) gEll(g, x + dx * s, y + dy * s, r * s, r * 0.8 * s, '#ffffff'); gEll(g, x - 2 * s, y - 7 * s, 2.4 * s, 1.4 * s, '#f4f8ff'); },
  peachtree(g, x, y, s = 1){ gShadow(g, x, y, 7 * s); gPoly(g, [[x - 1.4 * s, y], [x + 1.4 * s, y], [x + 0.8 * s, y - 9 * s], [x - 0.8 * s, y - 9 * s]], '#6b4a2b');
    gBlob(g, x - 4 * s, y - 12 * s, 6 * s, 5 * s, '#ff9ab8'); gBlob(g, x + 4 * s, y - 12 * s, 6 * s, 5 * s, '#ffb0c8'); gBlob(g, x, y - 16 * s, 7 * s, 5.4 * s, '#ffc0d4');
    for (const [dx, dy] of [[-5, -10], [3, -14], [5, -9], [-1, -17]]) { gEll(g, x + dx * s, y + dy * s, 1.6 * s, 1.6 * s, '#ff7a6a'); gEll(g, x + (dx - 0.5) * s, y + (dy - 0.6) * s, 0.5 * s, 0.5 * s, '#ffe0d0'); } },
  boat(g, x, y, s = 1){ gEll(g, x, y + 1, 16 * s, 3 * s, 'rgba(255,255,255,.35)'); gPoly(g, [[x - 15 * s, y - 5 * s], [x + 15 * s, y - 5 * s], [x + 11 * s, y], [x - 11 * s, y]], '#6b4a2b'); gPoly(g, [[x - 15 * s, y - 5 * s], [x + 15 * s, y - 5 * s], [x + 14 * s, y - 3.6 * s], [x - 14 * s, y - 3.6 * s]], '#8a6a42');
    gPoly(g, [[x - 0.8 * s, y - 5 * s], [x + 0.8 * s, y - 5 * s], [x + 0.6 * s, y - 24 * s], [x - 0.6 * s, y - 24 * s]], '#4a3423'); gPoly(g, [[x + 1, y - 23 * s], [x + 11 * s, y - 15 * s], [x + 1, y - 8 * s]], '#efe6d0'); gPoly(g, [[x - 1, y - 21 * s], [x - 8 * s, y - 14 * s], [x - 1, y - 9 * s]], '#e8dcc4'); },
  waterfall(g, x, y){ gPoly(g, [[x - 14, y], [x + 14, y], [x + 10, y - 26], [x - 10, y - 26]], '#8a7a6a'); gPoly(g, [[x - 5, y - 26], [x + 5, y - 26], [x + 6, y], [x - 6, y]], '#8fd0ff'); for (let i = 0; i < 4; i++) gPoly(g, [[x - 3 + i * 2, y - 24], [x - 2.4 + i * 2, y - 24], [x - 2 + i * 2, y], [x - 2.6 + i * 2, y]], '#e8f6ff'); gEll(g, x, y + 1, 9, 2.6, '#cfeaff'); },
  redpillar(g, x, y){ gShadow(g, x, y, 4); gPoly(g, [[x - 2.4, y], [x + 2.4, y], [x + 2.4, y - 26], [x - 2.4, y - 26]], '#c8382f'); gPoly(g, [[x + 0.8, y], [x + 2.4, y], [x + 2.4, y - 26], [x + 0.8, y - 26]], '#9a2a24'); gPoly(g, [[x - 3.6, y - 26], [x + 3.6, y - 26], [x + 3, y - 29], [x - 3, y - 29]], '#ffd24a'); gPoly(g, [[x - 3.4, y], [x + 3.4, y], [x + 3, y - 2], [x - 3, y - 2]], '#e8e0c8'); },
  pavilion(g, x, y){ gShadow(g, x, y + 1, 18); for (const dx of [-12, 12]) PROPS.redpillar(g, x + dx, y);
    gPoly(g, [[x - 20, y - 26], [x + 20, y - 26], [x + 16, y - 34], [x - 16, y - 34]], '#3c4652'); gPoly(g, [[x - 22, y - 25], [x - 16, y - 34], [x - 18, y - 34], [x - 25, y - 27]], '#2e3640'); gPoly(g, [[x + 22, y - 25], [x + 16, y - 34], [x + 18, y - 34], [x + 25, y - 27]], '#2e3640');
    gPoly(g, [[x - 16, y - 34], [x + 16, y - 34], [x + 12, y - 39], [x - 12, y - 39]], '#ffd24a'); gEll(g, x, y - 40, 2.6, 2, '#ffd24a'); },
  lantern(g, x, y, s = 1){ gShadow(g, x, y, 5 * s); gPoly(g, [[x - 2 * s, y], [x + 2 * s, y], [x + 1.4 * s, y - 6 * s], [x - 1.4 * s, y - 6 * s]], '#8a8a90');
    gPoly(g, [[x - 4 * s, y - 6 * s], [x + 4 * s, y - 6 * s], [x + 3 * s, y - 7.4 * s], [x - 3 * s, y - 7.4 * s]], '#a8a8b0');
    gPoly(g, [[x - 2.6 * s, y - 7.4 * s], [x + 2.6 * s, y - 7.4 * s], [x + 2.6 * s, y - 11 * s], [x - 2.6 * s, y - 11 * s]], '#9a9aa2'); gEll(g, x, y - 9.2 * s, 1.4 * s, 1.2 * s, '#ffd27a');
    gPoly(g, [[x - 5 * s, y - 11 * s], [x + 5 * s, y - 11 * s], [x, y - 15 * s]], '#7a7a82'); },
  cedar(g, x, y, s = 1){ gShadow(g, x, y, 6 * s); gPoly(g, [[x - 1.4 * s, y], [x + 1.4 * s, y], [x + 1.4 * s, y - 6 * s], [x - 1.4 * s, y - 6 * s]], '#5a3a2a');
    for (let i = 0; i < 4; i++){ const yy = y - 5 * s - i * 6 * s, w = (9 - i * 1.8) * s; gPoly(g, [[x - w, yy], [x + w, yy], [x, yy - 9 * s]], i % 2 ? '#2f5a34' : '#3a6a3e'); } },
  mushroom(g, x, y, col = '#9a4ad8'){ gPoly(g, [[x - 0.8, y], [x + 0.8, y], [x + 0.6, y - 4], [x - 0.6, y - 4]], '#e8e0d0'); gBlob(g, x, y - 4.5, 3.4, 2, col); gEll(g, x - 1, y - 5, 0.5, 0.4, '#ffffff'); },
};

/* 지역별 풍경: 판 뒤(위쪽)와 앞(아래쪽) 빈터에 소품을 놓는다 */
function isoScenery(t, rnd){
  const back = [], front = [];
  const spotBack = (n, minX = 4, maxX = MW - 4, gap = 6) => { const out = []; for (let k = 0; k < n * 6 && out.length < n; k++){ const x = minX + rnd() * (maxX - minX), y = 18 + rnd() * (edgeTop(x) - 18 - gap); if (y > 18) out.push([x, y]); } return out; };
  const spotFront = (n, gap = IDEP + 5) => { const out = []; for (let k = 0; k < n * 8 && out.length < n; k++){ const x = 2 + rnd() * (MW - 4), y = edgeBot(x) + gap + rnd() * (MH - edgeBot(x) - gap); if (y < MH - 1 && y > edgeBot(x) + gap) out.push([x, y]); } return out; };
  const P2 = (arr, fn) => { for (const [x, y] of arr) back.push([y, g => fn(g, x, y)]); };
  const F2 = (arr, fn) => { for (const [x, y] of arr) front.push([y, g => fn(g, x, y)]); };
  if (t === 'village'){
    back.push([40, g => PROPS.house(g, 62, 40, 'thatch')], [58, g => PROPS.house(g, 236, 58, 'tile')]);
    P2(spotBack(6), (g, x, y) => PROPS.tree(g, x, y, 0.8 + rnd() * 0.3));
    back.push([44, g => PROPS.fence(g, 140, 40, 9)]);
    P2(spotBack(5), (g, x, y) => PROPS.flowers(g, x, y, rnd));
    F2(spotFront(8), (g, x, y) => rnd() < 0.5 ? PROPS.flowers(g, x, y, rnd) : PROPS.grass(g, x, y));
  } else if (t === 'bamboo'){
    P2(spotBack(16, 4, W - 4, 3), (g, x, y) => PROPS.bamboo(g, x, y, 0.8 + rnd() * 0.4));
    F2(spotFront(6), (g, x, y) => PROPS.grass(g, x, y, '#4f8a3f'));
  } else if (t === 'rock'){
    P2(spotBack(9), (g, x, y) => PROPS.rock(g, x, y, 0.9 + rnd() * 0.8, ['#9a8a7a', '#8a7a6a', '#a89a88'][(rnd() * 3) | 0]));
    P2(spotBack(4), (g, x, y) => PROPS.pine(g, x, y, 0.7));
    F2(spotFront(6), (g, x, y) => PROPS.rock(g, x, y, 0.5 + rnd() * 0.4));
  } else if (t === 'swamp'){
    P2(spotBack(4), (g, x, y) => PROPS.deadtree(g, x, y));
    P2(spotBack(10), (g, x, y) => PROPS.reeds(g, x, y));
    F2(spotFront(8), (g, x, y) => PROPS.reeds(g, x, y));
  } else if (t === 'cave'){
    for (const [tx, ty] of CAVE_TORCH) back.push([ty, g => PROPS.torch(g, tx, ty)]);
    P2(spotBack(10), (g, x, y) => PROPS.stalag(g, x, y, 0.7 + rnd() * 0.6));
    P2(spotBack(4), (g, x, y) => PROPS.crystal(g, x, y, '#7a8ad8'));
    F2(spotFront(6), (g, x, y) => PROPS.stalag(g, x, y, 0.5));
  } else if (t === 'snow'){
    P2(spotBack(10), (g, x, y) => PROPS.pine(g, x, y, 0.75 + rnd() * 0.3, true));
    P2(spotBack(4), (g, x, y) => PROPS.snowmound(g, x, y));
    F2(spotFront(6), (g, x, y) => PROPS.snowmound(g, x, y, 0.6));
  } else if (t === 'blade'){
    P2(spotBack(10), (g, x, y) => PROPS.bladespike(g, x, y, 0.8 + rnd() * 0.5));
    P2(spotBack(4), (g, x, y) => PROPS.bones(g, x, y));
    F2(spotFront(6), (g, x, y) => PROPS.bones(g, x, y));
  } else if (t === 'lava'){
    back.push([42, g => PROPS.cauldron(g, 70, 42)], [56, g => PROPS.cauldron(g, 240, 56)]);
    P2(spotBack(6), (g, x, y) => PROPS.rock(g, x, y, 0.7, '#3a2420'));
  } else if (t === 'ice'){
    P2(spotBack(10), (g, x, y) => PROPS.icespike(g, x, y, 0.7 + rnd() * 0.5));
    F2(spotFront(5), (g, x, y) => PROPS.icespike(g, x, y, 0.5));
  } else if (t === 'bladetree'){
    P2(spotBack(7), (g, x, y) => PROPS.bladetree(g, x, y));
    F2(spotFront(4), (g, x, y) => PROPS.bladespike(g, x, y, 0.4));
  } else if (t === 'poison'){
    P2(spotBack(4), (g, x, y) => PROPS.deadtree(g, x, y, '#140e10'));
    P2(spotBack(8), (g, x, y) => PROPS.mushroom(g, x, y, rnd() < 0.5 ? '#9a4ad8' : '#7aa83a'));
    F2(spotFront(6), (g, x, y) => PROPS.mushroom(g, x, y));
  } else if (t === 'cloud'){
    P2(spotBack(12), (g, x, y) => PROPS.cloudpuff(g, x, y, 0.7 + rnd() * 0.6));
    F2(spotFront(6), (g, x, y) => PROPS.cloudpuff(g, x, y, 0.6 + rnd() * 0.4));
  } else if (t === 'peach'){
    P2(spotBack(9), (g, x, y) => PROPS.peachtree(g, x, y, 0.8 + rnd() * 0.4));
    P2(spotBack(5), (g, x, y) => PROPS.flowers(g, x, y, rnd));
    F2(spotFront(7), (g, x, y) => rnd() < 0.5 ? PROPS.flowers(g, x, y, rnd) : PROPS.grass(g, x, y));
  } else if (t === 'river2'){
    P2(spotBack(8), (g, x, y) => PROPS.reeds(g, x, y));
    P2(spotBack(5), (g, x, y) => PROPS.rock(g, x, y, 0.7 + rnd() * 0.5, '#8a9aa0'));
    F2(spotFront(6), (g, x, y) => PROPS.reeds(g, x, y));
  } else if (t === 'sea'){
    back.push([46, g => PROPS.boat(g, 60, 46, 1)], [70, g => PROPS.boat(g, 250, 70, 0.9)]);
    P2(spotBack(5), (g, x, y) => PROPS.rock(g, x, y, 0.6 + rnd() * 0.4, '#5a6a7a'));
    F2(spotFront(3), (g, x, y) => PROPS.boat(g, x, y, 0.6));
  } else if (t === 'fruitmt'){
    back.push([50, g => PROPS.waterfall(g, 200, 50)]);
    P2(spotBack(7), (g, x, y) => PROPS.peachtree(g, x, y, 0.7));
    P2(spotBack(6), (g, x, y) => PROPS.rock(g, x, y, 0.8 + rnd() * 0.6, '#a8988a'));
    F2(spotFront(5), (g, x, y) => PROPS.rock(g, x, y, 0.5));
  } else if (t === 'heaven'){
    back.push([48, g => PROPS.pavilion(g, 70, 48)], [64, g => PROPS.pavilion(g, 245, 64)]);
    P2(spotBack(8), (g, x, y) => PROPS.cloudpuff(g, x, y, 0.6 + rnd() * 0.5));
    F2(spotFront(5), (g, x, y) => PROPS.cloudpuff(g, x, y, 0.6));
  } else if (t === 'kappa'){
    back.push([46, g => PROPS.pond(g, 84, 46, 16, '#4a9ac8')]);
    P2(spotBack(9), (g, x, y) => PROPS.reeds(g, x, y));
    P2(spotBack(4), (g, x, y) => PROPS.rock(g, x, y, 0.6 + rnd() * 0.4, '#7a8a8a'));
    F2(spotFront(6), (g, x, y) => PROPS.reeds(g, x, y));
  } else if (t === 'foxfield'){
    P2(spotBack(6), (g, x, y) => PROPS.lantern(g, x, y, 0.9));
    P2(spotBack(10), (g, x, y) => PROPS.grass(g, x, y, '#3a5a4a'));
    F2(spotFront(7), (g, x, y) => rnd() < 0.5 ? PROPS.flowers(g, x, y, rnd) : PROPS.grass(g, x, y, '#3a5a4a'));
  } else if (t === 'kurama'){
    P2(spotBack(12), (g, x, y) => PROPS.cedar(g, x, y, 0.8 + rnd() * 0.4));
    P2(spotBack(4), (g, x, y) => PROPS.rock(g, x, y, 0.7, '#8a8a7a'));

  const slot = gearSlot, Gd = S.gear[slot], eq = S.equip[slot], def = GEAR[slot];
  let grid = '';
  for (let gr = 0; gr < 5; gr++){
    grid += `<div class="gl" style="--gc:${GRADES[gr].color}">${GRADES[gr].name}</div>`;
    for (let t = 0; t < 4; t++){
      const i = gr * 4 + t, c = Gd.count[i];
      grid += `<button class="cell${Gd.seen[i] ? '' : ' unseen'}${gearSel === i ? ' sel' : ''}" id="cell-${i}" data-i="${i}" style="--g:${GRADES[gr].color}" aria-label="${gearName(slot, i)}, ${c}개${eq === i ? ', 장착 중' : ''}">${SVG[def.icon]}<span class="tier">${ROMAN[t]}</span>${c ? `<span class="cnt">${c}</span>` : ''}${eq === i ? '<span class="eq">장착</span>' : ''}</button>`;
    }
  }
  let detail = '';

  return () => { $('#sum1').disabled = S.gems < 50; $('#sum10').disabled = S.gems < 450; };
}
function doSummon(slot, n){
  const res = summon(slot, n);
  if (!res){ addLog('보석이 부족합니다.', 'warn'); return; }
  sfx(res.some(r => r.it >= 12) ? 'rare' : 'summon');
  if (currentTab === 'gear') buildTab('gear', true);
  const best = res.reduce((a, r) => Math.max(a, r.it), 0);
  playFx('summon', {best:Math.floor(best / 4), sub:gearName(slot, best)});
  const html = `<div class="res-grid">${res.map((r, i) => {
      const g = GRADES[Math.floor(r.it / 4)];
      return `<div class="res flip${r.it >= 12 ? ' legend' : ''}" style="--g:${g.color};--i:${i}" title="${gearName(slot, r.it)}">${SVG[GEAR[slot].icon]}<span class="tier">${ROMAN[r.it % 4]}</span>${r.isNew ? '<span class="new">NEW</span>' : ''}</div>`;
    }).join('')}</div>
    <p class="small" style="margin-top:10px">가장 좋은 장비: <b>${gearName(slot, best)}</b> (${GRADES[Math.floor(best / 4)].name})</p>`;
  const cost = summonCost(n);
  showModal(`${GEAR[slot].label} 소환 결과`, html, [
    {label:`${n}회 더 (보석 ${cost})`, disabled:S.gems < cost, fn:() => doSummon(slot, n)},
    {label:'확인', primary:true},
  ]);
}

    <p class="hint" style="margin-top:8px">퀘스트 보상을 받을 때 낮은 확률(${Math.round(LUCK_MYTH * 100)}%)로 신화 보물이 나와요. 어려운 퀘스트일수록 효과가 커요. 종류마다 가장 센 것만 남고, 약한 것은 보석 ${MYTH_DUP_GEMS}개로 바뀌어요.</p>
    <ul class="list">${MYTHS.map(m => `<li class="row" id="my-${m.k}"><div class="ic myth" style="--myth:${MYTH_COLOR}">${SVG[m.icon]}</div>
      <div><div class="nm">${m.name}<span class="l">${m.stat}</span></div><div class="val" data-r="v"></div></div><span></span></li>`).join('')}</ul>
    <p class="small" style="margin-top:6px">퀘스트를 깰 때 ${Math.round(LUCK_RESET * 100)}% 확률로 모든 기술의 재사용 시간도 초기화돼요.</p>`;
  wireGearSeg();
  return () => {
    for (const m of MYTHS){
      const row = $('#my-' + m.k), v = S.myth[m.k];
      row.querySelector('.ic').classList.toggle('none', !v);
      setHTML(row.querySelector('[data-r=v]'), v ? `<span class="mythv">${m.stat} +${v}%</span>` : '아직 없음');
    }
  };
}

/* --- 상점 --- */
let shopCat = 'potion';
function shopItemText(it){
  if (it.buff){ const b = BUFFS[it.buff]; return {name:b.name, desc:`${b.desc} · 10분 (또 사면 늘어나요, 최대 60분)`}; }
  return {name:it.name, desc:it.desc};
}
function buildShop(){
  const items = SHOP.filter(it => it.cat === shopCat);
  panel.innerHTML = `
    <div class="ph"><h2>상점</h2><span class="bag" id="bag"></span></div>
    <p class="hint">물약은 위험할 때 저절로 마셔요. 부적은 싸우는 동안에만 시간이 줄어요.</p>
    <div class="shop-cats mode" role="group" aria-label="상점 분류">${SHOP_CATS.map(([k, n]) => `<button class="chip" data-c="${k}" aria-pressed="${k === shopCat}">${n}</button>`).join('')}</div>
    <ul class="list">${items.map(it => {
      const t = shopItemText(it), bc = it.buff ? BUFFS[it.buff].color : '';
      return `<li class="row" id="sh-${it.id}"><div class="ic${it.buff ? ' buffc' : ''}" ${bc ? `style="--bc:${bc}"` : ''}>${SVG[it.icon]}</div>
        <div><div class="nm">${t.name}<span class="on" data-r="on"></span></div><div class="val">${t.desc}</div></div>
        <button class="buy${it.cur === 'gems' ? ' gemc' : it.cur === 'free' ? ' free' : ''}" id="shb-${it.id}">${it.cur === 'gold' ? '<span class="coin"></span>' : it.cur === 'gems' ? '<i class="gem"></i>' : ''}<span data-r="p"></span></button></li>`;
    }).join('')}</ul>`;
  panel.querySelectorAll('.shop-cats .chip').forEach(bt => bt.addEventListener('click', () => { shopCat = bt.dataset.c; buildTab('shop', true); }));
  const refs = items.map(it => {
    const row = $('#sh-' + it.id), btn = $('#shb-' + it.id);
    const buy = () => {
      if (!buyShop(it.id)) return false;
      const t = shopItemText(it);
      addLog(it.id === 'gift' ? '오늘의 선물을 받았습니다! 보석 +10, 인삼 탕약 +5' : `${t.name}${josa(t.name, '을', '를')} 샀습니다.`, 'gain');
      return true;
    };
    if (it.inv || it.buff) holdButton(btn, buy); else btn.addEventListener('click', buy);
    return {it, btn, on:row.querySelector('[data-r=on]'), p:btn.querySelector('[data-r=p]')};
  });
  return () => {
    setHTML($('#bag'), `가방: 인삼 <b>${S.inv.potion}</b> · 산삼 <b>${S.inv.elixir}</b> · 숫돌 <b>${S.inv.whet}</b> · 토벌패 <b>${raidTickets()}</b>`);
    for (const r of refs){
      const st = shopState(r.it), it = r.it;
      let on = '';
      if (it.buff && S.buff[it.buff] > 0) on = `${Math.ceil(S.buff[it.buff] / 60)}분 남음`;
      else if (it.inv) on = `${S.inv[it.inv]}개`;
      else if (it.daily) on = `오늘 ${Math.max(0, it.daily - (S.shop.got[it.id] || 0))}번 남음`;
      setText(r.on, on);
      setHTML(r.p, st.why && !st.ok ? st.why : it.cur === 'free' ? '받기' : fmt(st.price));
      r.btn.disabled = !st.ok;
    }
  };
}

/* --- 재련 --- */
const refineMsg = {weapon:null, armor:null};
function buildRefine(){
  const card = slot => {
    const isW = slot === 'weapon', stat = isW ? '공격력' : '체력';
    return `<div class="card" id="rf-${slot}">
      <div class="rhead"><div class="ic">${SVG[isW ? 'sword' : 'armor']}</div>
        <div><div class="nm">${isW ? cls().weapon : cls().armor} 재련 <span class="rlv" data-r="lv"></span></div><div class="val" data-r="eff"></div></div></div>
      <div class="dl"><span>성공</span><b data-r="rate"></b></div>
      <div class="dl"><span>실패하면</span><b data-r="en"></b></div>
      <p class="rres" data-r="res"></p>
      <button class="buy" data-r="btn"><span class="coin"></span><span data-r="g"></span><i class="gem"></i><span data-r="m"></span></button>
      <p class="small">${stat}이 재련 단계만큼 크게 올라요. 두 번 연달아 떨어지면 다음 재련은 <b>반드시 성공</b>(기회의 불꽃)해요.</p>
    </div>`;
  };
  panel.innerHTML = `${gearSegHTML()}
    <p class="hint" style="margin-top:8px">엽전과 보석으로 무기·방어구를 벼려요. 높은 단계일수록 실패하면 <b>한 단계 떨어지거나</b>(+11부터, +10·+15·+20에서는 안 떨어짐) <b>부서져 +15·+20으로 돌아갈</b> 수 있어요(+17부터).</p>
    <label class="whet card"><input type="checkbox" id="whetChk" ${S.useWhet ? 'checked' : ''}><span id="whetTxt"></span></label>
    <label class="whet card"><input type="checkbox" id="protChk" ${S.useProtect ? 'checked' : ''}><span>보호: +16~+19에서 보석을 두 배 내고 부서짐을 막아요</span></label>
    ${card('weapon')}${card('armor')}
    <p class="rtable">확률 공개 (성공 / 하락 / 부서짐, 나머지는 유지)<br>${REFINE_RATE.map((r, i) => `+${i + 1} ${r}%${REFINE_DROP[i] ? ` / ${REFINE_DROP[i]}%` : ''}${REFINE_BREAK[i] ? ` / ${REFINE_BREAK[i]}%` : ''}`).join(' · ')}</p>`;
  wireGearSeg();
  $('#whetChk').addEventListener('change', e => { S.useWhet = e.target.checked; refreshPanel(); });
  $('#protChk').addEventListener('change', e => { S.useProtect = e.target.checked; refreshPanel(); });
  const refs = ['weapon', 'armor'].map(slot => {
    const el = $('#rf-' + slot), q = k => el.querySelector(`[data-r=${k}]`);
    const r = {slot, lv:q('lv'), eff:q('eff'), rate:q('rate'), en:q('en'), bar:q('bar'), res:q('res'), btn:q('btn'), g:q('g'), m:q('m')};
    r.btn.addEventListener('click', () => {
      const out = refineTry(slot);
      if (!out) return;
      const name = slot === 'weapon' ? cls().weapon : cls().armor;
      sfx(out.ok ? 'refOk' : 'refNo');
      playFx('refine', {el:r.btn, res:out.res, lv:out.lv, chance:out.sure});
      refineMsg[slot] = out.ok ? {ok:true, t:`성공! ${name} +${out.lv}${out.sure ? ' (기회의 불꽃)' : ''}`}
        : {ok:false, t:out.res === 'break' ? `부서졌어요… +${out.lv}로 돌아갔어요` : out.res === 'drop' ? `실패… +${out.lv}로 떨어졌어요${(S.refine[slot].drops || 0) >= 2 ? ' — 다음은 반드시 성공!' : ''}` : '실패… 단계는 그대로예요'};
      addLog(out.ok ? `재련 성공! ${name} +${out.lv}` : `재련 실패 (${name} +${out.from + 1} 시도${out.res === 'break' ? ', 부서짐' : out.res === 'drop' ? ', 하락' : ''})`, out.ok ? 'gain' : 'warn');
      if (out.ok){ fx.push({type:'level', t:0, dur:0.6}); addText(`+${out.lv}`, hero.x, hero.y - 34, '#ffd96a', 14, true); }
      r.res.classList.remove('pop'); void r.res.offsetWidth; r.res.classList.add('pop');
      refreshPanel();
    });
    return r;
  });
  return () => {
    setText($('#whetTxt'), `숫돌 함께 쓰기 (가진 숫돌 ${S.inv.whet}개${S.inv.whet ? '' : ' · 상점에서 살 수 있어요'})`);
    $('#whetChk').disabled = !S.inv.whet && !S.useWhet;
    for (const r of refs){
      const R2 = S.refine[r.slot], stat = r.slot === 'weapon' ? '공격력' : '체력', max = R2.lv >= REFINE_MAX;
      setText(r.lv, '+' + R2.lv);
      const rp = l => +refinePct(l).toFixed(1);
      setHTML(r.eff, max ? `${stat} +${rp(R2.lv)}% (최고 단계)` : `${stat} +${rp(R2.lv)}% → <em>+${rp(R2.lv + 1)}%</em>`);
      if (max){ setText(r.rate, '-'); setText(r.en, '-'); setHTML(r.g, '최고'); setHTML(r.m, ''); r.btn.disabled = true; }
      else {
        const o = refineOdds(r.slot), f1 = v => +v.toFixed(1);
        setText(r.rate, o.chance ? '100% (기회의 불꽃)' : `${f1(o.ok)}%${whetOn() ? ' (숫돌 ×1.15)' : ''}`);
        setText(r.en, o.chance ? '-' : [`유지 ${f1(o.keep)}%`, o.drop ? `하락 ${f1(o.drop)}%` : '', o.brk ? `부서짐 ${f1(o.brk)}%` : (S.useProtect && refineProtectable(R2.lv) ? '보호 중' : '')].filter(Boolean).join(' · '));
        const g = refineGold(R2.lv), m = refineGems(R2.lv) * (S.useProtect && refineProtectable(R2.lv) && !o.chance ? 2 : 1);
        setHTML(r.g, fmt(g)); setHTML(r.m, fmt(m));
        r.btn.disabled = S.gold < g || S.gems < m;
      }
      const msg = refineMsg[r.slot];
      setText(r.res, msg ? msg.t : '');
      r.res.classList.toggle('ok', !!(msg && msg.ok)); r.res.classList.toggle('no', !!(msg && !msg.ok));
    }
  };
}

/* --- 펫 --- */
let petSel = -1;
const starStr = n => n ? '★'.repeat(n) : '';
const petSlotsHTML = () => PET_TYPE_ORDER.map(t => {
  const i = eqPet(t);
  return `<div class="pslot"><b>${PET_TYPES[t].name}</b>${i >= 0 ? `<img src="${petImg(i)}" alt=""><span>${PETS[i].name}</span><span>Lv.${S.pets.lv[i]} <span class="stars">${starStr(S.pets.star[i])}</span></span>` : '<span class="empty">비어 있음</span>'}</div>`;
}).join('');
function buildPet(){
  let grid = '';
  PET_TYPE_ORDER.forEach((t, ti) => {
    grid += `<div class="gl" style="--gc:var(--text-soft)">${PET_TYPES[t].name}</div>`;
    for (let g = 0; g < 5; g++){
      const i = ti * 5 + g, own = S.pets.lv[i] > 0, eq = eqPet(t) === i;
      grid += `<button class="pcell${own ? '' : ' unseen'}${petSel === i ? ' sel' : ''}" data-i="${i}" style="--g:${GRADES[g].color}" aria-label="${PETS[i].name}${own ? ` Lv.${S.pets.lv[i]}` : ', 아직 없음'}${eq ? ', 데려가는 중' : ''}">
        <img src="${petImg(i)}" alt="">${own ? `<span class="lvl">Lv.${S.pets.lv[i]}</span><span class="st">${starStr(S.pets.star[i])}</span>` : ''}${eq ? '<span class="eq">함께</span>' : ''}</button>`;
    }
  });
  let detail = '';
  if (petSel >= 0){
    const i = petSel, p = PETS[i], own = S.pets.lv[i] > 0, lv = S.pets.lv[i], eq = eqPet(p.type) === i;
    detail = `<div class="detail" style="--g:${GRADES[p.g].color}">
      <div class="dn">${p.name}<span class="badge">${GRADES[p.g].name}</span><span class="badge">${PET_TYPES[p.type].name}</span></div>
      <div class="dl"><span id="pdLv"></span><b class="stars">${starStr(S.pets.star[i])}</b></div>
      <div class="dl"><span>효과</span><b id="pdEff"></b></div>
      ${own ? '<div class="dl"><span>다음 레벨</span><b style="color:var(--jade)" id="pdNext"></b></div>' : ''}
      <div class="dbtns">
        <button class="btn primary" id="petEqBtn" ${own && !eq ? '' : 'disabled'}>${eq ? '데려가는 중' : '데려가기'}</button>
        <button class="buy" id="petUpBtn"><span class="coin"></span><span data-r="g"></span><i class="gem"></i><span data-r="m"></span></button>
      </div>
      <p class="small">${own ? '강화는 엽전과 보석이 들어요. 길게 누르면 계속 올라가요. 같은 펫을 또 뽑으면 별이 올라 효과가 20%씩 세져요.' : '펫 소환으로 얻을 수 있어요.'}</p>
    </div>`;
  }
  panel.innerHTML = `
    <div class="ph"><h2>펫</h2></div>
    <p class="hint">공격·방어·지원 펫을 한 마리씩 데려갈 수 있어요. 데려간 펫은 용사를 따라다니며 도와요.</p>
    <div class="pslots" id="pslots"></div>
    <div class="summon">
      <button class="gbtn" id="psum1"><span>펫 1회 소환</span><span class="price"><i class="gem"></i>${petSummonCost(1)}</span></button>
      <button class="gbtn" id="psum10"><span>펫 10회 소환</span><span class="price"><i class="gem"></i>${petSummonCost(10)}</span></button>
    </div>
    <p class="odds">확률 공개 — 전설 0.5% · 영웅 3.5% · 희귀 13% · 고급 28% · 일반 55% (등급 안에서 공격·방어·지원 펫이 똑같이 3분의 1씩, 예: 전설 펫 한 마리는 0.17%). <b id="petPity"></b></p>
    <div class="pgrid">${grid}</div>
    ${detail}`;
  $('#psum1').addEventListener('click', () => doPetSummon(1));
  $('#psum10').addEventListener('click', () => doPetSummon(10));
  panel.querySelectorAll('.pcell').forEach(bt => bt.addEventListener('click', () => { const i = +bt.dataset.i; petSel = petSel === i ? -1 : i; buildTab('pet', true); }));
  const up = $('#petUpBtn');
  if ($('#petEqBtn')) $('#petEqBtn').addEventListener('click', () => { petEquip(petSel); addLog(`${PETS[petSel].name}${josa(PETS[petSel].name, '을', '를')} 데려갑니다.`, 'good'); buildTab('pet', true); });
  const sel = petSel;
  if (up) holdButton(up, () => { const ok = petUpgrade(sel); if (ok) upFx(up, `Lv.${S.pets.lv[sel]}`, '#8ff0a0'); return ok; });
  return () => {
    $('#psum1').disabled = S.gems < petSummonCost(1); $('#psum10').disabled = S.gems < petSummonCost(10);
    setText($('#petPity'), `영웅 이상 확정까지 ${Math.max(1, PET_PITY - (S.petPity || 0))}번`);
    setHTML($('#pslots'), petSlotsHTML());
    if (up){
      const lv = S.pets.lv[sel];
      setText($('#pdLv'), lv ? `Lv.${lv} · 별 ${S.pets.star[sel]}/${PET_STAR_MAX}` : '아직 없음');
      setText($('#pdEff'), petEffectText(sel, lv || 1));
      if ($('#pdNext')) setText($('#pdNext'), lv < PET_MAX ? petEffectText(sel, lv + 1) : '최고 레벨');
      const cl = panel.querySelector(`.pcell[data-i="${sel}"] .lvl`); if (cl) setText(cl, 'Lv.' + lv);
      if (!lv || lv >= PET_MAX){ setHTML(up.querySelector('[data-r=g]'), lv ? '최고 레벨' : '없음'); setHTML(up.querySelector('[data-r=m]'), ''); up.disabled = true; up.classList.add('nocoin'); }
      else { const c = petUpCost(lv); setHTML(up.querySelector('[data-r=g]'), fmt(c.gold)); setHTML(up.querySelector('[data-r=m]'), fmt(c.gems)); up.disabled = S.gold < c.gold || S.gems < c.gems; up.classList.remove('nocoin'); }
    }
  };
}
function doPetSummon(n){
  const res = petSummon(n);
  if (!res){ addLog('보석이 부족합니다.', 'warn'); return; }
  sfx(res.some(r => PETS[r.i].g >= 3) ? 'rare' : 'summon');
  if (currentTab === 'pet') buildTab('pet', true);
  const lab = {new:'NEW', star:'★+1', gem:'보석'};
  { const bp = res.reduce((a, r) => PETS[r.i].g > PETS[a.i].g ? r : a, res[0]); playFx('summon', {best:PETS[bp.i].g, sub:PETS[bp.i].name}); }
  const html = `<div class="res-grid">${res.map((r, k) => {
      const p = PETS[r.i];
      return `<div class="res flip${p.g >= 3 ? ' legend' : ''}" style="--g:${GRADES[p.g].color};--i:${k}" title="${p.name}"><img src="${petImg(r.i)}" alt="${p.name}"><span class="new${r.kind === 'star' ? ' star' : r.kind === 'gem' ? ' gem2' : ''}">${lab[r.kind]}</span></div>`;
    }).join('')}</div>
    <p class="small" style="margin-top:10px">${res.map(r => PETS[r.i].name).filter((v, k, a) => a.indexOf(v) === k).join(', ')}${josa(PETS[res[res.length - 1].i].name, '이', '가')} 나왔어요. 같은 펫은 별이 오르고, 별이 가득하면 보석 ${PET_DUP_GEMS}개로 돌려받아요.</p>`;
  const cost = petSummonCost(n);
  showModal('펫 소환 결과', html, [
    {label:`${n}회 더 (보석 ${cost})`, disabled:S.gems < cost, fn:() => doPetSummon(n)},
    {label:'확인', primary:true},
  ]);
}

  return () => {

    const q = mainQuest(), [cur, goal, txt] = questProg(q), done = questCur(q) >= q.n;
    setText($('#mqNo'), q.i < MAIN_Q.length ? `${CHAPTERS[q.ch]} — ${q.i + 1} / ${MAIN_Q.length}` : '이어지는 이야기 · 끝없는 윤회');
    setText($('#mqTitle'), q.t); setText($('#mqRew'), `보석 ${q.gems}`); setText($('#mqDiff'), `난이도 ${diffName(questDiff(q))}`); setText($('#mqStory'), q.s); setText($('#mqProg'), txt);
    $('#mqBar').style.width = Math.max(0, Math.min(100, cur / goal * 100)).toFixed(1) + '%';
    const mb = $('#mainClaim'); mb.disabled = !done; setText(mb, done ? '보상 받기' : '진행 중');
    $('#mainCard').classList.toggle('ready', done);
    const hq = hiddenQuest(), hc = $('#hidCard');
    hc.hidden = !hq;
    if (hq){
      const [hcur, hgoal, htxt] = questProg(hq), hd = questCur(hq) >= hq.n;
      setText($('#hqTitle'), `✦ ${hq.t}`); setText($('#hqRew'), `보석 ${hq.gems}`); setText($('#hqStory'), hq.s); setText($('#hqProg'), hq.k === 'hid0' ? '찾아온 차사' : htxt);
      $('#hqBar').style.width = Math.max(0, Math.min(100, hcur / hgoal * 100)).toFixed(1) + '%';
      const hb = $('#hidClaim'); hb.disabled = !hd; setText(hb, hd ? '보상 받기' : '진행 중'); hc.classList.toggle('ready', hd);
    }
    for (const d of DAILY){
      const row = $('#dq-' + d.key), v = S.quest.dp[d.key] || 0, got = S.quest.dgot.includes(d.key);
      row.querySelector('.meter i').style.width = Math.min(100, v / d.goal * 100).toFixed(1) + '%';
      const bt = row.querySelector('.btn');
      setText(bt, got ? '받음' : v >= d.goal ? '받기' : `${fmt(Math.min(v, d.goal))}/${fmt(d.goal)}`);
      bt.disabled = got || v < d.goal; bt.classList.toggle('primary', !got && v >= d.goal);
    }
    const ab = $('#dAll'); ab.disabled = !dailyAllReady(); setText(ab, S.quest.dall ? '오늘 보상을 모두 받았어요' : '모두 완료 보상 받기');
    const t = new Date(now()), left = (new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1) - t) / 1000;
    setText($('#dReset'), `${fmtTime(left)} 뒤 새로 고침`);
  };
}

// 지난 이야기 다시 보기
function openReplay(){
  const done = Math.min(S.quest.main, MAIN_Q.length);
  let html = '<p>이미 지나온 이야기를 다시 볼 수 있어요.</p><button class="btn sm" data-rp="pro" style="margin-bottom:8px">프롤로그</button>';
  let ch = -1;
  for (let i = 0; i < done; i++){
    const q = MAIN_Q[i];
    if (q.ch !== ch){ ch = q.ch; html += `<div class="opt-l">${CHAPTERS[ch]}</div>`; }
    html += `<button class="chip" data-rp="${i}" style="margin:0 4px 6px 0">▶ ${q.t}</button>`;
  }
  if (!done) html += '<p class="small">아직 지나온 이야기가 없어요.</p>';
  showModal('이야기 다시 보기', html, [{label:'닫기', primary:true}], () => {
    $('#mBody').querySelectorAll('[data-rp]').forEach(bt => bt.addEventListener('click', () => {
      hideModal();
      const v = bt.dataset.rp;
      if (v === 'pro') playCut(PROLOGUE, {title:'프롤로그'});
      else { const q = MAIN_Q[+v]; playCut([q.c], {title:`${CHAPTERS[q.ch]} · ${q.t}`}); }
    }));
  });
}

function partyLine(m){ return `${esc(m.name)}(${CLASSES[m.cls].name}${m.npc ? '·NPC' : '·내 캐릭터'})`; }
function buildRaid(){
  const open = raidUnlocked(), n = Math.min(S.world ? 10 : 10, Math.max(3, open + 2));
  const cards = [];
  for (let i = 0; i < n; i++){
    const info = raidAt(i), locked = i >= open;
    cards.push(`<div class="card${locked ? ' locked' : ''}" id="raid-${i}">
      <div class="ct">${info.label}<span class="tag">Lv.${info.req} · ${info.party}인 파티</span></div>
      <div class="dl"><span>보스</span><b>${info.bossName}</b></div>
      <div class="dl"><span>보상</span><b>보석 ${info.gems} · 엽전 · ${GRADES[info.g].name} 장비</b></div>
      ${S.raid.first[info.key] ? '' : `<div class="dl"><span>첫 클리어</span><b style="color:var(--gold)">보석 +${info.firstGems} · ${GRADES[Math.min(info.hell ? 4 : 3, info.g + 1)].name} 장비 1개 더</b></div>`}
      <button class="btn primary" data-i="${i}"></button>
    </div>`);
  }
  panel.innerHTML = `
    <div class="ph"><h2>레이드</h2><span class="small" id="tkInfo"></span></div>
    <p class="hint">${S.world === 2 ? '천계에서는 레벨 30마다 영웅 레이드가 열려요. 옛이야기·역사 속 영웅과 신들이 용사를 시험해요.' : S.world ? '저승에서는 레벨 20마다 시왕(十王) 레이드가 열려요.' : '레벨 10마다 새 레이드가 열려요.'} 나와 이 기기의 다른 캐릭터, NPC 동료가 함께 자동으로 싸워요. ${RAID_TIME}초 안에 보스를 쓰러뜨리면 성공! 깨면 토벌패 1개를 쓰고(최대 ${TICKET_MAX}개, ${TICKET_REGEN / 60000}분마다 1개 충전), 실패하면 돌려받아요.</p>
    <div id="tbBox"></div>
    <div id="raidLive"></div>
    ${cards.join('')}`;
  panel.querySelectorAll('.card .btn[data-i]').forEach(bt => bt.addEventListener('click', () => confirmRaid(+bt.dataset.i)));
  $('#tbBox').addEventListener('click', e => {
    const bt = e.target.closest('[data-tb]');
    if (!bt) return;
    if (bt.dataset.tb === 'join'){ tbJoin(); addLog('타임 보스 참가를 알렸어요. 다른 사람이 모이길 기다려요.', 'good'); return; }
    if (startTimeBoss(bt.dataset.tb)) buildTab('raid');
  });
  return () => {
    const w = tbWindow(), users = tbUsers(), others = tbOthers();
    const tbLeft = w.open ? w.end - now() : w.next - now();
    setHTML($('#tbBox'), `<div class="card ${w.open && !raid ? 'ready' : ''}">
      <div class="ct">타임 보스 · ${w.open ? w.boss.name : TB_SLOTS[(w.slot + 1) % 8].name}<span class="tag">${w.open ? `${fmtTime(tbLeft / 1000)} 뒤 사라짐` : `${new Date(w.next).getHours()}시에 나타남 (${fmtTime(tbLeft / 1000)})`}</span></div>
      <p class="story">00시부터 3시간마다 30분 동안 나타나요. <b>2명 이상</b> 모여야 도전할 수 있고, 엽전을 많이 주며 아주 드물게 귀걸이·팔찌·신화 보물을 떨궈요.</p>
      <div class="dl"><span>참가자</span><b>${users}명 (${['나'].concat(others.map(o => o.name + (o.live ? '' : '·이 기기'))).join(', ')})</b></div>
      ${room ? '<button class="btn sm" data-tb="join">참가한다고 알리기</button>' : `<p class="small">${users < 2 ? '지금은 같은 기기의 다른 계정 캐릭터가 함께 참가해요. 온라인 서버에 연결되면 다른 용사들과 모일 수 있어요.' : ''}</p>`}
      <div class="dbtns">${['normal', 'hell'].map(d => { const why = tbCan(d); return `<button class="btn ${why ? '' : 'primary'}" data-tb="${d}" ${why ? 'disabled' : ''}>${TB_DIFF[d].name} 도전${why ? `<br><small style="font-weight:600">${why}</small>` : ''}</button>`; }).join('')}</div>
    </div>`);
    const live = $('#raidLive');
    if (raid){
      const rows = [`<div><span>${esc(S.name || '나')} (나·${cls().name})</span><div class="meter"><i style="width:${(hero.hp / ST.maxHp * 100).toFixed(1)}%"></i></div></div>`]
        .concat(raid.allies.map(a => `<div><span class="${a.down ? 'down' : ''}">${esc(a.name)}${a.down ? ' (쓰러짐)' : ''}</span><div class="meter"><i style="width:${(a.hp / a.maxHp * 100).toFixed(1)}%"></i></div></div>`));
      setHTML(live, `<div class="card ready"><div class="ct">토벌 중 · ${raid.info.label}<span class="tag">${Math.max(0, Math.ceil(raid.time))}초 남음</span></div>
        <div class="dl"><span>${raid.info.bossName}</span><b>${Math.max(0, raid.boss.hp / raid.boss.maxHp * 100).toFixed(1)}%</b></div>
        <div class="meter fire"><i style="width:${Math.max(0, raid.boss.hp / raid.boss.maxHp * 100).toFixed(1)}%"></i></div>
        <div class="party">${rows.join('')}</div></div>`);
    } else setHTML(live, '');
    const tk = raidTickets(), left = ticketLeft();
    setText($('#tkInfo'), `토벌패 ${'■'.repeat(tk)}${'□'.repeat(TICKET_MAX - tk)} ${tk}/${TICKET_MAX}${left ? ` · ${fmtTime(left / 1000)} 뒤 충전` : ''}`);
    panel.querySelectorAll('.card .btn[data-i]').forEach(bt => {
      const i = +bt.dataset.i, info = raidAt(i);
      let t, dis = true;
      if (i >= raidUnlocked()) t = `Lv.${info.req}에 열려요`;
      else if (raid) t = raid.info.i === i ? '토벌 중' : '다른 토벌 중';
      else if (tk <= 0) t = `토벌패 충전까지 ${fmtTime(left / 1000)}`;
      else { t = '입장 (토벌패 1개)'; dis = false; }
      setText(bt, t); bt.disabled = dis;
      $('#raid-' + i).classList.toggle('ready', !dis);
    });
  };
}
function confirmRaid(i){
  if (!raidReady(i) || raid) return;
  const info = raidAt(i), party = raidParty(info);
  const own = party.filter(m => m.own).length;
  showModal(`${info.label} 토벌`, `
    <p><b>${info.bossName}</b>${josa(info.bossName, '이', '가')} 기다려요. ${info.party}인 파티로 자동 전투를 해요.</p>
    <ol class="plist"><li><b>${esc(S.name || '나')}</b> (나·${cls().name} Lv.${S.level})</li>${party.map(m => `<li>${partyLine(m)}</li>`).join('')}</ol>
    <p class="small" style="margin-top:8px">${own ? `이 기기의 다른 캐릭터 ${own}명이 함께해요. ` : ''}NPC 동료의 힘은 내 용사에 맞춰져요. 무사는 보스의 공격을 받아 주고, 도인은 파티를 치유해요. 깨면 토벌패 1개를 써요(지금 ${raidTickets()}개).</p>`,
    [{label:'취소'}, {label:'출발', primary:true, fn:() => { if (startRaid(i)) buildTab('raid'); }}]);
}

/* ================= 계정 =================
   서버가 없는 정적 페이지라 계정은 이 기기(브라우저)에 저장한다. 비밀번호는 그대로 두지 않고 소금(salt)을 쳐서 해시로만 남긴다.
   claude.ai 아티팩트로 열면 Claude 계정의 개인 저장소(data/users/<id>/)에도 같이 올려서 다른 기기에서 이어진다. */
const ID_RE = /^[a-z0-9_]{4,12}$/;
const NAME_RE = /^[가-힣a-zA-Z0-9]{2,8}$/;
let REG = null, curAcc = null, regDirty = false, modalLock = false, loginBusy = false;
const emptyReg = () => ({v:1, accounts:{}, keep:null, legacyClaimed:false, t:0});
function loadReg(){
  try {
    const d = JSON.parse(localStorage.getItem(ACC_KEY) || 'null');
    if (d && d.v === 1 && d.accounts && typeof d.accounts === 'object'){
      const r = Object.assign(emptyReg(), d);
      for (const A of Object.values(r.accounts)) if (!Array.isArray(A.chars)) A.chars = [];
      return r;
    }
  } catch (e) {}
  return emptyReg();
}
function saveReg(){
  REG.t = now(); regDirty = true;
  try { localStorage.setItem(ACC_KEY, JSON.stringify(REG)); } catch (e) {}
}
function writeSession(o){ try { if (o) sessionStorage.setItem(SESSION_KEY, JSON.stringify(o)); else sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
function readSession(){ try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; } }
function randHex(n){
  const a = new Uint8Array(n);
  try { crypto.getRandomValues(a); } catch (e) { for (let i = 0; i < n; i++) a[i] = Math.random() * 256 | 0; }
  return Array.from(a, x => x.toString(16).padStart(2, '0')).join('');
}
async function hashPw(pw, salt, alg){
  if (alg !== 'f'){
    try {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:enc.encode(salt), iterations:60000, hash:'SHA-256'}, key, 256);
      return 'p:' + Array.from(new Uint8Array(bits), x => x.toString(16).padStart(2, '0')).join('');
    } catch (e) { if (alg === 'p') return null; }
  }
  // 아주 오래된 브라우저용 예비 해시
  let h1 = 0x9e3779b9, h2 = 0x85ebca6b;
  const s = salt + ':' + pw;
  for (let r = 0; r < 3000; r++) for (let i = 0; i < s.length; i++){
    const c = s.charCodeAt(i) + r;
    h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); h1 ^= h2 >>> 15; h2 ^= h1 >>> 13;
  }
  return 'f:' + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}
const allChars = () => Object.entries(REG.accounts).flatMap(([acc, A]) => (A.chars || []).map(c => Object.assign({acc}, c)));
let cloudLegacy = null;
// 계정이 생기기 전에 하던 모험(예전 저장)을 찾는다
function legacyCandidate(){
  if (REG.legacyClaimed) return null;
  let best = null;
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (d && d.v === 1 && d.chosen) best = {data:d, t:d.lastSave || 0}; } catch (e) {}
  if (cloudLegacy && cloudLegacy.t > (best ? best.t : -1)) best = cloudLegacy;
  return best && {data:best.data, level:Math.floor(best.data.level) || 1, stage:Math.floor(best.data.maxStage) || 1};
}

    : '계정은 이 기기(브라우저)에 저장돼요. 다른 기기나 다른 브라우저에서는 새로 만들어야 해요.';

async function submitLogin(signup){
  if (loginBusy) return;
  const id = ($('#lg-id').value || '').trim().toLowerCase(), pw = $('#lg-pw').value || '', keep = $('#lg-keep').checked;
  const err = m => setText($('#lg-err'), m);
  if (!ID_RE.test(id)) return err('아이디는 영문 소문자·숫자·밑줄(_)로 4~12자예요.');
  if (pw.length < 4) return err('비밀번호는 4자 이상이에요.');
  if (signup){
    if (pw !== $('#lg-pw2').value) return err('비밀번호 확인이 서로 달라요.');
    if (REG.accounts[id]) return err('이미 있는 아이디예요. 다른 아이디를 쓰거나 로그인해 주세요.');
  } else if (!REG.accounts[id] && !onlineWanted()) return err(cloud ? '없는 아이디예요. [새 계정 만들기]를 눌러 주세요.' : '이 기기에 없는 아이디예요. [새 계정 만들기]를 눌러 주세요.');
  loginBusy = true; err('');
  const btn = $('#mBtns .primary');
  if (btn){ btn.disabled = true; btn.textContent = '확인 중…'; }
  try {
    let srv = null;                       // 온라인 서버가 준 로그인 표(토큰)
    onlineNote = '';
    if (onlineWanted()){
      try { srv = await rpc(signup ? 'samhan_signup' : 'samhan_login', {p_id:id, p_pw:pw}); }
      catch (e) {
        const A = REG.accounts[id];
        if (e.code === 'id_taken') return err('이미 서버에 있는 아이디예요. 다른 아이디를 쓰거나 [로그인]해 주세요.');
        if (e.code === 'bad_login'){
          // 서버가 생기기 전에 이 기기에서만 만든 계정이면 서버로 옮긴다
          if (!(A && (await hashPw(pw, A.salt, A.hash[0])) === A.hash)) return err('아이디나 비밀번호가 맞지 않아요.');
          try { srv = await rpc('samhan_signup', {p_id:id, p_pw:pw}); onlineNote = '이 기기의 계정을 온라인 서버로 옮겼어요. 이제 다른 기기에서도 이 아이디로 들어올 수 있어요.'; }
          catch (e2) {
            if (e2.code === 'id_taken') return err('서버에 같은 아이디가 이미 있어요(비밀번호가 달라요). 서버 비밀번호로 로그인하거나 다른 아이디로 새로 만들어 주세요.');
            onlineNote = '지금은 서버에 연결할 수 없어 이 기기에만 저장해요. 다시 연결되면 서버에 올려요.';
          }
        } else if (e.code !== 'net') return err('서버에서 받아 주지 않았어요. 아이디·비밀번호 규칙을 확인해 주세요.');
        else if (!signup && !A) return err('서버에 연결할 수 없어요. 인터넷 연결을 확인하고 다시 시도해 주세요.');
        else onlineNote = '지금은 서버에 연결할 수 없어 이 기기에만 저장해요. 다시 연결되면 서버에 올려요.';
      }
    }
    if (signup || srv){
      // 새 계정이거나 서버 로그인에 성공: 이 기기에도 같은 비밀번호로 계정을 둔다(인터넷이 끊겨도 들어올 수 있게)
      const salt = randHex(16), hash = await hashPw(pw, salt), A = REG.accounts[id];
      if (A) Object.assign(A, {salt, hash, t:now()}); else REG.accounts[id] = {salt, hash, created:now(), t:now(), chars:[]};
    } else {
      const A = REG.accounts[id], h = await hashPw(pw, A.salt, A.hash[0]);
      if (!h) return err('이 브라우저에서는 비밀번호를 확인할 수 없어요. 다른 브라우저로 열어 주세요.');
      if (h !== A.hash) return err('비밀번호가 맞지 않아요.');
    }
    curAcc = id;
    REG.keep = keep ? {acc:id} : null;
    saveReg(); writeSession({acc:id});
    if (srv){
      online = {acc:id, token:srv}; saveOnline(keep);
      try { await syncChars(id); } catch (e) { if (e.code === 'bad_token') lostOnline(); }
    }
    showCharSelect(onlineNote || (signup ? '계정을 만들었어요! 이제 캐릭터를 만들어 볼까요?' : ''));
    onlineNote = '';
  } finally {
    loginBusy = false;
    if (btn && btn.isConnected){ btn.disabled = false; btn.textContent = signup ? '계정 만들기' : '게임 시작'; }
  }
}

async function onlineRoom(){
  const sb = await onlineClient(), me = randHex(6), hs = {}, peerFns = [];
  const ch = sb.channel('samhan-world', {config:{broadcast:{self:false}, presence:{key:me}}});
  for (const topic of ['chat', 'tb']) ch.on('broadcast', {event:topic}, msg => {
    const p = msg && msg.payload && typeof msg.payload === 'object' ? msg.payload : {};
    for (const fn of hs[topic] || []) fn({data:p.d, peer:String(p.p || '').slice(0, 16)});
  });
  ch.on('presence', {event:'sync'}, () => { const n = Object.keys(ch.presenceState() || {}).length; for (const f of peerFns) f({peers:new Array(n).fill(0)}); });
  await new Promise((res, rej) => {
    const to = setTimeout(() => rej(new Error('timeout')), 9000);
    ch.subscribe(st => {
      if (st === 'SUBSCRIBED'){ clearTimeout(to); Promise.resolve(ch.track({t:Date.now()})).catch(() => {}); res(); }
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED'){ clearTimeout(to); rej(new Error(st)); }
    });
  });
  return {
    on(topic, fn){ (hs[topic] = hs[topic] || []).push(fn); return () => {}; },
    onPeers(fn){ peerFns.push(fn); return () => {}; },
    emit(topic, data){ return Promise.resolve(ch.send({type:'broadcast', event:topic, payload:{d:data, p:me}})).then(r => { if (r && r !== 'ok') throw Object.assign(new Error(String(r)), {code:String(r)}); }); },

    if (k.cid && REG.accounts[k.acc].chars.some(c => c.cid === k.cid)) enterChar(k.cid);
    else showCharSelect();
    return;
  }
  showLogin(Object.keys(REG.accounts).length ? 'login' : 'signup');
}

/* ================= 소리: 국악풍 배경음악·효과음 =================
   음원 파일 없이 Web Audio로 직접 연주한다(저작권 걱정 없음, 오프라인에서도 남).
   가야금(뜯는 소리)·대금(부는 소리)·장구(덩·쿵·덕)·징. 이승은 평조, 저승은 계면조 느낌의 5음 음계.
   브라우저 규칙상 화면을 한 번 눌러야 소리가 난다. */
const AUD_KEY = 'samhan-audio';
const AUD = {ctx:null, master:null, bgm:null, fx:null, noise:null, track:'', next:0, step:0, phrase:[], deg:0, lastHit:0, set:{bgm:true, sfx:true, bv:0.5, sv:0.7}};
try { Object.assign(AUD.set, JSON.parse(localStorage.getItem(AUD_KEY) || '{}')); } catch (e) {}
function audSave(){ try { localStorage.setItem(AUD_KEY, JSON.stringify(AUD.set)); } catch (e) {} audApply(); }
function audApply(){
  if (!AUD.ctx) return;
  const t = AUD.ctx.currentTime;
  AUD.bgm.gain.setTargetAtTime(AUD.set.bgm ? AUD.set.bv * 0.55 : 0, t, 0.2);
  AUD.fx.gain.setTargetAtTime(AUD.set.sfx ? AUD.set.sv * 0.8 : 0, t, 0.05);
}
function audInit(){
  if (AUD.ctx) { if (AUD.ctx.state === 'suspended') AUD.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const c = AUD.ctx = new AC();
  AUD.master = c.createGain(); AUD.master.gain.value = 0.9; AUD.master.connect(c.destination);
  AUD.bgm = c.createGain(); AUD.bgm.connect(AUD.master);
  AUD.fx = c.createGain(); AUD.fx.connect(AUD.master);
  const len = c.sampleRate, nb = c.createBuffer(1, len, c.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  AUD.noise = nb;
  audApply();
  AUD.next = c.currentTime + 0.1;
  setInterval(audTick, 60);
}
document.addEventListener('pointerdown', audInit, true);
document.addEventListener('keydown', audInit, true);
const hz = midi => 440 * Math.pow(2, (midi - 69) / 12);
// 악기
function pluck(out, t, midi, dur, vol){
  const c = AUD.ctx, o1 = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
  const fq = hz(midi);
  o1.type = 'triangle'; o2.type = 'sawtooth'; o2.detune.value = 6;
  o1.frequency.setValueAtTime(fq * 1.02, t); o1.frequency.exponentialRampToValueAtTime(fq, t + 0.07);   // 농현처럼 살짝 꺾임
  o2.frequency.setValueAtTime(fq * 1.02, t); o2.frequency.exponentialRampToValueAtTime(fq, t + 0.07);
  f.type = 'lowpass'; f.frequency.setValueAtTime(3200, t); f.frequency.exponentialRampToValueAtTime(500, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const g2 = c.createGain(); g2.gain.value = 0.35;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(f); f.connect(out);
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}
function flute(out, t, midi, dur, vol){
  const c = AUD.ctx, o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), g = c.createGain();
  o.type = 'sine'; o.frequency.value = hz(midi);
  lfo.frequency.value = 5; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(hz(midi) * 0.012, t + dur * 0.6);
  lfo.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.09); g.gain.setValueAtTime(vol, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const n = c.createBufferSource(), nf = c.createBiquadFilter(), ng = c.createGain();
  n.buffer = AUD.noise; nf.type = 'bandpass'; nf.frequency.value = hz(midi) * 2; nf.Q.value = 3; ng.gain.value = vol * 0.25;
  n.connect(nf); nf.connect(ng); ng.connect(g);
  o.connect(g); g.connect(out);
  o.start(t); lfo.start(t); n.start(t, Math.random() * 0.5); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05); n.stop(t + dur + 0.05);
}
function drum(out, t, kind, vol){
  const c = AUD.ctx;
  if (kind === 'dung' || kind === 'kung'){
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(kind === 'dung' ? 110 : 90, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.25);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.4);
  }
  if (kind === 'dung' || kind === 'deok'){
    const n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    n.buffer = AUD.noise; f.type = 'bandpass'; f.frequency.value = kind === 'deok' ? 2600 : 1800; f.Q.value = 1.2;
    g.gain.setValueAtTime(vol * (kind === 'deok' ? 0.9 : 0.6), t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    n.connect(f); f.connect(g); g.connect(out); n.start(t, Math.random()); n.stop(t + 0.12);
  }
}
function gong(out, t, vol){
  const c = AUD.ctx;
  for (const [fq, v] of [[98, 1], [101.5, 0.7], [196, 0.3]]){
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = fq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * v, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 3.3);
  }
}
// 곡: 박자 길이·음계·장단(장구 무늬)·밑음
const TRACKS = {
  title:{step:0.5, root:55, scale:[0, 2, 5, 7, 9], drums:['dung', '', '', '', '', '', 'kung', '', '', '', 'deok', ''], mel:'flute', melEvery:2, arp:true},
  field:{step:0.24, root:55, scale:[0, 2, 5, 7, 9], drums:['dung', '', 'deok', 'kung', '', 'deok', 'dung', 'deok', 'deok'], mel:'pluck', melEvery:1, arp:false},
  battle:{step:0.16, root:57, scale:[0, 3, 5, 7, 10], drums:['dung', 'deok', 'deok', 'dung', 'kung', 'deok', 'dung', 'deok'], mel:'pluck', melEvery:1, arp:true},
  hell:{step:0.42, root:52, scale:[0, 3, 5, 7, 10], drums:['dung', '', '', '', 'kung', '', '', ''], mel:'flute', melEvery:2, drone:true},
};
function wantTrack(){
  if (!session) return 'title';
  if (cut) return S.world === 1 ? 'hell' : 'title';
  if (raid || bossActive) return 'battle';
  return S.world === 1 ? 'hell' : S.world === 2 ? 'title' : 'field';
}
function audTick(){
  const c = AUD.ctx;
  if (!c || c.state !== 'running') return;
  const want = wantTrack();
  if (want !== AUD.track){
    AUD.track = want; AUD.step = 0; AUD.phrase = []; AUD.next = Math.max(AUD.next, c.currentTime + 0.05);
    if (want === 'battle' && AUD.set.bgm) gong(AUD.bgm, c.currentTime + 0.05, 0.25);
  }
  if (!AUD.set.bgm){ AUD.next = c.currentTime + 0.1; return; }
  const T = TRACKS[AUD.track];
  while (AUD.next < c.currentTime + 0.25){
    const t = AUD.next, st = AUD.step;
    const dk = T.drums[st % T.drums.length];
    if (dk) drum(AUD.bgm, t, dk, dk === 'deok' ? 0.18 : 0.32);
    if (st % T.melEvery === 0){
      if (!AUD.phrase.length){
        // 새 가락: 음계 안에서 한두 칸씩 움직이고, 끝은 으뜸음으로
        const n = 6 + ((Math.random() * 5) | 0), ph = [];
        let dg = AUD.deg || 5;
        for (let i = 0; i < n; i++){ dg = Math.max(0, Math.min(10, dg + [-2, -1, -1, 1, 1, 2, 0][(Math.random() * 7) | 0])); ph.push(Math.random() < 0.18 ? null : dg); }
        ph.push(5); ph.push(null); ph.push(null);
        AUD.phrase = ph; AUD.deg = dg;
      }
      const dg = AUD.phrase.shift();
      if (dg != null){
        const midi = T.root + 12 + T.scale[dg % 5] + 12 * Math.floor(dg / 5) - 12;
        if (T.mel === 'flute') flute(AUD.bgm, t, midi + 12, T.step * T.melEvery * 1.8, 0.13);
        else pluck(AUD.bgm, t, midi + 12, 0.9, 0.16);
      }
    }
    if (T.arp && st % 4 === 0) pluck(AUD.bgm, t, T.root + T.scale[(st / 4) % 5 | 0], 1.4, 0.09);
    if (T.drone && st % 16 === 0) flute(AUD.bgm, t, T.root - 12, T.step * 16, 0.07);
    AUD.next += T.step; AUD.step++;
  }
}
// 효과음
const SFX_GAP = {hit:0.07, crit:0.08, blip:0.06, click:0.05, kill:0.08, gem:0.1};
const sfxLast = {};
sfx = function(name){
  const c = AUD.ctx;
  if (!c || !AUD.set.sfx || c.state !== 'running') return;
  const t = c.currentTime;
  if (SFX_GAP[name] && t - (sfxLast[name] || 0) < SFX_GAP[name]) return;
  sfxLast[name] = t;
  const o = AUD.fx, P5 = [0, 2, 5, 7, 9];
  switch (name){
    case 'hit': drum(o, t, 'deok', 0.12); break;
    case 'crit': drum(o, t, 'deok', 0.2); pluck(o, t, 84, 0.25, 0.12); break;
    case 'kill': pluck(o, t, 88, 0.2, 0.08); pluck(o, t + 0.05, 93, 0.25, 0.08); break;
    case 'gem': pluck(o, t, 91, 0.6, 0.14); pluck(o, t + 0.08, 96, 0.8, 0.12); break;
    case 'level': P5.concat([12]).forEach((d, i) => pluck(o, t + i * 0.07, 67 + d, 0.6, 0.15)); break;
    case 'boss': gong(o, t, 0.4); drum(o, t, 'dung', 0.5); break;
    case 'win': [0, 5, 9, 12].forEach((d, i) => pluck(o, t + i * 0.1, 67 + d, 0.8, 0.16)); drum(o, t, 'dung', 0.4); break;
    case 'fail': [7, 5, 2, 0].forEach((d, i) => flute(o, t + i * 0.18, 60 + d, 0.3, 0.1)); break;
    case 'skill': { const n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); n.buffer = AUD.noise; f.type = 'bandpass'; f.Q.value = 2;
      f.frequency.setValueAtTime(600, t); f.frequency.exponentialRampToValueAtTime(3000, t + 0.25); g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      n.connect(f); f.connect(g); g.connect(o); n.start(t); n.stop(t + 0.32); break; }
    case 'nuke': drum(o, t, 'dung', 0.6); drum(o, t + 0.12, 'kung', 0.5); sfx('skill'); break;
    case 'quest': [0, 2, 5, 7].forEach((d, i) => pluck(o, t + i * 0.06, 72 + d, 0.5, 0.13)); break;
    case 'rare': [0, 5, 9, 12, 17, 21].forEach((d, i) => pluck(o, t + i * 0.07, 72 + d, 0.9, 0.14)); gong(o, t, 0.15); break;
    case 'summon': [0, 2, 5, 7, 9].forEach((d, i) => pluck(o, t + i * 0.05, 72 + d, 0.4, 0.1)); break;
    case 'refOk': pluck(o, t, 96, 0.5, 0.2); pluck(o, t + 0.05, 91, 0.7, 0.15); break;
    case 'refNo': drum(o, t, 'kung', 0.4); break;
    case 'raid': gong(o, t, 0.35); [0, 1, 2, 3].forEach(i => drum(o, t + 0.3 + i * 0.12, i % 2 ? 'deok' : 'dung', 0.35)); break;
    case 'awaken': gong(o, t, 0.5); [0, 5, 7, 12, 17, 19, 24].forEach((d, i) => pluck(o, t + i * 0.04, 60 + d, 1.2, 0.15)); break;
    case 'form': [0, 7, 12, 19].forEach((d, i) => flute(o, t + i * 0.06, 72 + d, 0.6, 0.1)); break;
    case 'rebirth': gong(o, t, 0.5); [12, 7, 5, 0, -5].forEach((d, i) => flute(o, t + 0.3 + i * 0.25, 60 + d, 0.6, 0.1)); break;
    case 'potion': flute(o, t, 79, 0.25, 0.1); break;
    case 'cut': gong(o, t, 0.18); break;
    case 'blip': pluck(o, t, 86, 0.12, 0.05); break;
    case 'click': pluck(o, t, 81, 0.1, 0.06); break;
  }
};
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('.btn,.chip,.tab,.seg button,.gbtn,.ccard,.char')) sfx('click'); });

/* ================= 시작 ================= */
let last = performance.now();
function loop(ts){
  let dt = (ts - last) / 1000; last = ts;
  if (dt > 0.25) dt = 0.25;
  if (cut){ updateCut(dt); shake = Math.max(0, shake - dt); }
  else if (dt > 0){
    for (let i = 0; i < S.speed; i++){
      let rem = dt;
      while (rem > 0){ const step = Math.min(rem, 0.05); update(step); rem -= step; }
    }
  }
  if (session && dt > 0){ tickBuffs(dt); npcChatter(dt); }
  if (heroSay){ heroSay.t -= dt; if (heroSay.t <= 0) heroSay = null; }
  render(); updateHud();
  requestAnimationFrame(loop);
}
function start(hotData){
  REG = loadReg();

  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv.parentElement);

}
if (location.search.indexOf('simtest') >= 0){
  window.__game = {
    get S(){ return S; }, get ST(){ return ST; }, get hero(){ return hero; }, get mobs(){ return mobs; }, get bossActive(){ return bossActive; }, get raid(){ return raid; }, get session(){ return session; },
    update, buyStat, upgradeSkill, summon, mergeAll, equipBest, skillCost, buyInfo, SKILLS, setClass, render,
    petSummon, petUpgrade, petEquipBest, petUpCost, PETS, PET_TYPE_ORDER, eqPet, refineTry, refineGold, refineGems, REFINE_MAX,
    claimAll, startRaid, raidReady, raidUnlocked, firstReadyRaid, raidInfo, buildTab,

    addTime(ms){ clockSkew += ms; }, quiet:false,
    sheet(){ return {hero:CLASS_ORDER.map(c => ['down', 'up', 'right'].map(d => [0, 1, 2, 3].map(f => heroSprite(c, d, f).toDataURL()))), mobs:Object.keys(MOB_HD).map(t => [mobSprite(t, '#8a8a8a', 0, false).toDataURL(), mobSprite(t, '#8a8a8a', 1, false).toDataURL()]), pets:PETS.map((p, i) => [petSprite(i, 0).toDataURL(), petSprite(i, 1).toDataURL()])}; },
    setStage(s){ S.stage = s; mapCache.clear(); resetRuntime(); },
    lookSheet(){ const out = [], L = S.look; for (let g = -1; g <= 4; g++) out.push(lookPreview(S.cls, L, g, g, 'down')); for (let g = 2; g <= 4; g++) out.push(lookPreview(S.cls, L, g, g, 'right')); out.push(lookPreview(S.cls, L, 4, 4, 'up'));
      for (const F of FORMS) for (const d of ['down', 'right', 'up']) out.push(lookPreview(S.cls, L, 3, 3, d, {form:F.k, ear:4, brace:3})); return out; },

    // 피해 측정: 안 죽는 보스 하나(또는 몬스터 6마리)를 sec초 동안 때린다. 초당 피해·가장 큰 한 방을 돌려준다
    bench(sec, pack, each){

      if (pack){ for (let k = 0; k < 6; k++) mk(false, 9 + (k % 3), 7 + Math.floor(k / 3) * 2); bossActive = false; }
