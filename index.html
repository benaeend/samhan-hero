// 꾸미기 상자: 상자에서 나오는 아바타 중 하나(이미 있으면 보석으로)
function openAvatarBox(){
  if (S.gems < AV_BOX) return null;
  S.gems -= AV_BOX;
  const box = AVATARS.filter(a => a.src === 'box');
  const rare = box.filter(a => a.type !== 'pet' && !S.av.own[a.k]);
  S.avPity = (S.avPity || 0) + 1;
  let type;
  if (S.avPity >= AV_PITY && rare.length) type = 'pity';
  else { let r = Math.random() * 100 / (window.__game && window.__game.avLuck || 1); type = 'miss'; for (const [t, p] of AV_ODDS){ if (r < p){ type = t; break; } r -= p; } }
  if (type === 'miss'){ S.inv.potion = Math.min(999, S.inv.potion + 10); return {miss:true, pity:S.avPity}; }
  const pool = type === 'pity' ? rare : box.filter(a => a.type === type), a = pool[(Math.random() * pool.length) | 0];
  const isNew = !S.av.own[a.k];
  if (isNew && a.type !== 'pet') S.avPity = 0;
  giveAvatar(a.k);
  return {a, isNew, pity:type === 'pity'};
}

    const [w, h, draw] = hd, cnv = document.createElement('canvas'); cnv.width = w + 4; cnv.height = h + 4; const g = cnv.getContext('2d'); g.translate(2, 2); draw(g, f, color, boss);

  waterfall(g, x, y){ gPoly(g, [[x - 14, y], [x + 14, y], [x + 10, y - 26], [x - 10, y - 26]], '#8a7a6a'); gPoly(g, [[x - 5, y - 26], [x + 5, y - 26], [x + 6, y], [x - 6, y]], '#8fd0ff'); for (let i = 0; i < 4; i++) gPoly(g, [[x - 3 + i * 2, y - 24], [x - 2.4 + i * 2, y - 24], [x - 2 + i * 2, y], [x - 2.6 + i * 2, y]], '#e8f6ff'); gEll(g, x, y + 1, 9, 2.6, '#cfeaff'); },
  redpillar(g, x, y){ gShadow(g, x, y, 4); gPoly(g, [[x - 2.4, y], [x + 2.4, y], [x + 2.4, y - 26], [x - 2.4, y - 26]], '#c8382f'); gPoly(g, [[x + 0.8, y], [x + 2.4, y], [x + 2.4, y - 26], [x + 0.8, y - 26]], '#9a2a24'); gPoly(g, [[x - 3.6, y - 26], [x + 3.6, y - 26], [x + 3, y - 29], [x - 3, y - 29]], '#ffd24a'); gPoly(g, [[x - 3.4, y], [x + 3.4, y], [x + 3, y - 2], [x - 3, y - 2]], '#e8e0c8'); },

/* 지역별 풍경: 판 뒤(위쪽)와 앞(아래쪽) 빈터에 소품을 놓는다 */
function isoScenery(t, rnd){
  const back = [], front = [];
  const spotBack = (n, minX = 4, maxX = MW - 4, gap = 6) => { const out = []; for (let k = 0; k < n * 6 && out.length < n; k++){ const x = minX + rnd() * (maxX - minX), y = 18 + rnd() * (edgeTop(x) - 18 - gap); if (y > 18) out.push([x, y]); } return out; };
  const spotFront = (n, gap = IDEP + 5) => { const out = []; for (let k = 0; k < n * 8 && out.length < n; k++){ const x = 2 + rnd() * (MW - 4), y = edgeBot(x) + gap + rnd() * (MH - edgeBot(x) - gap); if (y < MH - 1 && y > edgeBot(x) + gap) out.push([x, y]); } return out; };
  const P2 = (arr, fn) => { for (const [x, y] of arr) back.push([y, g => fn(g, x, y)]); };
  const F2 = (arr, fn) => { for (const [x, y] of arr) front.push([y, g => fn(g, x, y)]); };
  if (t === 'village'){
    back.push([40, g => PROPS.house(g, 62, 40, 'thatch')], [58, g => PROPS.house(g, 236, 58, 'tile')]);
    P2(spotBack(6), (g, x, y) => PROPS.tree(g, x, y, 0.8 + rnd() * 0.3));
    back.push([44, g => PROPS.fence(g, 140, 40, 9)]);
    P2(spotBack(5), (g, x, y) => PROPS.flowers(g, x, y, rnd));
    F2(spotFront(8), (g, x, y) => rnd() < 0.5 ? PROPS.flowers(g, x, y, rnd) : PROPS.grass(g, x, y));
  } else if (t === 'bamboo'){
    P2(spotBack(16, 4, W - 4, 3), (g, x, y) => PROPS.bamboo(g, x, y, 0.8 + rnd() * 0.4));
    F2(spotFront(6), (g, x, y) => PROPS.grass(g, x, y, '#4f8a3f'));
  } else if (t === 'rock'){
    P2(spotBack(9), (g, x, y) => PROPS.rock(g, x, y, 0.9 + rnd() * 0.8, ['#9a8a7a', '#8a7a6a', '#a89a88'][(rnd() * 3) | 0]));
    P2(spotBack(4), (g, x, y) => PROPS.pine(g, x, y, 0.7));
    F2(spotFront(6), (g, x, y) => PROPS.rock(g, x, y, 0.5 + rnd() * 0.4));
  } else if (t === 'swamp'){
    P2(spotBack(4), (g, x, y) => PROPS.deadtree(g, x, y));
    P2(spotBack(10), (g, x, y) => PROPS.reeds(g, x, y));
    F2(spotFront(8), (g, x, y) => PROPS.reeds(g, x, y));
  } else if (t === 'cave'){
    for (const [tx, ty] of CAVE_TORCH) back.push([ty, g => PROPS.torch(g, tx, ty)]);
    P2(spotBack(10), (g, x, y) => PROPS.stalag(g, x, y, 0.7 + rnd() * 0.6));
    P2(spotBack(4), (g, x, y) => PROPS.crystal(g, x, y, '#7a8ad8'));
    F2(spotFront(6), (g, x, y) => PROPS.stalag(g, x, y, 0.5));
  } else if (t === 'snow'){
    P2(spotBack(10), (g, x, y) => PROPS.pine(g, x, y, 0.75 + rnd() * 0.3, true));
    P2(spotBack(4), (g, x, y) => PROPS.snowmound(g, x, y));
    F2(spotFront(6), (g, x, y) => PROPS.snowmound(g, x, y, 0.6));

function buildIsoMap(ri, w = S.world){
  const Rg = regionsOf(w)[ri], t = Rg.theme, th = ISO_THEME[t] || ISO_THEME.village, old = THEMES[t] || THEMES.village, rnd = rng(ri * 977 + 13 + w * 7919);
  const c = document.createElement('canvas'); c.width = MW * RS; c.height = MH * RS;
  const g = c.getContext('2d'); g.scale(RS, RS);
  // 바깥 땅 + 먼 하늘·산

  for (let i = -20; i < 44; i++) for (let j = -24; j < 40; j++){
    const cx = isoX(i, j), cy = isoY(i, j);
    if (cx < -IW || cx > MW + IW || cy < 18 || cy > MH + IH) continue;
    if (rnd() < 0.5) isoTile(g, cx, cy, darken(th.outer, 0.04 + rnd() * 0.05), 0);
    if (rnd() < 0.5){ g.fillStyle = darken(th.outer, 0.12); g.fillRect(cx + (rnd() - 0.5) * 10, cy + (rnd() - 0.5) * 4, 0.8, 0.8); }
  }
  if (t === 'lava'){ for (let k = 0; k < 60; k++){ const x = rnd() * MW, y = 22 + rnd() * (MH - 22); gEll(g, x, y, 2 + rnd() * 5, 0.8 + rnd(), rnd() < 0.5 ? '#ffd24a' : '#ff8a2a'); } }
  if (t === 'sea' || t === 'river2'){ for (let k = 0; k < 70; k++){ const x = rnd() * MW, y = 24 + rnd() * (MH - 24); gEll(g, x, y, 2 + rnd() * 4, 0.5, 'rgba(255,255,255,.45)'); } }
  if (t === 'cloud' || t === 'heaven'){ for (let k = 0; k < 26; k++){ const x = rnd() * MW, y = 26 + rnd() * (MH - 26); gEll(g, x, y, 6 + rnd() * 10, 2 + rnd() * 2, 'rgba(255,255,255,.7)'); } }
  if (t === 'swamp' || t === 'poison'){ for (let k = 0; k < 18; k++){ const x = rnd() * MW, y = 24 + rnd() * (MH - 24); gEll(g, x, y, 3 + rnd() * 6, 1 + rnd() * 1.5, mix(th.outer, '#ffffff', 0.12)); } }
  const sc = isoScenery(t, rnd);
  sc.back.sort((a, b2) => a[0] - b2[0]).forEach(([, fn]) => fn(g));
  // 판: 앞 두 벽(흙·돌) → 윗면 칸
  const [lx, ly] = ISO_LEFT, [bx, by] = ISO_BOT, [rx, ry] = ISO_RIGHT;
  gPoly(g, [[lx, ly], [bx, by], [bx, by + IDEP], [lx, ly + IDEP]], th.side[0]);
  gPoly(g, [[bx, by], [rx, ry], [rx, ry + IDEP], [bx, by + IDEP]], th.side[1]);
  for (let k = 1; k < 3; k++){ const yy = IDEP * k / 3; g.globalAlpha = 0.25;
    gPoly(g, [[lx, ly + yy], [bx, by + yy], [bx, by + yy + 0.7], [lx, ly + yy + 0.7]], darken(th.side[0], 0.35));
    gPoly(g, [[bx, by + yy], [rx, ry + yy], [rx, ry + yy + 0.7], [bx, by + yy + 0.7]], darken(th.side[1], 0.35)); g.globalAlpha = 1; }
  if (t === 'lava') for (let k = 0; k < 8; k++){ const u = rnd(), x = lx + (bx - lx) * u, y = ly + (by - ly) * u; gPoly(g, [[x, y + 2], [x + 1, y + 2], [x + 2, y + IDEP], [x + 1, y + IDEP]], '#ff6a1a'); }
  for (let ty = TOPR; ty < ROWS; ty++) for (let tx = 0; tx < COLS; tx++){
    const cx = isoX(tx, ty), cy = isoY(tx, ty);
    let col = th.top[(tx + ty) % 2];

  g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 0.4; g.beginPath();
  for (let ty = TOPR; ty <= ROWS; ty++){ const x0 = isoX(-0.5, ty - 0.5), y0 = isoY(-0.5, ty - 0.5), x1 = isoX(COLS - 0.5, ty - 0.5), y1 = isoY(COLS - 0.5, ty - 0.5); g.moveTo(x0, y0); g.lineTo(x1, y1); }
  for (let tx = 0; tx <= COLS; tx++){ const x0 = isoX(tx - 0.5, TOPR - 0.5), y0 = isoY(tx - 0.5, TOPR - 0.5), x1 = isoX(tx - 0.5, ROWS - 0.5), y1 = isoY(tx - 0.5, ROWS - 0.5); g.moveTo(x0, y0); g.lineTo(x1, y1); }

  g.strokeStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.moveTo(lx, ly + 0.4); g.lineTo(bx, by + 0.4); g.lineTo(rx, ry + 0.4); g.stroke();
  sc.front.sort((a, b2) => a[0] - b2[0]).forEach(([, fn]) => fn(g));
  return c;
}

function drawOverlay(){

/* ================= 채팅 =================
   서버 없이 돌아가는 부분: 내 말, NPC 주민 수다, 시스템 알림. claude.ai 아티팩트에서 'room' 기능이 열려 있으면
   지금 같은 페이지를 보고 있는 사람들과 실시간으로 주고받는다(topic 'chat'). 받은 글은 남이 보낸 데이터라 글자로만 보여 준다. */
let chatMsgs = [], chatOpen = false, chatUnread = 0, chatSendT = -1e9, chatFilter = 'all', npcT = 20, heroSay = null;
let room = null, roomPeers = 0;
function cleanChat(t){
  t = String(t).replace(/[\u0000-\u001f\u007f\u200b-\u200f\u202a-\u202e\u2060-\u206f]/g, '').replace(/\s+/g, ' ').trim().slice(0, 60);
  for (const w of BAD_WORDS) if (t.includes(w)) t = t.split(w).join('*'.repeat(w.length));
  return t;
}
function addChat(kind, name, text){
  const m = {kind, name, text};
  chatMsgs.push(m);
  if (chatMsgs.length > CHAT_MAX) chatMsgs.shift();
  if (!chatOpen && kind !== 'me') chatUnread++;
  const ul = document.getElementById('chatList');
  if (ul){
    const li = document.createElement('li');
    li.className = 'cm ' + kind;
    const b = document.createElement('b'); b.textContent = kind === 'sys' ? '[알림]' : name;
    li.appendChild(b); li.appendChild(document.createTextNode(' ' + text));
    const atEnd = ul.scrollTop + ul.clientHeight >= ul.scrollHeight - 30;
    ul.appendChild(li);
    while (ul.children.length > CHAT_MAX) ul.firstChild.remove();
    if (atEnd || kind === 'me') ul.scrollTop = ul.scrollHeight;
  }
}
function announce(text){ if (session) addChat('sys', '알림', text); }
function sendChat(raw){
  const text = cleanChat(raw);
  if (!text || !session) return false;
  if (performance.now() - chatSendT < 1200){ addChat('sys', '알림', '조금 천천히 말해 주세요.'); return false; }
  chatSendT = performance.now();
  addChat('me', S.name, text);
  heroSay = {text, t:4};
  if (room) room.emit('chat', {n:S.name, t:text, c:S.cls}).catch(e => { if (e && e.code === 'not_permitted') addChat('sys', '알림', '이 창에서는 다른 사람에게 보낼 수 없어요. 주민들만 들어요.'); });
  // 주민이 가끔 대꾸한다
  const rule = NPC_REPLY.find(([re]) => re.test(text));
  if (rule || Math.random() < 0.35){
    const lines = rule ? rule[1] : ['그렇군요!', '오, 정말요?', '용사님 말이 맞아요.', '같이 힘내요!'];
    const who = VILLAGERS[(Math.random() * VILLAGERS.length) | 0], line = lines[(Math.random() * lines.length) | 0];
    setTimeout(() => { if (session) addChat('npc', who, line); }, 1200 + Math.random() * 1800);
  }
  return true;
}
function npcChatter(dt){
  if (!session) return;
  npcT -= dt;
  if (npcT > 0) return;
  npcT = 35 + Math.random() * 45;
  const reg = REGION_LINES[curRegion(S.stage).theme] || [];
  const pool = Math.random() < 0.4 && reg.length ? reg : NPC_LINES;
  addChat('npc', VILLAGERS[(Math.random() * (VILLAGERS.length - 1)) | 0], pool[(Math.random() * pool.length) | 0]);
}
async function bootRoom(){
  const c = window.claude, viaOnline = onlineWanted();
  if (!viaOnline && (!c || typeof c.use !== 'function')) return;
  try {
    const r = viaOnline ? await onlineRoom() : await c.use('room');
    if (!r) return;
    r.on('chat', msg => {
      if (!msg || msg.sameTab) return;
      const d = msg.data && typeof msg.data === 'object' ? msg.data : {};
      const text = cleanChat(typeof d.t === 'string' ? d.t : '');
      if (!text) return;
      const name = cleanChat(typeof d.n === 'string' ? d.n : '').slice(0, 8) || '나그네';
      addChat('player', name + (msg.guest ? '(손님)' : msg.isMe ? '(내 다른 창)' : ''), text);
    }, () => { room = null; });
    r.onPeers(ch => { roomPeers = ch.peers.length; }, () => {});
    r.on('tb', msg => {
      if (!msg || msg.sameTab || msg.isMe) return;
      const d = msg.data && typeof msg.data === 'object' ? msg.data : {};
      if (typeof d.w !== 'number') return;
      const name = cleanChat(typeof d.n === 'string' ? d.n : '').slice(0, 8) || '나그네';
      tbPeers.set(msg.peer, {w:d.w, name, cls:CLASSES[d.c] ? d.c : 'musa', look:cleanLook(d.l), dps:Math.min(1e300, Math.max(1, +d.d || 1)), maxHp:Math.min(1e300, Math.max(1, +d.h || 1))});
    }, () => {});
    room = r;
  } catch (e) { room = null; }
}

const $ = s => document.querySelector(s);

let modalOpen = false;
function showModal(title, html, buttons, onBuilt){
  $('#mTitle').textContent = title;
  $('#mBody').innerHTML = html;
  const bx = $('#mBtns'); bx.innerHTML = '';
  buttons.forEach((bt, i) => {
    const el = document.createElement('button');
    el.className = 'btn' + (bt.primary ? ' primary' : '') + (bt.danger ? ' danger' : '');
    el.id = 'modal-btn-' + i; el.textContent = bt.label; el.disabled = !!bt.disabled;
    el.addEventListener('click', () => { if (bt.keep && bt.keep()) return; hideModal(); if (bt.fn) bt.fn(); });
    bx.appendChild(el);
  });
  $('#modal').hidden = false; modalOpen = true;
  $('.sheet').scrollTop = 0;
  const onTitle = !session && modalLock && !!$('#title') && !$('#title').hidden;
  $('#modal').classList.toggle('on-title', onTitle);
  if (onBuilt) onBuilt();
  if (document.activeElement && document.activeElement.tagName === 'INPUT' && $('#modal').contains(document.activeElement)) return;
  const p = bx.querySelector('.primary:not(:disabled)') || bx.querySelector('button:not(:disabled)');
  if (p) p.focus({preventScroll:true});
}
function hideModal(){ $('#modal').hidden = true; modalOpen = false; }
function holdButton(btn, fn){
  let t1 = null, t2 = null;
  const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };
  btn.addEventListener('pointerdown', e => {
    if (btn.disabled || e.button > 0) return;
    if (!fn()) return;
    t1 = setTimeout(() => { t2 = setInterval(() => { if (!fn()) stop(); }, 85); }, 380);
  });
  ['pointerup', 'pointerleave', 'pointercancel', 'blur'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('click', e => { if (e.detail === 0) fn(); });
  btn.addEventListener('contextmenu', e => e.preventDefault());
}

      <li class="row" id="sk-${sk.key}"><div class="ic">${SVG[skDef(i).icon]}</div>

      <p class="story">레이드와 타임 보스에서 한 번, 공격력의 ${fmt(AWAKEN_PCT * cls().skillMul)}%를 다섯 번에 나눠 퍼부어요. 싸움이 시작되고 12초가 지나거나 보스 체력이 60% 아래로 떨어지면 저절로 써요.</p>
      ${S.awaken ? '' : `<p class="small">배우는 법: 환생한 뒤 저승 레벨 60을 넘기고, 시왕 레이드 「송제전」을 토벌한 다음, 저승 이야기의 「각성의 시련」 퀘스트를 완료해요.</p>`}
    </div>`;

    return r;
  });
  return () => {
    for (const r of refs){
      const lv = skLv(r.i), cdt = `재사용 ${+skCdOf(r.i).toFixed(1)}초${skAuto(r.i) ? '' : ' · <b>수동</b>'}`;
      if (!lv){
        setText(r.lv, skLockLong(r.i));

        setHTML(r.cost, '잠김'); r.btn.disabled = true; r.btn.classList.add('nocoin');
      } else if (lv >= r.sk.max){
        setText(r.lv, 'Lv.' + lv + ' 최대');
        setHTML(r.desc, `${skillDesc(r.i, lv)} · ${cdt}`);
        setHTML(r.cost, '최대'); r.btn.disabled = true; r.btn.classList.add('nocoin');
      } else {
        const c = skillCost(r.sk, lv);
        setText(r.lv, 'Lv.' + lv);
        setHTML(r.desc, `${skillDesc(r.i, lv)} · ${cdt}`);
        setHTML(r.cost, fmt(c)); r.btn.disabled = S.gold < c; r.btn.classList.remove('nocoin');

let gearSlot = 'weapon', gearSel = -1;
function gearSegHTML(){
  return `<div class="seg six" role="group" aria-label="장비 종류">
      <button id="seg-weapon" aria-pressed="${gearSlot === 'weapon'}">${cls().weapon}</button>
      <button id="seg-armor" aria-pressed="${gearSlot === 'armor'}">${cls().armor}</button>

      <button id="seg-myth" aria-pressed="${gearSlot === 'myth'}">신화</button>
      <button id="seg-acc" aria-pressed="${gearSlot === 'acc'}">장신구</button>
      <button id="seg-form" aria-pressed="${gearSlot === 'form'}">변신</button>
      <button id="seg-av" aria-pressed="${gearSlot === 'av'}">아바타</button>
      <button id="seg-craft" aria-pressed="${gearSlot === 'craft'}">조합${craftReady() ? ' •' : ''}</button>
    </div>`;
}
function wireGearSeg(){
  for (const k of ['weapon', 'armor', 'refine', 'myth', 'acc', 'form', 'av', 'craft']) $('#seg-' + k).addEventListener('click', () => { gearSlot = k; gearSel = -1; buildTab('gear', true); });
}
function buildGear(){
  if (gearSlot === 'refine') return buildRefine();
  if (gearSlot === 'myth') return buildMyth();
  if (gearSlot === 'acc') return buildAcc();
  if (gearSlot === 'form') return buildForm();
  if (gearSlot === 'av') return buildAvatar();
  if (gearSlot === 'craft') return buildCraft();
  const slot = gearSlot, Gd = S.gear[slot], eq = S.equip[slot], def = GEAR[slot];
  let grid = '';
  for (let gr = 0; gr < 5; gr++){
    grid += `<div class="gl" style="--gc:${GRADES[gr].color}">${GRADES[gr].name}</div>`;
    for (let t = 0; t < 4; t++){
      const i = gr * 4 + t, c = Gd.count[i];
      grid += `<button class="cell${Gd.seen[i] ? '' : ' unseen'}${gearSel === i ? ' sel' : ''}" id="cell-${i}" data-i="${i}" style="--g:${GRADES[gr].color}" aria-label="${gearName(slot, i)}, ${c}개${eq === i ? ', 장착 중' : ''}">${SVG[def.icon]}<span class="tier">${ROMAN[t]}</span>${c ? `<span class="cnt">${c}</span>` : ''}${eq === i ? '<span class="eq">장착</span>' : ''}</button>`;
    }
  }
  let detail = '';
  if (gearSel >= 0){
    const i = gearSel, gr = Math.floor(i / 4), c = Gd.count[i], m = mergeableSets(slot, i);
    detail = `<div class="detail" style="--g:${GRADES[gr].color}">
      <div class="dn">${gearName(slot, i)}<span class="badge">${GRADES[gr].name}</span></div>
      <div class="dl"><span>장착 효과</span><b>${def.stat} +${fmt(gearEquipPct(i))}%</b></div>
      <div class="dl"><span>보유 효과 (한 번 얻으면 계속 적용)</span><b>${def.stat} +${fmt(gearOwnPct(i))}%</b></div>
      <div class="dl"><span>가진 개수</span><b>${c}개</b></div>
      <div class="dbtns">
        <button class="btn primary" id="eqBtn" ${c > 0 && eq !== i ? '' : 'disabled'}>${eq === i ? '장착 중' : '장착하기'}</button>
        <button class="btn" id="mgBtn" ${m > 0 ? '' : 'disabled'}>${i >= 19 ? '최고 단계' : m > 0 ? `4개 합성 ×${m}` : '4개 모이면 합성'}</button>
      </div>
      ${Gd.seen[i] ? '' : '<p class="small">아직 얻지 못했어요. 소환하거나 바로 아래 단계 장비 4개를 합성하면 얻어요.</p>'}
    </div>`;
  }
  const eqP = eq >= 0 ? gearEquipPct(eq) : 0;
  panel.innerHTML = `
    ${gearSegHTML()}
    <div class="summon">
      <button class="gbtn" id="sum1"><span>${def.label} 1회 소환</span><span class="price"><i class="gem"></i>50</span></button>
      <button class="gbtn" id="sum10"><span>${def.label} 10회 소환</span><span class="price"><i class="gem"></i>450</span></button>
    </div>
    <p class="odds">전설 0.2% · 영웅 1.3% · 희귀 8.5% · 고급 26% · 일반 64%</p>
    <div class="effects">
      <div>장착 효과<b>${def.stat} +${fmt(eqP)}%</b></div>
      <div>보유 효과 합계<b>${def.stat} +${fmt(ownedPct(slot))}%</b></div>
    </div>
    <div class="grid">${grid}</div>
    ${detail}
    <div class="bulk"><button class="btn" id="mergeAll">일괄 합성</button><button class="btn" id="equipBest">가장 좋은 것 장착</button></div>`;
  wireGearSeg();
  $('#sum1').addEventListener('click', () => doSummon(slot, 1));
  $('#sum10').addEventListener('click', () => doSummon(slot, 10));
  panel.querySelectorAll('.cell').forEach(bt => bt.addEventListener('click', () => { const i = +bt.dataset.i; gearSel = gearSel === i ? -1 : i; buildTab('gear', true); }));
  if ($('#eqBtn')) $('#eqBtn').addEventListener('click', () => { S.equip[slot] = gearSel; refreshStats(); buildTab('gear', true); addLog(`${gearName(slot, gearSel)}${josa(gearName(slot, gearSel), '을', '를')} 장착했습니다.`); });
  if ($('#mgBtn')) $('#mgBtn').addEventListener('click', () => { const n = mergeOne(slot, gearSel); refreshStats(); if (n) addLog(`${gearName(slot, gearSel + 1)} ${n}개를 만들었습니다.`, 'gain'); buildTab('gear', true); });
  $('#mergeAll').addEventListener('click', () => { const n = mergeAll(slot); addLog(n ? `${n}번 합성했습니다.` : '합성할 장비가 없습니다. 같은 장비 4개가 필요해요.', n ? 'gain' : ''); buildTab('gear', true); });
  $('#equipBest').addEventListener('click', () => { equipBest(slot); addLog(S.equip[slot] >= 0 ? `${gearName(slot, S.equip[slot])}${josa(gearName(slot, S.equip[slot]), '을', '를')} 장착했습니다.` : '먼저 장비를 소환해 주세요.'); buildTab('gear', true); });
  return () => { $('#sum1').disabled = S.gems < 50; $('#sum10').disabled = S.gems < 450; };
}
function doSummon(slot, n){
  const res = summon(slot, n);
  if (!res){ addLog('보석이 부족합니다.', 'warn'); return; }
  sfx(res.some(r => r.it >= 12) ? 'rare' : 'summon');
  if (currentTab === 'gear') buildTab('gear', true);
  const best = res.reduce((a, r) => Math.max(a, r.it), 0);
  playFx('summon', {best:Math.floor(best / 4), sub:gearName(slot, best)});
  const html = `<div class="res-grid">${res.map((r, i) => {
      const g = GRADES[Math.floor(r.it / 4)];
      return `<div class="res flip${r.it >= 12 ? ' legend' : ''}" style="--g:${g.color};--i:${i}" title="${gearName(slot, r.it)}">${SVG[GEAR[slot].icon]}<span class="tier">${ROMAN[r.it % 4]}</span>${r.isNew ? '<span class="new">NEW</span>' : ''}</div>`;
    }).join('')}</div>
    <p class="small" style="margin-top:10px">가장 좋은 장비: <b>${gearName(slot, best)}</b> (${GRADES[Math.floor(best / 4)].name})</p>`;
  const cost = summonCost(n);
  showModal(`${GEAR[slot].label} 소환 결과`, html, [
    {label:`${n}회 더 (보석 ${cost})`, disabled:S.gems < cost, fn:() => doSummon(slot, n)},
    {label:'확인', primary:true},
  ]);
}

        : `아직 만들지 않았어요. 단계마다 ${c.main} +${c.per}%, 각인 효과도 단계만큼 커져요.`);

        const parts = [];

        setHTML(card.querySelector('[data-r=rec]'), n.open
          ? `<b>${n.t}단계 조합식</b>: ${parts.join(' + ')}${sel ? '' : ' · <span style="color:#ff8a7a">각인을 골라요</span>'}<br><span class="small">성공 확률 <b>${n.rate}%</b>${n.sure ? ' (천장 확정)' : ` · 실패하면 재료 절반만 사라지고, ${CRAFT_PITY[n.t - 1] - n.fails}번 더 실패하면 다음은 확정`}</span>`
          : `<b>${n.t}단계</b>는 ${WORLD_NAME[n.T.w]} ${n.T.need}단계(${stageLabelW(n.T.w, n.T.need)})에 닿으면 열려요.`);
        btn.disabled = !n.ok; setText(btn, `${n.t}단계 만들기 (${n.rate}%)`);
      }
      const showSwap = it.t > 0 && it.e2 && it.e2 !== it.e;
      sw.hidden = !showSwap;
      if (showSwap){ setText(sw, `각인 지금 바꾸기 (보석 ${engrSwapCost(c.k)})`); sw.disabled = S.gems < engrSwapCost(c.k); }
    }
    const nOk = CRAFT_SLOTS.filter(c => S.craft[c.k].t > 0 && engrBest(c.k, S.craft[c.k].e)).length;
    setHTML($('#cfHarm'), `<div class="ct">조화 · ${cls().name}의 최적 조합 <span class="tag">${nOk}/3</span></div>
      <p class="small">${CRAFT_SLOTS.map(c => `${c.name} 「${engrOf(c.k, best[c.k]).name}」`).join(' + ')} — 세 칸을 모두 최적 각인으로 맞추면 공격력·체력 +${HARMONY}%${harmonyOn() ? ' <b style="color:var(--gold)">(발동 중)</b>' : ''}</p>`);
  };
}

    setHTML($('#bag'), `가방: 인삼 <b>${S.inv.potion}</b> · 산삼 <b>${S.inv.elixir}</b> · 숫돌 <b>${S.inv.whet}</b> · 토벌패 <b>${raidTickets()}</b>`);
    for (const r of refs){
      const st = shopState(r.it), it = r.it;

      else if (it.daily) on = `오늘 ${Math.max(0, it.daily - (S.shop.got[it.id] || 0))}번 남음`;

/* --- 재련 --- */
const refineMsg = {weapon:null, armor:null};
function buildRefine(){
  const card = slot => {
    const isW = slot === 'weapon', stat = isW ? '공격력' : '체력';
    return `<div class="card" id="rf-${slot}">
      <div class="rhead"><div class="ic">${SVG[isW ? 'sword' : 'armor']}</div>
        <div><div class="nm">${isW ? cls().weapon : cls().armor} 재련 <span class="rlv" data-r="lv"></span></div><div class="val" data-r="eff"></div></div></div>
      <div class="dl"><span>성공</span><b data-r="rate"></b></div>
      <div class="dl"><span>실패하면</span><b data-r="en"></b></div>
      <p class="rres" data-r="res"></p>
      <button class="buy" data-r="btn"><span class="coin"></span><span data-r="g"></span><i class="gem"></i><span data-r="m"></span></button>
      <p class="small">${stat}이 재련 단계만큼 크게 올라요. 두 번 연달아 떨어지면 다음 재련은 <b>반드시 성공</b>(기회의 불꽃)해요.</p>
    </div>`;
  };
  panel.innerHTML = `${gearSegHTML()}
    <p class="hint" style="margin-top:8px">엽전과 보석으로 무기·방어구를 벼려요. 높은 단계일수록 실패하면 <b>한 단계 떨어지거나</b>(+11부터, +10·+15·+20에서는 안 떨어짐) <b>부서져 +15·+20으로 돌아갈</b> 수 있어요(+17부터).</p>
    <label class="whet card"><input type="checkbox" id="whetChk" ${S.useWhet ? 'checked' : ''}><span id="whetTxt"></span></label>
    <label class="whet card"><input type="checkbox" id="protChk" ${S.useProtect ? 'checked' : ''}><span>보호: +16~+19에서 보석을 두 배 내고 부서짐을 막아요</span></label>
    ${card('weapon')}${card('armor')}
    <p class="rtable">확률 공개 (성공 / 하락 / 부서짐, 나머지는 유지)<br>${REFINE_RATE.map((r, i) => `+${i + 1} ${r}%${REFINE_DROP[i] ? ` / ${REFINE_DROP[i]}%` : ''}${REFINE_BREAK[i] ? ` / ${REFINE_BREAK[i]}%` : ''}`).join(' · ')}</p>`;
  wireGearSeg();
  $('#whetChk').addEventListener('change', e => { S.useWhet = e.target.checked; refreshPanel(); });
  $('#protChk').addEventListener('change', e => { S.useProtect = e.target.checked; refreshPanel(); });
  const refs = ['weapon', 'armor'].map(slot => {
    const el = $('#rf-' + slot), q = k => el.querySelector(`[data-r=${k}]`);
    const r = {slot, lv:q('lv'), eff:q('eff'), rate:q('rate'), en:q('en'), bar:q('bar'), res:q('res'), btn:q('btn'), g:q('g'), m:q('m')};
    r.btn.addEventListener('click', () => {
      const out = refineTry(slot);
      if (!out) return;
      const name = slot === 'weapon' ? cls().weapon : cls().armor;
      sfx(out.ok ? 'refOk' : 'refNo');
      playFx('refine', {el:r.btn, res:out.res, lv:out.lv, chance:out.sure});
      refineMsg[slot] = out.ok ? {ok:true, t:`성공! ${name} +${out.lv}${out.sure ? ' (기회의 불꽃)' : ''}`}
        : {ok:false, t:out.res === 'break' ? `부서졌어요… +${out.lv}로 돌아갔어요` : out.res === 'drop' ? `실패… +${out.lv}로 떨어졌어요${(S.refine[slot].drops || 0) >= 2 ? ' — 다음은 반드시 성공!' : ''}` : '실패… 단계는 그대로예요'};
      addLog(out.ok ? `재련 성공! ${name} +${out.lv}` : `재련 실패 (${name} +${out.from + 1} 시도${out.res === 'break' ? ', 부서짐' : out.res === 'drop' ? ', 하락' : ''})`, out.ok ? 'gain' : 'warn');
      if (out.ok){ fx.push({type:'level', t:0, dur:0.6}); addText(`+${out.lv}`, hero.x, hero.y - 34, '#ffd96a', 14, true); }
      r.res.classList.remove('pop'); void r.res.offsetWidth; r.res.classList.add('pop');
      refreshPanel();
    });
    return r;
  });
  return () => {
    setText($('#whetTxt'), `숫돌 함께 쓰기 (가진 숫돌 ${S.inv.whet}개${S.inv.whet ? '' : ' · 상점에서 살 수 있어요'})`);
    $('#whetChk').disabled = !S.inv.whet && !S.useWhet;
    for (const r of refs){
      const R2 = S.refine[r.slot], stat = r.slot === 'weapon' ? '공격력' : '체력', max = R2.lv >= REFINE_MAX;
      setText(r.lv, '+' + R2.lv);
      const rp = l => +refinePct(l).toFixed(1);
      setHTML(r.eff, max ? `${stat} +${rp(R2.lv)}% (최고 단계)` : `${stat} +${rp(R2.lv)}% → <em>+${rp(R2.lv + 1)}%</em>`);
      if (max){ setText(r.rate, '-'); setText(r.en, '-'); setHTML(r.g, '최고'); setHTML(r.m, ''); r.btn.disabled = true; }
      else {
        const o = refineOdds(r.slot), f1 = v => +v.toFixed(1);
        setText(r.rate, o.chance ? '100% (기회의 불꽃)' : `${f1(o.ok)}%${whetOn() ? ' (숫돌 ×1.15)' : ''}`);
        setText(r.en, o.chance ? '-' : [`유지 ${f1(o.keep)}%`, o.drop ? `하락 ${f1(o.drop)}%` : '', o.brk ? `부서짐 ${f1(o.brk)}%` : (S.useProtect && refineProtectable(R2.lv) ? '보호 중' : '')].filter(Boolean).join(' · '));
        const g = refineGold(R2.lv), m = refineGems(R2.lv) * (S.useProtect && refineProtectable(R2.lv) && !o.chance ? 2 : 1);
        setHTML(r.g, fmt(g)); setHTML(r.m, fmt(m));
        r.btn.disabled = S.gold < g || S.gems < m;
      }
      const msg = refineMsg[r.slot];
      setText(r.res, msg ? msg.t : '');

function doPetSummon(n){
  const res = petSummon(n);
  if (!res){ addLog('보석이 부족합니다.', 'warn'); return; }
  sfx(res.some(r => PETS[r.i].g >= 3) ? 'rare' : 'summon');
  if (currentTab === 'pet') buildTab('pet', true);
  const lab = {new:'NEW', star:'★+1', gem:'보석'};
  { const bp = res.reduce((a, r) => PETS[r.i].g > PETS[a.i].g ? r : a, res[0]); playFx('summon', {best:PETS[bp.i].g, sub:PETS[bp.i].name}); }
  const html = `<div class="res-grid">${res.map((r, k) => {
      const p = PETS[r.i];
      return `<div class="res flip${p.g >= 3 ? ' legend' : ''}" style="--g:${GRADES[p.g].color};--i:${k}" title="${p.name}"><img src="${petImg(r.i)}" alt="${p.name}"><span class="new${r.kind === 'star' ? ' star' : r.kind === 'gem' ? ' gem2' : ''}">${lab[r.kind]}</span></div>`;
    }).join('')}</div>
    <p class="small" style="margin-top:10px">${res.map(r => PETS[r.i].name).filter((v, k, a) => a.indexOf(v) === k).join(', ')}${josa(PETS[res[res.length - 1].i].name, '이', '가')} 나왔어요. 같은 펫은 별이 오르고, 별이 가득하면 보석 ${PET_DUP_GEMS}개로 돌려받아요.</p>`;
  const cost = petSummonCost(n);
  showModal('펫 소환 결과', html, [
    {label:`${n}회 더 (보석 ${cost})`, disabled:S.gems < cost, fn:() => doPetSummon(n)},

  ]);
}

    [{label:'취소'}, {label:'출발', primary:true, fn:() => { if (startRaid(i)) buildTab('raid'); }}]);

const BUILDERS = {grow:buildGrow, skill:buildSkill, gear:buildGear, pet:buildPet, quest:buildQuest, raid:buildRaid, shop:buildShop, rec:buildRec};
// 메뉴 페이지: 오른쪽(세로 화면은 아래) 메뉴를 누르면 장면을 덮는 별도 화면으로 열린다. 같은 메뉴를 다시 누르거나 ✕·Esc로 닫는다
let currentTab = null, refresher = null;
function buildTab(key, keepScroll){
  if (!key || !BUILDERS[key]) return;
  const top = panel.scrollTop, pg = $('#page'), was = !pg.hidden && currentTab === key;
  currentTab = key;
  document.querySelectorAll('.tab').forEach(bt => bt.setAttribute('aria-selected', String(bt.dataset.tab === key)));
  const tb = $('#tab-' + key);
  if (tb){ setText($('#pageTitle'), tb.textContent.trim()); const sv = tb.querySelector('svg'); setHTML($('#pageIc'), sv ? sv.outerHTML : ''); }
  if (pg.hidden){ pg.hidden = false; pg.style.animation = 'none'; void pg.offsetWidth; pg.style.animation = ''; }
  refresher = BUILDERS[key]();
  refreshPanel();
  panel.scrollTop = keepScroll && was ? top : 0;
}
function closePage(){
  $('#page').hidden = true; currentTab = null; refresher = null;
  document.querySelectorAll('.tab').forEach(bt => bt.setAttribute('aria-selected', 'false'));
}
function refreshPanel(){ if (refresher && currentTab) refresher(); }
document.querySelectorAll('.tab').forEach(bt => bt.addEventListener('click', () => {

/* --- 직업 고르기 --- */
const prevCache = new Map();
function lookPreview(c, look, aG, wG, dir = 'down', ex){
  look = cleanLook(look);
  const key = [c, look.outfit, look.hair, look.hat, look.skin, aG, wG, dir, ex ? [ex.form, ex.ear, ex.brace, ex.job, ex.costume, ex.cape].join(',') : ''].join('|');
  let u = prevCache.get(key);
  if (!u){
    const sp = personSprite(c, look, aG, wG, dir, 0, false, ex);
    const cc = document.createElement('canvas'); cc.width = 64; cc.height = 60;
    cc.getContext('2d').drawImage(sp, 0, 2, 64, 60, 0, 0, 64, 60);
    u = cc.toDataURL();
    if (prevCache.size > 200) prevCache.clear();
    prevCache.set(key, u);
  }
  return u;
}
const classPreview = c => lookPreview(c, defaultLook(), -1, -1);
const classCardsHTML = pick => `<div class="classes">${CLASS_ORDER.map(c => `<button class="ccard" id="cc-${c}" data-c="${c}" aria-pressed="${c === pick}">

    document.querySelectorAll('#mBody .ccard').forEach(c2 => c2.setAttribute('aria-pressed', String(c2 === card)));

  }));
}
function chooseClass(canCancel){

  const btns = [{label:'이 직업으로 시작', primary:true, fn:() => setClass(pick)}];

  showModal(canCancel ? '직업 바꾸기' : '직업을 고르세요', html, btns, () => wireClassCards(c => { pick = c; }));

function setClass(c){

}

function wireLookEditor(look, getCls, grades){

/* ================= 계정 =================
   서버가 없는 정적 페이지라 계정은 이 기기(브라우저)에 저장한다. 비밀번호는 그대로 두지 않고 소금(salt)을 쳐서 해시로만 남긴다.
   claude.ai 아티팩트로 열면 Claude 계정의 개인 저장소(data/users/<id>/)에도 같이 올려서 다른 기기에서 이어진다. */
const ID_RE = /^[a-z0-9_]{4,12}$/;

function loadReg(){

      for (const A of Object.values(r.accounts)) if (!Array.isArray(A.chars)) A.chars = [];
      return r;
    }
  } catch (e) {}

}
function saveReg(){

function randHex(n){
  const a = new Uint8Array(n);
  try { crypto.getRandomValues(a); } catch (e) { for (let i = 0; i < n; i++) a[i] = Math.random() * 256 | 0; }
  return Array.from(a, x => x.toString(16).padStart(2, '0')).join('');
}
async function hashPw(pw, salt, alg){
  if (alg !== 'f'){
    try {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:enc.encode(salt), iterations:60000, hash:'SHA-256'}, key, 256);
      return 'p:' + Array.from(new Uint8Array(bits), x => x.toString(16).padStart(2, '0')).join('');
    } catch (e) { if (alg === 'p') return null; }
  }
  // 아주 오래된 브라우저용 예비 해시
  let h1 = 0x9e3779b9, h2 = 0x85ebca6b;
  const s = salt + ':' + pw;
  for (let r = 0; r < 3000; r++) for (let i = 0; i < s.length; i++){
    const c = s.charCodeAt(i) + r;
    h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); h1 ^= h2 >>> 15; h2 ^= h1 >>> 13;
  }
  return 'f:' + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}

}

function audApply(){

  AUD.bgm = c.createGain(); AUD.bgm.connect(AUD.master);

document.addEventListener('pointerdown', audInit, true);

const hz = midi => 440 * Math.pow(2, (midi - 69) / 12);
// 악기
function pluck(out, t, midi, dur, vol){

  o2.frequency.setValueAtTime(fq * 1.02, t); o2.frequency.exponentialRampToValueAtTime(fq, t + 0.07);
  f.type = 'lowpass'; f.frequency.setValueAtTime(3200, t); f.frequency.exponentialRampToValueAtTime(500, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const g2 = c.createGain(); g2.gain.value = 0.35;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(f); f.connect(out);
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}
function flute(out, t, midi, dur, vol){
  const c = AUD.ctx, o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), g = c.createGain();
  o.type = 'sine'; o.frequency.value = hz(midi);
  lfo.frequency.value = 5; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(hz(midi) * 0.012, t + dur * 0.6);
  lfo.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.09); g.gain.setValueAtTime(vol, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const n = c.createBufferSource(), nf = c.createBiquadFilter(), ng = c.createGain();
  n.buffer = AUD.noise; nf.type = 'bandpass'; nf.frequency.value = hz(midi) * 2; nf.Q.value = 3; ng.gain.value = vol * 0.25;
  n.connect(nf); nf.connect(ng); ng.connect(g);
  o.connect(g); g.connect(out);
  o.start(t); lfo.start(t); n.start(t, Math.random() * 0.5); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05); n.stop(t + dur + 0.05);
}
function drum(out, t, kind, vol){
  const c = AUD.ctx;
  if (kind === 'dung' || kind === 'kung'){
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(kind === 'dung' ? 110 : 90, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.25);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.4);
  }
  if (kind === 'dung' || kind === 'deok'){
    const n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    n.buffer = AUD.noise; f.type = 'bandpass'; f.frequency.value = kind === 'deok' ? 2600 : 1800; f.Q.value = 1.2;
    g.gain.setValueAtTime(vol * (kind === 'deok' ? 0.9 : 0.6), t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    n.connect(f); f.connect(g); g.connect(out); n.start(t, Math.random()); n.stop(t + 0.12);
  }
}
function gong(out, t, vol){
  const c = AUD.ctx;
  for (const [fq, v] of [[98, 1], [101.5, 0.7], [196, 0.3]]){
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = fq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * v, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 3.3);
  }
}
// 곡: 박자 길이·음계·장단(장구 무늬)·밑음
const TRACKS = {
  title:{step:0.5, root:55, scale:[0, 2, 5, 7, 9], drums:['dung', '', '', '', '', '', 'kung', '', '', '', 'deok', ''], mel:'flute', melEvery:2, arp:true},
  field:{step:0.24, root:55, scale:[0, 2, 5, 7, 9], drums:['dung', '', 'deok', 'kung', '', 'deok', 'dung', 'deok', 'deok'], mel:'pluck', melEvery:1, arp:false},
  battle:{step:0.16, root:57, scale:[0, 3, 5, 7, 10], drums:['dung', 'deok', 'deok', 'dung', 'kung', 'deok', 'dung', 'deok'], mel:'pluck', melEvery:1, arp:true},
  hell:{step:0.42, root:52, scale:[0, 3, 5, 7, 10], drums:['dung', '', '', '', 'kung', '', '', ''], mel:'flute', melEvery:2, drone:true},
};
function wantTrack(){
  if (!session) return 'title';
  if (cut) return S.world === 1 ? 'hell' : 'title';
  if (raid || bossActive) return 'battle';
  return S.world === 1 ? 'hell' : S.world === 2 ? 'title' : 'field';
}
function audTick(){
  const c = AUD.ctx;
  if (!c || c.state !== 'running') return;
  const want = wantTrack();
  if (want !== AUD.track){
    AUD.track = want; AUD.step = 0; AUD.phrase = []; AUD.next = Math.max(AUD.next, c.currentTime + 0.05);
    if (want === 'battle' && AUD.set.bgm) gong(AUD.bgm, c.currentTime + 0.05, 0.25);
  }
  if (!AUD.set.bgm){ AUD.next = c.currentTime + 0.1; return; }
  const T = TRACKS[AUD.track];
  while (AUD.next < c.currentTime + 0.25){
    const t = AUD.next, st = AUD.step;
    const dk = T.drums[st % T.drums.length];
    if (dk) drum(AUD.bgm, t, dk, dk === 'deok' ? 0.18 : 0.32);
    if (st % T.melEvery === 0){
      if (!AUD.phrase.length){
        // 새 가락: 음계 안에서 한두 칸씩 움직이고, 끝은 으뜸음으로
        const n = 6 + ((Math.random() * 5) | 0), ph = [];
        let dg = AUD.deg || 5;
        for (let i = 0; i < n; i++){ dg = Math.max(0, Math.min(10, dg + [-2, -1, -1, 1, 1, 2, 0][(Math.random() * 7) | 0])); ph.push(Math.random() < 0.18 ? null : dg); }
        ph.push(5); ph.push(null); ph.push(null);
        AUD.phrase = ph; AUD.deg = dg;
      }
      const dg = AUD.phrase.shift();
      if (dg != null){
        const midi = T.root + 12 + T.scale[dg % 5] + 12 * Math.floor(dg / 5) - 12;
        if (T.mel === 'flute') flute(AUD.bgm, t, midi + 12, T.step * T.melEvery * 1.8, 0.13);
        else pluck(AUD.bgm, t, midi + 12, 0.9, 0.16);
      }
    }
    if (T.arp && st % 4 === 0) pluck(AUD.bgm, t, T.root + T.scale[(st / 4) % 5 | 0], 1.4, 0.09);
    if (T.drone && st % 16 === 0) flute(AUD.bgm, t, T.root - 12, T.step * 16, 0.07);
    AUD.next += T.step; AUD.step++;
  }
}
// 효과음
const SFX_GAP = {hit:0.07, crit:0.08, blip:0.06, click:0.05, kill:0.08, gem:0.1};
const sfxLast = {};
sfx = function(name){
  const c = AUD.ctx;
  if (!c || !AUD.set.sfx || c.state !== 'running') return;
  const t = c.currentTime;
  if (SFX_GAP[name] && t - (sfxLast[name] || 0) < SFX_GAP[name]) return;
  sfxLast[name] = t;
  const o = AUD.fx, P5 = [0, 2, 5, 7, 9];
  switch (name){
    case 'hit': drum(o, t, 'deok', 0.12); break;
    case 'crit': drum(o, t, 'deok', 0.2); pluck(o, t, 84, 0.25, 0.12); break;
    case 'kill': pluck(o, t, 88, 0.2, 0.08); pluck(o, t + 0.05, 93, 0.25, 0.08); break;
    case 'gem': pluck(o, t, 91, 0.6, 0.14); pluck(o, t + 0.08, 96, 0.8, 0.12); break;
    case 'level': P5.concat([12]).forEach((d, i) => pluck(o, t + i * 0.07, 67 + d, 0.6, 0.15)); break;
    case 'boss': gong(o, t, 0.4); drum(o, t, 'dung', 0.5); break;
    case 'win': [0, 5, 9, 12].forEach((d, i) => pluck(o, t + i * 0.1, 67 + d, 0.8, 0.16)); drum(o, t, 'dung', 0.4); break;
    case 'fail': [7, 5, 2, 0].forEach((d, i) => flute(o, t + i * 0.18, 60 + d, 0.3, 0.1)); break;
    case 'skill': { const n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); n.buffer = AUD.noise; f.type = 'bandpass'; f.Q.value = 2;
      f.frequency.setValueAtTime(600, t); f.frequency.exponentialRampToValueAtTime(3000, t + 0.25); g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      n.connect(f); f.connect(g); g.connect(o); n.start(t); n.stop(t + 0.32); break; }
    case 'nuke': drum(o, t, 'dung', 0.6); drum(o, t + 0.12, 'kung', 0.5); sfx('skill'); break;
    case 'quest': [0, 2, 5, 7].forEach((d, i) => pluck(o, t + i * 0.06, 72 + d, 0.5, 0.13)); break;
    case 'rare': [0, 5, 9, 12, 17, 21].forEach((d, i) => pluck(o, t + i * 0.07, 72 + d, 0.9, 0.14)); gong(o, t, 0.15); break;
    case 'summon': [0, 2, 5, 7, 9].forEach((d, i) => pluck(o, t + i * 0.05, 72 + d, 0.4, 0.1)); break;
    case 'refOk': pluck(o, t, 96, 0.5, 0.2); pluck(o, t + 0.05, 91, 0.7, 0.15); break;
    case 'refNo': drum(o, t, 'kung', 0.4); break;
    case 'raid': gong(o, t, 0.35); [0, 1, 2, 3].forEach(i => drum(o, t + 0.3 + i * 0.12, i % 2 ? 'deok' : 'dung', 0.35)); break;
    case 'awaken': gong(o, t, 0.5); [0, 5, 7, 12, 17, 19, 24].forEach((d, i) => pluck(o, t + i * 0.04, 60 + d, 1.2, 0.15)); break;
    case 'form': [0, 7, 12, 19].forEach((d, i) => flute(o, t + i * 0.06, 72 + d, 0.6, 0.1)); break;
    case 'rebirth': gong(o, t, 0.5); [12, 7, 5, 0, -5].forEach((d, i) => flute(o, t + 0.3 + i * 0.25, 60 + d, 0.6, 0.1)); break;
    case 'potion': flute(o, t, 79, 0.25, 0.1); break;
    case 'cut': gong(o, t, 0.18); break;
    case 'blip': pluck(o, t, 86, 0.12, 0.05); break;
    case 'click': pluck(o, t, 81, 0.1, 0.06); break;
  }
};
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('.btn,.chip,.tab,.seg button,.gbtn,.ccard,.char')) sfx('click'); });

let last = performance.now();
function loop(ts){
  let dt = (ts - last) / 1000; last = ts;
  if (dt > 0.25) dt = 0.25;
  if (cut){ updateCut(dt); shake = Math.max(0, shake - dt); }
  else if (dt > 0){
    for (let i = 0; i < S.speed; i++){
      let rem = dt;
      while (rem > 0){ const step = Math.min(rem, 0.05); update(step); rem -= step; }
    }
  }
  if (session && dt > 0){ tickBuffs(dt); npcChatter(dt); }
  if (heroSay){ heroSay.t -= dt; if (heroSay.t <= 0) heroSay = null; }
  render(); updateHud();
  requestAnimationFrame(loop);
}
