    gBlob(g, x - 4 * s, y - 12 * s, 6 * s, 5 * s, '#ff9ab8'); gBlob(g, x + 4 * s, y - 12 * s, 6 * s, 5 * s, '#ffb0c8'); gBlob(g, x, y - 16 * s, 7 * s, 5.4 * s, '#ffc0d4');
    for (const [dx, dy] of [[-5, -10], [3, -14], [5, -9], [-1, -17]]) { gEll(g, x + dx * s, y + dy * s, 1.6 * s, 1.6 * s, '#ff7a6a'); gEll(g, x + (dx - 0.5) * s, y + (dy - 0.6) * s, 0.5 * s, 0.5 * s, '#ffe0d0'); } },
  boat(g, x, y, s = 1){ gEll(g, x, y + 1, 16 * s, 3 * s, 'rgba(255,255,255,.35)'); gPoly(g, [[x - 15 * s, y - 5 * s], [x + 15 * s, y - 5 * s], [x + 11 * s, y], [x - 11 * s, y]], '#6b4a2b'); gPoly(g, [[x - 15 * s, y - 5 * s], [x + 15 * s, y - 5 * s], [x + 14 * s, y - 3.6 * s], [x - 14 * s, y - 3.6 * s]], '#8a6a42');
    gPoly(g, [[x - 0.8 * s, y - 5 * s], [x + 0.8 * s, y - 5 * s], [x + 0.6 * s, y - 24 * s], [x - 0.6 * s, y - 24 * s]], '#4a3423'); gPoly(g, [[x + 1, y - 23 * s], [x + 11 * s, y - 15 * s], [x + 1, y - 8 * s]], '#efe6d0'); gPoly(g, [[x - 1, y - 21 * s], [x - 8 * s, y - 14 * s], [x - 1, y - 9 * s]], '#e8dcc4'); },
  waterfall(g, x, y){ gPoly(g, [[x - 14, y], [x + 14, y], [x + 10, y - 26], [x - 10, y - 26]], '#8a7a6a'); gPoly(g, [[x - 5, y - 26], [x + 5, y - 26], [x + 6, y], [x - 6, y]], '#8fd0ff'); for (let i = 0; i < 4; i++) gPoly(g, [[x - 3 + i * 2, y - 24], [x - 2.4 + i * 2, y - 24], [x - 2 + i * 2, y], [x - 2.6 + i * 2, y]], '#e8f6ff'); gEll(g, x, y + 1, 9, 2.6, '#cfeaff'); },
  redpillar(g, x, y){ gShadow(g, x, y, 4); gPoly(g, [[x - 2.4, y], [x + 2.4, y], [x + 2.4, y - 26], [x - 2.4, y - 26]], '#c8382f'); gPoly(g, [[x + 0.8, y], [x + 2.4, y], [x + 2.4, y - 26], [x + 0.8, y - 26]], '#9a2a24'); gPoly(g, [[x - 3.6, y - 26], [x + 3.6, y - 26], [x + 3, y - 29], [x - 3, y - 29]], '#ffd24a'); gPoly(g, [[x - 3.4, y], [x + 3.4, y], [x + 3, y - 2], [x - 3, y - 2]], '#e8e0c8'); },
  pavilion(g, x, y){ gShadow(g, x, y + 1, 18); for (const dx of [-12, 12]) PROPS.redpillar(g, x + dx, y);
    gPoly(g, [[x - 20, y - 26], [x + 20, y - 26], [x + 16, y - 34], [x - 16, y - 34]], '#3c4652'); gPoly(g, [[x - 22, y - 25], [x - 16, y - 34], [x - 18, y - 34], [x - 25, y - 27]], '#2e3640'); gPoly(g, [[x + 22, y - 25], [x + 16, y - 34], [x + 18, y - 34], [x + 25, y - 27]], '#2e3640');

    gPoly(g, [[x - 4 * s, y - 6 * s], [x + 4 * s, y - 6 * s], [x + 3 * s, y - 7.4 * s], [x - 3 * s, y - 7.4 * s]], '#a8a8b0');

/* 지역별 풍경: 판 뒤(위쪽)와 앞(아래쪽) 빈터에 소품을 놓는다 */
function isoScenery(t, rnd){
  const back = [], front = [];
  const spotBack = (n, minX = 4, maxX = MW - 4, gap = 6) => { const out = []; for (let k = 0; k < n * 6 && out.length < n; k++){ const x = minX + rnd() * (maxX - minX), y = 18 + rnd() * (edgeTop(x) - 18 - gap); if (y > 18) out.push([x, y]); } return out; };
  const spotFront = (n, gap = IDEP + 5) => { const out = []; for (let k = 0; k < n * 8 && out.length < n; k++){ const x = 2 + rnd() * (MW - 4), y = edgeBot(x) + gap + rnd() * (MH - edgeBot(x) - gap); if (y < MH - 1 && y > edgeBot(x) + gap) out.push([x, y]); } return out; };
  const P2 = (arr, fn) => { for (const [x, y] of arr) back.push([y, g => fn(g, x, y)]); };
  const F2 = (arr, fn) => { for (const [x, y] of arr) front.push([y, g => fn(g, x, y)]); };
  if (t === 'village'){
    back.push([40, g => PROPS.house(g, 62, 40, 'thatch')], [58, g => PROPS.house(g, 236, 58, 'tile')]);
    P2(spotBack(6), (g, x, y) => PROPS.tree(g, x, y, 0.8 + rnd() * 0.3));
    back.push([44, g => PROPS.fence(g, 140, 40, 9)]);
    P2(spotBack(5), (g, x, y) => PROPS.flowers(g, x, y, rnd));
    F2(spotFront(8), (g, x, y) => rnd() < 0.5 ? PROPS.flowers(g, x, y, rnd) : PROPS.grass(g, x, y));
  } else if (t === 'bamboo'){
    P2(spotBack(16, 4, W - 4, 3), (g, x, y) => PROPS.bamboo(g, x, y, 0.8 + rnd() * 0.4));
    F2(spotFront(6), (g, x, y) => PROPS.grass(g, x, y, '#4f8a3f'));
  } else if (t === 'rock'){
    P2(spotBack(9), (g, x, y) => PROPS.rock(g, x, y, 0.9 + rnd() * 0.8, ['#9a8a7a', '#8a7a6a', '#a89a88'][(rnd() * 3) | 0]));
    P2(spotBack(4), (g, x, y) => PROPS.pine(g, x, y, 0.7));
    F2(spotFront(6), (g, x, y) => PROPS.rock(g, x, y, 0.5 + rnd() * 0.4));
  } else if (t === 'swamp'){
    P2(spotBack(4), (g, x, y) => PROPS.deadtree(g, x, y));
    P2(spotBack(10), (g, x, y) => PROPS.reeds(g, x, y));
    F2(spotFront(8), (g, x, y) => PROPS.reeds(g, x, y));
  } else if (t === 'cave'){
    for (const [tx, ty] of CAVE_TORCH) back.push([ty, g => PROPS.torch(g, tx, ty)]);
    P2(spotBack(10), (g, x, y) => PROPS.stalag(g, x, y, 0.7 + rnd() * 0.6));
    P2(spotBack(4), (g, x, y) => PROPS.crystal(g, x, y, '#7a8ad8'));
    F2(spotFront(6), (g, x, y) => PROPS.stalag(g, x, y, 0.5));
  } else if (t === 'snow'){

function buildIsoMap(ri, w = S.world){

  // 바깥 땅 무늬(비스듬한 칸)

    const cx = isoX(i, j), cy = isoY(i, j);
    if (cx < -IW || cx > MW + IW || cy < 18 || cy > MH + IH) continue;
    if (rnd() < 0.5) isoTile(g, cx, cy, darken(th.outer, 0.04 + rnd() * 0.05), 0);
    if (rnd() < 0.5){ g.fillStyle = darken(th.outer, 0.12); g.fillRect(cx + (rnd() - 0.5) * 10, cy + (rnd() - 0.5) * 4, 0.8, 0.8); }
  }
  if (t === 'lava'){ for (let k = 0; k < 60; k++){ const x = rnd() * MW, y = 22 + rnd() * (MH - 22); gEll(g, x, y, 2 + rnd() * 5, 0.8 + rnd(), rnd() < 0.5 ? '#ffd24a' : '#ff8a2a'); } }
  if (t === 'sea' || t === 'river2'){ for (let k = 0; k < 70; k++){ const x = rnd() * MW, y = 24 + rnd() * (MH - 24); gEll(g, x, y, 2 + rnd() * 4, 0.5, 'rgba(255,255,255,.45)'); } }
  if (t === 'cloud' || t === 'heaven'){ for (let k = 0; k < 26; k++){ const x = rnd() * MW, y = 26 + rnd() * (MH - 26); gEll(g, x, y, 6 + rnd() * 10, 2 + rnd() * 2, 'rgba(255,255,255,.7)'); } }
  if (t === 'swamp' || t === 'poison'){ for (let k = 0; k < 18; k++){ const x = rnd() * MW, y = 24 + rnd() * (MH - 24); gEll(g, x, y, 3 + rnd() * 6, 1 + rnd() * 1.5, mix(th.outer, '#ffffff', 0.12)); } }

  sc.back.sort((a, b2) => a[0] - b2[0]).forEach(([, fn]) => fn(g));
  // 판: 앞 두 벽(흙·돌) → 윗면 칸
  const [lx, ly] = ISO_LEFT, [bx, by] = ISO_BOT, [rx, ry] = ISO_RIGHT;
  gPoly(g, [[lx, ly], [bx, by], [bx, by + IDEP], [lx, ly + IDEP]], th.side[0]);
  gPoly(g, [[bx, by], [rx, ry], [rx, ry + IDEP], [bx, by + IDEP]], th.side[1]);
  for (let k = 1; k < 3; k++){ const yy = IDEP * k / 3; g.globalAlpha = 0.25;
    gPoly(g, [[lx, ly + yy], [bx, by + yy], [bx, by + yy + 0.7], [lx, ly + yy + 0.7]], darken(th.side[0], 0.35));
    gPoly(g, [[bx, by + yy], [rx, ry + yy], [rx, ry + yy + 0.7], [bx, by + yy + 0.7]], darken(th.side[1], 0.35)); g.globalAlpha = 1; }
  if (t === 'lava') for (let k = 0; k < 8; k++){ const u = rnd(), x = lx + (bx - lx) * u, y = ly + (by - ly) * u; gPoly(g, [[x, y + 2], [x + 1, y + 2], [x + 2, y + IDEP], [x + 1, y + IDEP]], '#ff6a1a'); }
  for (let ty = TOPR; ty < ROWS; ty++) for (let tx = 0; tx < COLS; tx++){
    const cx = isoX(tx, ty), cy = isoY(tx, ty);
    let col = th.top[(tx + ty) % 2];
    if (rnd() < 0.35) col = mix(col, old.ground[(rnd() * old.ground.length) | 0], 0.5);

  }
  // 칸 테두리(아주 옅게)와 판 가장자리 빛
  g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 0.4; g.beginPath();
  for (let ty = TOPR; ty <= ROWS; ty++){ const x0 = isoX(-0.5, ty - 0.5), y0 = isoY(-0.5, ty - 0.5), x1 = isoX(COLS - 0.5, ty - 0.5), y1 = isoY(COLS - 0.5, ty - 0.5); g.moveTo(x0, y0); g.lineTo(x1, y1); }
  for (let tx = 0; tx <= COLS; tx++){ const x0 = isoX(tx - 0.5, TOPR - 0.5), y0 = isoY(tx - 0.5, TOPR - 0.5), x1 = isoX(tx - 0.5, ROWS - 0.5), y1 = isoY(tx - 0.5, ROWS - 0.5); g.moveTo(x0, y0); g.lineTo(x1, y1); }

  g.strokeStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.moveTo(lx, ly + 0.4); g.lineTo(bx, by + 0.4); g.lineTo(rx, ry + 0.4); g.stroke();
  sc.front.sort((a, b2) => a[0] - b2[0]).forEach(([, fn]) => fn(g));
  return c;
}

function addChat(kind, name, text, extra){

  if (!chatOpen && kind !== 'me') chatUnread++;

  if (ul){
    const li = document.createElement('li');
    li.className = 'cm ' + kind;
    const b = document.createElement('b'); b.textContent = kind === 'sys' ? '[알림]' : name;
    li.appendChild(b); li.appendChild(document.createTextNode(' ' + text));

function castSprite(k, f, dir){
  if (k === 'hero') return {sp:heroSprite(S.cls, dir === 'left' ? 'down' : 'right', f), sc:1.7, flip:false};
  if (k.startsWith('m:')){ const [, t, c] = k.split(':'); return {sp:mobSprite(t, c, f % 2, true), sc:3, flip:dir === 'right'}; }
  if (k.startsWith('k:')){ const K = KINGS[+k.slice(2)] || KINGS[0]; return {sp:mobSprite('judge', K.color, f % 2, true), sc:3, flip:dir === 'right'}; }
  if (k.startsWith('g:')){ const g = GUARD[k.slice(2)]; if (g.pet != null) return {sp:petSprite(g.pet, f % 2), sc:3, flip:dir === 'right', fly:PET_FLY[PETS[g.pet].draw] ? 10 : 0};
    return {sp:mobSprite(g.mob[0], g.mob[1], f % 2, false), sc:3, flip:dir === 'right'}; }
  const d = CAST[k];
  if (!d) return null;
  if (d.pet != null) return {sp:petSprite(d.pet, f % 2), sc:d.sc || 2, flip:dir === 'right', fly:8};
  const [c, look, aG, wG] = d.p;
  return {sp:personSprite(c, look, aG, wG, dir === 'left' ? 'down' : 'right', f, false, d.ex), sc:1.7, flip:false};
}

const CUT_X = {1:[120], 2:[72, 170], 3:[52, 122, 192], 4:[40, 96, 152, 206], 5:[30, 75, 120, 165, 210]};
function playCut(shots, opts = {}){
  if (!shots || !shots.length || !session && !window.__game) return false;
  cut = {shots, si:-1, opts, t:0};
  $('#cut').hidden = false; $('#scene').classList.add('cutting');
  const tt = $('#cutTitle'); setText(tt, opts.title || ''); tt.classList.toggle('on', !!opts.title);
  setTimeout(() => tt.classList.remove('on'), 3200);
  sfx('cut');
  nextShot();
  return true;
}
function nextShot(){
  cut.si++;
  const cd = cut.opts && cut.opts.card;
  if (cd && !cd.shown && cut.si >= cd.at){ cd.shown = true; showChapterCard(cd.ch); if (cut.si < cut.shots.length){ const tt = $('#cutTitle'); setText(tt, CHAPTERS[cd.ch] || ''); tt.classList.add('on'); setTimeout(() => tt.classList.remove('on'), 3200); } }
  if (cut.si >= cut.shots.length){ endCut(); return; }
  const [bg, castStr, fx, lines] = cut.shots[cut.si];
  const keys = castStr ? castStr.split(',').filter(Boolean) : [], xs = CUT_X[Math.min(5, keys.length)] || [];
  Object.assign(cut, {bg, fx:fx || '', lines:lines || [], li:-1, st:0, shotT:0});
  cut.cast = keys.map((k, i) => {
    const x = xs[i], left = x < 120 || (keys.length === 1 && k === 'hero');
    return {k, x, x0:left ? x - 110 : x + 110, dir:left ? 'right' : 'left', delay:i * 0.18};
  });
  if (cut.fx === 'shake') shake = 0.6;
  nextLine();
}
function nextLine(){
  cut.li++; cut.st = 0; cut.typ = 0;
  const box = $('#cutBox');
  if (cut.li >= cut.lines.length){ box.classList.remove('done'); cut.lineDur = 0.5; cut.waitShot = true; return; }
  cut.waitShot = false;
  const [who, text] = cut.lines[cut.li];
  cut.text = text.replace(/\{name\}/g, S.name);
  cut.who = who === '나' ? (S.name || '나') : who;
  cut.speaker = WHO[who] || '';
  box.classList.toggle('narr', !who); box.classList.remove('done');
  setText($('#cutWho'), cut.who); setText($('#cutText'), '');
  cut.lineDur = Math.max(2.3, cut.text.length / 26 + 1.5);
  if (who) sfx('blip');
}
function cutTap(){
  if (!cut) return;
  if (!cut.waitShot && cut.typ < cut.text.length){ cut.typ = cut.text.length; setText($('#cutText'), cut.text); $('#cutBox').classList.add('done'); return; }
  if (cut.waitShot) nextShot(); else nextLine();
}
function endCut(){
  const o = cut && cut.opts;
  cut = null; $('#cut').hidden = true; document.getElementById('scene').classList.remove('cutting');
  if (o && o.onEnd) o.onEnd();
}
function updateCut(dt){
  const c = cut;
  c.t += dt; c.st += dt; c.shotT += dt;
  if (c.waitShot){ if (c.st >= c.lineDur) nextShot(); return; }
  const want = Math.min(c.text.length, Math.floor(c.st * 26));
  if (want > c.typ){ c.typ = want; setText($('#cutText'), c.text.slice(0, want)); if (want >= c.text.length) $('#cutBox').classList.add('done'); }
  if (c.st >= c.lineDur) nextLine();
}
document.getElementById('cut').addEventListener('click', e => { if (e.target.id === 'cutSkip') return; cutTap(); });

  addLog(S.bossAuto ? '보스 자동: 몹을 다 잡으면 보스에게 알아서 도전해요.' : '보스 수동: 준비되면 [보스 도전]을 눌러야 보스가 나와요.', 'good');
});
elSpeed.addEventListener('click', () => { S.speed = S.speed === 2 ? 1 : 2; applySpeedBtn(); applyModeBtns(); });
let bossRetry = 0;   // 보스 자동일 때 실패 뒤 다시 도전까지 기다린 시간
const BOSS_RETRY = 45;
function applySpeedBtn(){ elSpeed.textContent = `×${S.speed}`; elSpeed.setAttribute('aria-label', `게임 속도 ${S.speed}배`); elSpeed.setAttribute('aria-pressed', String(S.speed === 2)); }
function updateHud(){
  setText(elLv, 'Lv.' + S.level); setText(elCls, jobName()); setText(elNick, session ? S.name : '');
  setText(elCp, fmt(power(ST)));
  setText(elGold, fmt(S.gold)); setText(elGems, fmt(S.gems));
  if (currentTab){ setText($('#pgGold'), fmt(S.gold)); setText($('#pgGems'), fmt(S.gems)); }
  const hr = Math.max(0, hero.hp / ST.maxHp);
  elHp.style.width = (hr * 100).toFixed(1) + '%'; setText(elHpN, fmt(hero.hp) + '/' + fmt(ST.maxHp));
  const xr = Math.min(1, S.exp / expNeed(S.level));
  elXp.style.width = (xr * 100).toFixed(1) + '%'; setText(elXpN, (xr * 100).toFixed(1) + '%');
  const showBoss = S.kills >= FIELD.kills && !S.autoBoss && !bossActive && !raid;
  if (elBoss.hidden === showBoss) elBoss.hidden = !showBoss;
  if (showBoss) setText(elBoss, S.bossAuto ? `보스 도전 · ${Math.max(1, Math.ceil(BOSS_RETRY - bossRetry))}초 뒤 자동` : '보스 도전!');
  if (skBarCls !== S.cls) buildSkillbar();
  SKILLS.forEach((sk, i) => {
    const r = skillEls[sk.key], lv = skLv(i), locked = !lv, man = !locked && !skAuto(i), rdy = man && !(skillCd[sk.key] > 0);
    if (r.el.classList.contains('locked') !== locked) r.el.classList.toggle('locked', locked);
    if (r.el.classList.contains('manual') !== man) r.el.classList.toggle('manual', man);
    if (r.el.classList.contains('rdy') !== rdy) r.el.classList.toggle('rdy', rdy);
    setText(r.lk, skLockText(i));
    const lab = `${skillName(i)}${locked ? ' (잠김)' : man ? ' (수동, 눌러서 쓰기)' : ''}`;
    if (r.el.getAttribute('aria-label') !== lab) r.el.setAttribute('aria-label', lab);
    r.cd.style.setProperty('--p', locked ? '0%' : Math.min(100, (skillCd[sk.key] || 0) / skCdOf(i) * 100).toFixed(1) + '%');
  });
}

/* --- 수련 --- */
let growView = 'stats';
const growSegHTML = () => `<div class="seg" role="group" aria-label="수련 보기" style="margin-bottom:10px">
  <button id="gv-stats" aria-pressed="${growView === 'stats'}">능력치</button><button id="gv-job" aria-pressed="${growView === 'job'}">전직${S.job ? ` · ${S.job}차` : ''}</button><button id="gv-reb" aria-pressed="${growView === 'reb'}">환생${S.reb.n ? ` · ${S.reb.n}회` : ''}</button></div>`;
function wireGrowSeg(){ for (const v of ['stats', 'job', 'reb']) $('#gv-' + v).addEventListener('click', () => { growView = v; buildTab('grow', true); }); }
function buildJob(){
  const c = S.cls, J = JOBS[c];
  const card = (tier) => {
    const j = J[tier - 1], got = S.job >= tier, secret = tier === 2 && !hiddenTrialOpen() && !got;
    const req = tier === 1 ? `레벨 ${JOB_LV}` : tier === 3 ? `부상 · Lv.${JOB3_LV} · ${j.ch}장` : tier === 4 ? `곤륜 · Lv.${JOB4_LV} · ${j.ch}장` : '숨은 퀘스트를 모두 마치면';
    return `<div class="card ${got ? '' : ''}" id="jobCard${tier}">
      <div class="ct">${tier}차 전직 · ${secret ? '???' : j.name}<span class="tag">${got ? '전직함' : req}</span></div>
      <p class="story">${secret ? (tier === 2 && hiddenOpen() ? '붉은 옷의 차사가 지켜보고 있어요. [퀘스트]의 히든 퀘스트를 따라가요.' : '어딘가에 숨은 전직이 있다는 소문이 있어요…')
        : `공격력·체력 +${JOB_BONUS[tier].atk}%, 기술 피해 +${JOB_BONUS[tier].skill}%. 전직 기술 「${CLASSES[c].skills[tier >= 3 ? 5 + tier : 5 + tier]}」, 전직 무기 「${j.weapon}」, 망토 「${j.cape}」를 받아요.`}</p>
      ${tier === 3 && !got ? `<p class="small">부상에서 레벨 ${JOB3_LV}을 넘기고 스승 ${j.teacher}이 나오는 이야기 ${j.ch}장을 마치면 겨룰 수 있어요.</p>` : ''}
      ${tier === 4 && !got ? `<p class="small">곤륜에서 레벨 ${JOB4_LV}을 넘기고 이야기 ${j.ch}장 「오색 돌」을 마치면 <b>세 스승의 시험</b>(1차 스승 → 강림도령 → 3차 스승, 연달아 세 판)을 봐요. 스승은 ${j.teacher}.</p>` : ''}
      ${got ? '' : `<button class="btn primary" data-tier="${tier}">${secret ? '???' : (tier === 1 ? '스승과' : tier === 3 ? j.teacher + '와' : tier === 4 ? '세 스승의 시험' : '강림도령과') + (tier === 4 ? '' : ' 겨루기(전직 시험)')}</button>`}
    </div>`;
  };
  panel.innerHTML = `${growSegHTML()}
    <div class="ph"><h2>전직</h2><span class="small">지금: <b>${jobName()}</b></span></div>
    <p class="hint">전직 시험은 동료 둘과 함께 ${RAID_TIME}초 안에 스승을 이기면 통과예요. 지면 몇 번이든 다시 도전할 수 있어요. 직업을 바꿔도 전직 단계는 남아요.</p>
    ${card(1)}${card(2)}${S.world >= 3 || S.job >= 2 ? card(3) : ''}${S.world >= 4 || S.job >= 3 ? card(4) : ''}`;
  wireGrowSeg();
  panel.querySelectorAll('[data-tier]').forEach(bt => bt.addEventListener('click', () => { if (startJobTrial(+bt.dataset.tier)) buildTab('grow', true); }));
  return () => {
    panel.querySelectorAll('[data-tier]').forEach(bt => { const t = +bt.dataset.tier, ok = jobReady(t) && !raid; bt.disabled = !ok; bt.classList.toggle('primary', ok);
      if (raid && raid.info.job === t) setText(bt, '시험 중…'); });
  };
}
function buildGrow(){
  if (growView === 'reb') return buildReb();
  if (growView === 'job') return buildJob();
  panel.innerHTML = `${growSegHTML()}
    <div class="ph"><h2>수련</h2>
      <div class="mode" role="group" aria-label="한 번에 올릴 단계">
        <button class="chip" id="mode-1" data-m="1">×1</button><button class="chip" id="mode-10" data-m="10">×10</button><button class="chip" id="mode-max" data-m="max">최대</button>
      </div></div>
    <p class="hint">엽전으로 능력을 갈고닦아요. 버튼을 길게 누르면 계속 올라가요.</p>
    <ul class="list">${STAT_ORDER.map(k => `
      <li class="row" id="row-${k}"><div class="ic">${SVG[STAT_DEFS[k].icon]}</div>
        <div><div class="nm">${STAT_DEFS[k].name}<span class="l" data-r="lv"></span></div><div class="val" data-r="val"></div></div>
        <button class="buy" id="buy-${k}"><span class="coin"></span><span data-r="cost"></span></button></li>`).join('')}
    </ul>`;
  wireGrowSeg();
  panel.querySelectorAll('.chip').forEach(bt => bt.addEventListener('click', () => { S.buyMode = bt.dataset.m === 'max' ? 'max' : +bt.dataset.m; refreshPanel(); }));
  const refs = STAT_ORDER.map(k => {
    const row = $('#row-' + k);
    const r = {k, lv:row.querySelector('[data-r=lv]'), val:row.querySelector('[data-r=val]'), btn:$('#buy-' + k)};
    r.cost = r.btn.querySelector('[data-r=cost]');
    holdButton(r.btn, () => { const ok = buyStat(k); if (ok) upFx(r.btn.closest('li') || r.btn, `${STAT_DEFS[k].name} ↑`); return ok; });
    return r;
  });
  return () => {
    for (const m of ['1', '10', 'max']) $('#mode-' + m).setAttribute('aria-pressed', String(String(S.buyMode) === m));
    for (const r of refs){
      const d = STAT_DEFS[r.k], bi = buyInfo(r.k), lv = S.up[r.k];
      setText(r.lv, lv >= d.max ? 'Lv.' + lv + ' 최대' : 'Lv.' + lv);
      const cur = statValue(r.k, ST);
      if (bi.n > 0){
        const nx = statValue(r.k, computeStats(Object.assign({}, S.up, {[r.k]:lv + bi.n})));
        setHTML(r.val, `${cur} → <em>${nx}</em>`);
        setHTML(r.cost, fmt(bi.cost) + (bi.n > 1 ? ` <small>+${bi.n}</small>` : ''));
        r.btn.disabled = !bi.afford; r.btn.classList.remove('nocoin');
      } else { setHTML(r.val, cur); setHTML(r.cost, '최대'); r.btn.disabled = true; r.btn.classList.add('nocoin'); }
    }
  };
}

/* --- 환생 --- */
function askCross(){
  if (!crossReady()) return;
  showModal(S.world === 3 ? '서쪽 하늘로 건널까요?' : '바다를 건널까요?', S.world === 3
    ? `<p>열 개의 해를 쫓아 서쪽 끝 신들의 산 <b>곤륜</b>으로 건너가요. 레벨·장비·능력치·엽전·펫은 그대로, 사냥 단계만 1부터예요. 레벨 상한은 500.</p>`
    : `<p>동해 용왕의 거북을 타고 <b>부상</b>으로 건너가요. 레벨·장비·능력치·엽전·펫은 그대로, 사냥 단계만 1부터예요. 몬스터는 천계 끝자락만큼 세요.</p>`,
    [{label:'아직'}, {label:'건너기', primary:true, fn:() => { if (doCross()) { growView = 'reb'; buildTab('grow'); } }}]);
}

        : '이승의 레벨 100을 채우고, 무기를 +25까지 벼리고, 윤회의 다섯 시련을 통과하면 저승에서 다시 태어나요. 레벨은 1이 되지만 저승의 레벨 상한은 200이에요.'}</p>

    for (const st of REB_STATS){

      <div class="ct"><span style="color:var(--gold)">초각성기</span> · ${cls().awaken}<span class="tag">${S.awaken ? '익힘' : '잠김'}</span></div>

      ${S.awaken ? '' : `<p class="small">배우는 법: 환생한 뒤 저승 레벨 60을 넘기고, 시왕 레이드 「송제전」을 토벌한 다음, 저승 이야기의 「각성의 시련」 퀘스트를 완료해요.</p>`}
    </div>`;
  const refs = SKILLS.map((sk, i) => {
    const row = $('#sk-' + sk.key);
    const r = {sk, i, lv:row.querySelector('[data-r=lv]'), desc:row.querySelector('[data-r=desc]'), btn:$('#skbuy-' + sk.key)};
    r.cost = r.btn.querySelector('[data-r=cost]');
    holdButton(r.btn, () => { const ok = upgradeSkill(sk.key); if (ok) upFx(r.btn.closest('li') || r.btn, `Lv.${S.skills[sk.key]}`, '#9fe7ff'); return ok; });
    return r;
  });
  return () => {
    for (const r of refs){
      const lv = skLv(r.i), cdt = `재사용 ${+skCdOf(r.i).toFixed(1)}초${skAuto(r.i) ? '' : ' · <b>수동</b>'}`;
      if (!lv){
        setText(r.lv, skLockLong(r.i));
        setHTML(r.desc, `${skillDesc(r.i, Math.max(1, S.skills[r.sk.key] || 1))} · ${cdt}`);
        setHTML(r.cost, '잠김'); r.btn.disabled = true; r.btn.classList.add('nocoin');
      } else if (lv >= r.sk.max){
        setText(r.lv, 'Lv.' + lv + ' 최대');
        setHTML(r.desc, `${skillDesc(r.i, lv)} · ${cdt}`);
        setHTML(r.cost, '최대'); r.btn.disabled = true; r.btn.classList.add('nocoin');
      } else {
        const c = skillCost(r.sk, lv);
        setText(r.lv, 'Lv.' + lv);
        setHTML(r.desc, `${skillDesc(r.i, lv)} · ${cdt}`);
        setHTML(r.cost, fmt(c)); r.btn.disabled = S.gold < c; r.btn.classList.remove('nocoin');
      }
    }
  };
}

let gearSlot = 'weapon', gearSel = -1;
function gearSegHTML(){
  return `<div class="seg six" role="group" aria-label="장비 종류">
      <button id="seg-weapon" aria-pressed="${gearSlot === 'weapon'}">${cls().weapon}</button>
      <button id="seg-armor" aria-pressed="${gearSlot === 'armor'}">${cls().armor}</button>
      <button id="seg-refine" aria-pressed="${gearSlot === 'refine'}">재련</button>
      <button id="seg-myth" aria-pressed="${gearSlot === 'myth'}">신화</button>
      <button id="seg-acc" aria-pressed="${gearSlot === 'acc'}">장신구</button>
      <button id="seg-form" aria-pressed="${gearSlot === 'form'}">변신</button>
      <button id="seg-av" aria-pressed="${gearSlot === 'av'}">아바타</button>
      <button id="seg-craft" aria-pressed="${gearSlot === 'craft'}">조합${craftReady() ? ' •' : ''}</button>
    </div>`;
}
function wireGearSeg(){
  for (const k of ['weapon', 'armor', 'refine', 'myth', 'acc', 'form', 'av', 'craft']) $('#seg-' + k).addEventListener('click', () => { gearSlot = k; gearSel = -1; buildTab('gear', true); });
}
function buildGear(){
  if (gearSlot === 'refine') return buildRefine();
  if (gearSlot === 'myth') return buildMyth();
  if (gearSlot === 'acc') return buildAcc();
  if (gearSlot === 'form') return buildForm();
  if (gearSlot === 'av') return buildAvatar();
  if (gearSlot === 'craft') return buildCraft();
  const slot = gearSlot, Gd = S.gear[slot], eq = S.equip[slot], def = GEAR[slot];
  let grid = '';
  for (let gr = 0; gr < 5; gr++){
    grid += `<div class="gl" style="--gc:${GRADES[gr].color}">${GRADES[gr].name}</div>`;
    for (let t = 0; t < 4; t++){
      const i = gr * 4 + t, c = Gd.count[i];
      grid += `<button class="cell${Gd.seen[i] ? '' : ' unseen'}${gearSel === i ? ' sel' : ''}" id="cell-${i}" data-i="${i}" style="--g:${GRADES[gr].color}" aria-label="${gearName(slot, i)}, ${c}개${eq === i ? ', 장착 중' : ''}">${SVG[def.icon]}<span class="tier">${ROMAN[t]}</span>${c ? `<span class="cnt">${c}</span>` : ''}${eq === i ? '<span class="eq">장착</span>' : ''}</button>`;
    }
  }
  let detail = '';
  if (gearSel >= 0){
    const i = gearSel, gr = Math.floor(i / 4), c = Gd.count[i], m = mergeableSets(slot, i);
    detail = `<div class="detail" style="--g:${GRADES[gr].color}">
      <div class="dn">${gearName(slot, i)}<span class="badge">${GRADES[gr].name}</span></div>
      <div class="dl"><span>장착 효과</span><b>${def.stat} +${fmt(gearEquipPct(i))}%</b></div>
      <div class="dl"><span>보유 효과 (한 번 얻으면 계속 적용)</span><b>${def.stat} +${fmt(gearOwnPct(i))}%</b></div>
      <div class="dl"><span>가진 개수</span><b>${c}개</b></div>
      <div class="dbtns">
        <button class="btn primary" id="eqBtn" ${c > 0 && eq !== i ? '' : 'disabled'}>${eq === i ? '장착 중' : '장착하기'}</button>
        <button class="btn" id="mgBtn" ${m > 0 ? '' : 'disabled'}>${i >= 19 ? '최고 단계' : m > 0 ? `4개 합성 ×${m}` : '4개 모이면 합성'}</button>
      </div>
      ${Gd.seen[i] ? '' : '<p class="small">아직 얻지 못했어요. 소환하거나 바로 아래 단계 장비 4개를 합성하면 얻어요.</p>'}
    </div>`;
  }
  const eqP = eq >= 0 ? gearEquipPct(eq) : 0;
  panel.innerHTML = `
    ${gearSegHTML()}
    <div class="summon">
      <button class="gbtn" id="sum1"><span>${def.label} 1회 소환</span><span class="price"><i class="gem"></i>50</span></button>
      <button class="gbtn" id="sum10"><span>${def.label} 10회 소환</span><span class="price"><i class="gem"></i>450</span></button>
    </div>
    <p class="odds">전설 0.2% · 영웅 1.3% · 희귀 8.5% · 고급 26% · 일반 64%</p>
    <div class="effects">
      <div>장착 효과<b>${def.stat} +${fmt(eqP)}%</b></div>
      <div>보유 효과 합계<b>${def.stat} +${fmt(ownedPct(slot))}%</b></div>
    </div>
    <div class="grid">${grid}</div>
    ${detail}
    <div class="bulk"><button class="btn" id="mergeAll">일괄 합성</button><button class="btn" id="equipBest">가장 좋은 것 장착</button></div>`;
  wireGearSeg();
  $('#sum1').addEventListener('click', () => doSummon(slot, 1));
  $('#sum10').addEventListener('click', () => doSummon(slot, 10));
  panel.querySelectorAll('.cell').forEach(bt => bt.addEventListener('click', () => { const i = +bt.dataset.i; gearSel = gearSel === i ? -1 : i; buildTab('gear', true); }));
  if ($('#eqBtn')) $('#eqBtn').addEventListener('click', () => { S.equip[slot] = gearSel; refreshStats(); buildTab('gear', true); addLog(`${gearName(slot, gearSel)}${josa(gearName(slot, gearSel), '을', '를')} 장착했습니다.`); });
  if ($('#mgBtn')) $('#mgBtn').addEventListener('click', () => { const n = mergeOne(slot, gearSel); refreshStats(); if (n) addLog(`${gearName(slot, gearSel + 1)} ${n}개를 만들었습니다.`, 'gain'); buildTab('gear', true); });
  $('#mergeAll').addEventListener('click', () => { const n = mergeAll(slot); addLog(n ? `${n}번 합성했습니다.` : '합성할 장비가 없습니다. 같은 장비 4개가 필요해요.', n ? 'gain' : ''); buildTab('gear', true); });
  $('#equipBest').addEventListener('click', () => { equipBest(slot); addLog(S.equip[slot] >= 0 ? `${gearName(slot, S.equip[slot])}${josa(gearName(slot, S.equip[slot]), '을', '를')} 장착했습니다.` : '먼저 장비를 소환해 주세요.'); buildTab('gear', true); });
  return () => { $('#sum1').disabled = S.gems < 50; $('#sum10').disabled = S.gems < 450; };
}
function doSummon(slot, n){
  const res = summon(slot, n);
  if (!res){ addLog('보석이 부족합니다.', 'warn'); return; }
  sfx(res.some(r => r.it >= 12) ? 'rare' : 'summon');
  if (currentTab === 'gear') buildTab('gear', true);
  const best = res.reduce((a, r) => Math.max(a, r.it), 0);
  playFx('summon', {best:Math.floor(best / 4), sub:gearName(slot, best)});
  const html = `<div class="res-grid">${res.map((r, i) => {
      const g = GRADES[Math.floor(r.it / 4)];
      return `<div class="res flip${r.it >= 12 ? ' legend' : ''}" style="--g:${g.color};--i:${i}" title="${gearName(slot, r.it)}">${SVG[GEAR[slot].icon]}<span class="tier">${ROMAN[r.it % 4]}</span>${r.isNew ? '<span class="new">NEW</span>' : ''}</div>`;
    }).join('')}</div>
    <p class="small" style="margin-top:10px">가장 좋은 장비: <b>${gearName(slot, best)}</b> (${GRADES[Math.floor(best / 4)].name})</p>`;
  const cost = summonCost(n);
  showModal(`${GEAR[slot].label} 소환 결과`, html, [
    {label:`${n}회 더 (보석 ${cost})`, disabled:S.gems < cost, fn:() => doSummon(slot, n)},
    {label:'확인', primary:true},
  ]);
}

      setHTML(card.querySelector('[data-r=now]'), it.t

          : `<b>${n.t}단계</b>는 ${WORLD_NAME[n.T.w]} ${n.T.need}단계(${stageLabelW(n.T.w, n.T.need)})에 닿으면 열려요.`);

      <button class="btn primary" id="grindBtn">남는 장비 갈기</button></div>

    ${card('weapon')}${card('armor')}

  wireGearSeg();
  const grindMax = () => Math.max(...['weapon', 'armor'].map(sl => S.equip[sl] >= 0 ? Math.floor(S.equip[sl] / 4) : 0)) - 1;

      refineMsg[slot] = out.ok ? {ok:true, t:`성공! ${name} +${out.lv}${out.sure ? ' (기회의 불꽃)' : ''}`}

        const g = refineGold(R2.lv), m = S.useProtect && refineProtectable(R2.lv) && !o.chance ? refineGems(R2.lv) * 2 : 0, du = refineDust(R2.lv);

      }
      const msg = refineMsg[r.slot];
      setText(r.res, msg ? msg.t : '');
      r.res.classList.toggle('ok', !!(msg && msg.ok)); r.res.classList.toggle('no', !!(msg && !msg.ok));
    }
  };
}

function bossPortrait(type, color){
  const k = type + color; let u = portCache.get(k);
  if (!u){
    const sp = mobSprite(type, color, 0, true), c = document.createElement('canvas'); c.width = 96; c.height = 96;
    const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
    const sc = Math.min(86 / sp.width, 86 / sp.height), w = sp.width * sc, h = sp.height * sc;
    g.drawImage(sp, (96 - w) / 2, 94 - h, w, h); u = c.toDataURL(); portCache.set(k, u);
  }

}

  return power(ST) * est / 45;
}

const JM_WORLD = [
  {name:'이승', part:'1부', sub:'고구려 건국 신화', gate:''},
  {name:'저승', part:'1부', sub:'시왕의 저승', gate:'환생'},
  {name:'천계', part:'1부', sub:'신과의 전쟁', gate:'마지막 환생'},
  {name:'부상', part:'2부', sub:'해 뜨는 섬의 신들', gate:'바다 건너기'},
  {name:'곤륜', part:'3부', sub:'무너진 하늘 기둥', gate:'서쪽 하늘로'},
];
const JM_DX = 138, JM_Y = [104, 62];   // 지그재그(아래·위). 띠 높이 180
const jmSpan = w => [null, HELL_SPAN, HEAVEN_SPAN, BUSANG_SPAN, KUNLUN_SPAN][w];
const jmNodeOf = (w, s) => w === 0 ? Math.min(9, Math.floor((Math.max(1, s) - 1) / 10)) : (sp => (k => k < 0 ? sp.length : k)(sp.findIndex(e => s <= e)))(jmSpan(w));
let jmNodesCache = null, jmChCache = null;
function jmNodes(){
  if (jmNodesCache) return jmNodesCache;
  const N = [];
  for (let k = 0; k < 10; k++){ const R = REGIONS[k % REGIONS.length]; N.push({w:0, k, ri:k % REGIONS.length, name:R.name + (k >= REGIONS.length ? ' Ⅱ' : ''), a:10 * k + 1, b:10 * k + 10, R}); }
  for (let w = 1; w <= 4; w++){ const sp = jmSpan(w); regionsOf(w).forEach((R, k) => N.push({w, k, ri:k, name:R.name, a:k ? sp[k - 1] + 1 : 1, b:sp[k] || null, R})); }
  return (jmNodesCache = N);
}
// 장마다: 그 장 퀘스트 조건 중 가장 뒤 세계, 그 세계에서 처음 나오는 '단계' 조건으로 지도 위 자리를 정한다
function jmChapters(){
  if (jmChCache) return jmChCache;
  const out = [], lastS = [1, 1, 1, 1];
  let curW = 0;
  for (let ch = 0; ch < CHAPTERS.length; ch++){
    const qs = []; MAIN_Q.forEach((q, i) => { if (q.ch === ch) qs.push([q, i]); });
    if (!qs.length) continue;
    let w = -1;
    for (const [q] of qs){ const m = /^[sl](\d)$/.exec(q.k); if (m) w = Math.max(w, +m[1]); if (q.k === 'world') w = Math.max(w, q.n); }
    if (w < 0) w = curW;
    let st = null;
    for (const [q] of qs) if (q.k === 's' + w){ st = Math.max(1, q.n - 1); break; }
    if (st == null) st = lastS[w];
    curW = Math.max(curW, w); lastS[w] = st;
    const lab = CHAPTERS[ch].split(' · ')[0];
    out.push({ch, w, k:jmNodeOf(w, st), first:qs[0][1], last:qs[qs.length - 1][1], lab, name:CHAPTERS[ch]});
  }
  return (jmChCache = out);
}
const jmChState = c => S.quest.main > c.last ? 's-done' : S.quest.main >= c.first ? 's-now' : 's-todo';
const jmBest = w => Math.max(S.best['s' + w] || 0, S.world === w ? S.maxStage : 0);
function jmState(n){
  if (n.w > S.world) return 's-lock';
  if (n.w < S.world) return 's-done';
  const ci = jmNodeOf(n.w, S.stage);
  if (n.k === ci) return 's-now';
  return (n.b && jmBest(n.w) > n.b) || n.k < ci ? 's-done' : 's-todo';
}
const jmRange = n => n.b ? `${n.a}~${n.b}단계` : `${n.a}단계~`;
// 지역 그림(사냥터 디오라마를 줄인 것). 처음 열 때 몇 장씩 나눠 그린다
const jmThumbs = new Map();
function jmThumb(w, ri){

    const g = t.getContext('2d'); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';

}
const JM_LOCK = '<svg class="lk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 10V7a5 5 0 0 1 10 0v3h1.5v11h-13V10zm2 0h6V7a3 3 0 0 0-6 0z"/></svg>';

/* ================= 계정 =================
   서버가 없는 정적 페이지라 계정은 이 기기(브라우저)에 저장한다. 비밀번호는 그대로 두지 않고 소금(salt)을 쳐서 해시로만 남긴다.
   claude.ai 아티팩트로 열면 Claude 계정의 개인 저장소(data/users/<id>/)에도 같이 올려서 다른 기기에서 이어진다. */
const ID_RE = /^[a-z0-9_]{4,12}$/;
const NAME_RE = /^[가-힣a-zA-Z0-9]{2,8}$/;
let REG = null, curAcc = null, regDirty = false, modalLock = false, loginBusy = false;
const emptyReg = () => ({v:1, accounts:{}, keep:null, legacyClaimed:false, t:0});
function loadReg(){
  try {
    const d = JSON.parse(localStorage.getItem(ACC_KEY) || 'null');
    if (d && d.v === 1 && d.accounts && typeof d.accounts === 'object'){
      const r = Object.assign(emptyReg(), d);
      for (const A of Object.values(r.accounts)) if (!Array.isArray(A.chars)) A.chars = [];
      return r;
    }
  } catch (e) {}
  return emptyReg();
}
function saveReg(){
  REG.t = now(); regDirty = true;
  try { localStorage.setItem(ACC_KEY, JSON.stringify(REG)); } catch (e) {}
}
function writeSession(o){ try { if (o) sessionStorage.setItem(SESSION_KEY, JSON.stringify(o)); else sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
function readSession(){ try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; } }
function randHex(n){
  const a = new Uint8Array(n);
  try { crypto.getRandomValues(a); } catch (e) { for (let i = 0; i < n; i++) a[i] = Math.random() * 256 | 0; }
  return Array.from(a, x => x.toString(16).padStart(2, '0')).join('');
}
async function hashPw(pw, salt, alg){
  if (alg !== 'f'){
    try {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:enc.encode(salt), iterations:60000, hash:'SHA-256'}, key, 256);
      return 'p:' + Array.from(new Uint8Array(bits), x => x.toString(16).padStart(2, '0')).join('');
    } catch (e) { if (alg === 'p') return null; }
  }
  // 아주 오래된 브라우저용 예비 해시
  let h1 = 0x9e3779b9, h2 = 0x85ebca6b;
  const s = salt + ':' + pw;
  for (let r = 0; r < 3000; r++) for (let i = 0; i < s.length; i++){
    const c = s.charCodeAt(i) + r;
    h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); h1 ^= h2 >>> 15; h2 ^= h1 >>> 13;
  }
  return 'f:' + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}
const allChars = () => Object.entries(REG.accounts).flatMap(([acc, A]) => (A.chars || []).map(c => Object.assign({acc}, c)));

  return best && {data:best.data, level:Math.floor(best.data.level) || 1, stage:Math.floor(best.data.maxStage) || 1};
}

async function submitLogin(signup){
  if (loginBusy) return;
  const id = ($('#lg-id').value || '').trim().toLowerCase(), pw = $('#lg-pw').value || '', keep = $('#lg-keep').checked;
  const err = m => setText($('#lg-err'), m);
  if (!ID_RE.test(id)) return err('아이디는 영문 소문자·숫자·밑줄(_)로 4~12자예요.');
  if (pw.length < 4) return err('비밀번호는 4자 이상이에요.');
  if (signup){
    if (pw !== $('#lg-pw2').value) return err('비밀번호 확인이 서로 달라요.');
    if (REG.accounts[id]) return err('이미 있는 아이디예요. 다른 아이디를 쓰거나 로그인해 주세요.');
  } else if (!REG.accounts[id] && !onlineWanted()) return err(cloud ? '없는 아이디예요. [새 계정 만들기]를 눌러 주세요.' : '이 기기에 없는 아이디예요. [새 계정 만들기]를 눌러 주세요.');
  loginBusy = true; err('');
  const btn = $('#mBtns .primary');
  if (btn){ btn.disabled = true; btn.textContent = '확인 중…'; }
  try {
    let srv = null;                       // 온라인 서버가 준 로그인 표(토큰)
    onlineNote = '';
    if (onlineWanted()){
      try { srv = await rpc(signup ? 'samhan_signup' : 'samhan_login', {p_id:id, p_pw:pw}); }
      catch (e) {
        const A = REG.accounts[id];
        if (e.code === 'id_taken') return err('이미 서버에 있는 아이디예요. 다른 아이디를 쓰거나 [로그인]해 주세요.');
        if (e.code === 'bad_login'){
          // 서버가 생기기 전에 이 기기에서만 만든 계정이면 서버로 옮긴다
          if (!(A && (await hashPw(pw, A.salt, A.hash[0])) === A.hash)) return err('아이디나 비밀번호가 맞지 않아요.');
          try { srv = await rpc('samhan_signup', {p_id:id, p_pw:pw}); onlineNote = '이 기기의 계정을 온라인 서버로 옮겼어요. 이제 다른 기기에서도 이 아이디로 들어올 수 있어요.'; }
          catch (e2) {
            if (e2.code === 'id_taken') return err('서버에 같은 아이디가 이미 있어요(비밀번호가 달라요). 서버 비밀번호로 로그인하거나 다른 아이디로 새로 만들어 주세요.');
            onlineNote = '지금은 서버에 연결할 수 없어 이 기기에만 저장해요. 다시 연결되면 서버에 올려요.';
          }
        } else if (e.code !== 'net') return err('서버에서 받아 주지 않았어요. 아이디·비밀번호 규칙을 확인해 주세요.');
        else if (!signup && !A) return err('서버에 연결할 수 없어요. 인터넷 연결을 확인하고 다시 시도해 주세요.');
        else onlineNote = '지금은 서버에 연결할 수 없어 이 기기에만 저장해요. 다시 연결되면 서버에 올려요.';
      }
    }
    if (signup || srv){
      // 새 계정이거나 서버 로그인에 성공: 이 기기에도 같은 비밀번호로 계정을 둔다(인터넷이 끊겨도 들어올 수 있게)

      if (h !== A.hash) return err('비밀번호가 맞지 않아요.');
    }
    curAcc = id;
    REG.keep = keep ? {acc:id} : null;

  for (const topic of ['chat', 'tb']) ch.on('broadcast', {event:topic}, msg => {

  await new Promise((res, rej) => {

      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED'){ clearTimeout(to); rej(new Error(st)); }

  return {
    on(topic, fn){ (hs[topic] = hs[topic] || []).push(fn); return () => {}; },
    onPeers(fn){ peerFns.push(fn); return () => {}; },

const AUD_KEY = 'samhan-audio';

function audApply(){

  const t = AUD.ctx.currentTime;
  AUD.bgm.gain.setTargetAtTime(AUD.set.bgm ? AUD.set.bv * 0.55 : 0, t, 0.2);
  AUD.fx.gain.setTargetAtTime(AUD.set.sfx ? AUD.set.sv * 0.8 : 0, t, 0.05);

function audInit(){
  if (AUD.ctx) { if (AUD.ctx.state === 'suspended') AUD.ctx.resume(); return; }

  if (!AC) return;
  const c = AUD.ctx = new AC();
  AUD.master = c.createGain(); AUD.master.gain.value = 0.9; AUD.master.connect(c.destination);
  AUD.bgm = c.createGain(); AUD.bgm.connect(AUD.master);
  AUD.fx = c.createGain(); AUD.fx.connect(AUD.master);
  const len = c.sampleRate, nb = c.createBuffer(1, len, c.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

  audApply();

const hz = midi => 440 * Math.pow(2, (midi - 69) / 12);
// 악기
function pluck(out, t, midi, dur, vol){
  const c = AUD.ctx, o1 = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
  const fq = hz(midi);
  o1.type = 'triangle'; o2.type = 'sawtooth'; o2.detune.value = 6;
  o1.frequency.setValueAtTime(fq * 1.02, t); o1.frequency.exponentialRampToValueAtTime(fq, t + 0.07);   // 농현처럼 살짝 꺾임
  o2.frequency.setValueAtTime(fq * 1.02, t); o2.frequency.exponentialRampToValueAtTime(fq, t + 0.07);
  f.type = 'lowpass'; f.frequency.setValueAtTime(3200, t); f.frequency.exponentialRampToValueAtTime(500, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const g2 = c.createGain(); g2.gain.value = 0.35;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(f); f.connect(out);
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}
function flute(out, t, midi, dur, vol){
  const c = AUD.ctx, o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), g = c.createGain();
  o.type = 'sine'; o.frequency.value = hz(midi);
  lfo.frequency.value = 5; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(hz(midi) * 0.012, t + dur * 0.6);
  lfo.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.09); g.gain.setValueAtTime(vol, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const n = c.createBufferSource(), nf = c.createBiquadFilter(), ng = c.createGain();
  n.buffer = AUD.noise; nf.type = 'bandpass'; nf.frequency.value = hz(midi) * 2; nf.Q.value = 3; ng.gain.value = vol * 0.25;
  n.connect(nf); nf.connect(ng); ng.connect(g);
  o.connect(g); g.connect(out);
  o.start(t); lfo.start(t); n.start(t, Math.random() * 0.5); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05); n.stop(t + dur + 0.05);
}
function drum(out, t, kind, vol){
  const c = AUD.ctx;
  if (kind === 'dung' || kind === 'kung'){
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(kind === 'dung' ? 110 : 90, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.25);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.4);
  }
  if (kind === 'dung' || kind === 'deok'){
    const n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    n.buffer = AUD.noise; f.type = 'bandpass'; f.frequency.value = kind === 'deok' ? 2600 : 1800; f.Q.value = 1.2;
    g.gain.setValueAtTime(vol * (kind === 'deok' ? 0.9 : 0.6), t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    n.connect(f); f.connect(g); g.connect(out); n.start(t, Math.random()); n.stop(t + 0.12);
  }
}
function gong(out, t, vol){
  const c = AUD.ctx;
  for (const [fq, v] of [[98, 1], [101.5, 0.7], [196, 0.3]]){
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = fq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * v, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);

  }
}
// 곡: 박자 길이·음계·장단(장구 무늬)·밑음
const TRACKS = {
  title:{step:0.5, root:55, scale:[0, 2, 5, 7, 9], drums:['dung', '', '', '', '', '', 'kung', '', '', '', 'deok', ''], mel:'flute', melEvery:2, arp:true},
  field:{step:0.24, root:55, scale:[0, 2, 5, 7, 9], drums:['dung', '', 'deok', 'kung', '', 'deok', 'dung', 'deok', 'deok'], mel:'pluck', melEvery:1, arp:false},
  battle:{step:0.16, root:57, scale:[0, 3, 5, 7, 10], drums:['dung', 'deok', 'deok', 'dung', 'kung', 'deok', 'dung', 'deok'], mel:'pluck', melEvery:1, arp:true},
  hell:{step:0.42, root:52, scale:[0, 3, 5, 7, 10], drums:['dung', '', '', '', 'kung', '', '', ''], mel:'flute', melEvery:2, drone:true},
};
function wantTrack(){
  if (!session) return 'title';
  if (cut) return S.world === 1 ? 'hell' : 'title';
  if (raid || bossActive) return 'battle';
  return S.world === 1 ? 'hell' : S.world === 2 ? 'title' : 'field';
}
function audTick(){
  const c = AUD.ctx;
  if (!c || c.state !== 'running') return;
  const want = wantTrack();
  if (want !== AUD.track){
    AUD.track = want; AUD.step = 0; AUD.phrase = []; AUD.next = Math.max(AUD.next, c.currentTime + 0.05);
    if (want === 'battle' && AUD.set.bgm) gong(AUD.bgm, c.currentTime + 0.05, 0.25);
  }
  if (!AUD.set.bgm){ AUD.next = c.currentTime + 0.1; return; }
  const T = TRACKS[AUD.track];
  while (AUD.next < c.currentTime + 0.25){
    const t = AUD.next, st = AUD.step;
    const dk = T.drums[st % T.drums.length];
    if (dk) drum(AUD.bgm, t, dk, dk === 'deok' ? 0.18 : 0.32);
    if (st % T.melEvery === 0){
      if (!AUD.phrase.length){
        // 새 가락: 음계 안에서 한두 칸씩 움직이고, 끝은 으뜸음으로
        const n = 6 + ((Math.random() * 5) | 0), ph = [];
        let dg = AUD.deg || 5;
        for (let i = 0; i < n; i++){ dg = Math.max(0, Math.min(10, dg + [-2, -1, -1, 1, 1, 2, 0][(Math.random() * 7) | 0])); ph.push(Math.random() < 0.18 ? null : dg); }
        ph.push(5); ph.push(null); ph.push(null);
        AUD.phrase = ph; AUD.deg = dg;
      }
      const dg = AUD.phrase.shift();
      if (dg != null){
        const midi = T.root + 12 + T.scale[dg % 5] + 12 * Math.floor(dg / 5) - 12;
        if (T.mel === 'flute') flute(AUD.bgm, t, midi + 12, T.step * T.melEvery * 1.8, 0.13);
        else pluck(AUD.bgm, t, midi + 12, 0.9, 0.16);
      }
    }
    if (T.arp && st % 4 === 0) pluck(AUD.bgm, t, T.root + T.scale[(st / 4) % 5 | 0], 1.4, 0.09);
    if (T.drone && st % 16 === 0) flute(AUD.bgm, t, T.root - 12, T.step * 16, 0.07);
    AUD.next += T.step; AUD.step++;
  }
}

const SFX_GAP = {hit:0.07, crit:0.08, blip:0.06, click:0.05, kill:0.08, gem:0.1};
const sfxLast = {};
sfx = function(name){
  const c = AUD.ctx;
  if (!c || !AUD.set.sfx || c.state !== 'running') return;
  const t = c.currentTime;
  if (SFX_GAP[name] && t - (sfxLast[name] || 0) < SFX_GAP[name]) return;
  sfxLast[name] = t;
  const o = AUD.fx, P5 = [0, 2, 5, 7, 9];
  switch (name){
    case 'hit': drum(o, t, 'deok', 0.12); break;
    case 'crit': drum(o, t, 'deok', 0.2); pluck(o, t, 84, 0.25, 0.12); break;
    case 'kill': pluck(o, t, 88, 0.2, 0.08); pluck(o, t + 0.05, 93, 0.25, 0.08); break;
    case 'gem': pluck(o, t, 91, 0.6, 0.14); pluck(o, t + 0.08, 96, 0.8, 0.12); break;
    case 'level': P5.concat([12]).forEach((d, i) => pluck(o, t + i * 0.07, 67 + d, 0.6, 0.15)); break;
    case 'boss': gong(o, t, 0.4); drum(o, t, 'dung', 0.5); break;
    case 'win': [0, 5, 9, 12].forEach((d, i) => pluck(o, t + i * 0.1, 67 + d, 0.8, 0.16)); drum(o, t, 'dung', 0.4); break;
    case 'fail': [7, 5, 2, 0].forEach((d, i) => flute(o, t + i * 0.18, 60 + d, 0.3, 0.1)); break;
    case 'skill': { const n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); n.buffer = AUD.noise; f.type = 'bandpass'; f.Q.value = 2;
      f.frequency.setValueAtTime(600, t); f.frequency.exponentialRampToValueAtTime(3000, t + 0.25); g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      n.connect(f); f.connect(g); g.connect(o); n.start(t); n.stop(t + 0.32); break; }
    case 'nuke': drum(o, t, 'dung', 0.6); drum(o, t + 0.12, 'kung', 0.5); sfx('skill'); break;
    case 'quest': [0, 2, 5, 7].forEach((d, i) => pluck(o, t + i * 0.06, 72 + d, 0.5, 0.13)); break;
    case 'rare': [0, 5, 9, 12, 17, 21].forEach((d, i) => pluck(o, t + i * 0.07, 72 + d, 0.9, 0.14)); gong(o, t, 0.15); break;
    case 'summon': [0, 2, 5, 7, 9].forEach((d, i) => pluck(o, t + i * 0.05, 72 + d, 0.4, 0.1)); break;
    case 'refOk': pluck(o, t, 96, 0.5, 0.2); pluck(o, t + 0.05, 91, 0.7, 0.15); break;
    case 'refNo': drum(o, t, 'kung', 0.4); break;
    case 'raid': gong(o, t, 0.35); [0, 1, 2, 3].forEach(i => drum(o, t + 0.3 + i * 0.12, i % 2 ? 'deok' : 'dung', 0.35)); break;
    case 'awaken': gong(o, t, 0.5); [0, 5, 7, 12, 17, 19, 24].forEach((d, i) => pluck(o, t + i * 0.04, 60 + d, 1.2, 0.15)); break;
    case 'form': [0, 7, 12, 19].forEach((d, i) => flute(o, t + i * 0.06, 72 + d, 0.6, 0.1)); break;
    case 'rebirth': gong(o, t, 0.5); [12, 7, 5, 0, -5].forEach((d, i) => flute(o, t + 0.3 + i * 0.25, 60 + d, 0.6, 0.1)); break;
    case 'potion': flute(o, t, 79, 0.25, 0.1); break;
    case 'cut': gong(o, t, 0.18); break;
    case 'blip': pluck(o, t, 86, 0.12, 0.05); break;
    case 'click': pluck(o, t, 81, 0.1, 0.06); break;
  }
};
