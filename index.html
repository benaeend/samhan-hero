  let p = 0; const seen = S.gear[slot].seen;
  for (let i = 0; i < 20; i++) if (seen[i]) p += gearOwnPct(i);
  return p;
}
function gearPct(slot){ const eq = S.equip[slot]; return ownedPct(slot) + (eq >= 0 ? gearEquipPct(eq) : 0); }

/* 펫 효과: 레벨·별에 따라 커진다 */
function petInfo(i, lvOver){
  const p = PETS[i], lv = Math.max(1, lvOver || S.pets.lv[i]), star = S.pets.star[i];
  const m = (1 + 0.06 * (lv - 1)) * (1 + 0.2 * star);
  if (p.type === 'atk') return {pct:PET_ATK[p.g] * m, splash:p.g >= 3};
  if (p.type === 'def') return {dr:Math.min(60, PET_DR[p.g] * (1 + 0.5 * (m - 1))), hp:PET_HP[p.g] * m};
  return {bonus:PET_GOLD[p.g] * (1 + 0.5 * (m - 1)), heal:PET_HEAL[p.g] * (1 + 0.25 * (m - 1))};
}
function petEffectText(i, lvOver){
  const e = petInfo(i, lvOver), t = PETS[i].type;
  if (t === 'atk') return `1.5초마다 공격력의 ${Math.round(e.pct)}% 피해${e.splash ? ' (주변 적까지)' : ''}`;
  if (t === 'def') return `받는 피해 -${e.dr.toFixed(1)}% · 체력 +${Math.round(e.hp)}%`;
  return `엽전·경험치 +${Math.round(e.bonus)}% · 5초마다 체력 ${e.heal.toFixed(1)}% 회복`;
}
const eqPet = t => { const i = S.petEq[t]; return i >= 0 && S.pets.lv[i] > 0 ? i : -1; };
const petDR = () => { const i = eqPet('def'); return i < 0 ? 0 : petInfo(i).dr; };
const petHpPct = () => { const i = eqPet('def'); return i < 0 ? 0 : petInfo(i).hp; };
const petBonus = () => { const i = eqPet('sup'); return i < 0 ? 0 : petInfo(i).bonus; };

// 장신구 효과 %
const accP = k => S.acc[k].g >= 0 ? S.acc[k].p * (cls().accMul || 1) : 0;   // 자객은 장신구 효과 1.5배
// 술사 마력 성장: 지금까지 오른 레벨(이승 100 + 저승 200 + 천계 300 = 600)에 따라 공격력 배율이 커진다
const cumLv = () => S.level + [0, 100, 300, 300, 300][S.world];
const classAtk = () => { const C = cls(); return C.grow ? C.grow[0] + (C.grow[1] - C.grow[0]) * Math.min(1, cumLv() / 600) : C.atkMul; };
// 세 나라 세트: 같은 줄 보물 셋(이승·부상·곤륜)을 모두 가지면 추가 효과. 오색 돌이 있으면 1.5배
function mythSets(){
  const m = S.myth, k = m.ose > 0 ? 1.5 : 1;
  return {sword:m.sword > 0 && m.kusa > 0 && m.pangu > 0 ? k : 0, mirror:m.mirror > 0 && m.yata > 0 && m.elixir > 0 ? k : 0, bell:m.bell > 0 && m.maga > 0 && m.sail > 0 ? k : 0};
}
function computeStats(up = S.up){
  const MS = mythSets(), C = cls(), lvMul = Math.pow(CURVE.lv, Math.min(S.level, 100) - 1) * Math.pow(CURVE.lv2, Math.max(0, S.level - 100)), F = formOf() || {}, RB = S.reb.up;
  return {
    atk: 10 * Math.pow(CURVE.statMul, up.atk) * lvMul * (1 + craftMain('w') / 100) * (1 + craftEff('power') / 100) * (harmonyOn() ? 1 + HARMONY / 100 : 1) * (1 + gearPct('weapon') / 100) * classAtk() * (1 + refineEff('weapon') / 100) * (1 + S.myth.sword / 100) * (1 + (S.myth.kusa || 0) / 100) * (1 + (S.myth.pangu || 0) / 100) * (1 + 0.2 * MS.sword)
      * (1 + 0.15 * RB.atk) * (1 + (F.atk || 0) / 100) * (1 + accP('ring') / 100) * (1 + JOB_BONUS[S.job].atk / 100) * (1 + AV_PCT * avCount() / 100) * (1 + mountCol() / 100),
    maxHp: 100 * Math.pow(CURVE.statMul, up.hp) * lvMul * (1 + craftMain('a') / 100) * (1 + 1.5 * craftEff('wall') / 100) * (harmonyOn() ? 1 + HARMONY / 100 : 1) * (1 + gearPct('armor') / 100) * C.hpMul * (1 + refineEff('armor') / 100) * (1 + petHpPct() / 100) * (1 + S.myth.mirror / 100) * (1 + (S.myth.yata || 0) / 100) * (1 + (S.myth.elixir || 0) / 100) * (1 + 0.2 * MS.mirror)
      * (1 + 0.15 * RB.hp) * (1 + (F.hp || 0) / 100) * (1 + accP('brace') / 100) * (1 + JOB_BONUS[S.job].hp / 100) * (1 + AV_PCT * avCount() / 100) * (1 + mountCol() / 100) * (1 + rideAb('hp') / 100),
    regen: 0.01 + 0.0002 * up.regen + C.regenAdd + craftEff('life') / 100,
    crit: Math.min(0.9, 0.05 + 0.005 * up.crit + C.critAdd + 0.01 * RB.eye + (F.crit || 0) / 100 + 0.05 * MS.bell + rideAb('crit') / 100),
    critDmg: 1.5 + 0.05 * up.critDmg + S.myth.bell / 100 + (S.myth.maga || 0) / 100 + (S.myth.sail || 0) / 100 + 0.3 * MS.bell + 0.05 * RB.eye + accP('ear') / 100 + craftEff('vital') / 100,
    aspd: (1 + 0.02 * up.aspd) * C.spdMul * (1 + 0.03 * RB.spd) * (1 + (F.spd || 0) / 100) * (1 + accP('brace') / 1000) * (1 + craftEff('swift') / 100),
  };
}
// 기술 피해 배율(만파식적·청룡 변신·귀걸이)
const skillMulX = () => (1 + S.myth.flute / 100) * (1 + (S.myth.ose || 0) / 100) * (1 + ((formOf() || {}).skill || 0) / 100) * (1 + accP('ear') / 200) * (1 + JOB_BONUS[S.job].skill / 100) * (1 + craftMain('n') / 100) * (1 + craftEff('magic') / 100) * (1 + rideAb('skill') / 100);
const dpsOf = st => st.atk * st.aspd * (1 + st.crit * (st.critDmg - 1));
function power(st){
  const pi = eqPet('atk'), petDps = pi >= 0 ? st.atk * petInfo(pi).pct / 100 / 1.5 : 0;
  return (dpsOf(st) + petDps) * 10 + st.maxHp / (1 - petDR() / 100);
}
function refreshStats(){
  const old = ST;
  ST = computeStats();
  if (old && old.maxHp > 0) hero.hp = Math.min(ST.maxHp, hero.hp / old.maxHp * ST.maxHp);
  if (spriteCache.size > 400) spriteCache.clear();
}
function statValue(k, st){
  switch (k){
    case 'atk': return st.atk < 100 ? st.atk.toFixed(1) : fmt(st.atk);
    case 'hp': return st.maxHp < 1000 ? st.maxHp.toFixed(1) : fmt(st.maxHp);
    case 'crit': return (st.crit * 100).toFixed(1) + '%';
    case 'critDmg': return Math.round(st.critDmg * 100) + '%';
    case 'aspd': return st.aspd.toFixed(2) + '회/초';
    case 'regen': return (st.regen * 100).toFixed(1) + '%/초';
  }
}
const atkBuff = () => (hero.buffT > 0 ? 1 + roarAtk(hero.buffLv) / 100 : 1) * (S.buff.atk > 0 ? BUFFS.atk.mul : 1) * (hero.jobBuffT > 0 ? 1.3 : 1) * (hero.gutT > 0 ? 1.5 : 1) * (hero.shinT > 0 ? 1.2 : 1);
const spdBuff = () => (hero.buffT > 0 ? 1 + roarSpd(hero.buffLv) / 100 : 1) * (S.buff.spd > 0 ? BUFFS.spd.mul : 1) * (hero.shinT > 0 ? 1.3 : 1);
// 펫·여의주(+%)와 상점 부적(×)을 합친 엽전·경험치 배율. 오프라인 보상에는 부적이 빠진다
const gainMul = (k, noBuff) => (1 + (petBonus() + S.myth.pearl + (S.myth.uchi || 0) + 10 * S.reb.up.luck + ((formOf() || {}).gain || 0) + rideAb(k)) / 100) * (!noBuff && S.buff[k] > 0 ? BUFFS[k].mul : 1);

/* ================= 강화·기술·장비 ================= */
function buyInfo(k){
  const d = STAT_DEFS[k], lv = S.up[k], room = d.max - lv;
  if (room <= 0) return {n:0, cost:0, afford:false};
  let n = 0, cost = 0;
  if (S.buyMode === 'max'){
    while (n < room && n < 1000){ const c = d.cost(lv + n); if (cost + c > S.gold) break; cost += c; n++; }
    if (n === 0) return {n:1, cost:d.cost(lv), afford:false};
    return {n, cost, afford:true};
  }
  const want = Math.min(S.buyMode, room);
  for (let i = 0; i < want; i++) cost += d.cost(lv + i);
  return {n:want, cost, afford:cost <= S.gold};
}
function buyStat(k){
  const b = buyInfo(k);
  if (!b.n || !b.afford) return false;
  S.gold -= b.cost; S.up[k] += b.n;
  ev('up', b.n);
  refreshStats(); refreshPanel();
  return true;
}
const skillCost = (sk, lv) => sk.base * Math.pow(sk.growth, lv - 1);
function upgradeSkill(key){
  const i = SKILLS.findIndex(s => s.key === key), sk = SKILLS[i], lv = skLv(i);
  if (!lv || lv >= sk.max) return false;
  const c = skillCost(sk, lv);
  if (S.gold < c) return false;
  S.gold -= c; S.skills[key]++;
  refreshPanel();
  return true;
}
function rollItem(){
  let r = Math.random(), g = 0;
  for (; g < 4; g++){ if (r < GRADE_P[g]) break; r -= GRADE_P[g]; }
  let r2 = Math.random(), t = 0;
  for (; t < 3; t++){ if (r2 < TIER_P[t]) break; r2 -= TIER_P[t]; }
  return g * 4 + t;
}
const summonCost = n => n === 10 ? 450 : 50 * n;
function summon(slot, n){
  const cost = summonCost(n);
  if (S.gems < cost) return null;
  S.gems -= cost; S.rec.summons += n;
  const G = S.gear[slot], res = [];
  for (let i = 0; i < n; i++){
    const it = rollItem();
    res.push({it, isNew:!G.seen[it]});
    G.count[it]++; G.seen[it] = true;
  }
  if (S.equip[slot] < 0) equipBest(slot);
  ev('gsummon', n);
  refreshStats(); saveLocal();
  return res;
}
function giveItem(slot, it){
  const G = S.gear[slot], isNew = !G.seen[it];
  G.count[it]++; G.seen[it] = true;
  if (S.equip[slot] < 0 || S.equip[slot] < it) S.equip[slot] = it;
  return isNew;
}

/* --- 재련 --- */
const whetOn = () => S.useWhet && S.inv.whet > 0;
function refineOdds(slot){
  const r = S.refine[slot], lv = r.lv;
  if ((r.drops || 0) >= 2) return {ok:100, drop:0, brk:0, keep:0, chance:true};
  const ok = Math.min(100, REFINE_RATE[lv] * (r.t ? REFINE_T_RATE : 1) * (whetOn() ? 1.15 : 1));
  const brk = S.useProtect && refineProtectable(lv) ? 0 : REFINE_BREAK[lv];
  const drop = REFINE_GUARD.includes(lv) ? 0 : REFINE_DROP[lv];
  const left = 100 - ok, b = Math.min(left, brk), d = Math.min(left - b, drop);
  return {ok, drop:d, brk:b, keep:left - b - d, chance:false};
}
function refineTry(slot){
  const r = S.refine[slot];
  if (r.lv >= refineCap(slot)) return null;
  const prot = S.useProtect && refineProtectable(r.lv) && (r.drops || 0) < 2;
  const g = refineGold(r.lv), gm = prot ? refineGems(r.lv) * 2 : 0, du = refineDust(r.lv);
  if (S.gold < g || S.gems < gm || S.dust < du) return null;
  S.gold -= g; S.gems -= gm; S.dust -= du; S.rec.refines++;
  const o = refineOdds(slot), from = r.lv;
  if (whetOn()) S.inv.whet--;
  let x = Math.random() * 100, res;
  if (x < o.ok) res = 'ok';
  else if ((x -= o.ok) < o.brk) res = 'break';
  else if ((x -= o.brk) < o.drop) res = 'drop';
  else res = 'keep';
  if (res === 'ok'){ r.lv++; r.drops = 0; if (r.lv >= 10) { const gn = slot === 'weapon' ? cls().weapon : cls().armor; announce(`${S.name}님이 ${gn}${josa(gn, '을', '를')} +${r.lv}까지 재련했어요!`); } }
  else if (res === 'drop'){ r.lv--; r.drops = (r.drops || 0) + 1; }
  else if (res === 'break'){ r.lv = refineGuardTo(r.lv); r.drops = 0; }
  else r.drops = 0;
  refreshStats();
  ev('refine');
  return {ok:res === 'ok', res, sure:o.chance, lv:r.lv, from, rate:o.ok};
}

/* --- 펫 --- */
function rollPet(){
  S.petPity = (S.petPity || 0) + 1;
  let g = 0;
  if (S.petPity >= PET_PITY) g = Math.random() < PET_P[4] / (PET_P[3] + PET_P[4]) ? 4 : 3;
  else { let r = Math.random(); for (; g < 4; g++){ if (r < PET_P[g]) break; r -= PET_P[g]; } }
  if (g >= 3) S.petPity = 0;
  return ((Math.random() * 3) | 0) * 5 + g;
}
function petScore(i){ const e = petInfo(i); return PETS[i].type === 'atk' ? e.pct : PETS[i].type === 'def' ? e.hp + e.dr * 4 : e.bonus + e.heal * 5; }
function petEquipBest(t){
  let best = -1, bv = -1;
  for (let i = 0; i < PET_N; i++) if (PETS[i].type === t && S.pets.lv[i] > 0){ const v = petScore(i); if (v > bv){ bv = v; best = i; } }
  S.petEq[t] = best;
  refreshStats();
}
function petSummon(n){
  const cost = petSummonCost(n);
  if (S.gems < cost) return null;
  S.gems -= cost; S.rec.psum += n;
  const res = [];
  for (let k = 0; k < n; k++){
    const i = rollPet();
    let kind;
    if (!S.pets.lv[i]){ S.pets.lv[i] = 1; kind = 'new'; if (PETS[i].g >= 3) announce(`${S.name}님이 ${GRADES[PETS[i].g].name} 펫 ${PETS[i].name}${josa(PETS[i].name, '을', '를')} 얻었어요!`); }
    else if (S.pets.star[i] < PET_STAR_MAX){ S.pets.star[i]++; kind = 'star'; }
    else { S.gems += PET_DUP_GEMS; kind = 'gem'; }
    res.push({i, kind});
  }
  for (const t of PET_TYPE_ORDER) if (eqPet(t) < 0) petEquipBest(t);
  ev('psummon', n);
  refreshStats(); saveLocal();
  return res;
}
function petUpgrade(i){
  const lv = S.pets.lv[i];
  if (!lv || lv >= PET_MAX) return false;
  const c = petUpCost(lv);
  if (S.gold < c.gold || S.gems < c.gems) return false;
  S.gold -= c.gold; S.gems -= c.gems; S.pets.lv[i]++;
  refreshStats(); refreshPanel();
  return true;
}
function petEquip(i){
  if (!S.pets.lv[i]) return;
  S.petEq[PETS[i].type] = i; petRt[PETS[i].type].init = false;
  refreshStats();
}

/* --- 퀘스트·튜토리얼 --- */
function today(){ const d = new Date(now()); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function dailyCheck(){
  const Q = S.quest, d = today();
  if (Q.day !== d){ Q.day = d; Q.dp = {}; Q.dgot = []; Q.dall = false; }
}
// 게임 안에서 일어난 일을 퀘스트·튜토리얼에 알린다
function ev(type, n = 1){
  const Q = S.quest;
  const dk = DAILY_OF[type];
  if (dk){ dailyCheck(); Q.dp[dk] = (Q.dp[dk] || 0) + n; }
  if (Q.tut >= 0 && Q.tut < TUT.length && TUT[Q.tut].ev === type){
    Q.tutN += n;
    if (Q.tutN >= TUT[Q.tut].n) tutAdvance();
  }
}
function tutAdvance(){
  const Q = S.quest, st = TUT[Q.tut];
  if (!st) return;
  if (st.gems){ S.gems += st.gems; addLog(`길잡이 까치: 잘했어요! 보석 +${st.gems}`, 'gain'); }
  Q.tut++; Q.tutN = 0;
  if (Q.tut >= TUT.length) Q.tut = -1;
  const g = document.getElementById('guide');
  if (g){ g.classList.remove('flash'); void g.offsetWidth; g.classList.add('flash'); }
}
/* --- 윤회의 시련·환생 --- */
function trialCur(t){
  switch (t.k){
    case 's0': return S.best.s0;
    case 'raids8': { let n = 0; for (let i = 0; i < 8; i++) if (S.raid.first[String(i)]) n++; return n; }
    case 'myth': return MYTHS.filter(m => S.myth[m.k] > 0).length;
    case 'pet30': return S.pets.lv.some(l => l >= TRIAL_PET_LV) ? 1 : 0;
    case 'acc': return ACC_ORDER.filter(k => S.acc[k].g >= 0).length;
  }
  return 0;
}
const trialReady = i => !S.quest.trials[i] && trialCur(TRIALS[i]) >= TRIALS[i].n;
function claimTrial(i){
  if (!trialReady(i)) return false;
  S.quest.trials[i] = true; S.gems += TRIALS[i].gems;
  addLog(`시련 통과: ${TRIALS[i].t} (보석 +${TRIALS[i].gems})`, 'gain');
  announce(`${S.name}님이 윤회의 시련 '${TRIALS[i].t}'을 통과했어요!`);
  sfx('quest');
  return true;
}
const trialsDone = () => TRIALS.every((t, i) => S.quest.trials[i]);
function rebirthCheck(){
  if (S.world === 0) return [
    {t:'이승 레벨 100', ok:S.level >= 100, v:`Lv.${S.level}`},
    {t:'무기 재련 +25', ok:S.refine.weapon.lv >= REFINE_MAX || !!S.refine.weapon.t, v:`+${S.refine.weapon.lv}`},
    {t:'윤회의 다섯 시련', ok:trialsDone(), v:`${S.quest.trials.filter(Boolean).length}/5`},
  ];
  if (S.world === 1) return [
    {t:'저승 레벨 200(만렙)', ok:S.level >= 200, v:`Lv.${S.level}`},
    {t:'저승 이야기 끝까지', ok:S.quest.main >= HELL_END_Q, v:`${Math.min(S.quest.main, HELL_END_Q)}/${HELL_END_Q}`},
  ];
  return [{t:'환생은 두 번까지예요(윤회 구슬도 두 번)', ok:false, v:`${S.reb.n}회`}];
}
const rebirthReady = () => rebirthCheck().every(c => c.ok);
const rebirthPts = () => Math.floor(S.level / 10) + Math.floor(S.maxStage / 20);
function applyWorld(){ document.body.classList.toggle('hell', S.world === 1); document.body.classList.toggle('heaven', S.world === 2); document.body.classList.toggle('busang', S.world === 3); document.body.classList.toggle('kunlun', S.world === 4); }
function doRebirth(){
  if (!rebirthReady()) return null;
  const pts = rebirthPts(), first = S.world === 0;
  S.reb.pts += pts; S.reb.total += pts; S.reb.n++;
  S.world = Math.min(2, S.world + 1);
  S.level = 1; S.exp = 0; S.gold = 0; S.stage = 1; S.maxStage = 1; S.kills = 0; S.autoBoss = true; S.deathsHere = 0;
  for (const k in S.up) S.up[k] = 0;
  const wb = S.world === 2 ? ['s2', 'l2'] : ['s1', 'l1']; S.best[wb[0]] = Math.max(S.best[wb[0]], 1); S.best[wb[1]] = Math.max(S.best[wb[1]], 1);
  raid = null; ST = null; refreshStats(); resetRuntime(); mapCache.clear(); applyWorld();
  unlockSkills();

  announce(`${S.name}님이 ${S.reb.n}번째 환생을 했어요!`);
  sfx('rebirth');

}
function rebUp(k){
  const st = REB_STATS.find(x => x.k === k), lv = S.reb.up[k];

  refreshStats(); refreshPanel();

}

function mainQuest(){

}
const awakenOk = () => S.reb.n >= 1 && S.best.l1 >= 60 && !!S.raid.first.h2;
function questCur(q){
  switch (q.k){
    case 'kills': return S.rec.kills;
    case 'stage': case 's0': return S.best.s0;
    case 'level': case 'l0': return S.best.l0;
    case 's1': return S.best.s1;
    case 'l1': return S.best.l1;
    case 'raids': return S.rec.raids;
    case 'raidK': return S.raid.first[q.key] ? 1 : 0;

    case 'refineW': return S.refine.weapon.lv;

function mobHeight(m){ const sp = mobSprite(m.type, m.color, 0, m.boss), sc = mobScale(m); return spH(sp) * sc + (FLOAT[m.type] || 0) * sc; }

let logEls = [];
function addLog(msg, kind){
  const box = document.getElementById('log');
  const el = document.createElement('div');
  el.textContent = msg; if (kind) el.className = kind;
  box.appendChild(el); logEls.push(el);
  while (logEls.length > 2){ const o = logEls.shift(); o.remove(); }
  setTimeout(() => el.classList.add('old'), 6000);
  setTimeout(() => { el.remove(); logEls = logEls.filter(e => e !== el); }, 6700);
}
function addText(text, x, y, color, size, bold){

const HIT_STYLE = {basic:['#ffffff', 12], skill:['#9fe7ff', 12], pet:['#ffd0a0', 11], ally:['#d8d0c0', 10]};
let dmgMeter = 0, dmgBy = {};   // 용사 쪽이 준 피해 합(시험용 측정)
function hit(m, base, kind, sure){
  if (m.dead) return;
  const C = cls(), mine = kind !== 'ally';
  const crit = sure || (kind === 'basic' || kind === 'skill' || kind === 'pet' && C.petCrit) && Math.random() < ST.crit;
  const cd = ST.critDmg + (hero.baguaT > 0 ? hero.baguaAdd / 100 : 0);
  const dmg = base * (crit ? cd : 1) * (m.markT > 0 ? 1 + m.markP / 100 : 1) * (mine && (m.boss || m.raid) ? (C.bossMul || 1) * (1 + craftEff('hunt') / 100) * (1 + rideAb('boss') / 100) : 1) * (0.92 + Math.random() * 0.16);
  if (mine){ dmgMeter += dmg; dmgBy[kind] = (dmgBy[kind] || 0) + dmg; if (dmg > (S.rec.maxHit || 0)) S.rec.maxHit = dmg; }
  if (kind === 'basic' || kind === 'skill') sfx(crit ? 'crit' : 'hit');
  if (kind === 'skill' && mine && !fxOff() && vfx.length < VFX_MAX - 20){ const hy = m.y - mobHeight(m) * 0.5; vSparks(m.x, hy, crit ? 6 : 3, crit ? '#ffd24a' : C.fx || '#ffffff', 55, 18); if (crit) vadd({type:'glow', x:m.x, y:hy, r:10, col:'#ffd24a', dur:0.25}); }
  m.hp -= dmg; m.flash = 0.1; m.aggro = true;
  const st = HIT_STYLE[kind] || HIT_STYLE.basic;
  addText(fmt(dmg), m.x + (Math.random() * (m.raid ? 30 : 10) - (m.raid ? 15 : 5)), m.y - mobHeight(m) - 2 + (kind === 'ally' ? 8 : 0),
    crit ? '#ffb347' : st[0], crit ? 15 : st[1], crit);
  fx.push({type:'hit', t:0, dur:0.18, x:m.x + (m.raid ? Math.random() * 20 - 10 : 0), y:m.y - mobHeight(m) * 0.5});
  if (m.hp <= 0) killMob(m);
}
function killMob(m){
  m.dead = true; m.deathT = 0.4; m.hp = 0;
  const n = m.boss ? 12 : 3;
  for (let i = 0; i < n; i++) parts.push({type:'coin', x:m.x, y:m.y - 6, vx:(Math.random() - 0.5) * 70, vy:-(50 + Math.random() * 60), gy:m.y, t:0, dur:0.9 + Math.random() * 0.3});
  if (hero.target === m) hero.target = null;
  if (m.raid){ m.deathT = 1; raidEnd(true); return; }
  const gm = gainMul('gold'), xm = gainMul('exp');
  S.gold += m.gold * gm; S.rec.kills++;
  if (m.boss){ gainExp(m.exp * xm); bossWin(); return; }
  addLog(`${m.name} 처치 · 경험 +${fmt(m.exp * xm)}`);
  gainExp(m.exp * xm);
  S.kills = Math.min(FIELD.kills, S.kills + 1); offHunt.k++;
  ev('kill');
  if (isGateStage(S.stage) && Math.random() < FIELD.rew) rollAcc(false);
  if (Math.random() < MAT_DROP.mob * FIELD.rew) gainMat(1);
  if (Math.random() < GEM_DROP * FIELD.rew){
    const g = 1 + (Math.random() < S.stage / 300 ? 1 : 0);
    S.gems += g;
    addText('보석 +' + g, m.x, m.y - mobHeight(m) - 12, '#7fdcff', 11, true); sfx('gem');
    parts.push({type:'gem', x:m.x, y:m.y - 8, vx:0, vy:-22, t:0, dur:0.8});
  }
}
function damageHero(d){
  if (hero.invisT > 0) return;   // 무영 월광살: 모습을 감춘 동안
  if (cls().evade && Math.random() < cls().evade){ addText('회피', hero.x + Math.random() * 8 - 4, hero.y - 30, '#d8d0ff', 10, true); return; }
  const dr = petDR();
  let dmg = d * (1 - dr / 100) * (S.buff.def > 0 ? BUFFS.def.mul : 1) * (1 - ((formOf() || {}).dr || 0) / 100) * (1 - (cls().dr || 0) / 100) * (1 - craftDR() / 100) * (1 - 0.1 * mythSets().mirror) * (hero.dr4T > 0 ? 0.7 : 1) * (1 - rideAb('dr') / 100) * (0.9 + Math.random() * 0.2);
  if (dr > 0) petRt.def.glow = 0.25;
  if (hero.shield > 0){
    const a = Math.min(hero.shield, dmg);
    hero.shield -= a; dmg -= a;
    if (dmg <= 0){ addText('막음', hero.x + Math.random() * 8 - 4, hero.y - 30, '#9fe7ff', 10, true); return; }
  }
  hero.hp -= dmg; hero.hurt = 0.12;
  addText('-' + fmt(dmg), hero.x + Math.random() * 8 - 4, hero.y - 30, '#ff8a7a', 11);
  if (hero.hp <= 0){ hero.hp = 0; heroDie(); }
}
function heroDie(){
  if (S.myth.elixir > 0 && !hero.elixirUsed && (raid || bossActive)){   // 서왕모의 불사약: 싸움마다 한 번
    hero.elixirUsed = true; hero.hp = ST.maxHp * 0.5; hero.hurt = 0;
    addText('불사약!', hero.x, hero.y - 40, '#ffe08a', 12, true); fx.push({type:'awaken', t:0, dur:0.9, color:'#ffe08a', x:hero.x, y:hero.y - 12}); sfx('awaken');
    return;
  }
  hero.dead = true; hero.deadT = 2.2; hero.buffT = 0; hero.moving = false; hero.target = null; hero.shield = 0; hero.baguaT = 0; hero.gutT = 0;
  if (raid){
    hero.deadT = 3;
    if (raid.info.tb){ raid.deaths = (raid.deaths || 0) + 1; if (raid.deaths >= TB_LIVES){ hero.deadT = Infinity; for (const a of raid.allies) if (a.down) a.downT = Infinity; addLog(`파티가 ${TB_LIVES}번 쓰러져 더는 일어날 수 없어요!`, 'warn'); return; } }
    addLog('용사가 쓰러졌습니다… 동료들이 버티는 사이 다시 일어나요.', 'warn'); return;
  }
  const wasBoss = bossActive;
  if (bossActive) bossFail('용사가 쓰러짐');
  for (const m of mobs) if (!m.dead){ m.dead = true; m.deathT = 0.4; m.fled = true; }
  addLog('용사가 쓰러졌습니다…', 'warn');
  if (!wasBoss){
    S.deathsHere++;
    if (S.deathsHere >= 2 && S.stage > 1){
      S.stage--; S.kills = FIELD.kills; S.autoBoss = false; S.deathsHere = 0;
      addLog('적이 너무 강합니다. 한 단계 물러나 수련합니다.', 'warn');
    }
  }
}
function respawn(){

function startBoss(){

function bossFail(reason){
  bossActive = false;
  if (bossRef && !bossRef.dead){ bossRef.dead = true; bossRef.deathT = 0.4; bossRef.fled = true; }
  bossRef = null; S.autoBoss = false;
  bossRetry = 0;
  addLog(S.bossAuto ? `보스 도전 실패 (${reason}). ${BOSS_RETRY}초 수련한 뒤 다시 도전해요.` : `보스 도전 실패 (${reason}). 수련 후 [보스 도전]을 누르세요.`, 'warn');
}
function bossWin(){
  const gems = 5 + Math.floor(effStage(S.stage) / 4);
  const prev = regionIndex(S.stage), wasGate = isGateStage(S.stage);
  S.gems += gems; S.rec.bosses++;
  if (wasGate) rollAcc(true);
  bossGearDrop();
  gainMat(wasGate ? MAT_DROP.gate : MAT_DROP.boss);
  S.stage++; S.maxStage = Math.max(S.maxStage, S.stage); S.kills = 0; S.deathsHere = 0;
  if (!S.bossAuto) S.autoBoss = false;   // 보스 수동: 다음 보스도 [보스 도전]을 눌러야
  const bk = ['s0', 's1', 's2', 's3', 's4'][S.world];
  if (S.maxStage > S.best[bk]) S.best[bk] = S.maxStage;
  bossActive = false; bossRef = null; spawnT = 1.4;
  const ri = regionIndex(S.stage);
  addLog(`보스를 물리쳤습니다! 보석 +${gems}`, 'gain'); sfx('win');
  if (ri !== prev){ const nm = curRegion(S.stage).name; addLog(`새 지역에 들어섰습니다: ${nm}`, 'good'); announce(`${S.name}님이 ${nm}에 들어섰어요.`); }
  if (isGateStage(S.stage)) addLog('이 단계 보스는 수문장! 장신구가 떨어질 수 있어요.', 'warn');
  if (S.world >= 3 && (S.stage - 1) % 8 === 0 && S.stage - 1 === S.maxStage - 1 && (S.stage - 1) / 8 <= (S.world === 4 ? KUNLUN_RAIDS : BUSANG_RAIDS).length){ const info = raidAt((S.stage - 1) / 8 - 1); if (info) addLog(`새 레이드가 열렸습니다: ${info.label}`, 'good'); }
  ev('boss');
}
/* --- 장신구 --- */
function rollAcc(gate){
  const tbl = gate ? ACC_DROP.gate : ACC_DROP.mob, got = [];
  for (const k of ACC_ORDER){
    if (Math.random() >= tbl[k] * (window.__game && window.__game.accLuck || 1)) continue;
    let r = Math.random(), g = 0;
    for (; g < 4; g++){ if (r < ACC_GRADE_P[g]) break; r -= ACC_GRADE_P[g]; }
    got.push(giveAcc(k, g));
  }
  return got;
}
function giveAcc(k, g){
  const A = ACC[k], p = Math.round(A.base[g] * (1 + effStage(S.stage) / 60)), cur = S.acc[k];
  const better = cur.g < 0 || p > cur.p;
  const name = A.names[g];
  if (better){
    S.acc[k] = {g, p}; refreshStats();
    addLog(`장신구! ${GRADES[g].name} ${name} (${A.stat} +${p}%)`, 'gain');
    announce(`${S.name}님이 ${GRADES[g].name} 장신구 ${name}${josa(name, '을', '를')} 얻었어요!`);
    addText(name + '!', hero.x, hero.y - 44, GRADES[g].color, 13, true);
    fx.push({type:'level', t:0, dur:0.8}); sfx('rare');
  } else {
    S.gems += ACC_DUP_GEMS;
    addLog(`${name}${josa(name, '이', '가')} 나왔지만 지금 것이 더 좋아 보석 ${ACC_DUP_GEMS}개로 바꿨어요.`, 'gain');
  }
  return {k, g, p, better};
}

const raidUnlocked = () => S.world === 4 ? kunlunRaidsOpen() : S.world === 3 ? busangRaidsOpen() : Math.floor(S.level / [10, 20, 30][S.world]);   // 열린 레이드 수(이승 10레벨, 저승 20레벨, 천계 30레벨마다)
// 토벌패 수를 지금 시각에 맞춰 채운다
function raidTickets(){
  const R2 = S.raid, t = now();
  if (R2.tk >= TICKET_MAX){ R2.tkT = t; return R2.tk; }
  if (!R2.tkT || R2.tkT > t) R2.tkT = t;
  const n = Math.floor((t - R2.tkT) / TICKET_REGEN);
  if (n > 0){ R2.tk = Math.min(TICKET_MAX, R2.tk + n); R2.tkT = R2.tk >= TICKET_MAX ? t : R2.tkT + n * TICKET_REGEN; }
  return R2.tk;
}
const ticketLeft = () => raidTickets() >= TICKET_MAX ? 0 : Math.max(0, S.raid.tkT + TICKET_REGEN - now());
const raidReady = i => i < raidUnlocked() && raidTickets() > 0;
function firstReadyRaid(){ for (let i = raidUnlocked() - 1; i >= 0; i--) if (raidReady(i)) return i; return -1; }
// 파티: 나 + 이 기기의 다른 캐릭터(강한 순) + 빈자리는 NPC 동료
function raidParty(info){
  const heroDps = dpsOf(ST), out = [];
  const others = allChars().filter(c => !(session && c.acc === session.acc && c.cid === session.cid) && c.ally)
    .sort((a, b) => b.ally.dps - a.ally.dps).slice(0, partyOf(info) - 1);
  for (const o of others) out.push({name:o.name, cls:o.cls, look:cleanLook(o.look), armorG:o.armorG, weaponG:o.weaponG, dps:o.ally.dps, maxHp:o.ally.maxHp, own:true});
  for (let k = 0; out.length < partyOf(info) - 1; k++){
    const n = NPCS[k % NPCS.length], gr = Math.min(4, Math.max(0, info.g - 1));
    out.push({name:n.name, cls:n.cls, look:{outfit:n.outfit, hair:n.hair, hat:'class', skin:k % 3}, armorG:gr, weaponG:gr,
      dps:heroDps * NPC_SHARE[n.cls], maxHp:ST.maxHp * (n.cls === 'musa' ? 1.3 : 0.85), npc:true});
  }
  return out;
}
function startRaid(i){
  if (raid || !raidReady(i) || !session && !window.__game) return false;
  const info = raidAt(i), ref = info.ref, eff = (1 + 0.45 * (info.party - 1)) * (info.party > RAID_PARTY_MAX ? 0.7 : 1);
  startFight(info, raidParty(info), {hp:10 * mHp(ref) / 15 * eff * 40, atk:mAtk(ref) * 3, aoe:mAtk(ref) * 2, time:RAID_TIME});
  addLog(`${info.label} 토벌 시작! ${RAID_TIME}초 안에 ${info.bossName}${josa(info.bossName, '을', '를')} 쓰러뜨려요.`, 'warn');
  return true;
}

  });

const AWAKEN_PCT = 15000;
function castAwaken(){
  const R = raid, B = R.boss, C = cls();

  fx.push({type:'awaken', t:0, dur:1.3, color:C.fx, x:B.x, y:B.y - mobHeight(B) * 0.5});
  fx.push({type:C.nukeFx, t:0, dur:1, pts:[[B.x - 22, B.y - 8], [B.x, B.y - 24], [B.x + 22, B.y - 8], [B.x - 12, B.y - 36], [B.x + 12, B.y - 36], [B.x, B.y - 2]], seed:Math.random() * 1000});

function update(dt){
  gtime += dt; S.rec.play += dt;

  updateVfx(dt);
  for (const p of parts){
    p.t += dt;
    if (p.type === 'coin'){ p.vy += 300 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.y > p.gy){ p.y = p.gy; p.vy *= -0.35; p.vx *= 0.5; } }
    else { p.x += p.vx * dt; p.y += p.vy * dt; }
  }
  parts = parts.filter(p => p.t < p.dur);
  for (const t of texts){ t.t += dt; t.y -= 18 * dt; }
  texts = texts.filter(t => t.t < t.dur);
  shake = Math.max(0, shake - dt);
  hero.swing = Math.max(0, hero.swing - dt);
  hero.hurt = Math.max(0, hero.hurt - dt);
  if (hero.buffT > 0) hero.buffT -= dt;
  if (hero.jobBuffT > 0) hero.jobBuffT -= dt;
  if (hero.dr4T > 0) hero.dr4T -= dt;
  if (hero.invisT > 0) hero.invisT -= dt;

  // 부상의 해돋이 기운: 사냥 속도와 상관없이 지금까지 나아간 단계만큼 경험치가 조금씩 쌓인다
  if (S.world >= 3 && !hero.dead) gainExp(mExp(S.maxStage) * CONT[S.world].sun * gainMul('exp') * dt);

  // 레이드 / 보스·소환
  if (raid) updateRaid(dt);
  else if (bossActive){
    bossTime -= dt;
    if (bossTime <= 0) bossFail('시간 초과');
  } else if (!hero.dead){
    if (S.kills >= FIELD.kills && !S.autoBoss && S.bossAuto){ bossRetry += dt; if (bossRetry >= BOSS_RETRY){ S.autoBoss = true; bossRetry = 0; } }   // 보스 자동: 실패해도 잠시 수련한 뒤 다시
    if (S.kills >= FIELD.kills && S.autoBoss) startBoss();
    else {
      spawnT -= dt;
      if (spawnT <= 0){
        if (aliveMobs().length < maxField()){
          const spot = spawnTile(4) || spawnTile(2);
          if (spot){ const m = makeMob(false, spot[0], spot[1]); mobs.push(m); fx.push({type:'poof', t:0, dur:0.4, x:m.x, y:m.y - 6}); }

  else {
    hero.hp = Math.min(ST.maxHp, hero.hp + ST.maxHp * ST.regen * dt);
    autoPotion(dt);
    updateMove(hero, dt);
    hero.atkT = Math.max(0, hero.atkT - dt * ST.aspd * spdBuff());
    if (!hero.moving){
      let tg = hero.target;
      if (!tg || tg.dead || tg.spawnT > 0) tg = hero.target = nearestMob();
      if (tg){
        hero.idleT = 0;
        const dx = tg.tx - hero.tx, dy = tg.ty - hero.ty, C = cls();

          if (!stepToward(hero, tg.tx, tg.ty, heroStep())){

          }

      } else {

        hero.idleT += dt;

  // 몬스터

    m.flash = Math.max(0, m.flash - dt); m.lunge = Math.max(0, m.lunge - dt);

      const dx = hero.tx - m.tx, dy = hero.ty - m.ty, man = Math.abs(dx) + Math.abs(dy);

      } else {
        m.thinkT -= dt;

          else { m.thinkT = 1 + Math.random() * 1.6; randomStep(m, m.stepDur * 1.4); }
        }

  projs = projs.filter(p => !p.done);

  // 기술
  if (hero.shieldT > 0){ hero.shieldT -= dt; if (hero.shieldT <= 0) hero.shield = 0; }
  if (hero.baguaT > 0) hero.baguaT -= dt;
  if (hero.gutT > 0) hero.gutT -= dt;
  if (hero.shinT > 0){ hero.shinT -= dt; if (!hero.dead) hero.hp = Math.min(ST.maxHp, hero.hp + ST.maxHp * 0.03 * dt); }
  if (hero.cloneT > 0){

    if (tg && !hero.dead && hero.engaged){

function gEll(g, x, y, rx, ry, col){ g.fillStyle = col; g.beginPath(); g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2); g.fill(); }
function isoTile(g, cx, cy, col, grow = 0.35){ gPoly(g, [[cx, cy - IH / 2 - grow], [cx + IW / 2 + grow * 2, cy], [cx, cy + IH / 2 + grow], [cx - IW / 2 - grow * 2, cy]], col); }
// 둥근 덩어리(나뭇잎·바위·눈더미): 아래 오른쪽은 어둡게, 위 왼쪽은 밝게
function gBlob(g, x, y, rx, ry, col){ gEll(g, x, y, rx, ry, darken(col, 0.22)); gEll(g, x - rx * 0.12, y - ry * 0.14, rx * 0.86, ry * 0.84, col); gEll(g, x - rx * 0.35, y - ry * 0.4, rx * 0.32, ry * 0.26, mix(col, '#ffffff', 0.28)); }
function gShadow(g, x, y, rx){ gEll(g, x, y, rx, rx * 0.45, 'rgba(0,0,0,.22)'); }

/* ── 풍경 소품(화면 좌표, 밑동 기준) ── */
const PROPS = {
  tree(g, x, y, s = 1, col = '#4f9a42'){ gShadow(g, x, y, 7 * s); gPoly(g, [[x - 1.6 * s, y], [x + 1.6 * s, y], [x + 1 * s, y - 10 * s], [x - 1 * s, y - 10 * s]], '#6b4a2b');
    gBlob(g, x - 4 * s, y - 12 * s, 6 * s, 5 * s, darken(col, 0.08)); gBlob(g, x + 4 * s, y - 12 * s, 6 * s, 5 * s, darken(col, 0.04)); gBlob(g, x, y - 17 * s, 7 * s, 6 * s, col); },
  pine(g, x, y, s = 1, snow){ gShadow(g, x, y, 6 * s); gPoly(g, [[x - 1.2 * s, y], [x + 1.2 * s, y], [x + 1.2 * s, y - 5 * s], [x - 1.2 * s, y - 5 * s]], '#5a4030');
    for (let i = 0; i < 3; i++){ const w = (7 - i * 1.8) * s, yy = y - (4 + i * 6) * s; gPoly(g, [[x - w, yy], [x + w, yy], [x, yy - 9 * s]], i % 2 ? '#2f6a5a' : '#2a5e50'); gPoly(g, [[x, yy - 9 * s], [x + w, yy], [x + w * 0.2, yy]], '#22504a');
      if (snow) gPoly(g, [[x - w * 0.55, yy - 3 * s], [x, yy - 9 * s], [x + w * 0.55, yy - 3 * s], [x, yy - 5 * s]], '#f4f9fd'); } },
  bamboo(g, x, y, s = 1){ for (let i = 0; i < 3; i++){ const bx = x + (i - 1) * 3 * s, h = (22 + ((i * 7) % 9)) * s, col = ['#7cc05a', '#6ab04a', '#8ad06a'][i];
    gPoly(g, [[bx - 1 * s, y], [bx + 1 * s, y], [bx + 1 * s, y - h], [bx - 1 * s, y - h]], col); gPoly(g, [[bx + 0.3 * s, y], [bx + 1 * s, y], [bx + 1 * s, y - h], [bx + 0.3 * s, y - h]], darken(col, 0.2));
    for (let k = 5; k < h / s; k += 6) gPoly(g, [[bx - 1.4 * s, y - k * s], [bx + 1.4 * s, y - k * s], [bx + 1.4 * s, y - k * s - 0.8], [bx - 1.4 * s, y - k * s - 0.8]], darken(col, 0.35));
    gEll(g, bx + 3 * s, y - h + 3 * s, 3.5 * s, 1.2 * s, '#4f9a3f'); gEll(g, bx - 3 * s, y - h + 6 * s, 3 * s, 1 * s, '#5aa850'); } },
  rock(g, x, y, s = 1, col = '#9a8a7a'){ gShadow(g, x, y, 6 * s); gPoly(g, [[x - 6 * s, y], [x - 4 * s, y - 5 * s], [x + 1 * s, y - 7 * s], [x + 6 * s, y - 3 * s], [x + 5 * s, y]], darken(col, 0.25));
    gPoly(g, [[x - 6 * s, y], [x - 4 * s, y - 5 * s], [x + 1 * s, y - 7 * s], [x + 1 * s, y - 1 * s]], col); gPoly(g, [[x - 4 * s, y - 5 * s], [x + 1 * s, y - 7 * s], [x - 1 * s, y - 4 * s]], mix(col, '#ffffff', 0.3)); },
  flowers(g, x, y, rnd){ for (let i = 0; i < 5; i++){ const fx = x + (rnd() - 0.5) * 10, fy = y + (rnd() - 0.5) * 5; gEll(g, fx, fy + 1, 1.2, 0.6, '#3f7a35'); gEll(g, fx, fy, 1, 1, ['#ffd84a', '#ff8ab0', '#ffffff', '#b98aff'][(rnd() * 4) | 0]); } },
  grass(g, x, y, col = '#4f8a3f'){ for (let i = -2; i <= 2; i++) gPoly(g, [[x + i * 1.2 - 0.6, y], [x + i * 1.2 + 0.6, y], [x + i * 1.8, y - 4 + Math.abs(i)]], i % 2 ? col : darken(col, 0.15)); },
  house(g, x, y, roof){   // 밑동 가운데 (x, y), 가로로 긴 초가·기와집
    const w = 26, d = 12, h = 10;
    gShadow(g, x, y + 1, 22);
    // 앞(왼쪽 아래) 벽과 옆(오른쪽 아래) 벽
    gPoly(g, [[x - w / 2, y - 4], [x + 4, y + 3], [x + 4, y + 3 - h], [x - w / 2, y - 4 - h]], '#efe6d0');
    gPoly(g, [[x + 4, y + 3], [x + w / 2, y - 3], [x + w / 2, y - 3 - h], [x + 4, y + 3 - h]], '#d8ccb0');
    for (const t of [0, 0.5, 1]){ const px = x - w / 2 + (x + 4 - (x - w / 2)) * t, py = y - 4 + 7 * t; gPoly(g, [[px - 0.6, py], [px + 0.6, py], [px + 0.6, py - h], [px - 0.6, py - h]], '#6b4a2b'); }
    gPoly(g, [[x - w / 2, y - 4 - h * 0.45], [x + 4, y + 3 - h * 0.45], [x + 4, y + 2.4 - h * 0.45], [x - w / 2, y - 4.6 - h * 0.45]], '#6b4a2b');
    gPoly(g, [[x - 6, y - 1.2], [x - 2, y + 0.4], [x - 2, y - 6], [x - 6, y - 7.6]], '#4a3423');
    gPoly(g, [[x + 8, y + 1], [x + 11, y - 0.6], [x + 11, y - 5.6], [x + 8, y - 4]], '#c9b48a');
    // 지붕
    const top = y - 4 - h, ridge = top - (roof === 'tile' ? 9 : 11);
    if (roof === 'tile'){
      gPoly(g, [[x - w / 2 - 4, top + 2], [x + 5, top + 10], [x + w / 2 + 4, top + 2], [x + w / 2 - 2, ridge + 2], [x - 4, ridge - 4], [x - w / 2 - 1, ridge + 1]], '#3c4652');
      gPoly(g, [[x - w / 2 - 4, top + 2], [x + 5, top + 10], [x + 6, top + 7], [x - w / 2 - 1, ridge + 1]], '#4a5664');
      for (let i = 1; i < 6; i++){ const t = i / 6; gPoly(g, [[x - w / 2 - 4 + (9 + w / 2) * t, top + 2 + 8 * t], [x - w / 2 - 1 + (w / 2 - 3) * t, ridge + 1 - 5 * t], [x - w / 2 - 0.4 + (w / 2 - 3) * t, ridge + 1 - 5 * t], [x - w / 2 - 3.4 + (9 + w / 2) * t, top + 2 + 8 * t]], '#2e3640'); }
      gPoly(g, [[x - w / 2 - 2, ridge], [x - 4, ridge - 5], [x + w / 2 - 1, ridge + 1], [x + w / 2 - 1, ridge + 2.6], [x - 4, ridge - 3.4], [x - w / 2 - 2, ridge + 1.6]], '#2a3038');
    } else {
      gPoly(g, [[x - w / 2 - 3, top + 3], [x + 5, top + 10], [x + w / 2 + 3, top + 3], [x + w / 2 - 3, ridge + 3], [x - 3, ridge - 2], [x - w / 2, ridge + 2]], '#a8823a');
      gPoly(g, [[x - w / 2 - 3, top + 3], [x + 5, top + 10], [x + 5, top + 7], [x - w / 2, ridge + 2]], '#c9a050');
      for (let i = 1; i < 4; i++) gPoly(g, [[x - w / 2 - 3 + 2 * i, top + 3 - 2.6 * i], [x + 5 - 0.5 * i, top + 10 - 2.4 * i], [x + 5 - 0.5 * i, top + 9.4 - 2.4 * i], [x - w / 2 - 3 + 2 * i, top + 2.4 - 2.6 * i]], '#b08a40');
    }
  },
  fence(g, x0, y0, n){ for (let i = 0; i <= n; i++){ const x = x0 + i * 5, y = y0 + i * 2.5; gPoly(g, [[x - 0.7, y], [x + 0.7, y], [x + 0.7, y - 6], [x - 0.7, y - 6]], '#8a6a4a'); }
    for (const h of [2, 4.5]) gPoly(g, [[x0, y0 - h], [x0 + n * 5, y0 + n * 2.5 - h], [x0 + n * 5, y0 + n * 2.5 - h - 0.8], [x0, y0 - h - 0.8]], '#a88a62'); },
  pond(g, x, y, rx, col = '#5a9ac8'){ gEll(g, x, y, rx + 1.5, rx * 0.5 + 1, darken(col, 0.3)); gEll(g, x, y, rx, rx * 0.5, col); gEll(g, x - rx * 0.3, y - rx * 0.12, rx * 0.35, rx * 0.1, mix(col, '#ffffff', 0.45)); },
  reeds(g, x, y){ for (let i = -2; i <= 2; i++){ const h = 8 + (i * 3 + 9) % 5; gPoly(g, [[x + i * 1.5 - 0.4, y], [x + i * 1.5 + 0.4, y], [x + i * 2, y - h]], '#6a8a4a'); if (i % 2) gEll(g, x + i * 2, y - h + 1, 0.8, 2, '#7a5a3a'); } },
  deadtree(g, x, y, col = '#2a3a30'){ gShadow(g, x, y, 5); const L = (x0, y0, x1, y1, w) => gPoly(g, [[x0 - w, y0], [x0 + w, y0], [x1 + w * 0.4, y1], [x1 - w * 0.4, y1]], col);
    L(x, y, x + 1, y - 20, 1.6); L(x + 1, y - 12, x - 6, y - 18, 0.8); L(x + 1, y - 15, x + 7, y - 22, 0.8); L(x - 3, y - 15, x - 4, y - 21, 0.5); },
  stalag(g, x, y, s = 1, col = '#4a3a3a'){ gShadow(g, x, y, 4 * s); gPoly(g, [[x - 4 * s, y], [x + 4 * s, y], [x + 0.5 * s, y - 14 * s]], col); gPoly(g, [[x + 0.5 * s, y - 14 * s], [x + 4 * s, y], [x + 1.5 * s, y]], darken(col, 0.3)); },
  crystal(g, x, y, col = '#9a6ad8'){ gPoly(g, [[x - 2, y], [x + 2, y], [x + 1, y - 7], [x - 1, y - 8]], col); gPoly(g, [[x - 1, y - 8], [x - 2, y], [x - 0.6, y]], mix(col, '#ffffff', 0.5)); gPoly(g, [[x + 2, y], [x + 4, y - 4], [x + 3.4, y - 5], [x + 1, y - 1]], darken(col, 0.2)); },
  torch(g, x, y){ gPoly(g, [[x - 0.8, y], [x + 0.8, y], [x + 0.8, y - 10], [x - 0.8, y - 10]], '#6b4a2b'); gPoly(g, [[x - 2.5, y - 10], [x + 2.5, y - 10], [x + 2, y - 12], [x - 2, y - 12]], '#4a3423'); },
  snowmound(g, x, y, s = 1){ gBlob(g, x, y - 2 * s, 8 * s, 3.5 * s, '#f4f9fd'); },
  bladespike(g, x, y, s = 1){ gShadow(g, x, y, 4 * s); for (const [dx, h, w] of [[-3, 16, 1.6], [2, 22, 2], [5, 12, 1.4]]){ const bx = x + dx * s;
    gPoly(g, [[bx - w * s, y], [bx + w * s, y], [bx, y - h * s]], '#9aa2ae'); gPoly(g, [[bx, y - h * s], [bx + w * s, y], [bx + 0.2, y]], '#6a727e'); gPoly(g, [[bx - w * 0.3 * s, y - h * 0.5 * s], [bx, y - h * s], [bx - w * 0.6 * s, y - h * 0.6 * s]], '#e8eef4'); } },
  bones(g, x, y){ gEll(g, x, y, 2.4, 2, '#d8d0c0'); gEll(g, x - 0.8, y - 0.2, 0.5, 0.6, '#1a1418'); gEll(g, x + 0.8, y - 0.2, 0.5, 0.6, '#1a1418'); gPoly(g, [[x + 3, y + 1], [x + 8, y + 2], [x + 8, y + 2.8], [x + 3, y + 1.8]], '#d8d0c0'); },
  cauldron(g, x, y){ gShadow(g, x, y, 10); gEll(g, x, y - 6, 10, 7, '#1a1414'); gEll(g, x, y - 11, 10, 3, '#2a2222'); gEll(g, x, y - 11, 8, 2.2, '#ff7a2a'); gEll(g, x - 2, y - 11.4, 3, 0.8, '#ffd24a');
    for (const dx of [-6, 6]) gPoly(g, [[x + dx - 1, y - 1], [x + dx + 1, y - 1], [x + dx + 1, y + 2], [x + dx - 1, y + 2]], '#1a1414'); },
  icespike(g, x, y, s = 1){ gShadow(g, x, y, 4 * s); gPoly(g, [[x - 3 * s, y], [x + 3 * s, y], [x + 0.5 * s, y - 15 * s]], '#cfeaff'); gPoly(g, [[x + 0.5 * s, y - 15 * s], [x + 3 * s, y], [x + 1.2 * s, y]], '#8fb8d8'); gPoly(g, [[x - 1.6 * s, y - 5 * s], [x + 0.5 * s, y - 15 * s], [x - 0.8 * s, y - 5 * s]], '#ffffff'); },
  bladetree(g, x, y){ gShadow(g, x, y, 7); gPoly(g, [[x - 1.4, y], [x + 1.4, y], [x + 0.8, y - 18], [x - 0.8, y - 18]], '#2a1e18');
    for (let i = 0; i < 14; i++){ const a = i * 2.4, r = 3 + (i % 4) * 2, lx = x + Math.cos(a) * r, ly = y - 20 + Math.sin(a) * r * 0.7; gPoly(g, [[lx, ly - 3], [lx + 0.9, ly], [lx, ly + 1.4], [lx - 0.9, ly]], i % 3 ? '#c8d0d8' : '#ffffff'); } },
  pillar(g, x, y){ gShadow(g, x, y, 5); gPoly(g, [[x - 3, y], [x + 3, y], [x + 3, y - 22], [x - 3, y - 22]], '#2a1a2a'); gPoly(g, [[x + 1, y], [x + 3, y], [x + 3, y - 22], [x + 1, y - 22]], '#1a1018');
    gPoly(g, [[x - 4.5, y - 22], [x + 4.5, y - 22], [x + 3.5, y - 25], [x - 3.5, y - 25]], '#3a2234'); gEll(g, x - 1, y - 14, 0.8, 0.5, '#ff2a4a'); gEll(g, x + 1.4, y - 14, 0.8, 0.5, '#ff2a4a'); },
  cloudpuff(g, x, y, s = 1){ gEll(g, x, y + 1, 10 * s, 3 * s, 'rgba(120,150,200,.25)'); for (const [dx, dy, r] of [[-6, -3, 5], [0, -6, 6.4], [6, -3, 5], [0, -1, 6]]) gEll(g, x + dx * s, y + dy * s, r * s, r * 0.8 * s, '#ffffff'); gEll(g, x - 2 * s, y - 7 * s, 2.4 * s, 1.4 * s, '#f4f8ff'); },
  peachtree(g, x, y, s = 1){ gShadow(g, x, y, 7 * s); gPoly(g, [[x - 1.4 * s, y], [x + 1.4 * s, y], [x + 0.8 * s, y - 9 * s], [x - 0.8 * s, y - 9 * s]], '#6b4a2b');
    gBlob(g, x - 4 * s, y - 12 * s, 6 * s, 5 * s, '#ff9ab8'); gBlob(g, x + 4 * s, y - 12 * s, 6 * s, 5 * s, '#ffb0c8'); gBlob(g, x, y - 16 * s, 7 * s, 5.4 * s, '#ffc0d4');
    for (const [dx, dy] of [[-5, -10], [3, -14], [5, -9], [-1, -17]]) { gEll(g, x + dx * s, y + dy * s, 1.6 * s, 1.6 * s, '#ff7a6a'); gEll(g, x + (dx - 0.5) * s, y + (dy - 0.6) * s, 0.5 * s, 0.5 * s, '#ffe0d0'); } },
  boat(g, x, y, s = 1){ gEll(g, x, y + 1, 16 * s, 3 * s, 'rgba(255,255,255,.35)'); gPoly(g, [[x - 15 * s, y - 5 * s], [x + 15 * s, y - 5 * s], [x + 11 * s, y], [x - 11 * s, y]], '#6b4a2b'); gPoly(g, [[x - 15 * s, y - 5 * s], [x + 15 * s, y - 5 * s], [x + 14 * s, y - 3.6 * s], [x - 14 * s, y - 3.6 * s]], '#8a6a42');
    gPoly(g, [[x - 0.8 * s, y - 5 * s], [x + 0.8 * s, y - 5 * s], [x + 0.6 * s, y - 24 * s], [x - 0.6 * s, y - 24 * s]], '#4a3423'); gPoly(g, [[x + 1, y - 23 * s], [x + 11 * s, y - 15 * s], [x + 1, y - 8 * s]], '#efe6d0'); gPoly(g, [[x - 1, y - 21 * s], [x - 8 * s, y - 14 * s], [x - 1, y - 9 * s]], '#e8dcc4'); },
  waterfall(g, x, y){ gPoly(g, [[x - 14, y], [x + 14, y], [x + 10, y - 26], [x - 10, y - 26]], '#8a7a6a'); gPoly(g, [[x - 5, y - 26], [x + 5, y - 26], [x + 6, y], [x - 6, y]], '#8fd0ff'); for (let i = 0; i < 4; i++) gPoly(g, [[x - 3 + i * 2, y - 24], [x - 2.4 + i * 2, y - 24], [x - 2 + i * 2, y], [x - 2.6 + i * 2, y]], '#e8f6ff'); gEll(g, x, y + 1, 9, 2.6, '#cfeaff'); },
  redpillar(g, x, y){ gShadow(g, x, y, 4); gPoly(g, [[x - 2.4, y], [x + 2.4, y], [x + 2.4, y - 26], [x - 2.4, y - 26]], '#c8382f'); gPoly(g, [[x + 0.8, y], [x + 2.4, y], [x + 2.4, y - 26], [x + 0.8, y - 26]], '#9a2a24'); gPoly(g, [[x - 3.6, y - 26], [x + 3.6, y - 26], [x + 3, y - 29], [x - 3, y - 29]], '#ffd24a'); gPoly(g, [[x - 3.4, y], [x + 3.4, y], [x + 3, y - 2], [x - 3, y - 2]], '#e8e0c8'); },
  pavilion(g, x, y){ gShadow(g, x, y + 1, 18); for (const dx of [-12, 12]) PROPS.redpillar(g, x + dx, y);
    gPoly(g, [[x - 20, y - 26], [x + 20, y - 26], [x + 16, y - 34], [x - 16, y - 34]], '#3c4652'); gPoly(g, [[x - 22, y - 25], [x - 16, y - 34], [x - 18, y - 34], [x - 25, y - 27]], '#2e3640'); gPoly(g, [[x + 22, y - 25], [x + 16, y - 34], [x + 18, y - 34], [x + 25, y - 27]], '#2e3640');
    gPoly(g, [[x - 16, y - 34], [x + 16, y - 34], [x + 12, y - 39], [x - 12, y - 39]], '#ffd24a'); gEll(g, x, y - 40, 2.6, 2, '#ffd24a'); },
  lantern(g, x, y, s = 1){ gShadow(g, x, y, 5 * s); gPoly(g, [[x - 2 * s, y], [x + 2 * s, y], [x + 1.4 * s, y - 6 * s], [x - 1.4 * s, y - 6 * s]], '#8a8a90');
    gPoly(g, [[x - 4 * s, y - 6 * s], [x + 4 * s, y - 6 * s], [x + 3 * s, y - 7.4 * s], [x - 3 * s, y - 7.4 * s]], '#a8a8b0');
    gPoly(g, [[x - 2.6 * s, y - 7.4 * s], [x + 2.6 * s, y - 7.4 * s], [x + 2.6 * s, y - 11 * s], [x - 2.6 * s, y - 11 * s]], '#9a9aa2'); gEll(g, x, y - 9.2 * s, 1.4 * s, 1.2 * s, '#ffd27a');
    gPoly(g, [[x - 5 * s, y - 11 * s], [x + 5 * s, y - 11 * s], [x, y - 15 * s]], '#7a7a82'); },
  cedar(g, x, y, s = 1){ gShadow(g, x, y, 6 * s); gPoly(g, [[x - 1.4 * s, y], [x + 1.4 * s, y], [x + 1.4 * s, y - 6 * s], [x - 1.4 * s, y - 6 * s]], '#5a3a2a');
    for (let i = 0; i < 4; i++){ const yy = y - 5 * s - i * 6 * s, w = (9 - i * 1.8) * s; gPoly(g, [[x - w, yy], [x + w, yy], [x, yy - 9 * s]], i % 2 ? '#2f5a34' : '#3a6a3e'); } },
  mushroom(g, x, y, col = '#9a4ad8'){ gPoly(g, [[x - 0.8, y], [x + 0.8, y], [x + 0.6, y - 4], [x - 0.6, y - 4]], '#e8e0d0'); gBlob(g, x, y - 4.5, 3.4, 2, col); gEll(g, x - 1, y - 5, 0.5, 0.4, '#ffffff'); },
};

/* 지역별 풍경: 판 뒤(위쪽)와 앞(아래쪽) 빈터에 소품을 놓는다 */
function isoScenery(t, rnd){
  const back = [], front = [];
  const spotBack = (n, minX = 4, maxX = MW - 4, gap = 6) => { const out = []; for (let k = 0; k < n * 6 && out.length < n; k++){ const x = minX + rnd() * (maxX - minX), y = 18 + rnd() * (edgeTop(x) - 18 - gap); if (y > 18) out.push([x, y]); } return out; };
  const spotFront = (n, gap = IDEP + 5) => { const out = []; for (let k = 0; k < n * 8 && out.length < n; k++){ const x = 2 + rnd() * (MW - 4), y = edgeBot(x) + gap + rnd() * (MH - edgeBot(x) - gap); if (y < MH - 1 && y > edgeBot(x) + gap) out.push([x, y]); } return out; };
  const P2 = (arr, fn) => { for (const [x, y] of arr) back.push([y, g => fn(g, x, y)]); };
  const F2 = (arr, fn) => { for (const [x, y] of arr) front.push([y, g => fn(g, x, y)]); };
  if (t === 'village'){
    back.push([40, g => PROPS.house(g, 62, 40, 'thatch')], [58, g => PROPS.house(g, 236, 58, 'tile')]);
    P2(spotBack(6), (g, x, y) => PROPS.tree(g, x, y, 0.8 + rnd() * 0.3));
    back.push([44, g => PROPS.fence(g, 140, 40, 9)]);
    P2(spotBack(5), (g, x, y) => PROPS.flowers(g, x, y, rnd));
    F2(spotFront(8), (g, x, y) => rnd() < 0.5 ? PROPS.flowers(g, x, y, rnd) : PROPS.grass(g, x, y));
  } else if (t === 'bamboo'){
    P2(spotBack(16, 4, W - 4, 3), (g, x, y) => PROPS.bamboo(g, x, y, 0.8 + rnd() * 0.4));
    F2(spotFront(6), (g, x, y) => PROPS.grass(g, x, y, '#4f8a3f'));
  } else if (t === 'rock'){

function buildIsoMap(ri, w = S.world){
  const Rg = regionsOf(w)[ri], t = Rg.theme, th = ISO_THEME[t] || ISO_THEME.village, old = THEMES[t] || THEMES.village, rnd = rng(ri * 977 + 13 + w * 7919);

  gPoly(g, [[0, 20], [MW, 20], [MW, 23], [0, 23]], darken(th.hills, 0.15));
  // 바깥 땅 무늬(비스듬한 칸)
  for (let i = -20; i < 44; i++) for (let j = -24; j < 40; j++){
    const cx = isoX(i, j), cy = isoY(i, j);
    if (cx < -IW || cx > MW + IW || cy < 18 || cy > MH + IH) continue;
    if (rnd() < 0.5) isoTile(g, cx, cy, darken(th.outer, 0.04 + rnd() * 0.05), 0);
    if (rnd() < 0.5){ g.fillStyle = darken(th.outer, 0.12); g.fillRect(cx + (rnd() - 0.5) * 10, cy + (rnd() - 0.5) * 4, 0.8, 0.8); }
  }
  if (t === 'lava'){ for (let k = 0; k < 60; k++){ const x = rnd() * MW, y = 22 + rnd() * (MH - 22); gEll(g, x, y, 2 + rnd() * 5, 0.8 + rnd(), rnd() < 0.5 ? '#ffd24a' : '#ff8a2a'); } }
  if (t === 'sea' || t === 'river2'){ for (let k = 0; k < 70; k++){ const x = rnd() * MW, y = 24 + rnd() * (MH - 24); gEll(g, x, y, 2 + rnd() * 4, 0.5, 'rgba(255,255,255,.45)'); } }
  if (t === 'cloud' || t === 'heaven'){ for (let k = 0; k < 26; k++){ const x = rnd() * MW, y = 26 + rnd() * (MH - 26); gEll(g, x, y, 6 + rnd() * 10, 2 + rnd() * 2, 'rgba(255,255,255,.7)'); } }
  if (t === 'swamp' || t === 'poison'){ for (let k = 0; k < 18; k++){ const x = rnd() * MW, y = 24 + rnd() * (MH - 24); gEll(g, x, y, 3 + rnd() * 6, 1 + rnd() * 1.5, mix(th.outer, '#ffffff', 0.12)); } }
  const sc = isoScenery(t, rnd);
  sc.back.sort((a, b2) => a[0] - b2[0]).forEach(([, fn]) => fn(g));
  // 판: 앞 두 벽(흙·돌) → 윗면 칸
  const [lx, ly] = ISO_LEFT, [bx, by] = ISO_BOT, [rx, ry] = ISO_RIGHT;
  gPoly(g, [[lx, ly], [bx, by], [bx, by + IDEP], [lx, ly + IDEP]], th.side[0]);
  gPoly(g, [[bx, by], [rx, ry], [rx, ry + IDEP], [bx, by + IDEP]], th.side[1]);
  for (let k = 1; k < 3; k++){ const yy = IDEP * k / 3; g.globalAlpha = 0.25;
    gPoly(g, [[lx, ly + yy], [bx, by + yy], [bx, by + yy + 0.7], [lx, ly + yy + 0.7]], darken(th.side[0], 0.35));
    gPoly(g, [[bx, by + yy], [rx, ry + yy], [rx, ry + yy + 0.7], [bx, by + yy + 0.7]], darken(th.side[1], 0.35)); g.globalAlpha = 1; }
  if (t === 'lava') for (let k = 0; k < 8; k++){ const u = rnd(), x = lx + (bx - lx) * u, y = ly + (by - ly) * u; gPoly(g, [[x, y + 2], [x + 1, y + 2], [x + 2, y + IDEP], [x + 1, y + IDEP]], '#ff6a1a'); }
  for (let ty = TOPR; ty < ROWS; ty++) for (let tx = 0; tx < COLS; tx++){
    const cx = isoX(tx, ty), cy = isoY(tx, ty);
    let col = th.top[(tx + ty) % 2];
    if (rnd() < 0.35) col = mix(col, old.ground[(rnd() * old.ground.length) | 0], 0.5);
    if (t === 'village' && (ty === 6 || ty === 7)) col = (tx + ty) % 2 ? '#d2ae76' : '#c9a36a';

    for (let k = 0; k < 3; k++){ g.fillStyle = old.speck[(rnd() * old.speck.length) | 0]; g.fillRect(cx + (rnd() - 0.5) * IW * 0.6, cy + (rnd() - 0.5) * IH * 0.5, 0.8, 0.8); }
  }
  // 칸 테두리(아주 옅게)와 판 가장자리 빛
  g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 0.4; g.beginPath();
  for (let ty = TOPR; ty <= ROWS; ty++){ const x0 = isoX(-0.5, ty - 0.5), y0 = isoY(-0.5, ty - 0.5), x1 = isoX(COLS - 0.5, ty - 0.5), y1 = isoY(COLS - 0.5, ty - 0.5); g.moveTo(x0, y0); g.lineTo(x1, y1); }
  for (let tx = 0; tx <= COLS; tx++){ const x0 = isoX(tx - 0.5, TOPR - 0.5), y0 = isoY(tx - 0.5, TOPR - 0.5), x1 = isoX(tx - 0.5, ROWS - 0.5), y1 = isoY(tx - 0.5, ROWS - 0.5); g.moveTo(x0, y0); g.lineTo(x1, y1); }
  g.stroke();

  g.strokeStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.moveTo(lx, ly + 0.4); g.lineTo(bx, by + 0.4); g.lineTo(rx, ry + 0.4); g.stroke();
  sc.front.sort((a, b2) => a[0] - b2[0]).forEach(([, fn]) => fn(g));
  return c;
}

function addChat(kind, name, text, extra){

    const b = document.createElement('b'); b.textContent = kind === 'sys' ? '[알림]' : name;

  setText(elMode, semi ? '반자동' : '자동'); elMode.classList.toggle('semi', semi);
  elMode.setAttribute('aria-label', semi ? '전투: 반자동, 기술은 직접 (누르면 자동)' : '전투: 자동 (누르면 반자동)');
  setText(elBossMode, S.bossAuto ? '보스 자동' : '보스 수동'); elBossMode.classList.toggle('semi', !S.bossAuto);
  elBossMode.setAttribute('aria-label', S.bossAuto ? '보스: 자동 도전 (누르면 직접 시작)' : '보스: 직접 시작 (누르면 자동 도전)');
}
elMode.addEventListener('click', () => {
  S.mode = S.mode === 'semi' ? 'auto' : 'semi'; applyModeBtns(); sfx('click');
  addLog(S.mode === 'semi' ? '반자동: 사냥은 알아서, 기술은 칸을 눌러 직접 써요.' : '자동: 사냥도 기술도 알아서 해요.', 'good');
});
elBossMode.addEventListener('click', () => {
  S.bossAuto = !S.bossAuto; S.autoBoss = S.bossAuto; bossRetry = 0; applyModeBtns(); sfx('click');
  addLog(S.bossAuto ? '보스 자동: 몹을 다 잡으면 보스에게 알아서 도전해요.' : '보스 수동: 준비되면 [보스 도전]을 눌러야 보스가 나와요.', 'good');
});
elSpeed.addEventListener('click', () => { S.speed = S.speed === 2 ? 1 : 2; applySpeedBtn(); applyModeBtns(); });
let bossRetry = 0;   // 보스 자동일 때 실패 뒤 다시 도전까지 기다린 시간
const BOSS_RETRY = 45;
function applySpeedBtn(){ elSpeed.textContent = `×${S.speed}`; elSpeed.setAttribute('aria-label', `게임 속도 ${S.speed}배`); elSpeed.setAttribute('aria-pressed', String(S.speed === 2)); }
function updateHud(){
  setText(elLv, 'Lv.' + S.level); setText(elCls, jobName()); setText(elNick, session ? S.name : '');
  setText(elCp, fmt(power(ST)));
  setText(elGold, fmt(S.gold)); setText(elGems, fmt(S.gems));
  if (currentTab){ setText($('#pgGold'), fmt(S.gold)); setText($('#pgGems'), fmt(S.gems)); }
  const hr = Math.max(0, hero.hp / ST.maxHp);
  elHp.style.width = (hr * 100).toFixed(1) + '%'; setText(elHpN, fmt(hero.hp) + '/' + fmt(ST.maxHp));
  const xr = Math.min(1, S.exp / expNeed(S.level));
  elXp.style.width = (xr * 100).toFixed(1) + '%'; setText(elXpN, (xr * 100).toFixed(1) + '%');
  const showBoss = S.kills >= FIELD.kills && !S.autoBoss && !bossActive && !raid;
  if (elBoss.hidden === showBoss) elBoss.hidden = !showBoss;
  if (showBoss) setText(elBoss, S.bossAuto ? `보스 도전 · ${Math.max(1, Math.ceil(BOSS_RETRY - bossRetry))}초 뒤 자동` : '보스 도전!');
  if (skBarCls !== S.cls) buildSkillbar();
  SKILLS.forEach((sk, i) => {
    const r = skillEls[sk.key], lv = skLv(i), locked = !lv, man = !locked && !skAuto(i), rdy = man && !(skillCd[sk.key] > 0);
    if (r.el.classList.contains('locked') !== locked) r.el.classList.toggle('locked', locked);
    if (r.el.classList.contains('manual') !== man) r.el.classList.toggle('manual', man);
    if (r.el.classList.contains('rdy') !== rdy) r.el.classList.toggle('rdy', rdy);
    setText(r.lk, skLockText(i));
    const lab = `${skillName(i)}${locked ? ' (잠김)' : man ? ' (수동, 눌러서 쓰기)' : ''}`;
    if (r.el.getAttribute('aria-label') !== lab) r.el.setAttribute('aria-label', lab);
    r.cd.style.setProperty('--p', locked ? '0%' : Math.min(100, (skillCd[sk.key] || 0) / skCdOf(i) * 100).toFixed(1) + '%');
  });
}

/* --- 수련 --- */
let growView = 'stats';
const growSegHTML = () => `<div class="seg" role="group" aria-label="수련 보기" style="margin-bottom:10px">
  <button id="gv-stats" aria-pressed="${growView === 'stats'}">능력치</button><button id="gv-job" aria-pressed="${growView === 'job'}">전직${S.job ? ` · ${S.job}차` : ''}</button><button id="gv-reb" aria-pressed="${growView === 'reb'}">환생${S.reb.n ? ` · ${S.reb.n}회` : ''}</button></div>`;
function wireGrowSeg(){ for (const v of ['stats', 'job', 'reb']) $('#gv-' + v).addEventListener('click', () => { growView = v; buildTab('grow', true); }); }
function buildJob(){
  const c = S.cls, J = JOBS[c];
  const card = (tier) => {
    const j = J[tier - 1], got = S.job >= tier, secret = tier === 2 && !hiddenTrialOpen() && !got;
    const req = tier === 1 ? `레벨 ${JOB_LV}` : tier === 3 ? `부상 · Lv.${JOB3_LV} · ${j.ch}장` : tier === 4 ? `곤륜 · Lv.${JOB4_LV} · ${j.ch}장` : '숨은 퀘스트를 모두 마치면';
    return `<div class="card ${got ? '' : ''}" id="jobCard${tier}">
      <div class="ct">${tier}차 전직 · ${secret ? '???' : j.name}<span class="tag">${got ? '전직함' : req}</span></div>
      <p class="story">${secret ? (tier === 2 && hiddenOpen() ? '붉은 옷의 차사가 지켜보고 있어요. [퀘스트]의 히든 퀘스트를 따라가요.' : '어딘가에 숨은 전직이 있다는 소문이 있어요…')
        : `공격력·체력 +${JOB_BONUS[tier].atk}%, 기술 피해 +${JOB_BONUS[tier].skill}%. 전직 기술 「${CLASSES[c].skills[tier >= 3 ? 5 + tier : 5 + tier]}」, 전직 무기 「${j.weapon}」, 망토 「${j.cape}」를 받아요.`}</p>
      ${tier === 3 && !got ? `<p class="small">부상에서 레벨 ${JOB3_LV}을 넘기고 스승 ${j.teacher}이 나오는 이야기 ${j.ch}장을 마치면 겨룰 수 있어요.</p>` : ''}
      ${tier === 4 && !got ? `<p class="small">곤륜에서 레벨 ${JOB4_LV}을 넘기고 이야기 ${j.ch}장 「오색 돌」을 마치면 <b>세 스승의 시험</b>(1차 스승 → 강림도령 → 3차 스승, 연달아 세 판)을 봐요. 스승은 ${j.teacher}.</p>` : ''}
      ${got ? '' : `<button class="btn primary" data-tier="${tier}">${secret ? '???' : (tier === 1 ? '스승과' : tier === 3 ? j.teacher + '와' : tier === 4 ? '세 스승의 시험' : '강림도령과') + (tier === 4 ? '' : ' 겨루기(전직 시험)')}</button>`}
    </div>`;
  };
  panel.innerHTML = `${growSegHTML()}
    <div class="ph"><h2>전직</h2><span class="small">지금: <b>${jobName()}</b></span></div>
    <p class="hint">전직 시험은 동료 둘과 함께 ${RAID_TIME}초 안에 스승을 이기면 통과예요. 지면 몇 번이든 다시 도전할 수 있어요. 직업을 바꿔도 전직 단계는 남아요.</p>
    ${card(1)}${card(2)}${S.world >= 3 || S.job >= 2 ? card(3) : ''}${S.world >= 4 || S.job >= 3 ? card(4) : ''}`;
  wireGrowSeg();
  panel.querySelectorAll('[data-tier]').forEach(bt => bt.addEventListener('click', () => { if (startJobTrial(+bt.dataset.tier)) buildTab('grow', true); }));
  return () => {
    panel.querySelectorAll('[data-tier]').forEach(bt => { const t = +bt.dataset.tier, ok = jobReady(t) && !raid; bt.disabled = !ok; bt.classList.toggle('primary', ok);
      if (raid && raid.info.job === t) setText(bt, '시험 중…'); });
  };
}
function buildGrow(){
  if (growView === 'reb') return buildReb();
  if (growView === 'job') return buildJob();
  panel.innerHTML = `${growSegHTML()}
    <div class="ph"><h2>수련</h2>
      <div class="mode" role="group" aria-label="한 번에 올릴 단계">
        <button class="chip" id="mode-1" data-m="1">×1</button><button class="chip" id="mode-10" data-m="10">×10</button><button class="chip" id="mode-max" data-m="max">최대</button>
      </div></div>
    <p class="hint">엽전으로 능력을 갈고닦아요. 버튼을 길게 누르면 계속 올라가요.</p>
    <ul class="list">${STAT_ORDER.map(k => `
      <li class="row" id="row-${k}"><div class="ic">${SVG[STAT_DEFS[k].icon]}</div>
        <div><div class="nm">${STAT_DEFS[k].name}<span class="l" data-r="lv"></span></div><div class="val" data-r="val"></div></div>
        <button class="buy" id="buy-${k}"><span class="coin"></span><span data-r="cost"></span></button></li>`).join('')}
    </ul>`;
  wireGrowSeg();
  panel.querySelectorAll('.chip').forEach(bt => bt.addEventListener('click', () => { S.buyMode = bt.dataset.m === 'max' ? 'max' : +bt.dataset.m; refreshPanel(); }));
  const refs = STAT_ORDER.map(k => {
    const row = $('#row-' + k);
    const r = {k, lv:row.querySelector('[data-r=lv]'), val:row.querySelector('[data-r=val]'), btn:$('#buy-' + k)};
    r.cost = r.btn.querySelector('[data-r=cost]');
    holdButton(r.btn, () => { const ok = buyStat(k); if (ok) upFx(r.btn.closest('li') || r.btn, `${STAT_DEFS[k].name} ↑`); return ok; });
    return r;
  });
  return () => {
    for (const m of ['1', '10', 'max']) $('#mode-' + m).setAttribute('aria-pressed', String(String(S.buyMode) === m));
    for (const r of refs){
      const d = STAT_DEFS[r.k], bi = buyInfo(r.k), lv = S.up[r.k];
      setText(r.lv, lv >= d.max ? 'Lv.' + lv + ' 최대' : 'Lv.' + lv);
      const cur = statValue(r.k, ST);
      if (bi.n > 0){
        const nx = statValue(r.k, computeStats(Object.assign({}, S.up, {[r.k]:lv + bi.n})));
        setHTML(r.val, `${cur} → <em>${nx}</em>`);
        setHTML(r.cost, fmt(bi.cost) + (bi.n > 1 ? ` <small>+${bi.n}</small>` : ''));
        r.btn.disabled = !bi.afford; r.btn.classList.remove('nocoin');
      } else { setHTML(r.val, cur); setHTML(r.cost, '최대'); r.btn.disabled = true; r.btn.classList.add('nocoin'); }
    }
  };
}

  showModal(S.world === 3 ? '서쪽 하늘로 건널까요?' : '바다를 건널까요?', S.world === 3
    ? `<p>열 개의 해를 쫓아 서쪽 끝 신들의 산 <b>곤륜</b>으로 건너가요. 레벨·장비·능력치·엽전·펫은 그대로, 사냥 단계만 1부터예요. 레벨 상한은 500.</p>`
    : `<p>동해 용왕의 거북을 타고 <b>부상</b>으로 건너가요. 레벨·장비·능력치·엽전·펫은 그대로, 사냥 단계만 1부터예요. 몬스터는 천계 끝자락만큼 세요.</p>`,

      <li class="row" id="sk-${sk.key}"><div class="ic">${SVG[skDef(i).icon]}</div>
        <div><div class="nm">${skillName(i)}<span class="l" data-r="lv"></span></div><div class="val" data-r="desc"></div></div>
        <button class="buy" id="skbuy-${sk.key}"><span class="coin"></span><span data-r="cost"></span></button></li>`).join('')}
    </ul>
    <div class="card ${S.awaken ? 'ready' : ''}" style="margin-top:14px">
      <div class="ct"><span style="color:var(--gold)">초각성기</span> · ${cls().awaken}<span class="tag">${S.awaken ? '익힘' : '잠김'}</span></div>
      <p class="story">레이드와 타임 보스에서 한 번, 공격력의 ${fmt(AWAKEN_PCT * cls().skillMul)}%를 다섯 번에 나눠 퍼부어요. 싸움이 시작되고 12초가 지나거나 보스 체력이 60% 아래로 떨어지면 저절로 써요.</p>
      ${S.awaken ? '' : `<p class="small">배우는 법: 환생한 뒤 저승 레벨 60을 넘기고, 시왕 레이드 「송제전」을 토벌한 다음, 저승 이야기의 「각성의 시련」 퀘스트를 완료해요.</p>`}
    </div>`;
  const refs = SKILLS.map((sk, i) => {
    const row = $('#sk-' + sk.key);
    const r = {sk, i, lv:row.querySelector('[data-r=lv]'), desc:row.querySelector('[data-r=desc]'), btn:$('#skbuy-' + sk.key)};
    r.cost = r.btn.querySelector('[data-r=cost]');
    holdButton(r.btn, () => { const ok = upgradeSkill(sk.key); if (ok) upFx(r.btn.closest('li') || r.btn, `Lv.${S.skills[sk.key]}`, '#9fe7ff'); return ok; });
    return r;
  });
  return () => {
    for (const r of refs){
      const lv = skLv(r.i), cdt = `재사용 ${+skCdOf(r.i).toFixed(1)}초${skAuto(r.i) ? '' : ' · <b>수동</b>'}`;
      if (!lv){
        setText(r.lv, skLockLong(r.i));
        setHTML(r.desc, `${skillDesc(r.i, Math.max(1, S.skills[r.sk.key] || 1))} · ${cdt}`);
        setHTML(r.cost, '잠김'); r.btn.disabled = true; r.btn.classList.add('nocoin');
      } else if (lv >= r.sk.max){
        setText(r.lv, 'Lv.' + lv + ' 최대');
        setHTML(r.desc, `${skillDesc(r.i, lv)} · ${cdt}`);
        setHTML(r.cost, '최대'); r.btn.disabled = true; r.btn.classList.add('nocoin');
      } else {
        const c = skillCost(r.sk, lv);
        setText(r.lv, 'Lv.' + lv);
        setHTML(r.desc, `${skillDesc(r.i, lv)} · ${cdt}`);
        setHTML(r.cost, fmt(c)); r.btn.disabled = S.gold < c; r.btn.classList.remove('nocoin');
      }
    }
  };
}

/* --- 장비 --- */
let gearSlot = 'weapon', gearSel = -1;
function gearSegHTML(){
  return `<div class="seg six" role="group" aria-label="장비 종류">
      <button id="seg-weapon" aria-pressed="${gearSlot === 'weapon'}">${cls().weapon}</button>
      <button id="seg-armor" aria-pressed="${gearSlot === 'armor'}">${cls().armor}</button>
      <button id="seg-refine" aria-pressed="${gearSlot === 'refine'}">재련</button>
      <button id="seg-myth" aria-pressed="${gearSlot === 'myth'}">신화</button>
      <button id="seg-acc" aria-pressed="${gearSlot === 'acc'}">장신구</button>
      <button id="seg-form" aria-pressed="${gearSlot === 'form'}">변신</button>
      <button id="seg-av" aria-pressed="${gearSlot === 'av'}">아바타</button>
      <button id="seg-mount" aria-pressed="${gearSlot === 'mount'}">탈것${mountNew() ? ' •' : ''}</button>
      <button id="seg-craft" aria-pressed="${gearSlot === 'craft'}">조합${craftReady() ? ' •' : ''}</button>
    </div>`;
}
function wireGearSeg(){
  for (const k of ['weapon', 'armor', 'refine', 'myth', 'acc', 'form', 'av', 'mount', 'craft']) $('#seg-' + k).addEventListener('click', () => { gearSlot = k; gearSel = -1; buildTab('gear', true); });
}
function buildGear(){
  if (gearSlot === 'refine') return buildRefine();
  if (gearSlot === 'myth') return buildMyth();
  if (gearSlot === 'acc') return buildAcc();
  if (gearSlot === 'form') return buildForm();
  if (gearSlot === 'av') return buildAvatar();
  if (gearSlot === 'mount') return buildMount();
  if (gearSlot === 'craft') return buildCraft();
  const slot = gearSlot, Gd = S.gear[slot], eq = S.equip[slot], def = GEAR[slot];
  let grid = '';
  for (let gr = 0; gr < 5; gr++){
    grid += `<div class="gl" style="--gc:${GRADES[gr].color}">${GRADES[gr].name}</div>`;
    for (let t = 0; t < 4; t++){
      const i = gr * 4 + t, c = Gd.count[i];
      grid += `<button class="cell${Gd.seen[i] ? '' : ' unseen'}${gearSel === i ? ' sel' : ''}" id="cell-${i}" data-i="${i}" style="--g:${GRADES[gr].color}" aria-label="${gearName(slot, i)}, ${c}개${eq === i ? ', 장착 중' : ''}">${SVG[def.icon]}<span class="tier">${ROMAN[t]}</span>${c ? `<span class="cnt">${c}</span>` : ''}${eq === i ? '<span class="eq">장착</span>' : ''}</button>`;
    }
  }
  let detail = '';
  if (gearSel >= 0){
    const i = gearSel, gr = Math.floor(i / 4), c = Gd.count[i], m = mergeableSets(slot, i);
    detail = `<div class="detail" style="--g:${GRADES[gr].color}">
      <div class="dn">${gearName(slot, i)}<span class="badge">${GRADES[gr].name}</span></div>
      <div class="dl"><span>장착 효과</span><b>${def.stat} +${fmt(gearEquipPct(i))}%</b></div>
      <div class="dl"><span>보유 효과 (한 번 얻으면 계속 적용)</span><b>${def.stat} +${fmt(gearOwnPct(i))}%</b></div>
      <div class="dl"><span>가진 개수</span><b>${c}개</b></div>
      <div class="dbtns">
        <button class="btn primary" id="eqBtn" ${c > 0 && eq !== i ? '' : 'disabled'}>${eq === i ? '장착 중' : '장착하기'}</button>
        <button class="btn" id="mgBtn" ${m > 0 ? '' : 'disabled'}>${i >= 19 ? '최고 단계' : m > 0 ? `4개 합성 ×${m}` : '4개 모이면 합성'}</button>
      </div>
      ${Gd.seen[i] ? '' : '<p class="small">아직 얻지 못했어요. 소환하거나 바로 아래 단계 장비 4개를 합성하면 얻어요.</p>'}
    </div>`;
  }
  const eqP = eq >= 0 ? gearEquipPct(eq) : 0;
  panel.innerHTML = `
    ${gearSegHTML()}
    <div class="summon">
      <button class="gbtn" id="sum1"><span>${def.label} 1회 소환</span><span class="price"><i class="gem"></i>50</span></button>
      <button class="gbtn" id="sum10"><span>${def.label} 10회 소환</span><span class="price"><i class="gem"></i>450</span></button>
    </div>
    <p class="odds">전설 0.2% · 영웅 1.3% · 희귀 8.5% · 고급 26% · 일반 64%</p>
    <div class="effects">
      <div>장착 효과<b>${def.stat} +${fmt(eqP)}%</b></div>
      <div>보유 효과 합계<b>${def.stat} +${fmt(ownedPct(slot))}%</b></div>
    </div>
    <div class="grid">${grid}</div>
    ${detail}
    <div class="bulk"><button class="btn" id="mergeAll">일괄 합성</button><button class="btn" id="equipBest">가장 좋은 것 장착</button></div>`;
  wireGearSeg();
  $('#sum1').addEventListener('click', () => doSummon(slot, 1));
  $('#sum10').addEventListener('click', () => doSummon(slot, 10));
  panel.querySelectorAll('.cell').forEach(bt => bt.addEventListener('click', () => { const i = +bt.dataset.i; gearSel = gearSel === i ? -1 : i; buildTab('gear', true); }));
  if ($('#eqBtn')) $('#eqBtn').addEventListener('click', () => { S.equip[slot] = gearSel; refreshStats(); buildTab('gear', true); addLog(`${gearName(slot, gearSel)}${josa(gearName(slot, gearSel), '을', '를')} 장착했습니다.`); });
  if ($('#mgBtn')) $('#mgBtn').addEventListener('click', () => { const n = mergeOne(slot, gearSel); refreshStats(); if (n) addLog(`${gearName(slot, gearSel + 1)} ${n}개를 만들었습니다.`, 'gain'); buildTab('gear', true); });
  $('#mergeAll').addEventListener('click', () => { const n = mergeAll(slot); addLog(n ? `${n}번 합성했습니다.` : '합성할 장비가 없습니다. 같은 장비 4개가 필요해요.', n ? 'gain' : ''); buildTab('gear', true); });
  $('#equipBest').addEventListener('click', () => { equipBest(slot); addLog(S.equip[slot] >= 0 ? `${gearName(slot, S.equip[slot])}${josa(gearName(slot, S.equip[slot]), '을', '를')} 장착했습니다.` : '먼저 장비를 소환해 주세요.'); buildTab('gear', true); });
  return () => { $('#sum1').disabled = S.gems < 50; $('#sum10').disabled = S.gems < 450; };
}
function doSummon(slot, n){
  const res = summon(slot, n);
  if (!res){ addLog('보석이 부족합니다.', 'warn'); return; }
  sfx(res.some(r => r.it >= 12) ? 'rare' : 'summon');
  if (currentTab === 'gear') buildTab('gear', true);
  const best = res.reduce((a, r) => Math.max(a, r.it), 0);
  playFx('summon', {best:Math.floor(best / 4), sub:gearName(slot, best)});
  const html = `<div class="res-grid">${res.map((r, i) => {
      const g = GRADES[Math.floor(r.it / 4)];
      return `<div class="res flip${r.it >= 12 ? ' legend' : ''}" style="--g:${g.color};--i:${i}" title="${gearName(slot, r.it)}">${SVG[GEAR[slot].icon]}<span class="tier">${ROMAN[r.it % 4]}</span>${r.isNew ? '<span class="new">NEW</span>' : ''}</div>`;
    }).join('')}</div>
    <p class="small" style="margin-top:10px">가장 좋은 장비: <b>${gearName(slot, best)}</b> (${GRADES[Math.floor(best / 4)].name})</p>`;
  const cost = summonCost(n);
  showModal(`${GEAR[slot].label} 소환 결과`, html, [
    {label:`${n}회 더 (보석 ${cost})`, disabled:S.gems < cost, fn:() => doSummon(slot, n)},
    {label:'확인', primary:true},
  ]);
}

function buildAcc(){
  const pct = v => (v * 100 >= 1 ? (v * 100).toFixed(1) : (v * 100).toFixed(2)) + '%';
  panel.innerHTML = `${gearSegHTML()}

    <p class="rtable">떨어질 확률(한 번에) — 수문장: 반지 ${pct(ACC_DROP.gate.ring)} · 귀걸이 ${pct(ACC_DROP.gate.ear)} · 팔찌 ${pct(ACC_DROP.gate.brace)} / 그 단계 몬스터: 반지 ${pct(ACC_DROP.mob.ring)} · 귀걸이 ${pct(ACC_DROP.mob.ear)} · 팔찌 ${pct(ACC_DROP.mob.brace)}.
      등급: 일반 55% · 고급 28% · 희귀 12% · 영웅 4% · 전설 1%. 깊은 단계일수록 효과가 커요.</p>`;

      : `<div class="ct">다음 수문장 단계: ${stageLabel(next)}</div>`);
    for (const k of ACC_ORDER){
      const row = $('#ac-' + k), a = S.acc[k], ic = row.querySelector('.ic');
      if (a.g >= 0){ setHTML(row.querySelector('[data-r=n]'), `<span style="color:${GRADES[a.g].color}">${GRADES[a.g].name} ${ACC[k].names[a.g]}</span>`); setHTML(row.querySelector('[data-r=v]'), `${ACC[k].stat} <em>+${a.p}%</em>`); ic.style.borderColor = GRADES[a.g].color; ic.style.color = GRADES[a.g].color; }
      else { setHTML(row.querySelector('[data-r=n]'), '비어 있음'); setHTML(row.querySelector('[data-r=v]'), `${ACC[k].stat}을(를) 올려 줘요`); ic.style.borderColor = ''; ic.style.color = '#3a4458'; }
    }
  };
}

  wireGearSeg();
  for (const c of CRAFT_SLOTS){
    const card = $('#cf-' + c.k);
    card.querySelectorAll('[data-e]').forEach(b => b.addEventListener('click', () => { pickEngr(c.k, b.dataset.e); refreshPanel(); }));
    card.querySelector('[data-c]').addEventListener('click', e => { const bt = e.currentTarget, r = craft(c.k);
      if (r === true){ playFx('craft', {el:bt, sub:craftName(c.k, S.craft[c.k].t)}); buildTab('gear', true); } else if (r){ playFx('craft', {el:bt, fail:true}); refreshPanel(); } });
    card.querySelector('[data-swap]').addEventListener('click', () => { const it = S.craft[c.k]; if (it.e2 && pickEngr(c.k, it.e2, true)) buildTab('gear', true); });
  }

      const card = $('#cf-' + c.k), it = S.craft[c.k], n = craftNeed(c.k), E = engrOf(c.k, it.e);
      setText(card.querySelector('[data-r=tier]'), it.t ? `${it.t}단계 / ${CRAFT_MAX}` : '아직 없음');
      setHTML(card.querySelector('[data-r=now]'), it.t
        ? `<b>${craftName(c.k, it.t)}</b> — ${c.main} +${craftMain(c.k)}%${E ? ` · 각인 「${E.name}」 ${E.d} +${+engrVal(c.k, it.e, it.t).toFixed(2)}${c.k === 'a' && it.e === 'life' ? '%p' : '%'}${engrBest(c.k, it.e) ? ' <em>최적 ×1.5</em>' : ''}` : ''}`
        : `아직 만들지 않았어요. 단계마다 ${c.main} +${c.per}%, 각인 효과도 단계만큼 커져요.`);

      else {

        if (n.gearSlot) parts.push(`${GRADES[n.g].name} ${n.gearSlot === 'weapon' ? cls().weapon : cls().armor} ${have(n.haveGear, n.n)}개`);
        else parts.push(`보석 ${have(S.gems, n.gems)}`);
        setHTML(card.querySelector('[data-r=rec]'), n.open

          : `<b>${n.t}단계</b>는 ${WORLD_NAME[n.T.w]} ${n.T.need}단계(${stageLabelW(n.T.w, n.T.need)})에 닿으면 열려요.`);
        btn.disabled = !n.ok; setText(btn, `${n.t}단계 만들기 (${n.rate}%)`);
      }
      const showSwap = it.t > 0 && it.e2 && it.e2 !== it.e;
      sw.hidden = !showSwap;

    }
    const nOk = CRAFT_SLOTS.filter(c => S.craft[c.k].t > 0 && engrBest(c.k, S.craft[c.k].e)).length;
    setHTML($('#cfHarm'), `<div class="ct">조화 · ${cls().name}의 최적 조합 <span class="tag">${nOk}/3</span></div>
      <p class="small">${CRAFT_SLOTS.map(c => `${c.name} 「${engrOf(c.k, best[c.k]).name}」`).join(' + ')} — 세 칸을 모두 최적 각인으로 맞추면 공격력·체력 +${HARMONY}%${harmonyOn() ? ' <b style="color:var(--gold)">(발동 중)</b>' : ''}</p>`);
  };
}

function buildForm(){
  panel.innerHTML = `${gearSegHTML()}
    <p class="hint" style="margin-top:10px">고구려 고분벽화의 수호신, 사신(四神)의 힘을 빌려 변신해요. 한 번에 하나만 쓸 수 있고, 변신하면 모습이 바뀌어요.</p>
    <div class="classes">${FORMS.map(F => `<div class="ccard" id="fm-${F.k}" style="cursor:default">
      <img alt="" data-r="img"><b style="color:${F.color === '#2f6a52' ? '#5ad8a0' : F.color}">${F.name} 변신</b><span>${F.desc}</span>
      <em data-r="from"></em><button class="btn sm" data-k="${F.k}"></button></div>`).join('')}</div>`;
  wireGearSeg();
  panel.querySelectorAll('.ccard .btn').forEach(bt => bt.addEventListener('click', () => {
    const k = bt.dataset.k;
    if (!S.form.own[k]) return;
    S.form.eq = S.form.eq === k ? '' : k;
    refreshStats(); sfx(S.form.eq ? 'form' : 'click');
    if (S.form.eq){ fx.push({type:'level', t:0, dur:0.8}); addLog(`${FORMS.find(f => f.k === k).name} 변신!`, 'good'); } else addLog('변신을 풀었습니다.');
    refreshPanel();
  }));
  return () => {
    for (const F of FORMS){
      const card = $('#fm-' + F.k), own = S.form.own[F.k], on = S.form.eq === F.k, img = card.querySelector('[data-r=img]');
      const src = lookPreview(S.cls, S.look, gradeOf(S.equip.armor), gradeOf(S.equip.weapon), 'down', {form:F.k, ear:S.acc.ear.g, brace:S.acc.brace.g});
      if (img._s !== src){ img._s = src; img.src = src; }
      img.style.filter = own ? '' : 'brightness(0) opacity(.4)';
      setText(card.querySelector('[data-r=from]'), own ? (on ? '변신 중' : '') : `얻는 곳: ${FORM_FROM[F.k]}`);
      const bt = card.querySelector('.btn'); setText(bt, on ? '풀기' : own ? '변신하기' : '잠김'); bt.disabled = !own; bt.classList.toggle('primary', own && !on);
      card.setAttribute('aria-pressed', String(on));
    }
  };
}

/* --- 탈것 --- */
// 살 수 있거나 별을 올릴 수 있으면 메뉴에 점
const mountNew = () => mountOpen() && MOUNTS.some(m => S.mount.own[m.k] ? (S.mount.star[m.k] || 0) < MOUNT_STAR_MAX && S.mount.piece >= mountStarCost(m) : (() => { const c = mountBuyCost(m); return c && c.cur === 'piece' && S.mount.piece >= c.n; })());
function buildMount(){
  panel.innerHTML = `${gearSegHTML()}
    <div class="ph" style="margin-top:10px"><h2>탈것</h2><span class="small">모음 효과 공격력·체력 <b id="mtCol"></b> · 고삐 조각 <b id="mtPiece"></b></span></div>
    <p class="hint">${mountOpen() ? '타면 걷는 속도가 빨라지고 <b>고유 능력</b>이 켜져요(한 번에 하나). 가진 탈것마다 공격력·체력이 올라요(일반 1%·고급 2%·희귀 3%·전설 5%·신화 8%). 별 하나마다 고유 능력·모음 효과 +20%. 고삐 조각은 부상·곤륜 레이드, 타임 보스, 허수아비 4등급 이상에서 얻어요.' : '2부 부상으로 건너가면 <b>마구간</b>이 열려요. 탈것은 이야기·마구간·고삐 조각으로 얻어요.'}</p>
    <div class="classes mounts">${MOUNTS.map(m => `<div class="ccard" id="mt-${m.k}" style="cursor:default;--g:${MOUNT_G[m.g].color}">
      <img alt="" src="${mountImg(m.k)}"><b style="color:${MOUNT_G[m.g].color}">${m.name}</b><i class="mstar" data-r="star"></i>
      <span>${MOUNT_G[m.g].name} · 걷기 +${m.spd}%<br><span data-r="ab"></span></span>
      <em data-r="from"></em>
      <div class="mbtns"><button class="btn sm" data-k="${m.k}" data-a="main"></button><button class="btn sm" data-k="${m.k}" data-a="star"></button></div></div>`).join('')}</div>`;
  wireGearSeg();
  panel.querySelectorAll('.mounts .btn').forEach(bt => bt.addEventListener('click', () => {
    const k = bt.dataset.k, m = MT[k];
    if (bt.dataset.a === 'star'){ if (mountStarUp(k)){ upFx(bt.closest('.ccard'), `★${S.mount.star[k]}`, '#ffd24a'); sfx('rare'); addLog(`${m.name} 별 ${S.mount.star[k]}개!`, 'good'); } }
    else if (S.mount.own[k]){ rideMount(k); sfx('click'); addLog(S.mount.ride ? `${m.name}${josa(m.name, '을', '를')} 탔어요!` : `${m.name}에서 내렸어요.`); }
    else if (buyMount(k)){ sfx('rare'); playFx('box', {el:bt.closest('.ccard'), rare:m.g >= 2, sub:m.name}); }
    refreshPanel();
  }));
  return () => {
    setText($('#mtCol'), `+${fmt(mountCol())}% (${mountN()}/${MOUNTS.length})`); setText($('#mtPiece'), fmt(S.mount.piece));
    for (const m of MOUNTS){
      const card = $('#mt-' + m.k), own = !!S.mount.own[m.k], on = S.mount.ride === m.k, st = S.mount.star[m.k] || 0, c = mountBuyCost(m);
      card.querySelector('img').style.filter = own ? '' : 'brightness(0) opacity(.4)';
      setText(card.querySelector('[data-r=star]'), own ? '★'.repeat(st) + '☆'.repeat(MOUNT_STAR_MAX - st) : '');
      setText(card.querySelector('[data-r=ab]'), mountAbText(m, own ? mountK(m.k) : 1));
      const cost = c ? (c.cur === 'gold' ? `엽전 ${fmt(c.n)}` : c.cur === 'gems' ? `보석 ${fmt(c.n)}` : `고삐 조각 ${c.n}`) : '';
      setText(card.querySelector('[data-r=from]'), own ? (on ? '타는 중' : '') : c ? (m.src === 'piece' ? `고삐 조각 ${c.n}개로 길들이기` : `마구간: ${cost}`) : `얻는 곳: ${m.from}`);
      const bt = card.querySelector('[data-a=main]'), sb = card.querySelector('[data-a=star]');
      const have = c ? (c.cur === 'gold' ? S.gold : c.cur === 'gems' ? S.gems : S.mount.piece) : 0;
      setText(bt, on ? '내리기' : own ? '타기' : c ? (mountOpen() ? '얻기' : '잠김') : '잠김');
      bt.disabled = !own && !(c && mountOpen() && have >= c.n); bt.classList.toggle('primary', !on && !bt.disabled);
      const sc = mountStarCost(m);
      sb.hidden = !own; setText(sb, st >= MOUNT_STAR_MAX ? '별 가득' : `★+ ${sc}`); sb.disabled = st >= MOUNT_STAR_MAX || S.mount.piece < sc;
      card.setAttribute('aria-pressed', String(on)); card.classList.toggle('on', on);
    }
  };
}

/* --- 아바타 --- */
function avPetIdx(){ for (const t of PET_TYPE_ORDER){ const i = eqPet(t); if (i >= 0) return i; } const j = S.pets.lv.findIndex(l => l > 0); return j >= 0 ? j : 0; }
function avPreview(a){
  if (a.type === 'pet'){ const old = S.av.pet; S.av.pet = a.k; const u = petSprite(avPetIdx(), 0).toDataURL(); S.av.pet = old; return u; }
  const ex = {form:formOf() ? S.form.eq : '', ear:S.acc.ear.g, brace:S.acc.brace.g, job:S.job, costume:a.type === 'char' ? a.k : S.av.char, cape:a.type === 'cape' ? a.k : S.av.cape};
  return lookPreview(S.cls, S.look, gradeOf(S.equip.armor), gradeOf(S.equip.weapon), a.type === 'cape' ? 'up' : 'down', ex);
}
function buildAvatar(){
  const list = t => AVATARS.filter(a => a.type === t && (!a.job || a.cls === S.cls));
  panel.innerHTML = `${gearSegHTML()}
    <div class="ph" style="margin-top:10px"><h2>아바타</h2><span class="small">도감 효과 공격력·체력 <b id="avBonus"></b></span></div>
    <p class="hint">옷·망토·펫 꾸미기는 모습만 바꿔요. 대신 가진 아바타 하나마다 공격력·체력이 ${AV_PCT}%씩 올라요(도감 효과). 다시 누르면 벗어요.</p>
    <button class="btn primary" id="avBox" style="width:100%;margin-bottom:6px">꾸미기 상자 열기 (보석 ${AV_BOX})</button>
    <p class="odds" id="avOdds"></p>
    ${AV_TYPES.map(([t, nm]) => `<div class="ph"><h2>${nm}</h2></div><div class="avgrid">${list(t).map(a => `<button class="avcell" data-k="${a.k}" aria-pressed="false">
      <img alt="" data-r="img"><b>${a.name}</b><em data-r="st"></em></button>`).join('')}</div>`).join('')}`;
  wireGearSeg();
  $('#avBox').addEventListener('click', () => { if (buyShop('avbox')) refreshPanel(); });
  panel.querySelectorAll('.avcell').forEach(bt => bt.addEventListener('click', () => { if (S.av.own[bt.dataset.k]){ equipAvatar(bt.dataset.k); sfx('click'); refreshPanel(); } }));
  return () => {
    setText($('#avBonus'), `+${AV_PCT * avCount()}% (${avCount()}개)`);
    $('#avBox').disabled = S.gems < AV_BOX;
    setHTML($('#avOdds'), `확률 공개 — 옷 ${AV_ODDS[0][1]}% · 망토 ${AV_ODDS[1][1]}% · 펫 꾸미기 ${AV_ODDS[2][1]}% · 위로품(인삼 탕약) ${AV_ODDS[3][1]}%. 종류 안에서는 똑같은 확률. <b>새 옷·망토 확정까지 ${Math.max(1, AV_PITY - (S.avPity || 0))}번</b>`);
    panel.querySelectorAll('.avcell').forEach(bt => {
      const a = AV[bt.dataset.k], own = !!S.av.own[a.k], on = S.av[a.type] === a.k, img = bt.querySelector('[data-r=img]');
      const src = avPreview(a); if (img._s !== src){ img._s = src; img.src = src; }
      img.style.filter = own ? '' : 'brightness(0) opacity(.35)';
      setText(bt.querySelector('[data-r=st]'), on ? '입는 중' : own ? '누르면 입기' : (a.src === 'box' ? '꾸미기 상자' : a.src));
      bt.setAttribute('aria-pressed', String(on));
    });
  };
}

/* --- 신화 보물 --- */

  panel.innerHTML = `${gearSegHTML()}
    <p class="hint" style="margin-top:8px">퀘스트 보상을 받을 때 낮은 확률(${Math.round(LUCK_MYTH * 100)}%)로 신화 보물이 나와요. 어려운 퀘스트일수록 효과가 커요. 종류마다 가장 센 것만 남고, 약한 것은 보석 ${MYTH_DUP_GEMS}개로 바뀌어요.</p>
    <ul class="list">${MYTHS.map(m => `<li class="row" id="my-${m.k}"><div class="ic myth" style="--myth:${MYTH_COLOR}">${SVG[m.icon]}</div>
      <div><div class="nm">${m.name}<span class="l">${m.stat}</span></div><div class="val" data-r="v"></div></div><span></span></li>`).join('')}</ul>
    <p class="small" style="margin-top:6px">퀘스트를 깰 때 ${Math.round(LUCK_RESET * 100)}% 확률로 모든 기술의 재사용 시간도 초기화돼요.</p>`;
