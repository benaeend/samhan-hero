plugins { id 'com.android.application' }

// 서명 정보는 저장소에 없고 GitHub 비밀값에서만 들어온다(없으면 시험용 키로 서명).
def ksPath = System.getenv('KEYSTORE_PATH')
def ksPass = System.getenv('KEYSTORE_PASSWORD')

android {
    namespace 'kr.samhan.hero'
    compileSdk 34
    defaultConfig {
        applicationId 'kr.samhan.hero'
        minSdk 24
        targetSdk 34
        versionCode = (System.getenv('VERSION_CODE') ?: '1').toInteger()
        versionName = '1.0.' + (System.getenv('VERSION_CODE') ?: '1')
    }
    signingConfigs {
        if (ksPath && ksPass) {
            release {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias 'samhan'
                keyPassword ksPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksPath && ksPass) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
