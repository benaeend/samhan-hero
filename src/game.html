<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>삼한 용사 키우기</title>
<meta name="description" content="옛 한국풍 도트 방치형 RPG. 네 직업 중 하나를 골라 마을 어귀부터 백두 설원까지 사냥하며 성장해요.">
<meta name="theme-color" content="#2b1f17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="삼한 용사">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
/* Galmuri — Copyright 2019–2025 Lee Minseo (quiple), SIL Open Font License 1.1, https://github.com/quiple/galmuri (이 게임에 쓰인 글자만 남긴 부분 글꼴) */
@font-face{font-family:'Galmuri';font-weight:400;src:url(data:font/woff2;base64,/*FONT_REG*/) format('woff2');font-display:block}
@font-face{font-family:'Galmuri';font-weight:700;src:url(data:font/woff2;base64,/*FONT_BOLD*/) format('woff2');font-display:block}
:root{
  /* 한지와 먹, 나무틀: 종이색 창 + 먹색 글씨 + 인주 빨강 하나로 강조.
     레이아웃: 세로 한 화면 = 나무 상태바 → 탑뷰 도트 장면 → 기술 줄 → 한지 창(스크롤) → 나무 탭 */
  --wood:#2b1f17;
  --wood-2:#3d2c20;
  --wood-line:#5e4532;
  --paper:#efe5cf;
  --paper-2:#e2d4b4;
  --paper-line:#c4ad84;
  --ink:#2a2118;
  --ink-soft:#6e5c47;
  --seal:#b8382f;
  --gold:#e0b03c;
  --jade:#3f8f6a;
  --sky:#3a9fcf;
  --myth:#ff5a8a;
  --pixel:'Galmuri','Apple SD Gothic Neo','Malgun Gothic',monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#1d150f;color:var(--ink);font-family:var(--pixel);font-size:13px;line-height:1.45;overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px);
}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--paper);border-left:3px solid var(--wood-2);border-right:3px solid var(--wood-2)}

/* 상단 나무 상태바 */
.hud{background:var(--wood);color:#f3e6c8;padding:7px 10px 8px;border-bottom:3px solid var(--wood-line);display:grid;gap:6px}
.hud-top{display:flex;align-items:center;gap:10px}
.who{flex:1;min-width:0;display:flex;align-items:baseline;gap:7px;white-space:nowrap;overflow:hidden}
.who b{font-weight:700;font-size:15px}
.who .cls{color:var(--gold);font-size:12px}
.who .nick{max-width:9em;overflow:hidden;text-overflow:ellipsis}
.who .cp{font-size:12px;color:#c9b490}
.cur{display:flex;align-items:center;gap:5px;font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.coin{width:12px;height:12px;background:#e0b03c;box-shadow:inset -2px -2px 0 #a8781a,inset 2px 2px 0 #ffe58a;flex:none;display:inline-block}
.gem{width:10px;height:10px;transform:rotate(45deg);background:#5ac8f0;box-shadow:inset -2px -2px 0 #2a88b0,inset 2px 2px 0 #c8f2ff;flex:none;display:inline-block;margin:0 2px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{display:flex;align-items:center;gap:5px;font-size:11px;color:#c9b490;white-space:nowrap}
.bar .tr{flex:1;height:8px;background:#120c08;border:1px solid #5e4532;position:relative}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;width:0}
.bar.hp i{background:#d8433a;box-shadow:inset 0 -2px 0 #9a2a22}
.bar.xp i{background:#e0b03c;box-shadow:inset 0 -2px 0 #a8781a}
.bar .num{min-width:58px;text-align:right;color:#f3e6c8;font-variant-numeric:tabular-nums}

/* 장면 */
.scene{position:relative;line-height:0;background:#000}
canvas{display:block;width:100%;image-rendering:pixelated;touch-action:manipulation}
.log{position:absolute;left:6px;right:6px;bottom:6px;display:flex;flex-direction:column;gap:1px;pointer-events:none;line-height:1.35}
.log div{align-self:flex-start;background:rgba(10,6,4,.62);color:#f3eee0;font-size:11px;padding:1px 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:opacity .6s}
.log div.gain{color:#ffd96a}.log div.warn{color:#ff8a7a}.log div.good{color:#9ff0b8}
.log div.old{opacity:0}

/* 기술 줄 */
.ctrl{display:flex;align-items:center;gap:7px;padding:6px 10px;background:var(--wood-2);border-top:3px solid var(--wood-line);border-bottom:3px solid var(--wood-line)}
.skills{display:flex;gap:6px}
.sk{position:relative;width:38px;height:38px;background:#1d150f;display:grid;place-items:center;color:var(--gold);border:2px solid #8a6a4a;box-shadow:inset 0 0 0 1px #000;overflow:hidden}
.sk svg{width:20px;height:20px;position:relative;z-index:1}
.sk .cd{position:absolute;inset:0;z-index:2;background:linear-gradient(to top,rgba(0,0,0,.72) var(--p,0%),transparent var(--p,0%))}
.sk .lk{display:none;position:absolute;inset:0;z-index:3;place-items:center;font-size:10px;color:#c9b490;background:rgba(29,21,15,.85)}
.sk.locked .lk{display:grid}
.sp{flex:1}
.btn-boss{border:2px solid #1d150f;padding:7px 10px;background:var(--seal);color:#fff4e0;font-weight:700;font-size:13px;cursor:pointer;
  box-shadow:inset -2px -2px 0 #7a1f1a,inset 2px 2px 0 #e86a5a;animation:blink 1s steps(2) infinite;touch-action:manipulation}
.btn-boss[hidden]{display:none}
@keyframes blink{50%{filter:brightness(1.25)}}
.btn-speed{border:2px solid #1d150f;padding:7px 9px;background:#5e4532;color:#f3e6c8;font-size:12px;cursor:pointer;box-shadow:inset -2px -2px 0 #3d2c20,inset 2px 2px 0 #8a6a4a;touch-action:manipulation}
.btn-speed[aria-pressed="true"]{background:#8a6a2a;color:#fff4c0}

/* 한지 창 패널 */
.panel{flex:1;overflow-y:auto;padding:10px 12px 16px;min-height:0;overscroll-behavior:contain;
  background-color:var(--paper);
  background-image:radial-gradient(rgba(120,90,50,.07) 1px,transparent 1px);background-size:5px 5px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 4px;padding-bottom:5px;border-bottom:2px solid var(--ink)}
.ph h2{font-weight:700;font-size:16px;margin:0;text-wrap:balance;display:flex;align-items:center;gap:7px}
.ph h2::before{content:"";width:9px;height:9px;background:var(--seal);display:inline-block}
.hint{font-size:12px;color:var(--ink-soft);margin:4px 0 6px}
.mode{display:flex;gap:4px}
.chip{border:2px solid var(--ink);background:var(--paper-2);color:var(--ink-soft);padding:2px 8px;font-size:12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--paper-line)}
.row:last-child{border-bottom:0}
.ic{width:36px;height:36px;background:var(--wood);border:2px solid var(--ink);display:grid;place-items:center;color:var(--gold)}
.ic svg{width:20px;height:20px}
.nm{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.nm .l{font-weight:400;font-size:12px;color:var(--ink-soft)}
.val{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.val em{font-style:normal;color:var(--jade);font-weight:700}
.buy{min-width:96px;display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 9px;border:2px solid var(--ink);
  background:var(--gold);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  box-shadow:inset -2px -2px 0 #a8781a,inset 2px 2px 0 #ffe58a;font-variant-numeric:tabular-nums}
.buy:active:not(:disabled){box-shadow:inset 2px 2px 0 #a8781a,inset -2px -2px 0 #ffe58a}
.buy:disabled{background:#d6c8a8;color:#8a7a60;box-shadow:inset -2px -2px 0 #bcae8c,inset 2px 2px 0 #ece0c4;cursor:default}
.buy:disabled .coin{filter:grayscale(1) opacity(.6)}
.buy.nocoin .coin{display:none}
.buy small{font-size:11px;font-weight:400}

/* 장비 */
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink)}
.seg button{border:0;background:var(--paper-2);color:var(--ink-soft);padding:7px;font-weight:700;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.summon{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.gbtn{border:2px solid var(--ink);padding:8px;background:var(--sky);color:#06202c;font-weight:700;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:inset -2px -2px 0 #1f6a8f,inset 2px 2px 0 #9fdcf4;touch-action:manipulation}
.gbtn .price{display:flex;align-items:center;gap:4px;font-weight:400;font-size:12px}
.gbtn:disabled{background:#d6c8a8;color:#8a7a60;box-shadow:inset -2px -2px 0 #bcae8c,inset 2px 2px 0 #ece0c4;cursor:default}
.odds{font-size:11px;color:var(--ink-soft);margin:0 0 8px;text-align:center}
.effects{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--ink-soft);margin-bottom:8px}
.effects div{background:var(--paper-2);border:2px solid var(--paper-line);padding:5px 8px}
.effects b{display:block;color:var(--ink);font-size:14px}
.grid{display:grid;grid-template-columns:34px repeat(4,1fr);gap:5px;align-items:center}
.gl{font-weight:700;font-size:12px;color:var(--gc)}
.cell{position:relative;aspect-ratio:1;background:var(--wood);border:2px solid var(--g);color:var(--g);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px #000}
.cell svg{width:46%;height:46%}
.cell.unseen{border-color:#7a6a52;color:#4e4032}
.cell.sel{outline:3px solid var(--seal);outline-offset:1px}
.cell .tier,.res .tier{position:absolute;left:3px;bottom:1px;font-size:10px;color:#f3e6c8}
.cell .cnt{position:absolute;right:3px;top:1px;font-size:11px;font-weight:700;color:#f3e6c8}
.cell .eq{position:absolute;left:-3px;top:-8px;background:var(--seal);color:#fff4e0;font-size:10px;padding:0 3px;border:1px solid var(--ink)}
.detail{margin-top:10px;padding:10px;background:var(--paper-2);border:2px solid var(--ink);border-top:5px solid var(--g);display:grid;gap:5px}
.dn{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px}
.badge{font-size:11px;padding:1px 5px;background:var(--wood);color:var(--g);border:1px solid var(--g)}
.dl{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-soft)}
.dl b{color:var(--ink)}
.dbtns,.bulk{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.bulk{margin-top:10px}
.small{font-size:12px;color:var(--ink-soft);margin:2px 0 0}

/* 공용 버튼 */
.btn{border:2px solid var(--ink);background:var(--paper-2);color:var(--ink);padding:7px 10px;cursor:pointer;font-weight:700;font-size:13px;
  box-shadow:inset -2px -2px 0 var(--paper-line),inset 2px 2px 0 #fbf4e2;touch-action:manipulation}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--seal);color:#fff4e0;box-shadow:inset -2px -2px 0 #7a1f1a,inset 2px 2px 0 #e86a5a}
.btn.danger{color:var(--seal)}

/* 정보 */
.rec{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 10px}
.rec div{background:var(--paper-2);border:2px solid var(--paper-line);padding:5px 8px}
.rec dt{font-size:11px;color:var(--ink-soft)}
.rec dd{margin:0;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.save-note{font-size:12px;color:var(--ink-soft);margin:0 0 12px;display:flex;align-items:center;gap:7px}
.save-note::before{content:"";width:8px;height:8px;background:var(--jade);flex:none}
.howto{margin:6px 0 14px;padding-left:18px;color:var(--ink-soft);font-size:12px;display:grid;gap:4px;max-width:65ch}
.recbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* 하단 탭 */
.tabs{display:grid;grid-template-columns:repeat(8,1fr);background:var(--wood);border-top:3px solid var(--wood-line);padding-bottom:env(safe-area-inset-bottom)}
.tab{position:relative;background:none;border:0;color:#a8906c;font-size:11px;padding:6px 0 8px;letter-spacing:-.3px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;white-space:nowrap}
.tab svg{width:18px;height:18px}
.tab[aria-selected="true"]{color:#ffe58a;background:#3d2c20;box-shadow:inset 0 3px 0 var(--seal)}
.tab .dot{display:none;position:absolute;top:4px;left:calc(50% + 6px);width:7px;height:7px;background:var(--seal);border:1px solid #1d150f}
.tab.has-dot .dot{display:block}

/* 길잡이(튜토리얼) 줄 */
.guide{display:flex;align-items:center;gap:8px;padding:5px 10px;background:#f6e2b8;border-bottom:3px solid var(--wood-line);font-size:12px;line-height:1.35}
.guide[hidden]{display:none}
.guide img{width:30px;height:22px;image-rendering:pixelated;flex:none}
.guide .gt{flex:1;min-width:0}
.guide .gt b{color:var(--seal);font-size:11px;margin-right:4px}
.guide .gp{color:var(--jade);font-weight:700;margin-left:4px;white-space:nowrap}
.guide .btn{padding:4px 7px;font-size:11px;flex:none}
.guide.flash{animation:gflash .4s steps(2) 3}
@keyframes gflash{50%{background:#cfeeb8}}
.pulse{animation:pulse .9s steps(2) infinite}
@keyframes pulse{50%{outline:3px solid var(--seal);outline-offset:1px}}

/* 공용 카드·막대 */
.card{background:var(--paper-2);border:2px solid var(--ink);padding:8px 10px;margin:8px 0;display:grid;gap:5px}
.card.locked{opacity:.6}
.card.ready{border-color:var(--seal);box-shadow:inset 0 0 0 1px var(--seal)}
.ct{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px}
.ct .tag{margin-left:auto;font-weight:400;font-size:11px;color:var(--ink-soft);white-space:nowrap}
.ct .badge{color:var(--gold)}
.story{font-size:12px;color:var(--ink-soft);margin:0;max-width:62ch}
.meter{height:8px;background:#d6c8a8;border:1px solid var(--ink);position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--jade)}
.meter.gold i{background:var(--gold)}
.meter.fire i{background:#e0703a}
.btn.sm{padding:5px 8px;font-size:12px}
.qrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--paper-line)}
.qrow:last-child{border-bottom:0}
.qrow .qn{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:6px}
.qrow .qn span{font-weight:400;font-size:11px;color:var(--ink-soft);white-space:nowrap}
.qrow .meter{margin-top:3px}
.qrow .btn{min-width:66px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg.four button{padding:7px 2px}

/* 상점 */
.shop-cats{display:flex;gap:4px;margin:8px 0 2px;flex-wrap:wrap}
.bag{font-size:11px;color:var(--ink-soft)}
.bag b{color:var(--ink)}
.ic.buffc{color:var(--bc)}
.row .on{font-size:11px;color:var(--jade);font-weight:700}
.buy.gemc{background:var(--sky);color:#06202c;box-shadow:inset -2px -2px 0 #1f6a8f,inset 2px 2px 0 #9fdcf4}
.buy.free{background:var(--jade);color:#f3fff6;box-shadow:inset -2px -2px 0 #24603f,inset 2px 2px 0 #7fd0a8}
.whet{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft)}

/* 신화 */
.ic.myth{color:var(--myth);border-color:var(--myth);box-shadow:0 0 0 2px rgba(255,90,138,.35)}
.ic.myth.none{color:#5a4a3a;border-color:var(--ink);box-shadow:none}
.mythv{color:var(--myth);font-weight:700}
.rewards.notes li{display:grid;gap:2px;font-size:12px;font-weight:400}
.rewards.notes li b{font-size:14px}
.rewards.notes li span:last-child{margin-left:0;color:var(--ink-soft)}
.myth-get{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;background:#2a1a22;color:#ffe0ea;border:2px solid var(--myth);padding:10px}
.myth-get .ic{width:48px;height:48px}
.myth-get .ic svg{width:28px;height:28px}
.myth-get b{font-size:17px;color:#ffd0de}
.myth-get p{margin:2px 0 0;color:#ffe0ea}
.myth-get .small{color:#d8a8b8}

/* 채팅 */
.btn-chat{position:relative;border:2px solid #1d150f;width:34px;height:34px;padding:0;background:#5e4532;color:#f3e6c8;cursor:pointer;display:grid;place-items:center;
  box-shadow:inset -2px -2px 0 #3d2c20,inset 2px 2px 0 #8a6a4a;touch-action:manipulation}
.btn-chat svg{width:18px;height:18px}
.btn-chat[aria-pressed="true"]{background:#8a6a2a;color:#fff4c0}
.btn-chat .dot{display:none;position:absolute;top:-4px;right:-4px;min-width:14px;height:14px;padding:0 2px;background:var(--seal);color:#fff;font-size:9px;line-height:12px;border:1px solid #1d150f;font-style:normal}
.btn-chat.has-dot .dot{display:block}
.chat{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--paper)}
.chat[hidden]{display:none}
.chat-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:2px solid var(--ink)}
.chat-head .small{flex:1;margin:0}
.chat-list{flex:1;min-height:0;overflow-y:auto;list-style:none;margin:0;padding:6px 12px;display:flex;flex-direction:column;gap:3px;font-size:13px;overscroll-behavior:contain}
.chat-list.sys-only .cm:not(.sys){display:none}
.cm{line-height:1.4;word-break:break-all}
.cm b{margin-right:2px}
.cm.me b{color:var(--seal)}
.cm.player b{color:#2a6aa8}
.cm.npc b{color:var(--jade)}
.cm.sys{color:#8a5a1a;background:#f6e2b8;padding:1px 5px}
.chat-in{display:flex;gap:6px;padding:8px 12px;border-top:2px solid var(--ink);background:var(--paper-2)}
.chat-in input{flex:1;min-width:0;font:inherit;font-size:16px;padding:6px 8px;border:2px solid var(--ink);border-radius:0;background:#fbf4e2;color:var(--ink)}
.chat-in input:focus{outline:2px solid var(--sky);outline-offset:1px}

/* 재련 */
.rhead{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center}
.rlv{color:var(--seal)}
.rres{font-weight:700;font-size:13px;min-height:1.4em;margin:0}
.rres.ok{color:var(--jade)}
.rres.no{color:var(--seal)}
.rres.pop{animation:pop .3s steps(3)}
.rtable{font-size:11px;color:var(--ink-soft);margin:6px 0 0;line-height:1.6;word-break:keep-all}

/* 펫 */
.pslots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.pslot{border:2px solid var(--ink);background:var(--wood);color:#f3e6c8;padding:6px 4px;display:grid;justify-items:center;align-content:start;gap:1px;font-size:11px;text-align:center;min-height:96px}
.pslot b{color:var(--gold);font-size:11px}
.pslot img{width:44px;height:34px;object-fit:contain;image-rendering:pixelated;margin:2px 0}
.pslot .empty{color:#8a7a60;margin-top:22px}
.pgrid{display:grid;grid-template-columns:34px repeat(5,1fr);gap:5px;align-items:center}
.pcell{position:relative;aspect-ratio:1;background:var(--wood);border:2px solid var(--g);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px #000}
.pcell img{width:72%;height:72%;object-fit:contain;image-rendering:pixelated}
.pcell.unseen{border-color:#7a6a52}
.pcell.unseen img{filter:brightness(0) opacity(.35)}
.pcell.sel{outline:3px solid var(--seal);outline-offset:1px}
.pcell .lvl{position:absolute;left:2px;bottom:0;font-size:9px;color:#f3e6c8}
.pcell .st{position:absolute;right:2px;top:0;font-size:9px;color:var(--gold);letter-spacing:-1px}
.pcell .eq{position:absolute;left:-3px;top:-8px;background:var(--seal);color:#fff4e0;font-size:10px;padding:0 3px;border:1px solid var(--ink)}
.stars{color:#c8901a;letter-spacing:-1px}
.res img{width:70%;height:70%;object-fit:contain;image-rendering:pixelated}
.res .new.star{background:#a8781a}
.res .new.gem2{background:#1f6a8f}

/* 레이드 */
.party{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;font-size:11px}
.party div{display:grid;gap:2px;min-width:0}
.party span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.party .meter{height:6px}
.party .down{color:var(--seal)}
.plist{margin:6px 0 0;padding-left:16px;font-size:12px;color:var(--ink-soft);display:grid;gap:2px}
.plist b{color:var(--ink)}

/* 계정·꾸미기 */
.form{display:grid;gap:8px;margin:8px 0 2px}
.form label{display:grid;gap:3px;font-size:12px;color:var(--ink-soft)}
.form input[type=text],.form input[type=password]{font:inherit;font-size:16px;padding:7px 9px;border:2px solid var(--ink);border-radius:0;background:#fbf4e2;color:var(--ink);box-shadow:inset 2px 2px 0 var(--paper-line);width:100%}
.form input:focus{outline:2px solid var(--sky);outline-offset:1px}
.check{display:flex !important;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);cursor:pointer}
.check input{width:16px;height:16px;margin:0;accent-color:var(--seal);flex:none}
.err{color:var(--seal);font-size:12px;min-height:1.4em;margin:4px 0 0 !important;font-weight:700}
.logo{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin:-2px 0 8px;background:var(--wood);border:2px solid var(--ink);padding:8px 0 4px}
.logo img{width:56px;height:52px;image-rendering:pixelated}
.chars{display:grid;gap:7px;margin:8px 0 4px}
.char{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center;padding:6px 8px;border:2px solid var(--ink);background:var(--paper-2);cursor:pointer;text-align:left;box-shadow:inset -2px -2px 0 var(--paper-line),inset 2px 2px 0 #fbf4e2}
.char[aria-pressed="true"]{background:#f6e2b8;outline:3px solid var(--seal);outline-offset:1px}
.char img{width:46px;height:43px;image-rendering:pixelated;background:var(--wood)}
.char b{font-size:15px;display:block}
.char span span{font-size:11px;color:var(--ink-soft)}
.linkrow{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.link{background:none;border:0;padding:2px 0;color:var(--ink-soft);text-decoration:underline;cursor:pointer;font-size:12px}
.link.danger{color:var(--seal)}
.opt-l{font-size:12px;font-weight:700;color:var(--ink);margin:10px 0 4px}
.lookwrap{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start}
.preview{background:var(--wood);border:2px solid var(--ink);display:grid;justify-items:center;gap:2px;padding:8px 0 4px;cursor:pointer}
.preview img{width:84px;height:78px;image-rendering:pixelated}
.preview span{font-size:10px;color:#c9b490}
.opts{display:grid;gap:7px}
.opts .opt-l{margin:0 0 3px;font-weight:400;font-size:11px;color:var(--ink-soft)}
.sw,.chips{display:flex;flex-wrap:wrap;gap:4px}
.sw button{width:24px;height:24px;border:2px solid var(--ink);background:var(--c);cursor:pointer;padding:0;box-shadow:inset -2px -2px 0 rgba(0,0,0,.25);font-size:9px;color:var(--ink)}
.sw button.auto{background:repeating-linear-gradient(45deg,var(--paper-2) 0 3px,var(--paper-line) 3px 6px)}
.sw button[aria-pressed="true"],.chips .chip[aria-pressed="true"]{outline:3px solid var(--seal);outline-offset:1px}
.chips .chip{padding:2px 6px;font-size:11px}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(15,10,6,.72);display:grid;place-items:center;padding:14px;z-index:10}
.modal[hidden]{display:none}
.sheet{width:min(430px,100%);background:var(--paper);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--wood-line),0 18px 50px rgba(0,0,0,.6);padding:14px;max-height:92%;overflow:auto}
.sheet h2{font-weight:700;margin:0 0 8px;font-size:18px;text-wrap:balance;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.sheet p{margin:0 0 8px;color:var(--ink-soft)}
.sheet p b{color:var(--ink)}
.mbtns{display:flex;gap:8px;margin-top:12px}
.mbtns button{flex:1}
.rewards{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:5px}
.rewards li{display:flex;align-items:center;gap:8px;background:var(--paper-2);border:2px solid var(--paper-line);padding:6px 10px;font-weight:700;font-size:15px}
.rewards li span:last-child{margin-left:auto;font-weight:400;font-size:12px;color:var(--ink-soft)}
.res-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:4px}
.res{position:relative;aspect-ratio:1;background:var(--wood);border:2px solid var(--g);color:var(--g);display:grid;place-items:center;animation:pop .3s steps(3) both;animation-delay:calc(var(--i) * 60ms)}
.res svg{width:48%;height:48%}
.res.legend{box-shadow:0 0 0 2px var(--g)}
.res .new{position:absolute;right:-3px;top:-8px;background:var(--seal);color:#fff;font-size:9px;padding:0 3px;border:1px solid var(--ink)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.classes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ccard{border:2px solid var(--ink);background:var(--paper-2);padding:8px;cursor:pointer;display:grid;justify-items:center;gap:4px;text-align:center;box-shadow:inset -2px -2px 0 var(--paper-line),inset 2px 2px 0 #fbf4e2}
.ccard[aria-pressed="true"]{background:#f6e2b8;outline:3px solid var(--seal);outline-offset:1px}
.ccard img{width:60px;height:56px;image-rendering:pixelated}
.ccard b{font-size:15px}
.ccard span{font-size:11px;color:var(--ink-soft);line-height:1.35}
.ccard em{font-style:normal;font-size:11px;color:var(--seal)}

@media (prefers-reduced-motion: reduce){
  .btn-boss,.res,.guide.flash,.rres.pop{animation:none}
  .pulse{animation:none;outline:3px solid var(--seal);outline-offset:1px}
  .log div{transition:none}
}
</style>
</head>

<script>
(() => {
'use strict';

/* ================= 기본 설정 ================= */
const T = 16, COLS = 15, ROWS = 10, W = COLS * T, H = ROWS * T, TOPR = 2;
const KILLS_PER_STAGE = 10, BOSS_TIME = 30, OFFLINE_CAP = 12 * 3600;
const SAVE_KEY = 'samhan-hero-v1';          // 예전(계정 없던 때) 저장 자리. 새 캐릭터로 옮겨 올 때만 읽는다
const ACC_KEY = 'samhan-accounts-v1';       // 이 기기의 계정·캐릭터 목록
const SESSION_KEY = 'samhan-session';       // 로그인 유지를 끈 경우 탭이 열려 있는 동안만 기억
const charKey = (acc, cid) => `${SAVE_KEY}:${acc}:${cid}`;
const MAX_CHARS = 4;
const STEP_HERO = 0.2;
const GEM_DROP = 0.1;                       // 잡몹 한 마리가 보석을 떨굴 확률
let clockSkew = 0;                          // 테스트에서 시간을 빨리 돌릴 때만 쓴다

/* ================= 앱으로 설치(PWA) =================
   GitHub Pages(github.io)나 내 컴퓨터(localhost)에서 열 때만 앱 설정(manifest.webmanifest)과 오프라인 도우미(sw.js)를 켠다.
   claude.ai 아티팩트처럼 다른 곳에 올린 경우에는 아무것도 하지 않는다. */
const PWA_HOST = (() => {
  try {
    return window.top === window && /(^|\.)github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)
      && (location.protocol === 'https:' || location.protocol === 'http:' && /^(localhost|127\.0\.0\.1)$/.test(location.hostname));
  } catch (e) { return false; }
})();
if (PWA_HOST){
  for (const [rel, href] of [['manifest', 'manifest.webmanifest'], ['icon', 'icons/icon-192.png'], ['apple-touch-icon', 'icons/icon-192.png']]){
    const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l);
  }
  if ('serviceWorker' in navigator){
    const reg = () => navigator.serviceWorker.register('sw.js').catch(() => {});
    if (document.readyState === 'complete') reg(); else window.addEventListener('load', reg);
  }
}
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
window.addEventListener('appinstalled', () => { installEvt = null; });
const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const canInstall = () => PWA_HOST && !isStandalone();
const now = () => Date.now() + clockSkew;

const SVG = {

  spin:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 3h6v2h2v2h-2v2h-2V7H9v2H7v6h2v2h6v-2h2v-2h4v2h-2v2h-2v2h-2v2H9v-2H7v-2H5v-2H3V9h2V7h2V5h2zm10 2h2v6h-6V9h2V7h2z"/></svg>',

  mirror:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 2h8v2h2v2h1v8h-1v2h-2v2h-3v4h-2v-4H8v-2H6v-2H5V6h1V4h2zm1 4v6h2V6z"/></svg>',
  bell:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 2h2v2h2v2h2v8h2v3H5v-3h2V6h2V4h2zm-1 16h4v3h-4z"/></svg>',

const UNITS = ['', '만', '억', '조', '경', '해', '자', '양', '구', '간', '정', '재', '극'];
function fmt(n){
  if (!isFinite(n)) return '∞';
  n = Math.floor(Math.max(0, n));
  if (n < 10000) return n.toLocaleString('ko-KR');
  const u = Math.floor(Math.log10(n) / 4);
  if (u >= UNITS.length) return n.toExponential(2);
  const v = n / Math.pow(10000, u);
  let s = v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v).toLocaleString('ko-KR');
  if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s + UNITS[u];
}
function fmtTime(sec){
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  if (h) return `${h}시간 ${m}분`;
  if (m) return `${m}분 ${s}초`;
  return `${s}초`;
}
function josa(word, a, b){
  const c = word.charCodeAt(word.length - 1);
  if (c < 0xac00 || c > 0xd7a3) return b;
  return (c - 0xac00) % 28 ? a : b;
}

function mergeState(d){
  const out = Object.assign(defaultState(), d);
  const base = defaultState();
  out.up = Object.assign(base.up, d.up || {});
  out.skills = Object.assign(base.skills, d.skills || {});
  out.rec = Object.assign(base.rec, d.rec || {});
  out.equip = Object.assign(base.equip, d.equip || {});
  // 새로 생긴 칸: 예전 저장에는 없으므로 기본값을 채운다
  out.name = typeof d.name === 'string' ? d.name.slice(0, 8) : '';
  out.look = cleanLook(d.look);
  for (const k of ['weapon', 'armor']){
    const r = (d.refine && d.refine[k]) || {};
    out.refine[k] = {lv:Math.min(REFINE_MAX, Math.max(0, Math.floor(+r.lv) || 0)), fails:Math.max(0, Math.floor(+r.fails) || 0), energy:Math.min(100, Math.max(0, +r.energy || 0))};
  }
  const pd = d.pets || {};

const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const dirOf = (dx, dy) => Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
const inMap = (x, y) => x >= 0 && x < COLS && y >= TOPR && y < ROWS;
function occupied(x, y, self){
  if (self !== hero && !hero.dead && ((hero.tx === x && hero.ty === y) || (hero.moving && hero.fx === x && hero.fy === y))) return true;
  if (raid) for (const a of raid.allies) if (a.tx === x && a.ty === y) return true;
  for (const m of mobs){
    if (m === self || m.dead) continue;
    if ((m.tx === x && m.ty === y) || (m.moving && m.fx === x && m.fy === y)) return true;
  }
  return false;
}
const tileFree = (x, y, self) => inMap(x, y) && !occupied(x, y, self);
function startMove(e, nx, ny, dur){
  e.fx = e.tx; e.fy = e.ty; e.tx = nx; e.ty = ny; e.mt = 0; e.moving = true; e.stepDur = dur;
  e.dir = dirOf(nx - e.fx, ny - e.fy);
}
function updateMove(e, dt){
  if (!e.moving) return;
  e.mt += dt / e.stepDur;
  if (e.mt >= 1){ e.mt = 0; e.moving = false; e.fx = e.tx; e.fy = e.ty; }
}
function placeOf(e){
  const k = e.moving ? e.mt : 1;
  const tx = e.moving ? e.fx + (e.tx - e.fx) * k : e.tx, ty = e.moving ? e.fy + (e.ty - e.fy) * k : e.ty;
  e.x = tx * T + T / 2; e.y = ty * T + T - 2;
}
function stepToward(e, gx, gy, dur){
  const dx = gx - e.tx, dy = gy - e.ty, opts = [];
  if (Math.abs(dx) >= Math.abs(dy)){ if (dx) opts.push([Math.sign(dx), 0]); if (dy) opts.push([0, Math.sign(dy)]); }
  else { if (dy) opts.push([0, Math.sign(dy)]); if (dx) opts.push([Math.sign(dx), 0]); }
  for (const [ox, oy] of opts){ if (tileFree(e.tx + ox, e.ty + oy, e)){ startMove(e, e.tx + ox, e.ty + oy, dur); return true; } }
  if (Math.random() < 0.35){
    const side = DIRS.filter(([ox, oy]) => !opts.some(o => o[0] === ox && o[1] === oy) && tileFree(e.tx + ox, e.ty + oy, e));
    if (side.length){ const [ox, oy] = side[(Math.random() * side.length) | 0]; startMove(e, e.tx + ox, e.ty + oy, dur); return true; }
  }
  return false;
}
function randomStep(e, dur){
  const opts = DIRS.filter(([ox, oy]) => tileFree(e.tx + ox, e.ty + oy, e));
  if (!opts.length) return;
  const [ox, oy] = opts[(Math.random() * opts.length) | 0];
  startMove(e, e.tx + ox, e.ty + oy, dur);
}

  const R = raid, B = R.boss;
  if (R.ending){ R.endT -= dt; if (R.endT <= 0) finishRaid(); return; }
  R.time -= dt;
  if (R.time <= 0){ raidEnd(false); return; }
  for (const a of R.allies){
    a.swing = Math.max(0, a.swing - dt); a.hurt = Math.max(0, a.hurt - dt);
    if (a.down){
      a.downT -= dt;
      if (a.downT <= 0){ a.down = false; a.hp = a.maxHp * 0.5; fx.push({type:'poof', t:0, dur:0.4, x:a.x, y:a.y - 8}); }
      continue;
    }
    a.hp = Math.min(a.maxHp, a.hp + a.maxHp * 0.01 * dt);
    if (B.dead || B.spawnT > 0) continue;
    a.dir = dirOf(B.tx - a.tx, B.ty - a.ty);
    a.atkT -= dt * a.aspd;
    if (a.atkT <= 0){ a.atkT = 1; allyAttack(a, B); }
    if (a.cls === 'doin'){ a.healT -= dt; if (a.healT <= 0){ a.healT = 4; healParty(a); } }
  }
  if (B.dead || B.spawnT > 0) return;
  B.atkT -= dt;

    B.atkT = 1.6;

      B.dir = tg.x > B.x ? 'right' : 'left'; B.lunge = 0.2;
      fx.push({type:'hit', t:0, dur:0.2, x:tg.x, y:tg.y - 12});
      if (tg === hero) damageHero(B.atk); else damageAlly(tg, B.atk);

  }
  B.aoeT -= dt;
  if (B.aoeT <= 0){
    B.aoeT = 7;
    fx.push({type:'ring', t:0, dur:0.6, x:B.x, y:B.y - 4, color:'#ff7a4a', r:90});

}

function raidReward(info){

  items.push({slot:Math.random() < 0.5 ? 'weapon' : 'armor', it:info.g * 4 + roll()});
  if (first) items.push({slot:Math.random() < 0.5 ? 'weapon' : 'armor', it:Math.min(3, info.g + 1) * 4 + roll()});

/* ================= 펫 움직임 ================= */
const petRt = {atk:{x:0, y:0, atkT:1, lunge:0, init:false}, def:{x:0, y:0, glow:0, init:false}, sup:{x:0, y:0, healT:3, init:false}};
const PET_OFF = {atk:[-13, -3], def:[13, 1], sup:[-5, 7]};
const PET_FLY = {hawk:1, crow:1, magpie:1, phoenix:1};
function updatePets(dt){
  const side = hero.dir === 'left' ? -1 : 1;
  for (const t of PET_TYPE_ORDER){
    const r = petRt[t];
    if (eqPet(t) < 0){ r.init = false; continue; }
    const gx = Math.max(6, Math.min(W - 6, hero.x + PET_OFF[t][0] * side)), gy = Math.max(2 * T + 10, Math.min(H - 2, hero.y + PET_OFF[t][1]));
    if (!r.init){ r.x = gx; r.y = gy; r.init = true; }
    const k = Math.min(1, dt * 5);
    r.x += (gx - r.x) * k; r.y += (gy - r.y) * k;
    r.lunge = Math.max(0, (r.lunge || 0) - dt); r.glow = Math.max(0, (r.glow || 0) - dt);
    if (r.lunge > 0 && r.lx != null) r.faceRight = r.lx > r.x;
    else if (hero.dir === 'right') r.faceRight = true;
    else if (hero.dir === 'left') r.faceRight = false;
  }
  if (hero.dead) return;
  const ai = eqPet('atk');
  if (ai >= 0){
    const r = petRt.atk;
    r.atkT -= dt;
    if (r.atkT <= 0){
      const tg = hero.target && !hero.target.dead && hero.target.spawnT <= 0 ? hero.target : nearestMob();
      if (tg && Math.hypot(tg.x - hero.x, tg.y - hero.y) < 100){
        r.atkT = 1.5; r.lunge = 0.25; r.lx = tg.x; r.ly = tg.y - 3;
        const e = petInfo(ai), dmg = ST.atk * atkBuff() * e.pct / 100;
        fx.push({type:'claw', t:0, dur:0.25, x:tg.x, y:tg.y - mobHeight(tg) * 0.5, color:PETS[ai].c});
        if (e.splash){ for (const m of mobs) if (!m.dead && m.spawnT <= 0 && Math.hypot(m.x - tg.x, m.y - tg.y) <= 30) hit(m, dmg, 'pet'); }
        else hit(tg, dmg, 'pet');
      } else r.atkT = 0.3;
    }
  }
  const si = eqPet('sup');
  if (si >= 0){
    const r = petRt.sup;
    r.healT -= dt;
    if (r.healT <= 0){
      r.healT = 5;
      if (hero.hp < ST.maxHp){
        const h = ST.maxHp * petInfo(si).heal / 100;
        hero.hp = Math.min(ST.maxHp, hero.hp + h);
        addText('+' + fmt(h), hero.x, hero.y - 34, '#8ff0a0', 11);
        fx.push({type:'heal', t:0, dur:0.7});
      }
    }
  }
}
function attack(tg){
  const C = cls();
  hero.swing = 0.2; hero.atkT = 1;
  if (!C.proj){
    fx.push({type:'slash', t:0, dur:0.16, x:hero.x, y:hero.y - 8, dir:hero.dir, color:C.fx});

function tryCast(i, lv){
  const C = cls();
  const alive = mobs.filter(m => !m.dead && m.spawnT <= 0);
  if (!alive.length || !hero.engaged) return false;
  const mul = C.skillMul * atkBuff() * (1 + S.myth.flute / 100);
  const tg = hero.target && !hero.target.dead ? hero.target : alive[0];
  if (i === 0){
    const cx = C.range > 1 ? tg.x : hero.x, cy = C.range > 1 ? tg.y : hero.y;
    const hits = alive.filter(m => Math.hypot(m.x - cx, m.y - cy) <= 34);
    if (!hits.length) return false;
    fx.push({type:'ring', t:0, dur:0.4, x:cx, y:cy - 6, color:C.fx});
    for (const m of hits) hit(m, ST.atk * mul * spinPct(lv) / 100, 'skill');
    return true;
  }
  if (i === 1){
    const t2 = alive.reduce((a, b) => b.hp > a.hp ? b : a);
    fx.push({type:C.boltFx, t:0, dur:0.4, x:t2.x, y:t2.y - mobHeight(t2) * 0.5, seed:Math.random() * 1000});
    shake = 0.15;
    hit(t2, ST.atk * mul * boltPct(lv) / 100, 'skill');
    return true;
  }
  if (i === 2){
    hero.buffT = 8; hero.buffLv = lv;
    fx.push({type:'aura', t:0, dur:0.9, color:C.fx});
    if (S.cls === 'doin'){
      const h = ST.maxHp * 0.3;
      hero.hp = Math.min(ST.maxHp, hero.hp + h);
      addText('+' + fmt(h), hero.x, hero.y - 34, '#8ff0a0', 12);
      fx.push({type:'heal', t:0, dur:0.9});
    }
    return true;
  }
  fx.push({type:C.nukeFx, t:0, dur:0.8, pts:alive.slice(0, 6).map(m => [m.x, m.y - 6]), seed:Math.random() * 1000});
  shake = 0.3;
  for (const m of alive) hit(m, ST.atk * mul * meteorPct(lv) / 100, 'skill');
  return true;
}
function nearestMob(){
  let best = null, bd = 1e9;
  for (const m of mobs){
    if (m.dead || m.spawnT > 0) continue;
    const d = Math.abs(m.tx - hero.tx) + Math.abs(m.ty - hero.ty) + (m.boss ? -0.5 : 0);
    if (d < bd){ bd = d; best = m; }
  }
  return best;
}

function update(dt){
  gtime += dt; S.rec.play += dt;
  for (const e of fx) e.t += dt;
  fx = fx.filter(e => e.t < e.dur);
  for (const p of parts){
    p.t += dt;
    if (p.type === 'coin'){ p.vy += 300 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.y > p.gy){ p.y = p.gy; p.vy *= -0.35; p.vx *= 0.5; } }
    else { p.x += p.vx * dt; p.y += p.vy * dt; }
  }
  parts = parts.filter(p => p.t < p.dur);
  for (const t of texts){ t.t += dt; t.y -= 18 * dt; }
  texts = texts.filter(t => t.t < t.dur);
  shake = Math.max(0, shake - dt);
  hero.swing = Math.max(0, hero.swing - dt);
  hero.hurt = Math.max(0, hero.hurt - dt);
  if (hero.buffT > 0) hero.buffT -= dt;

  // 레이드 / 보스·소환
  if (raid) updateRaid(dt);
  else if (bossActive){
    bossTime -= dt;
    if (bossTime <= 0) bossFail('시간 초과');
  } else if (!hero.dead){
    if (S.kills >= KILLS_PER_STAGE && S.autoBoss) startBoss();
    else {
      spawnT -= dt;
      if (spawnT <= 0){
        if (aliveMobs().length < maxField()){
          const spot = spawnTile(4) || spawnTile(2);
          if (spot){ const m = makeMob(false, spot[0], spot[1]); mobs.push(m); fx.push({type:'poof', t:0, dur:0.4, x:m.x, y:m.y - 6}); }
        }
        spawnT = 0.6 + Math.random() * 0.5;
      }
    }
  }

  // 용사
  if (hero.dead){ hero.deadT -= dt; if (hero.deadT <= 0) respawn(); }
  else {
    hero.hp = Math.min(ST.maxHp, hero.hp + ST.maxHp * ST.regen * dt);
    autoPotion(dt);
    updateMove(hero, dt);
    hero.atkT = Math.max(0, hero.atkT - dt * ST.aspd * spdBuff());
    if (!hero.moving){
      let tg = hero.target;
      if (!tg || tg.dead || tg.spawnT > 0) tg = hero.target = nearestMob();
      if (tg){
        hero.idleT = 0;
        const dx = tg.tx - hero.tx, dy = tg.ty - hero.ty, C = cls();
        const inRange = C.range === 1 ? Math.abs(dx) + Math.abs(dy) === 1 : Math.hypot(dx, dy) <= C.range + 0.01;
        if (inRange){
          hero.engaged = true;
          if (dx || dy) hero.dir = dirOf(dx, dy);
          if (hero.atkT <= 0) attack(tg);
        } else {
          hero.engaged = false;
          if (!stepToward(hero, tg.tx, tg.ty, STEP_HERO)){
            const other = nearestOther(tg);
            if (other) hero.target = other;
          }
        }
      } else {
        hero.engaged = false;
        hero.idleT += dt;
        if (hero.idleT > 1.2){ hero.idleT = 0; randomStep(hero, STEP_HERO * 1.5); }
      }
    }
  }
  placeOf(hero);
  updatePets(dt);

  // 몬스터
  for (const m of mobs){
    m.anim += dt;
    if (m.dead){ m.deathT -= dt; continue; }
    if (m.spawnT > 0){ m.spawnT -= dt; placeOf(m); continue; }
    m.flash = Math.max(0, m.flash - dt); m.lunge = Math.max(0, m.lunge - dt);
    if (m.raid){ placeOf(m); continue; }   // 레이드 보스는 updateRaid가 움직인다
    updateMove(m, dt);
    if (!m.moving){
      const dx = hero.tx - m.tx, dy = hero.ty - m.ty, man = Math.abs(dx) + Math.abs(dy);
      const aggro = !hero.dead && (m.boss || m.aggro || man <= 5);
      if (aggro && man === 1){
        m.dir = dirOf(dx, dy);
        m.atkT -= dt;
        if (m.atkT <= 0){ m.atkT = m.boss ? 1.5 : 1.3; m.lunge = 0.2; damageHero(m.atk); }
      } else {
        m.thinkT -= dt;
        if (m.thinkT <= 0){
          if (aggro){ m.thinkT = 0.08; stepToward(m, hero.tx, hero.ty, m.stepDur); }
          else { m.thinkT = 1 + Math.random() * 1.6; randomStep(m, m.stepDur * 1.4); }
        }
      }
    }
    placeOf(m);
    if (hero.dead) break;
  }
  mobs = mobs.filter(m => !m.dead || m.deathT > 0);

  // 투사체
  for (const p of projs){
    const tg = p.tg;
    if (!tg || tg.dead){ p.done = true; continue; }
    const tx = tg.x, ty = tg.y - mobHeight(tg) * 0.5;
    const d = Math.hypot(tx - p.x, ty - p.y), sp = 190 * dt;
    p.trail.push([p.x, p.y]); if (p.trail.length > 4) p.trail.shift();
    if (d <= sp + 2){ p.done = true; hit(tg, p.dmg != null ? p.dmg : ST.atk * atkBuff(), p.hk || 'basic'); }
    else { p.x += (tx - p.x) / d * sp; p.y += (ty - p.y) / d * sp; }
  }
  projs = projs.filter(p => !p.done);

  // 기술
  if (!hero.dead){
    SKILLS.forEach((sk, i) => {
      const lv = S.skills[sk.key];
      if (!lv) return;
      skillCd[sk.key] = Math.max(0, skillCd[sk.key] - dt);
      if (skillCd[sk.key] <= 0 && tryCast(i, lv)) skillCd[sk.key] = sk.cd;
    });
  }
}
function nearestOther(not){
  let best = null, bd = 1e9;
  for (const m of mobs){
    if (m === not || m.dead || m.spawnT > 0) continue;
    const d = Math.abs(m.tx - hero.tx) + Math.abs(m.ty - hero.ty);
    if (d < bd){ bd = d; best = m; }
  }
  return best;
}

function mix(a, b, t){
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(((pa >> 16) & 255) * (1 - t) + ((pb >> 16) & 255) * t);
  const g = Math.round(((pa >> 8) & 255) * (1 - t) + ((pb >> 8) & 255) * t);
  const bl = Math.round((pa & 255) * (1 - t) + (pb & 255) * t);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}
const darken = (c, f) => mix(c, '#000000', f);
const EYE = '#1b1420';
let SKIN = SKINS[0], SKIN_D = '#d9a47a', HAIR = HAIRS[0];   // drawHero가 꾸미기에 맞춰 바꾼다
let G = null;
const R = (x, y, w, h, c) => { G.fillStyle = c; G.fillRect(x, y, w, h); };

function buildSprite(w, h, draw, outline){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  G = c.getContext('2d'); draw();
  const o = document.createElement('canvas'); o.width = w + 2; o.height = h + 2;
  const og = o.getContext('2d');
  const s = document.createElement('canvas'); s.width = w; s.height = h;
  const sg = s.getContext('2d'); sg.drawImage(c, 0, 0); sg.globalCompositeOperation = 'source-in'; sg.fillStyle = outline || '#1a1218'; sg.fillRect(0, 0, w, h);
  for (const [dx, dy] of [[0, 1], [2, 1], [1, 0], [1, 2]]) og.drawImage(s, dx, dy);
  og.drawImage(c, 1, 1);
  return o;
}
function whiteOf(src){
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const g = c.getContext('2d'); g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
  return c;
}

/* ================= 채팅 =================

function addChat(kind, name, text){

  if (!chatOpen && kind !== 'me') chatUnread++;
  const ul = document.getElementById('chatList');
  if (ul){
    const li = document.createElement('li');
    li.className = 'cm ' + kind;
    const b = document.createElement('b'); b.textContent = kind === 'sys' ? '[알림]' : name;
    li.appendChild(b); li.appendChild(document.createTextNode(' ' + text));
    const atEnd = ul.scrollTop + ul.clientHeight >= ul.scrollHeight - 30;

  // 주민이 가끔 대꾸한다
  const rule = NPC_REPLY.find(([re]) => re.test(text));
  if (rule || Math.random() < 0.35){
    const lines = rule ? rule[1] : ['그렇군요!', '오, 정말요?', '용사님 말이 맞아요.', '같이 힘내요!'];
    const who = VILLAGERS[(Math.random() * VILLAGERS.length) | 0], line = lines[(Math.random() * lines.length) | 0];

  npcT = 35 + Math.random() * 45;
  const reg = REGION_LINES[REGIONS[regionIndex(S.stage)].theme] || [];
  const pool = Math.random() < 0.4 && reg.length ? reg : NPC_LINES;
  addChat('npc', VILLAGERS[(Math.random() * (VILLAGERS.length - 1)) | 0], pool[(Math.random() * pool.length) | 0]);
}
async function bootRoom(){
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  try {
    const r = await c.use('room');
    if (!r) return;
    r.on('chat', msg => {
      if (!msg || msg.sameTab) return;
      const d = msg.data && typeof msg.data === 'object' ? msg.data : {};
      const text = cleanChat(typeof d.t === 'string' ? d.t : '');
      if (!text) return;
      const name = cleanChat(typeof d.n === 'string' ? d.n : '').slice(0, 8) || '나그네';
      addChat('player', name + (msg.guest ? '(손님)' : msg.isMe ? '(내 다른 창)' : ''), text);
    }, () => { room = null; });
    r.onPeers(ch => { roomPeers = ch.peers.length; }, () => {});
    room = r;
  } catch (e) { room = null; }
}

let modalOpen = false;
function showModal(title, html, buttons, onBuilt){
  $('#mTitle').textContent = title;
  $('#mBody').innerHTML = html;
  const bx = $('#mBtns'); bx.innerHTML = '';
  buttons.forEach((bt, i) => {
    const el = document.createElement('button');
    el.className = 'btn' + (bt.primary ? ' primary' : '') + (bt.danger ? ' danger' : '');
    el.id = 'modal-btn-' + i; el.textContent = bt.label; el.disabled = !!bt.disabled;
    el.addEventListener('click', () => { if (bt.keep && bt.keep()) return; hideModal(); if (bt.fn) bt.fn(); });
    bx.appendChild(el);
  });
  $('#modal').hidden = false; modalOpen = true;
  $('.sheet').scrollTop = 0;
  if (onBuilt) onBuilt();

function hideModal(){ $('#modal').hidden = true; modalOpen = false; }
function holdButton(btn, fn){
  let t1 = null, t2 = null;
  const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };
  btn.addEventListener('pointerdown', e => {
    if (btn.disabled || e.button > 0) return;
    if (!fn()) return;
    t1 = setTimeout(() => { t2 = setInterval(() => { if (!fn()) stop(); }, 85); }, 380);
  });
  ['pointerup', 'pointerleave', 'pointercancel', 'blur'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('click', e => { if (e.detail === 0) fn(); });
  btn.addEventListener('contextmenu', e => e.preventDefault());
}

      <p class="rres" data-r="res"></p>

    </div>`;
  };
  panel.innerHTML = `${gearSegHTML()}
    <p class="hint" style="margin-top:8px">엽전과 보석으로 무기·방어구를 벼려요. 실패할 때마다 다음 성공 확률이 조금씩 오르고(최대 2배), 담금질 기운이 쌓여요.</p>
    <label class="whet card"><input type="checkbox" id="whetChk" ${S.useWhet ? 'checked' : ''}><span id="whetTxt"></span></label>
    ${card('weapon')}${card('armor')}
    <p class="rtable">기본 확률: ${REFINE_RATE.map((r, i) => `+${i + 1} ${r}%`).join(' · ')}</p>`;
  wireGearSeg();
  $('#whetChk').addEventListener('change', e => { S.useWhet = e.target.checked; refreshPanel(); });
  const refs = ['weapon', 'armor'].map(slot => {
    const el = $('#rf-' + slot), q = k => el.querySelector(`[data-r=${k}]`);
    const r = {slot, lv:q('lv'), eff:q('eff'), rate:q('rate'), en:q('en'), bar:q('bar'), res:q('res'), btn:q('btn'), g:q('g'), m:q('m')};
    r.btn.addEventListener('click', () => {
      const out = refineTry(slot);
      if (!out) return;
      const name = slot === 'weapon' ? cls().weapon : cls().armor;
      refineMsg[slot] = out.ok ? {ok:true, t:`성공! ${name} +${out.lv}${out.sure ? ' (담금질 기운)' : ''}`} : {ok:false, t:`실패… 다음 확률이 오르고 기운이 쌓였어요`};
      addLog(out.ok ? `재련 성공! ${name} +${out.lv}` : `재련 실패 (${name} +${out.lv + 1} 시도)`, out.ok ? 'gain' : 'warn');
      if (out.ok){ fx.push({type:'level', t:0, dur:0.6}); addText(`+${out.lv}`, hero.x, hero.y - 34, '#ffd96a', 14, true); }
      r.res.classList.remove('pop'); void r.res.offsetWidth; r.res.classList.add('pop');
      refreshPanel();
    });
    return r;
  });
  return () => {
    setText($('#whetTxt'), `숫돌 함께 쓰기 (가진 숫돌 ${S.inv.whet}개${S.inv.whet ? '' : ' · 상점에서 살 수 있어요'})`);
    $('#whetChk').disabled = !S.inv.whet && !S.useWhet;
    for (const r of refs){
      const R2 = S.refine[r.slot], stat = r.slot === 'weapon' ? '공격력' : '체력', max = R2.lv >= REFINE_MAX;
      setText(r.lv, '+' + R2.lv);
      setHTML(r.eff, max ? `${stat} +${refinePct(R2.lv)}% (최고 단계)` : `${stat} +${refinePct(R2.lv)}% → <em>+${refinePct(R2.lv + 1)}%</em>`);
      if (max){ setText(r.rate, '-'); setText(r.en, '-'); r.bar.style.width = '0'; setHTML(r.g, '최고'); setHTML(r.m, ''); r.btn.disabled = true; }
      else {
        const base = REFINE_RATE[R2.lv], rate = refineRate(r.slot), noW = refineRate(r.slot, true);
        const parts = [`${base}%`];
        if (noW > base) parts.push(`실패 보너스 ${(noW - base).toFixed(1)}%`);
        if (rate > noW) parts.push(`숫돌 ${(rate - noW).toFixed(1)}%`);
        setText(r.rate, R2.energy >= 100 ? '100% (기운 가득)' : parts.length > 1 ? `${parts.join(' + ')} = ${rate.toFixed(1)}%` : `${base}%`);
        setText(r.en, R2.energy.toFixed(1) + '%');
        r.bar.style.width = R2.energy.toFixed(1) + '%';
        const g = refineGold(R2.lv), m = refineGems(R2.lv);
        setHTML(r.g, fmt(g)); setHTML(r.m, fmt(m));
        r.btn.disabled = S.gold < g || S.gems < m;
      }
      const msg = refineMsg[r.slot];
      setText(r.res, msg ? msg.t : '');
      r.res.classList.toggle('ok', !!(msg && msg.ok)); r.res.classList.toggle('no', !!(msg && !msg.ok));
    }
  };
}

function doPetSummon(n){
  const res = petSummon(n);
  if (!res){ addLog('보석이 부족합니다.', 'warn'); return; }

  const lab = {new:'NEW', star:'★+1', gem:'보석'};
  const html = `<div class="res-grid">${res.map((r, k) => {
      const p = PETS[r.i];
      return `<div class="res${p.g >= 3 ? ' legend' : ''}" style="--g:${GRADES[p.g].color};--i:${k}" title="${p.name}"><img src="${petImg(r.i)}" alt="${p.name}"><span class="new${r.kind === 'star' ? ' star' : r.kind === 'gem' ? ' gem2' : ''}">${lab[r.kind]}</span></div>`;
    }).join('')}</div>
    <p class="small" style="margin-top:10px">${res.map(r => PETS[r.i].name).filter((v, k, a) => a.indexOf(v) === k).join(', ')}${josa(PETS[res[res.length - 1].i].name, '이', '가')} 나왔어요. 같은 펫은 별이 오르고, 별이 가득하면 보석 ${PET_DUP_GEMS}개로 돌려받아요.</p>`;
  const cost = petSummonCost(n);
  showModal('펫 소환 결과', html, [
    {label:`${n}회 더 (보석 ${cost})`, disabled:S.gems < cost, fn:() => doPetSummon(n)},

  ]);
}

function partyLine(m){ return `${esc(m.name)}(${CLASSES[m.cls].name}${m.npc ? '·NPC' : '·내 캐릭터'})`; }
function buildRaid(){
  const open = raidUnlocked(), n = Math.max(3, open + 2);
  const cards = [];
  for (let i = 0; i < n; i++){
    const info = raidInfo(i), locked = i >= open;
    cards.push(`<div class="card${locked ? ' locked' : ''}" id="raid-${i}">
      <div class="ct">${info.label}<span class="tag">Lv.${info.req} · ${info.party}인 파티</span></div>
      <div class="dl"><span>보스</span><b>${info.bossName}</b></div>
      <div class="dl"><span>보상</span><b>보석 ${info.gems} · 엽전 · ${GRADES[info.g].name} 장비</b></div>
      ${S.raid.first[i] ? '' : `<div class="dl"><span>첫 클리어</span><b style="color:var(--seal)">보석 +${info.firstGems} · ${GRADES[Math.min(3, info.g + 1)].name} 장비 1개 더</b></div>`}
      <button class="btn primary" data-i="${i}"></button>
    </div>`);
  }
  panel.innerHTML = `
    <div class="ph"><h2>레이드</h2><span class="small" id="tkInfo"></span></div>
    <p class="hint">레벨 10마다 새 레이드가 열려요. 나와 이 기기의 다른 캐릭터, NPC 동료가 함께 자동으로 싸워요. ${RAID_TIME}초 안에 보스를 쓰러뜨리면 성공! 깨면 토벌패 1개를 쓰고(최대 ${TICKET_MAX}개, ${TICKET_REGEN / 60000}분마다 1개 충전), 실패하면 돌려받아요.</p>
    <div id="raidLive"></div>
    ${cards.join('')}`;
  panel.querySelectorAll('.card .btn').forEach(bt => bt.addEventListener('click', () => confirmRaid(+bt.dataset.i)));
  return () => {
    const live = $('#raidLive');
    if (raid){
      const rows = [`<div><span>${esc(S.name || '나')} (나·${cls().name})</span><div class="meter"><i style="width:${(hero.hp / ST.maxHp * 100).toFixed(1)}%"></i></div></div>`]
        .concat(raid.allies.map(a => `<div><span class="${a.down ? 'down' : ''}">${esc(a.name)}${a.down ? ' (쓰러짐)' : ''}</span><div class="meter"><i style="width:${(a.hp / a.maxHp * 100).toFixed(1)}%"></i></div></div>`));
      setHTML(live, `<div class="card ready"><div class="ct">토벌 중 · ${raid.info.label}<span class="tag">${Math.max(0, Math.ceil(raid.time))}초 남음</span></div>
        <div class="dl"><span>${raid.info.bossName}</span><b>${Math.max(0, raid.boss.hp / raid.boss.maxHp * 100).toFixed(1)}%</b></div>
        <div class="meter fire"><i style="width:${Math.max(0, raid.boss.hp / raid.boss.maxHp * 100).toFixed(1)}%"></i></div>
        <div class="party">${rows.join('')}</div></div>`);
    } else setHTML(live, '');
    const tk = raidTickets(), left = ticketLeft();
    setText($('#tkInfo'), `토벌패 ${'■'.repeat(tk)}${'□'.repeat(TICKET_MAX - tk)} ${tk}/${TICKET_MAX}${left ? ` · ${fmtTime(left / 1000)} 뒤 충전` : ''}`);
    panel.querySelectorAll('.card .btn').forEach(bt => {
      const i = +bt.dataset.i, info = raidInfo(i);
      let t, dis = true;
      if (i >= raidUnlocked()) t = `Lv.${info.req}에 열려요`;
      else if (raid) t = raid.info.i === i ? '토벌 중' : '다른 토벌 중';
      else if (tk <= 0) t = `토벌패 충전까지 ${fmtTime(left / 1000)}`;
      else { t = '입장 (토벌패 1개)'; dis = false; }
      setText(bt, t); bt.disabled = dis;
      $('#raid-' + i).classList.toggle('ready', !dis);
    });
  };
}
function confirmRaid(i){
  if (!raidReady(i) || raid) return;
  const info = raidInfo(i), party = raidParty(info);
  const own = party.filter(m => m.own).length;
  showModal(`${info.label} 토벌`, `
    <p><b>${info.bossName}</b>${josa(info.bossName, '이', '가')} 기다려요. ${info.party}인 파티로 자동 전투를 해요.</p>
    <ol class="plist"><li><b>${esc(S.name || '나')}</b> (나·${cls().name} Lv.${S.level})</li>${party.map(m => `<li>${partyLine(m)}</li>`).join('')}</ol>
    <p class="small" style="margin-top:8px">${own ? `이 기기의 다른 캐릭터 ${own}명이 함께해요. ` : ''}NPC 동료의 힘은 내 용사에 맞춰져요. 무사는 보스의 공격을 받아 주고, 도인은 파티를 치유해요. 깨면 토벌패 1개를 써요(지금 ${raidTickets()}개).</p>`,
    [{label:'취소'}, {label:'출발', primary:true, fn:() => { if (startRaid(i)) buildTab('raid'); }}]);
}

const prevCache = new Map();
function lookPreview(c, look, aG, wG, dir = 'down'){
  look = cleanLook(look);
  const key = [c, look.outfit, look.hair, look.hat, look.skin, aG, wG, dir].join('|');
  let u = prevCache.get(key);
  if (!u){
    const sp = personSprite(c, look, aG, wG, dir, 0, false);
    if (dir === 'left'){
      const cc = document.createElement('canvas'); cc.width = sp.width; cc.height = sp.height;
      const g = cc.getContext('2d'); g.translate(sp.width, 0); g.scale(-1, 1); g.drawImage(sp, 0, 0);
      u = cc.toDataURL();
    } else u = sp.toDataURL();
    if (prevCache.size > 200) prevCache.clear();
    prevCache.set(key, u);
  }
  return u;
}

/* ================= 계정 =================
   서버가 없는 정적 페이지라 계정은 이 기기(브라우저)에 저장한다. 비밀번호는 그대로 두지 않고 소금(salt)을 쳐서 해시로만 남긴다.
   claude.ai 아티팩트로 열면 Claude 계정의 개인 저장소(data/users/<id>/)에도 같이 올려서 다른 기기에서 이어진다. */
const ID_RE = /^[a-z0-9_]{4,12}$/;
const NAME_RE = /^[가-힣a-zA-Z0-9]{2,8}$/;
let REG = null, curAcc = null, regDirty = false, modalLock = false, loginBusy = false;
const emptyReg = () => ({v:1, accounts:{}, keep:null, legacyClaimed:false, t:0});
function loadReg(){
  try {
    const d = JSON.parse(localStorage.getItem(ACC_KEY) || 'null');
    if (d && d.v === 1 && d.accounts && typeof d.accounts === 'object'){
      const r = Object.assign(emptyReg(), d);
      for (const A of Object.values(r.accounts)) if (!Array.isArray(A.chars)) A.chars = [];
      return r;
    }
  } catch (e) {}
  return emptyReg();
}
function saveReg(){
  REG.t = now(); regDirty = true;
  try { localStorage.setItem(ACC_KEY, JSON.stringify(REG)); } catch (e) {}
}
function writeSession(o){ try { if (o) sessionStorage.setItem(SESSION_KEY, JSON.stringify(o)); else sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
function readSession(){ try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; } }
function randHex(n){
  const a = new Uint8Array(n);
  try { crypto.getRandomValues(a); } catch (e) { for (let i = 0; i < n; i++) a[i] = Math.random() * 256 | 0; }
  return Array.from(a, x => x.toString(16).padStart(2, '0')).join('');
}
async function hashPw(pw, salt, alg){
  if (alg !== 'f'){
    try {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:enc.encode(salt), iterations:60000, hash:'SHA-256'}, key, 256);
      return 'p:' + Array.from(new Uint8Array(bits), x => x.toString(16).padStart(2, '0')).join('');
    } catch (e) { if (alg === 'p') return null; }
  }
  // 아주 오래된 브라우저용 예비 해시
  let h1 = 0x9e3779b9, h2 = 0x85ebca6b;
  const s = salt + ':' + pw;
  for (let r = 0; r < 3000; r++) for (let i = 0; i < s.length; i++){
    const c = s.charCodeAt(i) + r;
    h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); h1 ^= h2 >>> 15; h2 ^= h1 >>> 13;
  }
  return 'f:' + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}
const allChars = () => Object.entries(REG.accounts).flatMap(([acc, A]) => (A.chars || []).map(c => Object.assign({acc}, c)));
let cloudLegacy = null;
// 계정이 생기기 전에 하던 모험(예전 저장)을 찾는다
function legacyCandidate(){
  if (REG.legacyClaimed) return null;
  let best = null;
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (d && d.v === 1 && d.chosen) best = {data:d, t:d.lastSave || 0}; } catch (e) {}
  if (cloudLegacy && cloudLegacy.t > (best ? best.t : -1)) best = cloudLegacy;
  return best && {data:best.data, level:Math.floor(best.data.level) || 1, stage:Math.floor(best.data.maxStage) || 1};
}

    ${canInstall() ? '<button class="link" id="lg-install">휴대폰 홈 화면에 앱으로 설치하기</button>' : ''}`;
  showModal('삼한 용사 키우기', html, [{label:signup ? '계정 만들기' : '로그인', primary:true, keep:() => { submitLogin(signup); return true; }}], () => {
    $('#lg-tab-login').addEventListener('click', () => showLogin('login'));
    $('#lg-tab-signup').addEventListener('click', () => showLogin('signup'));
    if ($('#lg-install')) $('#lg-install').addEventListener('click', () => { const m = signup ? 'signup' : 'login'; installAppThen(() => showLogin(m)); });
    enterSubmits();
  });
}
async function submitLogin(signup){
  if (loginBusy) return;
  const id = ($('#lg-id').value || '').trim().toLowerCase(), pw = $('#lg-pw').value || '', keep = $('#lg-keep').checked;
  const err = m => setText($('#lg-err'), m);
  if (!ID_RE.test(id)) return err('아이디는 영문 소문자·숫자·밑줄(_)로 4~12자예요.');
  if (pw.length < 4) return err('비밀번호는 4자 이상이에요.');
  if (signup){
    if (pw !== $('#lg-pw2').value) return err('비밀번호 확인이 서로 달라요.');
    if (REG.accounts[id]) return err('이미 있는 아이디예요. 다른 아이디를 쓰거나 로그인해 주세요.');
  } else if (!REG.accounts[id]) return err(cloud ? '없는 아이디예요. [새 계정 만들기]를 눌러 주세요.' : '이 기기에 없는 아이디예요. [새 계정 만들기]를 눌러 주세요.');
  loginBusy = true; err('');
  const btn = $('#mBtns .primary');
  if (btn){ btn.disabled = true; btn.textContent = '확인 중…'; }
  try {
    if (signup){
      const salt = randHex(16), hash = await hashPw(pw, salt);
      REG.accounts[id] = {salt, hash, created:now(), t:now(), chars:[]};
    } else {
      const A = REG.accounts[id], h = await hashPw(pw, A.salt, A.hash[0]);
      if (!h) return err('이 브라우저에서는 비밀번호를 확인할 수 없어요. 다른 브라우저로 열어 주세요.');
      if (h !== A.hash) return err('비밀번호가 맞지 않아요.');
    }
    curAcc = id;
    REG.keep = keep ? {acc:id} : null;
    saveReg(); writeSession({acc:id});
    showCharSelect(signup ? '계정을 만들었어요! 이제 캐릭터를 만들어 볼까요?' : '');
  } finally {
    loginBusy = false;
    if (btn && btn.isConnected){ btn.disabled = false; btn.textContent = signup ? '계정 만들기' : '로그인'; }
  }
}
function showCharSelect(msg){
  modalLock = true;
  const A = REG.accounts[curAcc];
  if (!A){ showLogin('login'); return; }
  let pick = A.chars.some(c => c.cid === A.lastChar) ? A.lastChar : A.chars.length ? A.chars[0].cid : null;
  const list = A.chars.map(ch => `<button class="char" data-cid="${esc(ch.cid)}" aria-pressed="${ch.cid === pick}">
      <img src="${lookPreview(ch.cls in CLASSES ? ch.cls : 'musa', ch.look, ch.armorG >= 0 ? ch.armorG : -1, ch.weaponG >= 0 ? ch.weaponG : -1)}" alt="">
      <span><b>${esc(ch.name)}</b><span>${(CLASSES[ch.cls] || CLASSES.musa).name} · Lv.${ch.level || 1} · 최고 ${ch.maxStage || 1}단계</span></span></button>`).join('');
  const html = `<p>아이디 <b>${esc(curAcc)}</b>로 들어왔어요. 함께할 캐릭터를 골라요. (한 계정에 ${MAX_CHARS}명까지)</p>
    <div class="chars">${list || '<p class="small">아직 캐릭터가 없어요. [새 캐릭터]를 눌러 만들어 주세요.</p>'}</div>
    <p class="err" role="alert" style="color:var(--jade)">${esc(msg || '')}</p>
    <div class="linkrow"><button class="link" id="cs-out">로그아웃</button>${A.chars.length ? '<button class="link danger" id="cs-del">고른 캐릭터 지우기</button>' : ''}</div>`;
  showModal('캐릭터 고르기', html, [
    {label:'새 캐릭터', disabled:A.chars.length >= MAX_CHARS, keep:() => { showCharCreate(); return true; }},
    {label:'시작하기', primary:true, disabled:!pick, keep:() => { if (pick) enterChar(pick); return true; }},
  ], () => {
    document.querySelectorAll('#mBody .char').forEach(card => {
      card.addEventListener('click', () => {
        pick = card.dataset.cid;
        document.querySelectorAll('#mBody .char').forEach(c2 => c2.setAttribute('aria-pressed', String(c2 === card)));
      });
      card.addEventListener('dblclick', () => enterChar(card.dataset.cid));
    });
    $('#cs-out').addEventListener('click', () => { curAcc = null; REG.keep = null; saveReg(); writeSession(null); showLogin('login'); });
    if ($('#cs-del')) $('#cs-del').addEventListener('click', () => { if (pick) confirmDeleteChar(pick); });
  });
}
function confirmDeleteChar(cid){
  const A = REG.accounts[curAcc], ch = A && A.chars.find(c => c.cid === cid);
  if (!ch) return;
  showModal('캐릭터를 지울까요?', `<p><b>${esc(ch.name)}</b> (Lv.${ch.level || 1})의 모든 기록이 사라져요. 되돌릴 수 없어요.</p>`, [
    {label:'취소', keep:() => { showCharSelect(); return true; }},
    {label:'지우기', danger:true, keep:() => {
      A.chars = A.chars.filter(c => c.cid !== cid); A.t = now(); saveReg();
      try { localStorage.removeItem(charKey(curAcc, cid)); } catch (e) {}
      if (cloud){ try { cdoc(cdocName(curAcc, cid)).delete().catch(() => {}); } catch (e) {} }
      showCharSelect(`${ch.name}${josa(ch.name, '을', '를')} 지웠어요.`);
      return true;
    }},
  ]);
}
function showCharCreate(){
  modalLock = true;
  const look = defaultLook(), lg = legacyCandidate();
  let pick = 'musa';
  const html = `
    <div class="form"><label>캐릭터 이름<input type="text" id="cc-name" maxlength="8" autocomplete="off" spellcheck="false" placeholder="한글·영문·숫자 2~8자"></label></div>
    <div class="opt-l">직업</div>
    ${classCardsHTML(pick)}
    <div class="opt-l">꾸미기</div>
    ${lookEditorHTML(look)}
    ${lg ? `<label class="check" style="margin-top:10px"><input type="checkbox" id="cc-legacy" checked>이 브라우저에 있던 예전 모험(Lv.${lg.level}, 최고 ${lg.stage}단계)을 이 캐릭터로 이어가기</label>` : ''}
    <p class="err" id="cc-err" role="alert"></p>`;
  showModal('새 캐릭터 만들기', html, [
    {label:'뒤로', keep:() => { showCharSelect(); return true; }},
    {label:'만들기', primary:true, keep:() => { createChar(pick, look); return true; }},
  ], () => {
    const upd = wireLookEditor(look, () => pick, [-1, -1]);
    wireClassCards(c => { pick = c; upd(); });
    enterSubmits();
  });
}
function createChar(c0, look){
  const err = m => setText($('#cc-err'), m);
  const name = ($('#cc-name').value || '').trim();
  if (!NAME_RE.test(name)) return err('이름은 한글·영문·숫자로 2~8자예요. 띄어쓰기와 기호는 쓸 수 없어요.');
  if (allChars().some(c => c.name === name)) return err('이 기기에 같은 이름의 캐릭터가 이미 있어요.');
  const A = REG.accounts[curAcc];
  if (!A){ showLogin('login'); return; }
  if (A.chars.length >= MAX_CHARS) return err(`캐릭터는 한 계정에 ${MAX_CHARS}명까지 만들 수 있어요.`);
  let st = defaultState(), imported = false;
  const box = $('#cc-legacy');
  if (box && box.checked){ const lg = legacyCandidate(); if (lg){ st = mergeState(lg.data); REG.legacyClaimed = true; imported = true; } }
  st.cls = c0; st.chosen = true; st.name = name; st.look = cleanLook(look); st.lastSave = now();
  const cid = 'c' + now().toString(36) + randHex(2);
  A.chars.push({cid, name, cls:c0, level:st.level, maxStage:st.maxStage, look:st.look, armorG:gradeOf(st.equip.armor), weaponG:gradeOf(st.equip.weapon), t:now()});
  A.t = now(); saveReg();
  try { localStorage.setItem(charKey(curAcc, cid), JSON.stringify(st)); } catch (e) {}
  enterChar(cid, {data:st, fresh:true, imported});
}
async function enterChar(cid, opts = {}){
  const acc = curAcc, A = REG.accounts[acc], ch = A && A.chars.find(c => c.cid === cid);
  if (!ch){ showCharSelect(); return; }
  let data = opts.data || null, t = data ? data.lastSave || 0 : 0;
  if (!data){
    try { const d = JSON.parse(localStorage.getItem(charKey(acc, cid)) || 'null'); if (d && d.v === 1){ data = d; t = d.lastSave || 0; } } catch (e) {}
    if (cloud){
      showModal('불러오는 중…', '<p>모험 기록을 불러오고 있어요.</p>', []);
      const c = await cloudGet(cdocName(acc, cid));
      if (c && typeof c.save === 'string' && (c.t || 0) > t + 2000){ try { const d = JSON.parse(c.save); if (d && d.v === 1){ data = d; t = c.t; } } catch (e) {} }
    }
  }
  S = data ? mergeState(data) : defaultState();
  if (!S.name) S.name = ch.name;
  if (!S.chosen){ S.chosen = true; S.cls = CLASSES[ch.cls] ? ch.cls : 'musa'; }
  session = {acc, cid}; A.lastChar = cid;
  if (REG.keep) REG.keep = {acc, cid};
  writeSession({acc, cid});
  raid = null; ST = null; refreshStats(); resetRuntime(); applySpeedBtn(); mapCache.clear();
  gearSel = -1; petSel = -1; gearSlot = 'weapon';
  modalLock = false; hideModal();
  logEls.forEach(e => e.remove()); logEls = [];
  buildTab('grow');
  addLog(`${S.name}님, ${stageLabel(S.stage)}에 들어섰습니다.`, 'good');
  if (opts.imported) addLog('예전 모험을 이어받았습니다.', 'good');
  chatMsgs = []; $('#chatList').innerHTML = ''; chatUnread = 0; npcT = 8;
  addChat('sys', '알림', `${S.name}님, 어서 오세요! 채팅창에서 주민들과 이야기할 수 있어요.${room ? ' 지금 이 페이지를 보는 사람들과도 이야기가 이어져요.' : ''}`);
  chatUnread = 0;
  saveLocal();
  const away = t && !opts.fresh && !opts.hot ? (now() - t) / 1000 : 0;
  if (away >= 60) offlineReward(away);
  else if (!opts.fresh && !notesSeen() && !window.__game) showNotes();
  if (opts.fresh) try { localStorage.setItem(NOTE_KEY, NOTE_VER); } catch (e) {}
}
function toTitle(){
  setChat(false);
  raid = null; S = titleState(); ST = null; refreshStats(); resetRuntime(); applySpeedBtn(); mapCache.clear();
  logEls.forEach(e => e.remove()); logEls = [];
  buildTab('grow');
}
function switchChar(){
  saveLocal(); pushCloud();
  session = null;
  if (REG.keep) REG.keep = {acc:curAcc};
  saveReg(); writeSession({acc:curAcc});
  toTitle(); showCharSelect();
}
function logout(){
  saveLocal(); pushCloud();
  session = null; curAcc = null; REG.keep = null;
  saveReg(); writeSession(null);
  toTitle(); showLogin('login');
}

/* ================= 저장·오프라인 보상 ================= */
let cloud = null, cloudBusy = false;
const cdocName = (acc, cid) => `samhan-c-${acc}-${cid}`;
const cdoc = name => cloud.db.doc('data/users/' + cloud.uid + '/' + name);
function saveLocal(){
  if (!session) return;
  S.lastSave = now();
  try { localStorage.setItem(charKey(session.acc, session.cid), JSON.stringify(S)); } catch (e) {}
  // 계정 목록의 캐릭터 요약(레이드에서 다른 캐릭터를 동료로 부를 때도 쓴다)
  const A = REG.accounts[session.acc], ch = A && A.chars.find(c => c.cid === session.cid);
  if (!ch) return;
  const sum = {name:S.name, cls:S.cls, level:S.level, maxStage:S.maxStage, look:S.look, armorG:gradeOf(S.equip.armor), weaponG:gradeOf(S.equip.weapon),
    ally:{dps:Math.round(dpsOf(ST)), maxHp:Math.round(ST.maxHp)}};
  const pick = o => JSON.stringify([o.name, o.cls, o.level, o.maxStage, o.look, o.armorG, o.weaponG, o.ally]);
  if (pick(ch) !== pick(sum)){ Object.assign(ch, sum, {t:now()}); A.t = now(); saveReg(); }
}
function bootCloud(){
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return Promise.resolve(null);
  const work = (async () => {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) return null;
    const uid = await user.id();
    return uid ? {db, uid} : null;
  })().catch(() => null);
  return Promise.race([work, new Promise(r => setTimeout(() => r(null), 6000))]);
}
async function cloudGet(name){
  if (!cloud) return null;
  try {
    const snap = await Promise.race([cdoc(name).get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 6000))]);
    return snap && snap.exists ? snap.data() : null;
  } catch (e) { return null; }
}
function mergeCloudReg(c){
  try {
    const d = JSON.parse(c.reg);
    if (!d || !d.accounts) return;
    for (const [id, a] of Object.entries(d.accounts)){
      if (!ID_RE.test(id) || !a || typeof a.hash !== 'string' || !Array.isArray(a.chars)) continue;
      const l = REG.accounts[id];
      if (!l || (a.t || 0) > (l.t || 0)) REG.accounts[id] = a;
    }
    if (d.legacyClaimed) REG.legacyClaimed = true;
    try { localStorage.setItem(ACC_KEY, JSON.stringify(REG)); } catch (e) {}
  } catch (e) {}
}
async function pushCloud(){
  if (!cloud || !session || cloudBusy) return;
  cloudBusy = true;
  const name = cdocName(session.acc, session.cid);
  S.lastSave = now();
  const body = {t:S.lastSave, save:JSON.stringify(S)};
  const regBody = regDirty ? {t:REG.t, reg:JSON.stringify(Object.assign({}, REG, {keep:null}))} : null;
  regDirty = false;
  try {
    await cdoc(name).set(body);
    if (regBody) await cdoc('samhan-accounts').set(regBody);
  } catch (e) {
    if (regBody) regDirty = true;
    const c = e && e.code;
    if (c !== 'unavailable' && c !== 'resource_exhausted') cloud = null;
  }
  cloudBusy = false;
}
function resetRuntime(){
  mobs = []; texts = []; parts = []; fx = []; projs = [];
  bossActive = false; bossRef = null; bossTime = 0; spawnT = 0.5; raid = null;
  Object.assign(hero, {tx:7, ty:6, fx:7, fy:6, mt:0, moving:false, dir:'down', hp:ST.maxHp, dead:false, deadT:0, atkT:0, swing:0, hurt:0, buffT:0, target:null, engaged:false});
  placeOf(hero);
  for (const k in skillCd) skillCd[k] = 1.5;
  for (const t of PET_TYPE_ORDER) petRt[t].init = false;
}
function resetGame(){
  const keep = {name:S.name, look:S.look};
  S = defaultState(); S.name = keep.name; S.look = keep.look;
  ST = null; refreshStats(); resetRuntime(); applySpeedBtn(); gearSel = -1; petSel = -1; mapCache.clear();
  saveLocal(); pushCloud();
  buildTab('grow');
  chooseClass(false);
}
function offlineReward(sec){
  sec = Math.min(sec, OFFLINE_CAP);
  if (sec < 60) return;
  const s = S.stage, bonus = gainMul('gold', true);
  const kps = Math.min(0.6, dpsOf(ST) / mobHp(s) * 0.5) * 0.5;
  const kills = Math.floor(kps * sec);
  const gold = kills * mobGold(s) * bonus, exp = kills * mobExp(s) * bonus;
  const gems = Math.floor(sec / 600) + Math.floor(kills * GEM_DROP * 0.5);
  const lv0 = S.level;
  S.gold += gold; S.gems += gems; S.rec.kills += kills;
  gainExp(exp);
  saveLocal();
  showModal('다녀오셨습니까?', `
    <p>자리를 비운 <b>${fmtTime(sec)}</b> 동안 용사가 <b>${fmt(kills)}마리</b>를 잡았어요.</p>
    <ul class="rewards">
      <li><span class="coin"></span>${fmt(gold)}<span>엽전</span></li>
      <li><span class="gem"></span>${fmt(gems)}<span>보석 (10분마다 1개 + 몬스터가 떨군 것)</span></li>
      <li>Lv.${lv0}${S.level > lv0 ? ` → Lv.${S.level}` : ''}<span>경험치 +${fmt(exp)}</span></li>
    </ul>${sec >= OFFLINE_CAP ? '<p class="small" style="margin-top:8px">오프라인 보상은 최대 12시간까지 쌓여요.</p>' : ''}`,
    [{label:'받기', primary:true}]);
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ hiddenAt = now(); saveLocal(); pushCloud(); }
  else {
    const away = hiddenAt ? (now() - hiddenAt) / 1000 : 0;
    hiddenAt = 0; last = performance.now();
    if (away >= 60 && S.chosen && session && !modalLock) offlineReward(away);
  }
});
window.addEventListener('pagehide', saveLocal);

async function boot(){
  if (window.claude && typeof window.claude.use === 'function'){
    modalLock = true;
    showModal('불러오는 중…', '<p>모험 기록을 불러오고 있어요.</p>', []);
    cloud = await bootCloud();
    if (cloud){
      const [r, lg] = await Promise.all([cloudGet('samhan-accounts'), cloudGet('samhan')]);
      if (r && typeof r.reg === 'string') mergeCloudReg(r);
      if (lg && typeof lg.save === 'string'){ try { const d = JSON.parse(lg.save); if (d && d.v === 1 && d.chosen) cloudLegacy = {data:d, t:lg.t || 0}; } catch (e) {} }
    }
  }
  bootRoom();
  const k = REG.keep || readSession();
  if (k && k.acc && REG.accounts[k.acc]){
    curAcc = k.acc;
    if (k.cid && REG.accounts[k.acc].chars.some(c => c.cid === k.cid)) enterChar(k.cid);
    else showCharSelect();
    return;
  }
  showLogin(Object.keys(REG.accounts).length ? 'login' : 'signup');
}

/* ================= 시작 ================= */
let last = performance.now();
function loop(ts){
  let dt = (ts - last) / 1000; last = ts;
  if (dt > 0.25) dt = 0.25;
  if (dt > 0){
    for (let i = 0; i < S.speed; i++){
      let rem = dt;
      while (rem > 0){ const step = Math.min(rem, 0.05); update(step); rem -= step; }
    }
  }
  if (session && dt > 0){ tickBuffs(dt); npcChatter(dt); }
  if (heroSay){ heroSay.t -= dt; if (heroSay.t <= 0) heroSay = null; }
  render(); updateHud();
  requestAnimationFrame(loop);
}
function start(hotData){
  REG = loadReg();
  refreshStats(); resetRuntime(); resize(); applySpeedBtn();
  buildTab('grow');
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv.parentElement);
  else window.addEventListener('resize', resize);
  last = performance.now();
  requestAnimationFrame(loop);
  setInterval(() => { refreshPanel(); updateGuide(); updateDots(); }, 200);
  setInterval(saveLocal, 5000);
  setInterval(pushCloud, 60000);
  let hotOk = false;
  if (hotData && typeof hotData.save === 'string' && hotData.acc && REG.accounts[hotData.acc]){
    try {
      const d = JSON.parse(hotData.save);
      if (d && d.v === 1 && REG.accounts[hotData.acc].chars.some(c => c.cid === hotData.cid)){
        curAcc = hotData.acc; enterChar(hotData.cid, {data:d, hot:true}); hotOk = true;
        bootCloud().then(c => { cloud = c; });
      }
    } catch (e) {}
  }
  if (!hotOk) boot();
  if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function'){
    window.claude.hot.snapshot(() => ({save:JSON.stringify(S), acc:session && session.acc, cid:session && session.cid}));
  }
}
if (location.search.indexOf('simtest') >= 0){
  window.__game = {
    get S(){ return S; }, get ST(){ return ST; }, get hero(){ return hero; }, get bossActive(){ return bossActive; }, get raid(){ return raid; }, get session(){ return session; },
    update, buyStat, upgradeSkill, summon, mergeAll, equipBest, skillCost, buyInfo, SKILLS, setClass, render,
    petSummon, petUpgrade, petEquipBest, petUpCost, PETS, PET_TYPE_ORDER, eqPet, refineTry, refineGold, refineGems, REFINE_MAX,
    claimAll, startRaid, raidReady, raidUnlocked, firstReadyRaid, raidInfo, buildTab,
    buyShop, SHOP, dropMyth, showNotes, installApp, get pwa(){ return PWA_HOST; }, questLuck, sendChat, addChat, get chatMsgs(){ return chatMsgs; }, get skillCd(){ return skillCd; }, luck:null,
    addTime(ms){ clockSkew += ms; }, quiet:false,
    sheet(){ return {hero:CLASS_ORDER.map(c => ['down', 'up', 'right'].map(d => [0, 1, 2, 3].map(f => heroSprite(c, d, f).toDataURL()))), mobs:Object.keys(MOB_DRAW).map(t => [mobSprite(t, '#8a8a8a', 0, false).toDataURL(), mobSprite(t, '#8a8a8a', 1, false).toDataURL()]), pets:PETS.map((p, i) => [petSprite(i, 0).toDataURL(), petSprite(i, 1).toDataURL()])}; },
    setStage(s){ S.stage = s; mapCache.clear(); resetRuntime(); },
  };
}

const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});
})();
